name: Dynamic Cognition Successor Stage C V8

on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage_c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 0

      - name: Exact source fence, apply Stage C, build, test, push
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          p = Path("runner/scripts/dynamic-successor-stage-c-objective-envelope.py")
          s = p.read_text()
          repairs = [
              ("    ''import { isBearerAuthorized }", "    '''import { isBearerAuthorized }"),
              ("      engineeringJob','',", "      engineeringJob''',"),
              ("    ''import {completeProductionObjectiveStateV1", "    '''import {completeProductionObjectiveStateV1"),
          ]
          for old, new in repairs:
              if s.count(old) != 1:
                  raise SystemExit(f"current Stage C quote repair expected 1 match for {old!r}, got {s.count(old)}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m py_compile runner/scripts/dynamic-successor-stage-c-objective-envelope.py

          cd sentient
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"

          python ../runner/scripts/dynamic-successor-stage-c-objective-envelope.py

          python - <<'PY'
          from pathlib import Path

          p = Path("src/application/production-mission-control.ts")
          s = p.read_text()
          broken = '"' + "\n\n" + '"'
          if s.count(broken) != 2:
              raise SystemExit(f"mission-control newline repair expected 2 matches, got {s.count(broken)}")
          p.write_text(s.replace(broken, '"\\n\\n"'))

          p = Path("src/fly/self-execution.ts")
          s = p.read_text()
          fixes = [
              (
                  '  budget: SentientObjectiveInput["budget"] | null;',
                  '  budget: NonNullable<SentientObjectiveInput["budget"]> | null;',
              ),
              (
                  '  let budget: SentientObjectiveInput["budget"] | null = null;',
                  '  let budget: NonNullable<SentientObjectiveInput["budget"]> | null = null;',
              ),
          ]
          for old, new in fixes:
              if s.count(old) != 1:
                  raise SystemExit(f"budget type repair expected one match for {old!r}, got {s.count(old)}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("test/dynamic-objective-envelope-runtime-v1.test.ts")
          s = p.read_text()
          old = r'assert.match(runner, /budget:\s*SentientObjectiveInput\["budget"\]\s*\|\s*null/);'
          new = r'assert.match(runner, /budget:\s*NonNullable<SentientObjectiveInput\["budget"\]>\s*\|\s*null/);'
          if s.count(old) != 1:
              raise SystemExit(f"budget test repair expected 1 match, got {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/dynamic-objective-envelope-runtime-v1.test.js \
            dist/test/dynamc-hard-stops-core.test.js \
            dist/test/atlas-hybrid-router.test.js
          npm test

          git config user.name "Sentient Engineering"
          git config user.email "sentient-engineering@users.noreply.github.com"
          git add \
            src/application/production-composition.ts \
            src/application/production-mission-control.ts \
            src/fly/self-execution.ts \
            src/fly/server-runtime.ts \
            test/dynamic-objective-envelope-runtime-v1.test.ts
          git diff --cached --check
          git commit -m "cognition: persist and propagate objective hard-stop envelope"

          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"

          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"

          echo "SUCCESSOR_SHA=$new_sha"
          echo "SUCCESSOR_TREEE=$new_tree"
          echo "DEPLOYMENT_PERFORMED=false"
