name: Sentient Routine Stale Backlog Objective

"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}

permissions:
  contents: read

concurrency:
  group: sentient-routine-stale-backlog
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Execute one bounded useful objective
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          ok=false
          for _ in $(seq 1 90); do
            r="$(curl -fsS --max-time 5 "https://${APP}.fly.dev/readyz" 2>/dev/null || true)"
            if jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' >/dev/null 2>&1 <<<"$r"; then ok=true; break; fi
            sleep 2
          done
          test "$ok" = true
          oid="routine-stale-coordination-backlog-${GITHUB_RUN_ID}-1"
          sid="routine-operations-${GITHUB_RUN_ID}"
          node --check scripts/routine-stale-backlog-objective.mjs
          b64="$(base64 -w0 scripts/routine-stale-backlog-objective.mjs)"
          timeout 780s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64|base64 -d >/tmp/routine-objective.mjs && OID=$oid SID=$sid SHA=$EXPECTED_SHA TREE=$EXPECTED_TREE node /tmp/routine-objective.mjs; rc=\$?; rm -f /tmp/routine-objective.mjs; exit \$rc'" | tee /tmp/routine-objective.out
          grep -Fq 'OBJECTIVE_STATUS=succeeded' /tmp/routine-objective.out
          grep -Fq 'ACTIVE_ENGINEERING_JOB_ID=none' /tmp/routine-objective.out
          grep -Fq 'DEPLOY_ON_SUCCESS=false' /tmp/routine-objective.out
          grep -Fq 'PRIVATE_ACTIONS_BRIDGE_USED=false' /tmp/routine-objective.out
          grep -Fq 'SECRET_VALUES_EXPOSED=false' /tmp/routine-objective.out
          echo RESOURCE_ENVELOPE_CHANGED=false
          echo GITHUB_ACTIONS_REQUIRED_FOR_RUNTIME=false
