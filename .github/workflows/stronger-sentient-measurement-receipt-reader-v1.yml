name: Stronger Sentient Measurement Receipt Reader v1

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: false
        default: "41496814542"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download immutable measurement receipt
        uses: actions/download-artifact@v4
        with:
          name: stronger-sentient-baseline-v1
          path: receipt
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print receipt
        shell: bash
        run: |
          set -euo pipefail
          cat receipt/stronger-sentient-baseline-v1.json
          echo "PROVIDER_CALLS_ADDED=0"
          echo "PRODUCTION_DEPLOYMENT=false"
