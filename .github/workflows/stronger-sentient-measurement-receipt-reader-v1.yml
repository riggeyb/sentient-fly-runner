name: Stronger Sentient Measurement Receipt Reader v1

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: false
        default: "41496814542"
        type: string
      artifact_name:
        required: false
        default: "stronger-sentient-baseline-v1"
        type: string
      file_name:
        required: false
        default: "stronger-sentient-baseline-v1.json"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download immutable measurement receipt
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: receipt
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print compact receipt summary
        shell: bash
        run: |
          set -euo pipefail
          file="receipt/${{ inputs.file_name }}"
          jq -c '{
            schemaVersion,
            campaign,
            sourceSha,
            sourceTree,
            corpusDigest,
            neutralSignalProfile,
            tasksExpected,
            tasksMeasured,
            providerCalls,
            maxProviderCalls,
            http429Count,
            atlas429Rate,
            retryCount,
            retryRate,
            fallbackTaskCount,
            fallbackRate,
            queueWaitP50Ms,
            queueWaitP95Ms,
            providerLatencyP50Ms,
            providerLatencyP95Ms,
            inputTokens,
            outputTokens,
            reasoningTokens,
            reportedCostUsd,
            verifiedTaskSuccessRate,
            evidenceGroundingRate,
            schemaValidityRate,
            deploymentPerformed
          }' "$file"
          echo "PROVIDER_CALLS_ADDED=0"
          echo "PRODUCTION_DEPLOYMENT=false"
