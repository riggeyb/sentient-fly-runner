name: Stronger Sentient Measurement Receipt Reader v1

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      file_name:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download immutable measurement receipt
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: receipt
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print schema-agnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          file="receipt/${{ inputs.file_name }}"
          test -f "$file"
          jq -c '.' "$file"
          echo "PROVIDER_CALLS_ADDED=0"
          echo "PRODUCTION_DEPLOYMENT=false"
