name: Skills Exact Candidate Acceptance

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      private_issue:
        required: true
        type: string

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
          SOURCE_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          PRIVATE_ISSUE: ${{ inputs.private_issue }}
        run: |
          set +e
          mkdir -p /tmp/skills
          receipt=/tmp/receipt.txt
          : >"$receipt"
          failed=0
          runq() {
            label="$1"; shift
            "$@" >"/tmp/skills/$label.log" 2>&1
            rc=$?
            echo "${label}_EXIT=$rc" | tee -a "$receipt"
            [ "$rc" -eq 0 ] || failed=1
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 2
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE" || exit 2
          {
            echo "EXACT_SKILLS_ACCEPTANCE_RECEIPT_V1"
            echo "SOURCE_SHA=$EXPECTED_SHA"
            echo "SOURCE_TREE=$EXPECTED_TREE"
            echo "RUNNER_OS=$(uname -srvmo)"
            echo "NODE_VERSION=$(node --version)"
            echo "PYTHON_VERSION=$(python --version 2>&1)"
            echo "REQUIREMENTS_BLOB=$(git rev-parse HEAD:requirements.txt)"
            echo "ORCHESTRATOR_MANIFEST_BLOB=$(git rev-parse HEAD:sentient-orchestrator/package.json)"
            echo "ORCHESTRATOR_LOCK=ABSENT"
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$receipt"
          runq PYTHON_DEPS pip install -r requirements.txt
          runq REGISTRY python scripts/validate_registry.py
          runq EVALS python scripts/check_evals.py
          runq DURABLE env PYTHONDONTWRITEBYTECODE=1 python tests/test_durable_objective_continuation_v1.py
          runq ACTIVE_WORK env PYTHONDONTWRITEBYTECODE=1 python tests/test_active_work_disclosure_v1.py
          runq REPO_EDIT python scripts/test_repository_edit.py
          runq REPO_GATEWAY python scripts/test_repository_edit_request.py
          runq ACTION_SCHEMA python scripts/validate_actions_schema.py
          runq NETLIFY_SCHEMA python scripts/validate_netlify_actions_schema.py
          (cd sentient-orchestrator && npm install --ignore-scripts --no-audit --no-fund --no-package-lock) >/tmp/skills/NPM_INSTALL.log 2>&1
          rc=$?; echo "NPM_INSTALL_EXIT=$rc" | tee -a "$receipt"; [ "$rc" -eq 0 ] || failed=1
          (cd sentient-orchestrator && npm run typecheck) >/tmp/skills/TYPECHECK.log 2>&1
          rc=$?; echo "TYPECHECK_EXIT=$rc" | tee -a "$receipt"; [ "$rc" -eq 0 ] || failed=1
          (cd sentient-orchestrator && npm run migrate) >/tmp/skills/MIGRATE.log 2>&1
          rc=$?; echo "MIGRATE_EXIT=$rc" | tee -a "$receipt"; [ "$rc" -eq 0 ] || failed=1
          (cd sentient-orchestrator && npm test) >/tmp/skills/TESTS.log 2>&1
          rc=$?; echo "TESTS_EXIT=$rc" | tee -a "$receipt"; [ "$rc" -eq 0 ] || failed=1
          grep -E '^# (tests|pass|fail) ' /tmp/skills/TESTS.log | tail -3 | tee -a "$receipt" || true
          GITHUB_TOKEN="$SOURCE_TOKEN" python scripts/validate_registry.py --remote >/tmp/skills/REMOTE.log 2>&1
          rc=$?; echo "REMOTE_REGISTRY_EXIT=$rc" | tee -a "$receipt"; [ "$rc" -eq 0 ] || failed=1
          rm -rf sentient-orchestrator/node_modules
          if [ -n "$(git status --porcelain)" ]; then
            echo "SOURCE_MUTATION=true" | tee -a "$receipt"
            failed=1
          else
            echo "SOURCE_MUTATION=false" | tee -a "$receipt"
          fi
          echo "FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$receipt"
          echo "OVERALL_EXIT=$failed" | tee -a "$receipt"
          if [ "$failed" -ne 0 ]; then
            printf 'EXACT_SKILLS_ACCEPTANCE_RECEIPT_V1\n```text\n' >/tmp/body
            cat "$receipt" >>/tmp/body
            printf '```\n' >>/tmp/body
            jq -Rs '{body:.}' </tmp/body >/tmp/payload.json
            curl --fail --silent --show-error               -H "Authorization: Bearer $SOURCE_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: application/json"               -X POST "https://api.github.com/repos/riggeyb/skills/issues/$PRIVATE_ISSUE/comments"               --data-binary @/tmp/payload.json >/dev/null || true
          fi
          exit "$failed"
