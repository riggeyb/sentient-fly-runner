name: Final Cert Continuation Diagnostic
"on":
  workflow_dispatch:
    inputs:
      objective_id: {type: string, required: true}
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ID: ${{ inputs.objective_id }}
      APP: sentient-validation-runner
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Exact-fenced read-only continuation check
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          curl -fsS --retry 6 --retry-delay 2 --max-time 15 "https://${APP}.fly.dev/readyz" > /tmp/ready.json
          jq -e '.ready==true and .identity.source.sha=="aed9e3a974767eb5c4ac18d9a0321bb2404f20ef" and .identity.source.tree=="5d0700883048031723edb3d1ffbc4becbdf558a0"' /tmp/ready.json >/dev/null
          cat > /tmp/probe.mjs <<'NODE'
          import {PostgresSpawnObjectiveRepository as Repo} from "/app/dist/src/objective-continuation/postgres-spawn-repository.js";
          const d=process.env.DATABASE_URL??process.env.DIRECT_URL;
          if(!d)throw Error("DB_MISSING");
          const r=new Repo({connectionString:d}),id=process.env.CERT_ID;
          try {
            const t=await r.get("task",id),o=await r.getObjectiveContinuation(id);
            console.log("CERT_READONLY="+JSON.stringify({id,task:t?.status??null,root:o?.status??null,rev:o?.revision??null,terminal:o?.terminal?.status??null,satisfied:(o?.evidenceDependencies??[]).filter(x=>x.status==="SATISFIED").length}));
          }finally{await r.close();}
          NODE
          b="$(base64 -w0 /tmp/probe.mjs)"
          timeout 70s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b|base64 -d >/tmp/cert-${GITHUB_RUN_ID}.mjs; CERT_ID=$ID node /tmp/cert-${GITHUB_RUN_ID}.mjs; rc=\$?; rm -f /tmp/cert-${GITHUB_RUN_ID}.mjs; exit \$rc'"
