name: Final Cert Phase4 Executor Exception Terminalization Repair
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: final-cert-phase4-terminalization-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 06c5b82b2a1670074d6661b130ba7394953f8766
      BRANCH: sentient-production-composition-20261017
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact shared source and apply minimal repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$BASE_SHA"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path("src/phase4/multistep-autonomy.ts")
          s=p.read_text()
          old=base64.b64decode("ICAgICAgY29uc3QgZXhlY3V0aW9uPWF3YWl0IGlucHV0LmV4ZWN1dG9yLmV4ZWN1dGUoZWZmZWN0aXZlU3RlcCk7CiAgICAgIGxhdGVzdFJlZj1leGVjdXRpb24uYXV0aG9yaXRhdGl2ZVJlc3VsdFJlZjsK").decode()
          new=base64.b64decode("").decode()
          if s.count(old)!=1:
              raise SystemExit(f"phase4 execution anchor count={s.count(old)}")
          p.write_text(s.replace(old,new))
          t=Path("test/phase4-multistep-autonomy.test.ts")
          x=t.read_text()
          marker='test("Phase 4 terminalizes durable continuation before rethrowing an executor exception"'
          if marker in x:
              raise SystemExit("focused regression already present")
          addition=base64.b64decode("").decode()
          t.write_text(x+addition)
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/phase4/multistep-autonomy.ts test/phase4-multistep-autonomy.test.ts | sort)"
      - name: Build and focused/cross-phase regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/phase4-multistep-autonomy.test.js \
            dist/test/phase5-collaborative-convergence.test.js \
            dist/test/phase5-fly-restart-lease-retry.test.js \
            dist/test/production-collaboration-restart-recovery.test.js \
            dist/test/phase1-core-runtime.test.js \
            dist/test/phase6-capability-integration.test.js \
            dist/test/phase7-model-improvement.test.js
          echo FINAL_CERT_PHASE4_EXCEPTION_TERMINALIZATION_TESTS=PASS
      - name: Commit only exact tested repair if shared head unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$BASE_SHA"
          git config user.name sentient-final-cert
          git config user.email sentient-final-cert@users.noreply.github.com
          git add src/phase4/multistep-autonomy.ts test/phase4-multistep-autonomy.test.ts
          git diff --cached --check
          git commit -m "fix: terminalize objective on executor exception"
          git push --force-with-lease="refs/heads/$BRANCH:$BASE_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo NEW_SHA="$(git rev-parse HEAD)"
          echo NEW_TREE="$(git rev-parse 'HEAD^{tree}')"
          echo SENTIENT_SOURCE_MUTATION=MINIMAL_PROVEN_CERT_DEFECT_REPAIR
          echo RESOURCE_ENVELOPE_UNCHANGED=true
          echo SECRET_VALUES_EXPOSED=false
