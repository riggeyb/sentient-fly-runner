name: Wire MVP Root Mission Control into production runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-mission-control-integration-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply fenced production integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "868fe1234320ee26483b2d905e6c438668a072c6"
          echo '' | base64 -d | gzip -d > "$RUNNER_TEMP/patch.py"
          python3 "$RUNNER_TEMP/patch.py"
          git diff --check
      - name: Build and focused Mission Control regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee "$RUNNER_TEMP/mvp-build.log"
          node --test dist/test/spawn-mission-control.test.js
          node --test dist/tests/spawn-mission-control.test.js
      - name: Commit canonical successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentient-mvp-activation"
          git config user.email "sentient-mvp-activation@users.noreply.github.com"
          git add src/application/contracts.ts src/application/production-composition.ts src/fly/production-runtime.ts src/fly/self-execution.ts package-lock.json
          git commit -m "mvp: route production objectives through Root Mission Control"
          git push origin HEAD:sentient/mvp-mission-control-integration-v1
          echo "SUCCESSOR_SHA=$(git rev-parse HEAD)"
          echo "SUCCESSOR_TREE=$(git rev-parse 'HEAD^{tree}')"
