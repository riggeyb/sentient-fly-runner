name: Wire MVP Root Mission Control into production runtime
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-mission-control-integration-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply fenced production integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "868fe1234320ee26483b2d905e6c438668a072c6"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one match, found {n}")
              p.write_text(s.replace(old, new, 1))

          p = "src/application/production-composition.ts"
          replace_once(
              p,
              'fine {ProductionEvidenceGap,stepExecutionFromBoundedResultV1} from "./production-evidence.js";',
               'import {ProductionEvidenceGap,stepExecutionFromBoundedResultV1} from "./production-evidence.js";'if False else import  }
          PY
