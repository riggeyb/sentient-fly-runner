name: Sentient Runtime Crash Log
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture sanitized recent runtime logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl logs -a sentient-validation-runner --no-tail | tail -n 240
          echo SECRET_VALUES_EXPOSED=false
