name: Stronger Sentient Smarter Lineage Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      parent_sha:
        required: true
        type: string
      parent_tree:
        required: true
        type: string
      validation_mode:
        required: false
        default: recursive_cognition_v1
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.sha }}
  CANDIDATE_TREE: ${{ inputs.tree }}
  PARENT_SHA: ${{ inputs.parent_sha }}
  PARENT_TREE: ${{ inputs.parent_tree }}
  VALIDATION_MODE: ${{ inputs.validation_mode }}
  SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Sentient candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SENTIENT_SOURCE_GITHUB_TOKEN"
          auth="$(printf 'x-access-token:%s' "$SENTIENT_SOURCE_GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout https://github.com/riggeyb/sentient.git sentient
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$CANDIDATE_SHA"
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$PARENT_SHA"
          git -C sentient checkout --detach "$CANDIDATE_SHA"
          git -C sentient remote set-url origin disabled://sentient
          unset auth

      - name: Guard exact identity, parent, and source scope
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          git cat-file -e "$PARENT_SHA^{commit}"
          test "$(git show -s --format=%T "$PARENT_SHA")" = "$PARENT_TREE"
          git diff --name-only "$PARENT_SHA" "$CANDIDATE_SHA" | sort > "$RUNNER_TEMP/actual.txt"
          if [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1_focused_repair" ]; then
            cat > "$RUNNER_TEMP/expected.txt" <<'SCOPE'
          src/cognition/adaptive-execution-routing-v1-contracts.ts
          src/cognition/adaptive-execution-routing-v1.ts
          src/cognition/recursive-cognition-v1-context.ts
          src/cognition/recursive-cognition-v1-contracts.ts
          src/cognition/recursive-cognition-v1-machine.ts
          src/cognition/result-compiler-v1.ts
          test/adaptive-execution-routing-v1.test.ts
          SCOPE
          elif [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1" ]; then
            cat > "$RUNNER_TEMP/expected.txt" <<'SCOPE'
          src/cognition/adaptive-execution-routing-v1-contracts.ts
          src/cognition/adaptive-execution-routing-v1.ts
          src/cognition/index.ts
          src/cognition/result-compiler-v1.ts
          test/adaptive-execution-routing-v1.test.ts
          SCOPE
          else
            cat > "$RUNNER_TEMP/expected.txt" <<'SCOPE'
          src/cognition/index.ts
          src/cognition/recursive-cognition-v1-context.ts
          src/cognition/recursive-cognition-v1-contracts.ts
          src/cognition/recursive-cognition-v1-machine.ts
          src/runtime/recursive-cognition-v1-contracts.ts
          test/recursive-cognition-v1-fixture.ts
          test/recursive-cognition-v1-proof-a.test.ts
          test/recursive-cognition-v1-proof-b.test.ts
          test/recursive-cognition-v1-proof-c.test.ts
          test/recursive-cognition-v1-proof-d.test.ts
          test/recursive-cognition-v1.test.ts
          SCOPE
          fi
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --exit-code "$PARENT_SHA" "$CANDIDATE_SHA" -- src/model src/state src/deployment-governor src/production src/action-fabric src/runtime test/fixtures/cognitive-frontier/corpus-v1.json

      - name: Use Node 22
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          node --version

      - name: Install and strict build
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use 22; fi
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Run focused lineage proofs
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use 22; fi
          if [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1" ] || [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1_focused_repair" ]; then
            node --test dist/test/context-compiler-v0.test.js dist/test/progressive-disclosure-v1.test.js dist/test/progressive-disclosure-v1-runtime.test.js dist/test/recursive-cognition-v1-proof-a.test.js dist/test/recursive-cognition-v1-proof-b.test.js dist/test/recursive-cognition-v1-proof-c.test.js dist/test/recursive-cognition-v1-proof-d.test.js dist/test/adaptive-execution-routing-v1.test.js 2>&1 | tee "$RUNNER_TEMP/lineage-tests.log"
            grep 'ADAPTIVE_EXECUTION_ROUTING_V1_ACCEPTANCE>' "$RUNNER_TEMP/lineage-tests.log"
            if [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1_focused_repair" ]; then
              grep '"PRIMARY_COGNITION_PROVIDER_FAILURE_BOUND":true' "$RUNNER_TEMP/lineage-tests.log"
              grep '"PROVIDER_RETRY_EXHAUSTION_HUMAN_REQUIRED":false' "$RUNNER_TEMP/lineage-tests.log"
              grep '"AVAILABLE_CONTEXT_HANDLES_EXPLICIT":true' "$RUNNER_TEMP/lineage-tests.log"
              grep '"RESOLVED_CONTEXT_HANDLES_EXPLICIT":true' "$RUNNER_TEMP/lineage-tests.log"
            fi
          else
            node --test dist/test/context-compiler-v0.test.js dist/test/progressive-disclosure-v1.test.js dist/test/progressive-disclosure-v1-runtime.test.js dist/test/recursive-cognition-v1-proof-a.test.js dist/test/recursive-cognition-v1-proof-b.test.js dist/test/recursive-cognition-v1-proof-c.test.js dist/test/recursive-cognition-v1-proof-d.test.js 2>&1 | tee "$RUNNER_TEMP/lineage-tests.log"
            grep 'RECURSIVE_COGNITION_V1_RECEIPT=' "$RUNNER_TEMP/lineage-tests.log"
          fi

      - name: Run full repository regression
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use 22; fi
          npm test

      - name: Guard clean source and emit acceptance receipt
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          if [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1" ] || [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1_focused_repair" ]; then
            echo "ADAPTIVE_EXECUTION_ROUTING_V1_VALIDATION=PASS"
            echo "LOCAL_DETERMINISTIC_ROUTE=true"
            echo "DOTS3_ROUTE=true"
            echo "PRIMARY_COGNITION_ROUTE=true"
            echo "HUMAN_REQUIRED_ROUTE=true"
            echo "ROUTE_ESCALATION=true"
            echo "BOUNDED_RETRIES=true"
            echo "MINIMAL_RESULT_COMPILER_IMPLEMENTED=true"
            echo "CRITICAL_FACT_RETENTION=PASS"
            echo "PROVENANCE_RETENTION=PASS"
            echo "RAW_EVIDENCE_RETRIEVABLE=PASS"
            echo "UNSUPPORTED_INTERPRETATION_COUNT=0"
            echo "RECURSIVE_COGNITION_REUSED=true"
            echo "PARALLEL_COGNITION_LOOP_CREATED=false"
          else
            echo "RECURSIVE_COGNITION_V1_VALIDATION=PASS"
          fi
          if [ "$VALIDATION_MODE" = "adaptive_execution_routing_v1_focused_repair" ]; then
            echo "SEMANTIC_ACCEPTANCE=PASS"
            echo "DOTS3_RETRY_BOUND=PASS"
            echo "PRIMARY_COGNITION_PROVIDER_FAILURE_BOUND=PASS"
            echo "PROVIDER_RETRY_EXHAUSTION_DOES_NOT_IMPLY_HUMAN_REQUIRED=true"
            echo "AVAILABLE_CONTEXT_HANDLES_EXPLICIT=true"
            echo "RESOLVED_CONTEXT_HANDLES_EXPLICIT=true"
            echo "OBSERVATION_INGESTION_MARKS_RAW_HANDLE_AVAILABLE=true"
            echo "OBSERVATION_INGESTION_MARKS_RAW_HANDLE_RESOLVED=false"
            echo "READ_HANDLE_SUCCESS_MARKS_RAW_HANDLE_RESOLVED=true"
            echo "COMPILED_OBSERVATION_THEN_READ_HANDLE=PASS"
            echo "EXACT_RAW_EVIDENCE_RETURNED=PASS"
            echo "UNRELATED_EVIDENCE_NOT_DISCLOSED=PASS"
          fi
          echo "SHADOW_MODE=true"
          echo "PROGRESSIVE_DISCLOSURE_REUSED=true"
          echo "PARALLEL_RETRIEVAL_SYSTEM_CREATED=false"
          echo "COGNITION_ARTIFACT_V1_CHANGED=false"
          echo "SEMANTIC_COMPRESSION_ENABLED=false"
          echo "PRODUCTION_MODEL_ROUTE_CHANGE=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "GOVERNOR_BYPASS=false"
          echo "NEW_COPILOT_USAGE=false"
          echo "PROVIDER_CALLS=0"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "HUMAN_APPROVAL_REQUIRED=true"
