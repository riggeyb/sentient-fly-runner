name: Sentient Private Engineering Ingress Diagnostic

"on":
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
      APP: sentient-deployment-governor
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect bounded ingress prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]{1,10}$ ]]
          if [ -n "$SOURCE_GITHUB_TOKEN" ]; then
            echo "SOURCE_TOKEN_PRESENT=true"
          else
            echo "SOURCE_TOKEN_PRESENT=false"
            exit 1
          fi
          code="$(curl -sS -o /tmp/issue.json -w '%{http_code}'             -H "Authorization: Bearer $SOURCE_GITHUB_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/riggeyb/sentient/issues/$ISSUE_NUMBER")"
          echo "PRIVATE_ISSUE_HTTP=$code"
          if [ "$code" = 200 ]; then
            node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync("/tmp/issue.json","utf8"));const b=String(j.body??""); console.log("REQUEST_MARKERS_PRESENT="+(b.includes("REQUEST_BASE64_BEGIN")&&b.includes("REQUEST_BASE64_END")));'
          else
            echo "REQUEST_MARKERS_PRESENT=unknown"
          fi
          rm -f /tmp/issue.json
          machines="$(flyctl machines list -a "$APP" --json)"
          persistent_started="$(jq '[.[]|select((.config.auto_destroy//false)!=true and .state=="started")]|length' <<<"$machines")"
          echo "PERSISTENT_STARTED_GOVERNOR_COUNT=$persistent_started"
          echo "SECRET_VALUES_EXPOSED=false"
