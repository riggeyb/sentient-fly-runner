name: Atlas Hybrid Final Candidate Real Smoke

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact riggeyb/sentient source SHA
        required: true
        type: string
      tree:
        description: Exact expected source tree SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard and build exact source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo "SOURCE_CHECKOUT=PASS"
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          echo "BUILD=PASS"
      - name: Real Atlas smoke
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            AtlasCloudClientV1,
            resolveAtlasDots3NoteModelV1,
          } from "./dist/src/model/providers/atlas-cloud-client.js";

          const key = String(process.env.ATLASCLOUD_API_KEY ?? "").trim();
          if (!key) {
            console.log("ATLAS_AUTH=FAIL");
            process.exit(2);
          }
          const client = new AtlasCloudClientV1({ apiKey: key });

          let dots;
          try {
            dots = await resolveAtlasDots3NoteModelV1(client, null, 8_000);
          } catch {
            console.log("ATLAS_AUTH=FAIL");
            console.log("DOTS3_MODEL_RESOLUTION=FAIL");
            process.exit(3);
          }
          console.log("ATLAS_AUTH=PASS");
          console.log(`DOTS3_MODEL=${dots}`);

          const deep = await client.complete({
            model: "deepseek-ai/deepseek-v3.2",
            systemPrompt: 'Return only a JSON object with a non-empty string field named "answer".',
            userPrompt: 'Set answer to "ok".',
            maxOutputTokens: 96,
            timeoutMs: 15_000,
            requireJsonObject: true,
          });
          if (!deep.ok) {
            console.log("DEEPSEEK_V3_2_CONNECTIVITY=FAIL");
            console.log(`DEEPSEEK_FAILURE_REASON=${deep.reason}`);
            process.exit(4);
          }
          const deepAnswer =
            deep.structuredOutput
            && typeof deep.structuredOutput === "object"
            && !Array.isArray(deep.structuredOutput)
            ? deep.structuredOutput.answer
            : null;
          console.log("DEEPSEEK_V3_2_CONNECTIVITY=PASS");
          console.log(`DEEPSEEK_RESPONSE_VALID=${typeof deepAnswer === "string" && deepAnswer.trim() ? "PASS" : "FAIL"}`);
          printUsage("DEEPSEEK", deep);

          const dotsResult = await client.complete({
            model: dots,
            systemPrompt: "Produce a harmless candidate response only. You are non-authoritative.",
            userPrompt: "Reply with: ok",
            maxOutputTokens: 64,
            timeoutMs: 15_000,
          });
          if (!dotsResult.ok) {
            console.log("DOTS3_CONNECTIVITY=FAIL");
            console.log(`DOTS3_FAILURE_REASON=${dotsResult.reason}`);
            process.exit(5);
          }
          console.log("DOTS3_CONNECTIVITY=PASS");
          console.log(`DOTS3_RESPONSE_VALID=${dotsResult.text.trim() ? "PASS" : "FAIL"}`);
          printUsage("DOTS3", dotsResult);
          console.log("ATLASCLOUD_SECRET_EXPOSED=false");

          function printUsage(prefix, result) {
            console.log(`${prefix}_USAGE_CAPTURED=${result.usage.totalTokens !== null ? "PASS" : "FAIL"}`);
            console.log(`${prefix}_INPUT_TOKENS=${result.usage.inputTokens ?? "UNREPORTED"}`);
            console.log(`${prefix}_CACHED_INPUT_TOKENS=${result.usage.cachedInputTokens ?? "UNREPORTED"}`);
            console.log(`${prefix}_OUTPUT_TOKENS=${result.usage.outputTokens ?? "UNREPORTED"}`);
            console.log(`${prefix}_REASONING_TOKENS=${result.usage.reasoningTokens ?? "UNREPORTED"}`);
            console.log(`${prefix}_TOTAL_TOKENS=${result.usage.totalTokens ?? "UNREPORTED"}`);
            console.log(`ACTUAL_${prefix}_SMOKE_COST=${result.reportedCostUsd ?? "UNREPORTED"}`);
            console.log(`${prefix}_LATENCY_MS=${result.latencyMs}`);
            console.log(`${prefix}_FINISH_REASON=${result.finishReason ?? "UNREPORTED"}`);
            console.log(`${prefix}_PROVIDER_REQUEST_ID=${result.providerRequestId ?? "UNREPORTED"}`);
          }
          NODE
      - name: Guard tracked source unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "TRACKED_SOURCE_MUTATION=false"
