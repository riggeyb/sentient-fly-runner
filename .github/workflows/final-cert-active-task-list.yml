name: Final Cert Active Task List
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: 3a0d39ed877c6321c181c7f75e2fd6f7de085564
      EXPECTED_TREE: 8ef9f17c38bebe267a45f9aaeec799250a93bca1
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: List sanitized unfinished objective tasks without HTTP dependency
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          jq -e --arg s "$EXPECTED_SHA" 'any(.[]; ((.config.image // .image_ref.tag // "") | contains($s)))' <<<"$machines" >/dev/null
          echo FINAL_CERT_CONTROL_PLANE_IMAGE_MATCH=PASS
          cat >/tmp/list.mjs <<'NODE'
          import {PostgresSpawnObjectiveRepository} from "/app/dist/src/objective-continuation/postgres-spawn-repository.js";
          const db=String(process.env.DATABASE_URL||process.env.DIRECT_URL||"").trim();
          if(!db) throw new Error("DB_BINDING_MISSING");
          const repo=new PostgresSpawnObjectiveRepository({connectionString:db});
          try{
            const tasks=(await repo.list("task"))
              .filter(t=>t.kind==="task"&&t.metadata?.contract==="sentient-fly-objective-runner/v1"&&["pending","running"].includes(t.status))
              .sort((a,b)=>Date.parse(a.updatedAt)-Date.parse(b.updatedAt));
            console.log("FINAL_CERT_ACTIVE_TASK_COUNT="+tasks.length);
            for(const t of tasks) console.log("FINAL_CERT_ACTIVE_TASK="+JSON.stringify({id:t.id,status:t.status,updatedAt:t.updatedAt,ageMs:Date.now()-Date.parse(t.updatedAt)}));
            console.log("SECRET_VALUES_EXPOSED=false");
          }finally{await repo.close().catch(()=>undefined);}
          NODE
          B64="$(base64 -w0 /tmp/list.mjs)"
          timeout 70s flyctl ssh console -a "$APP" -C "sh -lc 'echo $B64|base64 -d >/tmp/list-${GITHUB_RUN_ID}.mjs && node /tmp/list-${GITHUB_RUN_ID}.mjs; rc=\$?; rm -f /tmp/list-${GITHUB_RUN_ID}.mjs; exit \$rc'"
