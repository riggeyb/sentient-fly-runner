name: Sentient HF Provider Environment Configure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-hf-provider-environment-configure
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      HF_NAMESPACE: sentient-labs
      HF_VERSIONED_REPOSITORY: sentient-labs/sentient-ml-artifacts
      HF_WORKING_BUCKET: sentient-labs/sentient-working-ml
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Snapshot and fence
        shell: bash
        run: |
          set -euo pipefail
          flyctl machines list -a "$APP" --json > /tmp/before.json
          flyctl secrets list -a "$APP" --json > /tmp/secrets-before.json
          test "$(jq 'length' /tmp/before.json)" -eq 1
          jq -e 'any(.[]; ((.Name // .name // "") == "SENTIENT_HF_TOKEN"))' /tmp/secrets-before.json >/dev/null
          echo "MACHINE_ID=$(jq -r '.[0].id' /tmp/before.json)" >> "$GITHUB_ENV"
          jq -c '.[0] | {
            id, region, name,
            image:.config.image,
            guest:.config.guest,
            mounts:(.config.mounts // []),
            services:(.config.services // []),
            restart:(.config.restart // {}),
            schedule:(.config.schedule // null),
            auto_destroy:(.config.auto_destroy // false),
            standbys:(.config.standbys // [])
          }' /tmp/before.json > /tmp/stable-before.json
          jq -c '.[0].config.env // {} |
            del(.SENTIENT_HF_NAMESPACE,.SENTIENT_HF_VERSIONED_REPOSITORY,.SENTIENT_HF_WORKING_BUCKET)' \
            /tmp/before.json > /tmp/other-env-before.json
          echo "HF_TOKEN_SECRET_PRESENT=true"
          echo "SECRET_VALUES_EXPOSED=false"

      - name: Install ordinary HF environment before removing obsolete secrets
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine update "$MACHINE_ID" -a "$APP" --yes \
            --env "SENTIENT_HF_NAMESPACE=$HF_NAMESPACE" \
            --env "SENTIENT_HF_VERSIONED_REPOSITORY=$HF_VERSIONED_REPOSITORY" \
            --env "SENTIENT_HF_WORKING_BUCKET=$HF_WORKING_BUCKET" \
            >/tmp/env-update.log 2>&1
          flyctl machines list -a "$APP" --json > /tmp/after-env.json
          test "$(jq 'length' /tmp/after-env.json)" -eq 1
          test "$(jq -r '.[0].id' /tmp/after-env.json)" = "$MACHINE_ID"
          jq -e --arg ns "$HF_NAMESPACE" --arg vr "$HF_VERSIONED_REPOSITORY" --arg wb "$HF_WORKING_BUCKET" '
            .[0].config.env.SENTIENT_HF_NAMESPACE == $ns and
            .[0].config.env.SENTIENT_HF_VERSIONED_REPOSITORY == $vr and
            .[0].config.env.SENTIENT_HF_WORKING_BUCKET == $wb' /tmp/after-env.json >/dev/null
          jq -c '.[0].config.env // {} |
            del(.SENTIENT_HF_NAMESPACE,.SENTIENT_HF_VERSIONED_REPOSITORY,.SENTIENT_HF_WORKING_BUCKET)' \
            /tmp/after-env.json > /tmp/other-env-after-env.json
          cmp -s /tmp/other-env-before.json /tmp/other-env-after-env.json
          jq -c '.[0] | {
            id, region, name,
            image:.config.image,
            guest:.config.guest,
            mounts:(.config.mounts // []),
            services:(.config.services // []),
            restart:(.config.restart // {}),
            schedule:(.config.schedule // null),
            auto_destroy:(.config.auto_destroy // false),
            standbys:(.config.standbys // [])
          }' /tmp/after-env.json > /tmp/stable-after-env.json
          cmp -s /tmp/stable-before.json /tmp/stable-after-env.json
          echo "ORDINARY_HF_ENV_INSTALLED=PASS"
          echo "RESOURCE_ENVELOPE_CHANGES=NONE"

      - name: Remove only obsolete HF target-name secrets
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets unset --stage -a "$APP" \
            SENTIENT_HF_NAMESPACE \
            SENTIENT_HF_VERSIONED_REPOSITORY \
            SENTIENT_HF_WORKING_BUCKET \
            >/tmp/secrets-unset.log 2>&1
          flyctl secrets deploy -a "$APP" >/tmp/secrets-deploy.log 2>&1
          echo "OBSOLETE_HF_TARGET_SECRETS_REMOVED=PASS"
          echo "SECRET_VALUES_EXPOSED=false"

      - name: Final verify
        shell: bash
        run: |
          set -euo pipefail
          flyctl machines list -a "$APP" --json > /tmp/final.json
          flyctl secrets list -a "$APP" --json > /tmp/secrets-final.json
          test "$(jq 'length' /tmp/final.json)" -eq 1
          test "$(jq -r '.[0].id' /tmp/final.json)" = "$MACHINE_ID"
          jq -e --arg ns "$HF_NAMESPACE" --arg vr "$HF_VERSIONED_REPOSITORY" --arg wb "$HF_WORKING_BUCKET" '
            .[0].config.env.SENTIENT_HF_NAMESPACE == $ns and
            .[0].config.env.SENTIENT_HF_VERSIONED_REPOSITORY == $vr and
            .[0].config.env.SENTIENT_HF_WORKING_BUCKET == $wb' /tmp/final.json >/dev/null
          jq -e 'any(.[]; ((.Name // .name // "") == "SENTIENT_HF_TOKEN"))' /tmp/secrets-final.json >/dev/null
          jq -e 'all(.[];
            ((.Name // .name // "") != "SENTIENT_HF_NAMESPACE") and
            ((.Name // .name // "") != "SENTIENT_HF_VERSIONED_REPOSITORY") and
            ((.Name // .name // "") != "SENTIENT_HF_WORKING_BUCKET"))' /tmp/secrets-final.json >/dev/null
          jq -c '.[0].config.env // {} |
            del(.SENTIENT_HF_NAMESPACE,.SENTIENT_HF_VERSIONED_REPOSITORY,.SENTIENT_HF_WORKING_BUCKET)' \
            /tmp/final.json > /tmp/other-env-final.json
          cmp -s /tmp/other-env-before.json /tmp/other-env-final.json
          jq -c '.[0] | {
            id, region, name,
            image:.config.image,
            guest:.config.guest,
            mounts:(.config.mounts // []),
            services:(.config.services // []),
            restart:(.config.restart // {}),
            schedule:(.config.schedule // null),
            auto_destroy:(.config.auto_destroy // false),
            standbys:(.config.standbys // [])
          }' /tmp/final.json > /tmp/stable-final.json
          cmp -s /tmp/stable-before.json /tmp/stable-final.json
          echo "FLY_ENV_CONFIGURATION=PASS"
          echo "HF_WRITE_TOKEN_AVAILABLE=true"
          echo "HF_NAMESPACE_CONFIGURED=true"
          echo "HF_VERSIONED_REPOSITORY_CONFIGURED=true"
          echo "HF_WORKING_BUCKET_CONFIGURED=true"
          echo "HF_TOKEN_REMAINS_SECRET=true"
          echo "RESOURCE_ENVELOPE_CHANGES=NONE"
          echo "UNRELATED_ENV_CHANGES=NONE"
          echo "SECRET_NAMES_EXPOSED=false"
          echo "SECRET_VALUES_EXPOSED=false"
          echo "PRIVATE_ACTIONS_BRIDGE_USED=false"
          echo "GITHUB_ACTIONS_REQUIRED_FOR_RUNTIME=false"
          echo "HF_PAID_INFERENCE_USED=false"
          echo "HF_PAID_TRAINING_USED=false"
