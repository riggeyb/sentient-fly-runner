name: Sentient Artifact Cache Concurrency Engineering
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentient-artifact-cache-concurrency-engineering
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/artifact-cache-concurrency-request.cjs >/tmp/request.json
          node -e 'const x=require("/tmp/request.json");if(x.expectedHead!=="fb07f1bbb387f007a2153f8221a2b83150eb5838"||x.expectedTree!=="550f573de34df30aef5da93af0af538d1e3b8ed3"||x.objectiveId!=="SENTIENT_ROUTINE_ARTIFACT_CACHE_CONCURRENCY_RELIABILITY_V1"||x.policyVersion!=="sentient-capability-tier/v1"||x.commands.at(-1)?.category!=="test")process.exit(2)'
          app=sentient-deployment-governor
          id="$(flyctl machines list -a "$app" --json|jq -r '[.[]|select((.config.auto_destroy//false)!=true)]|sort_by(.id)|.[0].id//empty')"
          test -n "$id"
          state="$(flyctl machines list -a "$app" --json|jq -r --arg id "$id" '.[]|select(.id==$id)|.state'|head -n1)"
          started=false
          cleanup(){ rm -f /tmp/request.json; if [ "$started" = true ]; then flyctl machine stop "$id" -a "$app" >/dev/null 2>&1||true; fi; }
          trap cleanup EXIT
          if [ "$state" != started ]; then flyctl machine start "$id" -a "$app" >/dev/null; started=true; fi
          for _ in $(seq 1 60); do state="$(flyctl machines list -a "$app" --json|jq -r --arg id "$id" '.[]|select(.id==$id)|.state'|head -n1)"; [ "$state" = started ]&&break; sleep 2; done
          test "$state" = started
          req="$(base64 -w0 /tmp/request.json)"
          script='const fs=require("fs");const token=process.env.SENTIENT_ENGINEERING_API_TOKEN;if(!token)throw Error("ENGINEERING_CREDENTIAL_MISSING");const request=JSON.parse(fs.readFileSync("/tmp/request.json","utf8"));fetch("http://127.0.0.1:8080/v1/engineering/jobs",{method:"POST",headers:{authorization:"Bearer "+token,"content-type":"application/json"},body:JSON.stringify(request),signal:AbortSignal.timeout(30000)}).then(async r=>{const body=await r.json().catch(()=>({}));console.log(JSON.stringify({http:r.status,jobId:body.jobId??null,status:body.status??null,expectedHead:body.expectedHead??null,authorityReceipt:body.authorityReceipt??null}));if(r.status!==202||!body.jobId||body.expectedHead!==request.expectedHead)process.exit(31);console.log("ENGINEERING_CREATE=PASS");console.log("JOB_ID="+body.jobId)})'
          code="$(printf %s "$script"|base64 -w0)"
          flyctl ssh console -a "$app" --machine "$id" --command "sh -lc 'echo $req|base64 -d >/tmp/request.json; echo $code|base64 -d >/tmp/post.js; node /tmp/post.js; rc=\$?; rm -f /tmp/request.json /tmp/post.js; exit \$rc'"
          echo "GOVERNOR_ENGINEERING_INGRESS=PASS"
          echo "RESOURCE_ENVELOPE_CHANGED=false"
          echo "PRIVATE_ACTIONS_BRIDGE_USED=false"
          echo "SECRET_VALUES_EXPOSED=false"
