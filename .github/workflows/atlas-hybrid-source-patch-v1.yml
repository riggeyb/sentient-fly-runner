name: Atlas Hybrid Source Patch V1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact riggeyb/sentient successor SHA
        required: true
        type: string
      source_tree:
        description: Exact riggeyb/sentient successor tree SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
      - name: Repair exact Atlas test fetch typing and verify
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SOURCE_TREE"
          python - <<'PY'
          from pathlib import Path
          p = Path("test/atlas-hybrid-router.test.ts")
          text = p.read_text()
          old = "RequestInfo"
          expected = 3
          count = text.count(old)
          if count != expected:
              raise SystemExit(f"expected {expected} RequestInfo occurrences, saw {count}")
          p.write_text(text.replace(old, "Parameters<typeof fetch>[0]"))
          PY
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          node --test dist/test/atlas-hybrid-router.test.js dist/test/atlas-dots3-cost-policy.test.js dist/test/phase0-engineering-readiness.test.js
          git config user.name "sentient-atlas-engineering"
          git config user.email "sentient-atlas-engineering@users.noreply.github.com"
          git add test/atlas-hybrid-router.test.ts
          git commit -m "test: align Atlas mocked fetch typing with Node"
          git push origin HEAD:refs/heads/atlas-hybrid-cognition-mvp-v1-20261029
