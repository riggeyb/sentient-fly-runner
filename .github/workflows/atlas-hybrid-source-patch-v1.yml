name: Sentient Dynamic Cognition Hard Stops Patch V1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout engineering scripts
        uses: actions/checkout@v4
        with:
          ref: sentient-dynamic-cognition-hard-stops-v1
          path: runner
      - name: Checkout exact Sentient integration head
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: sentient
      - name: Guard exact source and apply hard-stop integration
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C sentient rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$SOURCE_TREE"
          python runner/scripts/dynamic_hard_stops_stage1b.py
          python runner/scripts/dynamic_hard_stops_stage2.py
          python runner/scripts/dynamic_hard_stops_stage3.py
          python runner/scripts/dynamic_hard_stops_stage4.py
          git -C sentient diff --check
      - name: Build and focused hard-stop verification
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --test dist/test/dynamic-hard-stops-v1.test.js
          node --test dist/test/atlas-hybrid-router.test.js
          node --test dist/test/governor-convergence-v1.test.js
      - name: Commit verified integration
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentient-hard-stop-engineering"
          git config user.email "sentient-hard-stop-engineering@users.noreply.github.com"
          git add src test
          git commit -m "runtime: connect objective and Spawn hard stops"
          git push origin HEAD:refs/heads/sentient-dynamic-cognition-hard-stops-v1-integration
          echo "SUCCESSOR_SHA=$(git rev-parse HEAD)"
          echo "SUCCESSOR_TREE=$(git show -s --format=%T HEAD)"
