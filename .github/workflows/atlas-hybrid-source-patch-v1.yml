name: Atlas Hybrid Source Patch V1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          path: runner
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch and verify Governor convergence/readiness fencing
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          TARGET_BRANCH: atlas-timing-governor-convergence-v1
          EXPERIMENTAL_GOVERNOR_SHA: c4afaf414cf87c1c0dc23b1f983dfc6c0d2c8af7
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git cat-file -e "${EXPERIMENTAL_GOVERNOR_SHA}^{commit}"

          cp runner/runner-fixtures/governor-convergence-v1.ts src/deployment-governor/convergence.ts
          git show "${EXPERIMENTAL_GOVERNOR_SHA}:src/deployment-governor/deployment.ts" > src/deployment-governor/deployment.ts
          cp runner/runner-fixtures/governor-convergence-v1.test.ts test/governor-convergence-v1.test.ts
          python - <<'PY'
          from pathlib import Path
          p = Path("test/governor-convergence-v1.test.ts")
          s = p.read_text()
          old = 'const SKILLS = "b".repeat(40);'
          new = 'const SKILLS = "b3df9b32b47370a7140d6fe814eeba97564663ab";'
          if s.count(old) != 1:
              raise SystemExit(f"skills fixture contract changed: {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

          python runner/scripts/governor_contract_patch.py
          git diff --check

          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/governor-convergence-v1.test.js \
            dist/test/deployment-governor.test.js

          git config user.name "sentient-governor-engineering"
          git config user.email "sentient-governor-engineering@users.noreply.github.com"
          git add \
            src/deployment-governor/convergence.ts \
            src/deployment-governor/deployment.ts \
            src/deployment-governor/fly-exec.ts \
            src/deployment-governor/policy.ts \
            src/deployment-governor/server-main.ts \
            test/governor-convergence-v1.test.ts
          git commit -m "governor: separate Fly convergence from readiness"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
