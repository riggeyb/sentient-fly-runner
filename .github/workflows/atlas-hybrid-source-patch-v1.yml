name: Atlas Hybrid Source Patch V1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: runner
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch and verify exact Atlas timing policy
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          TARGET_BRANCH: atlas-timing-governor-convergence-v1
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          mkdir -p runner-fixtures
          cp runner/runner-fixtures/atlas-hybrid-timeout-policy.test.ts runner-fixtures/
          sed -i 's/DEEPSEEEK/DEEPSEEK/g' runner-fixtures/atlas-hybrid-timeout-policy.test.ts
          python runner/scripts/atlas_timing_patch.py
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/atlas-hybrid-timeout-policy.test.js \
            dist/test/atlas-hybrid-router.test.js \
            dist/test/atlas-root-timeout-budget.test.js
          git config user.name "sentient-atlas-engineering"
          git config user.email "sentient-atlas-engineering@users.noreply.github.com"
          git add src/model/providers/atlas-hybrid-router.ts test/atlas-hybrid-timeout-policy.test.ts
          git commit -m "atlas: use stage-aware bounded provider timeouts"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
