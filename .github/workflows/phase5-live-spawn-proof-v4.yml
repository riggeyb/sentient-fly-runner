name: Sentient Phase 5 Live Restart Reclaim Proof V4
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  phase5-live-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Materialize corrected immutable shared proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/riggeyb/sentient-fly-runner/4b26935d44268f93cdf240f4e83e9a4703af93df/.github/workflows/phase5-live-spawn-proof.yml -o /tmp/shared.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path("/tmp/shared.yml").read_text()
          marker="        run: |\n"
          if text.count(marker)!=1: raise SystemExit("RUN_BLOCK_INVALID")
          lines=text.split(marker,1)[1].splitlines()
          out=[]
          for line in lines:
              if line=="":
                  out.append("")
              elif line.startswith("          "):
                  out.append(line[10:])
              else:
                  break
          Path("/tmp/proof.sh").write_text(("\n".join(out)+"\n").replace("PHASE1_","PHASE5_"))
          PY
          ! grep -Fq 'PHASE1_' /tmp/proof.sh
          grep -Fq 'PHASE5_SESSION_ID=$SESSION' /tmp/proof.sh
          grep -Fq 'PHASE5_ORIGINAL_WORK_ID=$ORIGINAL_WORK_ID' /tmp/proof.sh
          grep -Fq 'PHASE5_INTERRUPT_ARMED=PASS' /tmp/proof.sh
          grep -Fq 'await new Promise' /tmp/proof.sh
          grep -Fq 'throw new Error("PHASE5_AUTOMATIC_RECOVERY_NOT_TERMINAL")' /tmp/proof.sh
          bash -n /tmp/proof.sh
          echo PHASE5_SHARED_PROOF_TRANSFORM=PASS
      - name: Execute corrected immutable shared proof
        shell: bash
        run: bash /tmp/proof.sh
