name: Phase0 Exact Canonical Predeploy Repair Validation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: d83342897d0c2ca38ec4f3e38d795b633af4dc66
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fence exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "d83342897d0c2ca38ec4f3e38d795b633af4dc66"
          test "$(git rev-parse 'HEAD^{tree}')" = "3bdb661f05e7f2dbf78aba3d2dd73e1965bd6227"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Strict build
        run: npm run build
      - name: Predeploy regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/test/*.test.js; do
            if ! node --test "$f" >/tmp/test.out 2>&1; then
              echo "FAILING_TEST=$f"
              tail -n 80 /tmp/test.out
              exit 1
            fi
          done
          echo "PREDEPLOY_TESTS=PASS"
