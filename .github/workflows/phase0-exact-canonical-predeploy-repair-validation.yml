name: Phase0 Exact Canonical Predeploy Repair Validation
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: e9bd0c9135f05da2be337e5e7ac4077af0f4649d
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fence exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e9bd0c9135f05da2be337e5e7ac4077af0f4649d"
          test "$(git rev-parse 'HEAD^{tree}')" = "0d5317a5434f20530d4814d748ae9fa9a7a520f3"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Strict build
        run: npm run build
      - name: Required predeploy regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test             dist/test/final-cert-objective-admission-atomicity.test.js             dist/test/final-cert-restart-backlog-serialization.test.js             dist/test/phase5-fly-restart-lease-retry.test.js             dist/test/production-collaboration-restart-recovery.test.js             dist/test/active-work-expiry-fencing.test.js             dist/test/production-repository-capability.test.js             dist/test/phase0-control-recovery.test.js             dist/test/phase0-engineering-readiness.test.js             dist/test/deployment-governor-boundaries.test.js             dist/test/deployment-governor-cloud-bootstrap.test.js             dist/test/deployment-governor-fly-token-durability.test.js             dist/test/deployment-governor-skills-fence.test.js             dist/test/deployment-governor.test.js             dist/test/phase1-core-runtime.test.js             dist/test/phase2-dependency-boundary.test.js             dist/test/phase2-skill-execution.test.js             dist/test/phase3-cognitive-components.test.js             dist/test/phase3-local-hf-adapter.test.js             dist/test/phase4-multistep-autonomy.test.js             dist/test/phase5-collaborative-convergence.test.js             dist/test/phase5-knowledge-contracts.test.js             dist/test/phase6-capability-integration.test.js             dist/test/phase7-local-hf-feature-head.test.js             dist/test/phase7-model-improvement.test.js             dist/test/job2-self-execution.test.js             dist/test/job2-production-convergence.test.js             dist/test/permanent-continuation-http.test.js             dist/test/permanent-continuation-multiprocess.test.js
          echo "PREDEPLOY_TESTS=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
