name: Final Cert Spawn Pre Reservation Diagnostic
"on":
  workflow_dispatch:
    inputs:
      objective_id: { required: true, type: string }
      session_id: { required: true, type: string }
      sha: { required: true, type: string }
      tree: { required: true, type: string }
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      OID: ${{ inputs.objective_id }}
      SID: ${{ inputs.session_id }}
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Probe pre-reservation stages read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          [[ "$SID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          mid="$(flyctl machines list -a "$APP" --json | jq -er '.[0].id')"
          state="$(flyctl machines list -a "$APP" --json | jq -er '.[0].state')"
          if [ "$state" != "started" ]; then flyctl machine start "$mid" -a "$APP" >/dev/null; fi
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 8 "https://${APP}.fly.dev/readyz" >/tmp/r.json 2>/dev/null &&
               jq -e --arg s "$SHA" --arg t "$TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/r.json >/dev/null; then break; fi
            sleep 2
          done
          jq -e --arg s "$SHA" --arg t "$TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/r.json >/dev/null
          sed -i 's/const r@decision\.reservation;/const r=decision.reservation;/' scripts/final-spawn-pre-reservation.mjs
          B64="$(base64 -w0 scripts/final-spawn-pre-reservation.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $B64|base64 -d >/tmp/probe-${GITHUB_RUN_ID}.mjs; CERT_OID=$OID CERT_SID=$SID node /tmp/probe-${GITHUB_RUN_ID}.mjs; rc=\$?; rm -f /tmp/probe-${GITHUB_RUN_ID}.mjs; exit \$rc'"
