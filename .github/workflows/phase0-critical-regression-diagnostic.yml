name: Phase0 Critical Regression Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact Sentient candidate SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci --no-audit --no-fund
          npm run build
          echo "SOURCE_IDENTITY=PASS"
          echo "BUILD=PASS"
      - name: Run Phase0 critical regressions independently
        shell: bash
        run: |
          set -uo pipefail
          tests=(
            director-sentient-auth
            active-work-core
            active-work-expiry-fencing
            active-work-persistence
            active-work-restart-edge
            engineering-jobs
            objective-continuation
            objective-continuation-readiness
            permanent-continuation-http
            permanent-continuation-multiprocess
            phase0-control-recovery
            phase0-engineering-readiness
            deployment-governor
            deployment-governor-boundaries
            deployment-governor-skills-fence
          )
          failed=0
          for t in "${tests[@]}"; do
            echo "=== TEST:$t ==="
            if node --test "dist/test/$t.test.js"; then
              echo "REGRESSION_${t}=PASS"
            else
              echo "REGRESSION_${t}=FAIL"
              failed=1
            fi
          done
          echo "SECRET_VALUES_EXPOSED=false"
          if [ "$failed" -ne 0 ]; then
            echo "PHASE0_CRITICAL_REGRESSIONS=FAIL"
            exit 1
          fi
          echo "PHASE0_CRITICAL_REGRESSIONS=PASS"
