name: Sentient Storage Stage Compile Private Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: storage-hf-buildout-20261025
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact staging tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "da4f11a0abd2f7553a9c1a4ce0f1450bc2d23e05"
          test "$(git merge-base HEAD e9bd0c9135f05da2be337e5e7ac4077af0f4649d)" = "e9bd0c9135f05da2be337e5e7ac4077af0f4649d"
          echo "SOURCE_IDENTITY_FENCE=PASS"
      - name: Install dependencies silently
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1
      - name: Compile and post sanitized diagnostic privately
        id: compile
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
        run: |
          set +e
          npx tsc -p tsconfig.json --pretty false >/tmp/tsc.log 2>&1
          rc=$?
          set -e
          python3 - "$rc" <<'PY'
          from pathlib import Path
          import sys
          rc=int(sys.argv[1])
          lines=Path("/tmp/tsc.log").read_text(errors="replace").splitlines()
          errors=[l for l in lines if "error TS" in l][:120]
          body=[
            "STORAGE_STAGE_COMPILE_DIAGNOSTIC_V1",
            f"RUNNER_RUN_ID={{{ github.run_id }}}",
           "REF=storage-hf-buildout-20261025",
            "SHA=da4f11a0abd2f7553a9c1a4ce0f1450bc2d23e05",
            f"TSC_EXIT_CODE={rc}",
            f"ERROR_COUNT={len(errors)}",
            "ERRORS:",
            *errors,
            "SECRET_VALUES_EXPOSED=false",
          ]
          Path("/tmp/diagnostic.txt").write_text("\n".join(body)+"\n")
          PY
          gh api repos/riggeyb/sentient/issues/289/comments -f body="$(cat /tmp/diagnostic.txt)" >/dev/null
          echo "PRIVATE_DIAGNOSTIC_POSTED=true"
          test "$rc" -eq 0
