name: Sentient Storage Stage Compile Private Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: storage-hf-buildout-20261025
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact staging tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d6d4a9a28ac55c139daf38672e588e0cd4a56bf4"
          test "$(git merge-base HEAD e9bd0c9135f05da2be337e5e7ac4077af0f4649d)" = "e9bd0c9135f05da2be337e5e7ac4077af0f4649d"
          echo "SOURCE_IDENTITY_FENCE=PASS"
      - name: Install dependencies silently
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1
      - name: Compile with privacy-safe result
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.json --pretty false >/tmp/tsc.log 2>&1
          rc=$?
          set -e
          error_count="$(grep -c 'error TS' /tmp/tsc.log || true)"
          echo "TSC_EXIT_CODE=$rc"
          echo "TSC_ERROR_COUNT=$error_count"
          echo "PRIVATE_SOURCE_LINES_EXPOSED=false"
          echo "SECRET_VALUES_EXPOSED=false"
          test "$rc" -eq 0
      - name: Build production Docker image without push or deploy
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          git bundle create sentient-source.bundle HEAD
          docker build \
            --build-arg "SENTIENT_RUNTIME_SHA=$SHA" \
            --build-arg "SENTIENT_RUNTIME_TREE=$TREE" \
            --build-arg "SENTIENT_SKILLS_SHA=unset" \
            --build-arg "SENTIENT_PHASE0_ACCEPTANCE_BASE_SHA=e9bd0c9135f05da2be337e5e7ac4077af0f4649d" \
            -t sentient-storage-readonly:"${SHA::12}" .
          echo "DOCKER_BUILD=PASS"
          echo "REGISTRY_PUSH=false"
          echo "DEPLOYMENT=false"
          echo "RESOURCE_ENVELOPE_CHANGES=none"
