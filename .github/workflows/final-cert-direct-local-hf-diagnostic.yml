name: Final Cert Direct Local HF Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Prove exact local HF cognition with nonempty subordinate generation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[a-f0-9]{40}$ ]]
          ready=false
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 8 "https://${APP}.fly.dev/readyz" >/tmp/direct-hf-ready.json 2>/dev/null &&
              jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/direct-hf-ready.json >/dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          test "$ready" = true
          echo "DIRECT_HF_EXACT_READINESS=PASS"
          cat >/tmp/hf-direct.mjs <<'NODE'
          import {
            LocalHuggingFaceRuntimeV1,
            LocalHuggingFacePhase1CognitionV1,
            LOCAL_HF_MODEL_V1,
            LOCAL_HF_MODEL_REVISION_V1,
          } from "/app/dist/src/model/providers/huggingface.js";
          import {deriveTaskRequirementsV1} from "/app/dist/src/phase1/core-runtime.js";
          const runtime = new LocalHuggingFaceRuntimeV1();
          const cognition = new LocalHuggingFacePhase1CognitionV1(runtime);
          const requirements = deriveTaskRequirementsV1({
            requestId:"final-cert-direct-hf",
            sessionId:"final-cert-direct-hf-session",
            taskId:"final-cert-direct-hf-task",
            userRequest:"Explain in one concise sentence why exact source identity matters for a trustworthy runtime."
          });
          try {
            await cognition.initialize();
            console.log("DIRECT_HF_INITIALIZE=PASS");
            const value = await cognition.run(requirements);
            const row = value && typeof value === "object" ? value : {};
            const metadata = row.metadata && typeof row.metadata === "object" ? row.metadata : {};
            const usage = row.usage && typeof row.usage === "object" ? row.usage : {};
            console.log("DIRECT_HF_OK="+String(row.ok===true));
            console.log("DIRECT_HF_PROVIDER="+String(row.provider??"none"));
            console.log("DIRECT_HF_MODEL="+String(row.model??"none"));
            console.log("DIRECT_HF_CODE="+String(row.code??"none"));
            console.log("DIRECT_HF_MESSAGE="+String(row.message??"none").replace(/[\r\n]/g," ").slice(0,240));
            console.log("DIRECT_HF_OUTPUT_TOKENS="+String(usage.outputTokens??"none"));
            console.log("DIRECT_HF_MODEL_REVISION="+String(metadata.modelRevision??"none"));
            if(row.ok!==true ||
               typeof row.text!=="string" || !row.text.trim() ||
               row.provider!=="huggingface-local" ||
               row.model!==LOCAL_HF_MODEL_V1 ||
               metadata.modelRevision!==LOCAL_HF_MODEL_REVISION_V1 ||
               metadata.modelOutputIsAuthority!==false ||
               metadata.huggingFacePaidInference!==false ||
               !Number.isInteger(usage.outputTokens) || usage.outputTokens<=0) {
              throw new Error("DIRECT_HF_NONEMPTY_LOCAL_SUBORDINATE_GENERATION_NOT_PROVEN");
            }
            console.log("DIRECT_HF_LIVE_COGNITION=PASS");
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally {
            await cognition.close().catch(()=>undefined);
          }
          NODE
          node --check /tmp/hf-direct.mjs
          b64="$(base64 -w0 /tmp/hf-direct.mjs)"
          timeout 480s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/hf-direct-${GITHUB_RUN_ID}.mjs && node /tmp/hf-direct-${GITHUB_RUN_ID}.mjs; rc=\$?; rm -f /tmp/hf-direct-${GITHUB_RUN_ID}.mjs; exit \$rc'"
