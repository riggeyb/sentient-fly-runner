name: Commit validated MVP Root runtime wiring

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout runner transform
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient-fly-runner
          ref: main
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout canonical Sentient successor
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-mission-control-integration-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract and apply the already-reviewed transform
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          test "$(git rev-parse HEAD)" = "868fe1234320ee26483b2d905e6c438668a072c6"
          cd ..
          awk '
            /python3 - <<'\''PY'\''/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /,""); print}
          ' runner/.github/workflows/sentient-mvp-wire-root-runtime.yml > "$RUNNER_TEMP/mvp-wire.py"
          test -s "$RUNNER_TEMP/mvp-wire.py"
          cd sentient
          python3 "$RUNNER_TEMP/mvp-wire.py"
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/application/production-composition.ts src/fly/production-runtime.ts src/fly/self-execution.ts | sort)"

      - name: Build and production-lineage tests
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          npm ci --no-audit --no-fund
          npm run build
          node --test dist/test/spawn-mission-control-context.test.js
          npm test

      - name: Commit canonical successor
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          git config user.name "sentient-mvp-activation"
          git config user.email "sentient-mvp-activation@users.noreply.github.com"
          git add src/application/production-composition.ts src/fly/production-runtime.ts src/fly/self-execution.ts
          git commit -m "mvp: route production objectives through Root Mission Control"
          git push origin HEAD:sentient/mvp-mission-control-integration-v1
          echo "SUCCESSOR_SHA=$(git rev-parse HEAD)"
          echo "SUCCESSOR_TREE=$(git rev-parse 'HEAD^{tree}')"
