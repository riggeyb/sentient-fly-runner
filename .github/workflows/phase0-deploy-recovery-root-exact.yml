name: Phase0 Deploy Recovery Root Exact
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-deploy-recovery-root-exact
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOVERNOR_APP: sentient-deployment-governor
      RECOVERY_APP: sentient-governor-recovery-root
      RECOVERY_POLICY_REVISION: SENTIENT_GOVERNOR_RECOVERY_V1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 5d642c9e337e99639a4af8640249cc8f27595764
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy exact repaired recovery root
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5d642c9e337e99639a4af8640249cc8f27595764"
          test "$(git rev-parse 'HEAD^{tree}')" = "5a895ad4403792dffd64f004f392dd55ce7c1b63"


          echo "GOVERNOR_ENGINEERING_TOKEN_REPAIR=START"
          flyctl tokens debug -t "$FLY_API_TOKEN" > /tmp/fly-token-debug.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const value=JSON.parse(fs.readFileSync("/tmp/fly-token-debug.json","utf8"));
          let id=null;
          const visit=(v)=>{
            if(id!==null || v===null || typeof v!=="object") return;
            if(!Array.isArray(v) && v.type==="Organization" && v.body && (typeof v.body.id==="number" || typeof v.body.id==="string")) {
              id=String(v.body.id);
              return;
            }
            for(const x of (Array.isArray(v)?v:Object.values(v))) visit(x);
          };
          visit(value);
          if(!id || !/^\d+$/.test(id)) process.exit(2);
          fs.writeFileSync("/tmp/engineering-caveats.json",JSON.stringify([{type:"Organization",body:{id:Number(id),mask:"rwcdC"}}]));
          NODE
          raw_engineering_token="$(flyctl tokens attenuate -t "$FLY_API_TOKEN" -f /tmp/engineering-caveats.json)"
          ENGINEERING_FLY_TOKEN="$(printf '%s\n' "$raw_engineering_token" | awk 'NF{v=$NF} END{print v}')"
          test -n "$ENGINEERING_FLY_TOKEN"
          test "$ENGINEERING_FLY_TOKEN" != "$FLY_API_TOKEN"
          echo "::add-mask::$ENGINEERING_FLY_TOKEN"
          FLY_API_TOKEN="$ENGINEERING_FLY_TOKEN" flyctl machines list -a "$GOVERNOR_APP" --json >/dev/null
          flyctl secrets set -a "$GOVERNOR_APP" SENTIENT_ENGINEERING_MACHINE_FLY_TOKEN="$ENGINEERING_FLY_TOKEN" >/dev/null
          unset raw_engineering_token ENGINEERING_FLY_TOKEN
          echo "GOVERNOR_ENGINEERING_TOKEN_REPAIR=PASS"

          machines="$(flyctl machines list -a "$GOVERNOR_APP" --json)"
          gid="$(printf '%s' "$machines" | jq -r '.[0].id')"
          gstate="$(printf '%s' "$machines" | jq -r '.[0].state')"
          test -n "$gid"
          if [ "$gstate" != "started" ]; then
            flyctl machine start "$gid" -a "$GOVERNOR_APP" >/dev/null
          fi
          for _ in $(seq 1 60); do
            gstate="$(flyctl machines list -a "$GOVERNOR_APP" --json | jq -r --arg id "$gid" '.[] | select(.id==$id) | .state' | head -n1)"
            [ "$gstate" = "started" ] && break
            sleep 2
          done
          test "$gstate" = "started"

          echo "GOVERNOR_DB_HANDOFF=START"
          DB=""
          ssh_ok=false
          for _ in $(seq 1 20); do
            set +e
            DB="$(flyctl ssh console -a "$GOVERNOR_APP" -C "node -e 'const v=String(process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??\"\").trim();if(!v)process.exit(2);process.stdout.write(v)'" 2>/tmp/governor-db-handoff.err)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ -n "$DB" ]; then
              ssh_ok=true
              break
            fi
            DB=""
            sleep 2
          done
          if [ "$ssh_ok" != "true" ]; then
            echo "GOVERNOR_DB_HANDOFF=FAIL"
            sed -E 's#(postgres(ql)?://)[^ @]+@#\1***@#g' /tmp/governor-db-handoff.err || true
            echo "GOVERNOR_RECENT_LOGS_BEGIN"
            timeout 15s flyctl logs -a "$GOVERNOR_APP" --no-tail 2>&1 | tail -n 120 | sed -E 's#(postgres(ql)?://)[^ @]+@#\1***@#g' || true
            echo "GOVERNOR_RECENT_LOGS_END"
            exit 41
          fi
          echo "::add-mask::$DB"
          echo "GOVERNOR_DB_HANDOFF=PASS"

          echo "RECOVERY_SECRET_IMPORT=START"
          printf 'SENTIENT_DATABASE_BOOTSTRAP_URL=%s\n' "$DB" | flyctl secrets import -a "$RECOVERY_APP" --stage >/dev/null
          unset DB

          echo "RECOVERY_SECRET_IMPORT=PASS"

          echo "RECOVERY_FLY_DEPLOY=START"
          flyctl deploy --app "$RECOVERY_APP" --config fly.recovery.toml --remote-only --yes --ha=false
          echo "RECOVERY_FLY_DEPLOY=PASS"

          healthy=false
          for _ in $(seq 1 120); do
            code="$(curl -sS --max-time 5 -o /tmp/recovery-health.json -w '%{http_code}' "https://${RECOVERY_APP}.fly.dev/healthz" || true)"
            if [ "$code" = "200" ] && jq -e --arg rev "$RECOVERY_POLICY_REVISION" '.status=="ok" and .role=="INDEPENDENT_FLY_GOVERNOR_RECOVERY_ROOT" and .recoveryPolicyRevision==$rev and .oldGovernorRequired==false and .netlifyRequired==false and .githubActionsRequiredForRecoveryDesign==false' /tmp/recovery-health.json >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = "true"
          jq '{status,role,recoveryPolicyRevision}' /tmp/recovery-health.json
          echo "RECOVERY_ROOT_EXACT_SOURCE_DEPLOY=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
