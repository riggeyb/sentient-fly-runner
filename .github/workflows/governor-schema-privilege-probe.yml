name: Governor Schema Privilege Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-deployment-governor
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Probe fixed Governor schema privilege
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          id="$(printf '%s' "$machines" | jq -r '.[0].id')"
          state="$(printf '%s' "$machines" | jq -r '.[0].state')"
          if [ "$state" != "started" ]; then flyctl machine start "$id" -a "$APP" >/dev/null; fi
          for _ in $(seq 1 45); do
            state="$(flyctl machines list -a "$APP" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state')"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          cat >/tmp/schema-probe.mjs <<'NODE'
          import pg from "pg";
          const {Pool}=pg;
          const cs=String(process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??"").trim();
          if(!cs) process.exit(2);
          const p=new Pool({connectionString:cs,max:1,connectionTimeoutMillis:10000});
          try {
            const r=await p.query("SELECT to_regnamespace($1) IS NOT NULL AS exists, has_schema_privilege(current_user,$1,$2) AS usage, has_schema_privilege(current_user,$1,$3) AS create",["sentient_deployment_governor","USAGE","CREATE"]);
            console.log("GOVERNOR_SCHEMA_EXISTS="+(r.rows[0]?.exists===true));
            console.log("GOVERNOR_SCHEMA_USAGE="+(r.rows[0]?.usage===true));
            console.log("GOVERNOR_SCHEMA_CREATE="+(r.rows[0]?.create===true));
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await p.end(); }
          NODE
          b64="$(base64 -w0 /tmp/schema-probe.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $b64 | base64 -d >schema-probe.mjs && node schema-probe.mjs; rc=\$?; rm -f schema-probe.mjs; exit \$rc'"
