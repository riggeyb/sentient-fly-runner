name: Final Cert Phase5 Lease Phase4 Retry Repair
"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BRANCH: sentient-production-composition-20261017
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence and apply exact repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"
          curl -fsSL https://raw.githubusercontent.com/riggeyb/sentient-fly-runner/abc2fcb571362694c7194678dd198aeb2a62075f/scripts/final-cert-phase5-lease-phase4-repair.py -o /tmp/repair.py
          python3 /tmp/repair.py
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx 'src/application/production-collaboration.ts'
          printf '%s\n' "$changed" | grep -Fx 'src/phase4/multistep-autonomy.ts'
          printf '%s\n' "$changed" | grep -Fx 'test/final-cert-phase5-lease-phase4-resume.test.ts'
      - name: Build and focused/cross-phase regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/final-cert-phase5-lease-phase4-resume.test.js \
            dist/test/final-cert-phase4-executor-exception.test.js \
            dist/test/phase5-fly-restart-lease-retry.test.js \
            dist/test/production-collaboration-restart-recovery.test.js \
            dist/test/final-cert-restart-backlog-serialization.test.js \
            dist/test/phase4-multistep-autonomy.test.js \
            dist/test/phase1-acceptance-policy.test.js \
            dist/test/phase6-capability-integration.test.js \
            dist/test/phase7-model-improvement.test.js \
            dist/test/phase0-control-recovery.test.js
          git diff --check
      - name: Push only exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"
          git config user.name sentient-final-cert-convergence
          git config user.email sentient-final-cert-convergence@users.noreply.github.com
          git add src/application/production-collaboration.ts src/phase4/multistep-autonomy.ts test/final-cert-phase5-lease-phase4-resume.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_REPAIR_CHANGE; exit 1; }
          git commit -m "fix: preserve Phase5 continuation across inherited lease retry"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo "PRIOR_SHA=$EXPECTED_SHA"
          echo "NEW_SHA=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "PHASE5_LEASE_PHASE4_RETRY_ORDERING_REPAIR=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
