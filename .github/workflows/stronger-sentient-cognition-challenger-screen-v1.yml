name: Stronger Sentient Cognition Challenger Screen v1
on:
  workflow_dispatch:
    inputs:
      static_validation_only:
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: stronger-sentient-cognition-challenger-screen-v1
  cancel-in-progress: false
env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab
  CORPUS_SHA: 9c037505f65663ae6b7e8990ae969639572860d9
  CORPUS_DIGEST: 611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51
  CONTRACT_DIGEST: sha256:62f98338f60164620a3fe93fd69e7c94b33e8ec4602ba3337c1b06b89651673d
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.CORPUS_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: corpus-source
          persist-credentials: false
      - name: Guard frozen inputs
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$BASELINE_TREE"
          test "$(git -C corpus-source rev-parse HEAD)" = "$CORPUS_SHA"
          test "$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json|awk '{print $1}')" = "$CORPUS_DIGEST"
          test "sha256:$(sha256sum measurement-contracts/stronger-sentient-cognition-artifact-v1.schema.json|awk '{print $1}')" = "$CONTRACT_DIGEST"
          jq -e '.cognitionArtifactInterfaceFrozen==true and .dots3SynthesisValidation=="PASS" and .dots3SynthesisPolicy.enableThinking==false and .visibleArtifactEnvelope.absoluteMax==2000 and .challengerOutputCostPolicy=="COMPACT_INTERNAL_ARTIFACT_ONLY"' measurement-contracts/stronger-sentient-cognition-artifact-v1.freeze.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build accepted baseline
        working-directory: sentient
        run: npm install --no-audit --no-fund --package-lock=false && npm run build
      - name: Validate fair gate source
        run: |
          node --check scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
          node --check scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
          node --check scripts/stronger-sentient-challenger-frozen-interface-preload-v1.cjs
          grep -q 'DEEPSEEK_V3_2_MODEL_V1' scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
          ! grep -q 'DEEPSEEK_V3_2_MODD_V1' scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
          grep -q 'maxOutputTokens:2000' scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
          ! grep -q 'maxOutputTokens:4096' scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
      - name: Execute zero-provider fairness gate static validation
        env:
          ATLASCLOUD_API_KEY: static-validation-not-used
          STATIC_VALIDATE: "true"
          BASELINE_SHA: ${{ env.BASELINE_SHA }}
          BASELINE_TREE: ${{ env.BASELINE_TREE }}
          CONTRACT_DIGEST: ${{ env.CONTRACT_DIGEST }}
          EXPERIMENT_OUT: ${{ runner.temp }}/challenger-gate-static-v1.json
        run: |
          node scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
          jq -e '.fairnessGateStaticValidation=="PASS" and .providerCalls==0 and .deepseekModel=="deepseek-ai/deepseek-v3.2" and .freezeReceiptVerified==true and .dots3EnableThinking==false and .cognitionProviderCompletionMaxTokens==2000 and .visibleArtifactMaxTokens==2000' "$EXPERIMENT_OUT" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-cognition-challenger-gate-static-v1
          path: ${{ runner.temp }}/challenger-gate-static-v1.json
          retention-days: 14
      - name: Run bounded fair challenger screen
        if: ${{ inputs.static_validation_only != true }}
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          BASELINE_SHA: ${{ env.BASELINE_SHA }}
          BASELINE_TREE: ${{ env.BASELINE_TREE }}
          CORPUS_DIGEST: ${{ env.CORPUS_DIGEST }}
          CONTRACT_DIGEST: ${{ env.CONTRACT_DIGEST }}
          EXPERIMENT_OUT: ${{ runner.temp }}/challenger-screen-v1.json
        run: node scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
      - name: Guard immutable baseline
        run: |
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$BASELINE_TREE"
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.static_validation_only != true }}
        with:
          name: stronger-sentient-cognition-challenger-screen-v1
          path: ${{ runner.temp }}/challenger-screen-v1.json
          retention-days: 14
      - name: Guard experiment envelope
        run: |
          echo "FAIRNESS_GATE_STATIC_VALIDATION=PASS"
          echo "STATIC_VALIDATION_PROVIDER_CALLS=0"
          echo "DEEPSEEK_PREFLIGHT_CALLS=2"
          echo "COGNITION_PROVIDER_COMPLETION_MAX_TOKENS=2000"
          echo "DOTS3_ENABLE_THINKING=false"
          echo "PROVIDER_RETRIES=0"
          echo "SOURCE_CHANGE=false"
          echo "PRODUCTION_DEPLOYMENT=false"
