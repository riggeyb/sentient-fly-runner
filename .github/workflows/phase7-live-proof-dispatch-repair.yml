name: Sentient Phase 7 Live Improvement Proof Dispatch Repair
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact deployed Sentient SHA
        required: true
        type: string
      tree:
        description: Exact deployed Sentient tree
        required: true
        type: string
permissions:
  contents: read

jobs:
  phase7-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Prove bounded Phase 7 lifecycle through production runtime
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
          PROOF_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          APP=sentient-validation-runner
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          ready=false
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 5 "https://${APP}.fly.dev/readyz" >/tmp/ready.json 2>/dev/null &&
              jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" \
                '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/ready.json >/dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          test "$ready" = true
          echo "PHASE7_LIVE_IDENTITY_MATCH=PASS"

          cat >/tmp/proof.mjs <<'NODE'
          import { PostgresStateRepository } from "./dist/src/state/postgres-state-repository.js";
          import { DefaultSentientStateService } from "./dist/src/state/service.js";
          const db=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const proof=String(process.env.PHASE7_PROOF_ID??"").trim();
          if(!db||!token||!/^[A-Za-z0-9._:-]{1,160}$/.test(proof)) throw new Error("phase7_live_bindings_invalid");
          const repo=new PostgresStateRepository({connectionString:db}); await repo.initialize();
          const s=new DefaultSentientStateService(repo), now=new Date().toISOString();
          try {
            const task=await s.createTask({kind:"task",title:`phase7 proof ${proof}`,status:"succeeded",provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const session=await s.createSession({kind:"session",taskId:task.id,label:`phase7-${proof}`,provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const source=await s.createSource({kind:"source",sourceClass:"tool",topic:"phase7-live-proof",authorityTier:"system-verified",retrievalMethod:"deterministic",canonicalLocation:`sentient://phase7/${proof}`,freshnessPolicy:"bounded",retrievedAt:now,contentDigest:`sha256:${"7".repeat(64)}`,provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const claim=await s.createClaim({kind:"claim",statement:"Phase 7 proof outcomes were deterministically observed.",provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const mkRun=(status,attempt,repairOfRunId)=>s.createModelRun({kind:"model_run",sessionId:session.id,provider:"local-hf",model:"phase7-live-proof",attempt,status,usage:null,latencyMs:1,...(status==="failed"?{failure:{reason:"verified broken failure error",code:"phase7_live_failure",retryable:false}}:{}),...(repairOfRunId?{repairOfRunId}:{}),provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const mkExp=(r,outcome,summary)=>s.createExperience({kind:"experience",sessionId:session.id,modelRunId:r.id,outcome,summary,provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const mkEv=observation=>s.createEvidence({kind:"evidence",sourceId:source.id,observation,provenance:{actor:"system"},metadata:{phase7LiveProofId:proof}});
            const mkVer=(r,e)=>s.createVerification({kind:"verification",claimId:claim.id,verifierId:"phase7-live-deterministic-verifier",status:"passed",checkedAt:new Date().toISOString(),summary:"deterministic live proof verified",evidenceIds:[e.id],deterministic:true,provenance:{actor:"system",modelRunId:r.id},metadata:{phase7LiveProofId:proof}});

            const failed=await mkRun("failed",1), repaired=await mkRun("succeeded",2,failed.id);
            const fe=await mkExp(failed,"failure","negative broken failure error unhealthy outcome");
            const re=await mkExp(repaired,"success","positive repaired fixed healthy successful outcome");
            const fv=await mkEv("negative broken failure error observed"), rv=await mkEv("positive repaired fixed healthy success observed");
            const fver=await mkVer(failed,fv), rver=await mkVer(repaired,rv);
            const lesson=await s.createLesson({kind:"lesson",taskId:task.id,rule:"Prefer the verified repaired healthy path over the verified broken failure path.",sourceModelRunIds:[failed.id,repaired.id],sourceExperienceIds:[fe.id,re.id],sourceEvidenceIds:[fv.id,rv.id],verificationIds:[fver.id,rver.id],sourceSessionId:session.id,failedRunId:failed.id,repairRunId:repaired.id,applicability:{taskKinds:["phase7-verified-improvement"]},provenance:{actor:"system"},metadata:{phase7LiveProofId:proof,lessonCandidateId:`phase7-live-${proof}`,candidateCreatedAt:new Date().toISOString(),repairVerificationId:rver.id}});
            await s.promoteLessonCandidate(lesson.id,{decision:"promote",reasonCodes:["verified_repair_narrow_scope"]});

            const hp=await mkRun("succeeded",3), hn=await mkRun("failed",4);
            await mkExp(hp,"success","positive healthy fixed successful held out outcome");
            await mkExp(hn,"failure","negative broken failed unhealthy held out outcome");
            const hpe=await mkEv("positive healthy fixed held out result observed"), hne=await mkEv("negative broken failed held out result observed");
            await mkVer(hp,hpe); await mkVer(hn,hne);

            const response=await fetch("http://127.0.0.1:8080/v1/model-improvement",{method:"POST",headers:{authorization:`Bearer ${token}`,accept:"application/json","content-type":"application/json"},body:JSON.stringify({lessonId:lesson.id,verifiedFailureVerificationId:fver.id}),signal:AbortSignal.timeout(600000)});
            const raw=await response.text(); let body={}; try{body=JSON.parse(raw)}catch{}
            if(!response.ok) throw new Error(`phase7_http_${response.status}_${String(body?.reason??body?.error??"unknown")}`);
            const run=body?.result??{}, result=run?.result??{};
            if(typeof result.candidateCheckpointRef!=="string"||!result.candidateCheckpointRef) throw new Error("phase7_real_training_missing");
            if(!Number.isFinite(result.baselineScore)||!Number.isFinite(result.candidateScore)) throw new Error("phase7_evaluation_missing");
            if(!["PROMOTED","REJECTED"].includes(result.decision)) throw new Error("phase7_sentient_decision_missing");
            if(run.promotionDecisionOwner!=="SENTIENT_RUNTIME"||run.modelMayPromoteItself!==false||run.modelMayProposeImprovement!==true) throw new Error("phase7_authority_policy_invalid");
            if(run.evaluationEligibility?.heldOutDisjoint!==true||run.evaluationEligibility?.bothLabels!==true) throw new Error("phase7_evaluation_eligibility_invalid");
            const artifact=await repo.get("memory",run.artifactMemoryId);
            if(artifact?.kind!=="memory"||artifact.metadata?.phase7Artifact!=="model_improvement_v1") throw new Error("phase7_artifact_missing");
            const persisted=JSON.parse(artifact.content);
            if(persisted?.result?.decision!==result.decision) throw new Error("phase7_persisted_decision_mismatch");
            console.log("PHASE7_PROOF_JSON="+JSON.stringify({proofId:proof,lessonId:lesson.id,baselineId:run.baselineId,candidateId:run.candidateId,evaluationId:run.evaluationId,baselineScore:result.baselineScore,candidateScore:result.candidateScore,decision:result.decision,reason:result.reason,artifactMemoryId:run.artifactMemoryId,datasetId:run.datasetId,promotionPolicyId:run.promotionPolicyId,promotionThreshold:run.promotionThreshold}));
            console.log("PHASE7_LOCAL_TRAINING=PASS");
            console.log("PHASE7_HELD_OUT_EVALUATION=PASS");
            console.log("PHASE7_SENTIENT_POLICY_DECISION=PASS");
            console.log("PHASE7_DECISION_PERSISTED=PASS");
            console.log("PHASE7_REAL_IMPROVEMENT_CYCLE=PASS");
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await repo.close(); }
          NODE
          B64="$(base64 -w0 /tmp/proof.mjs)"
          MID="$(flyctl machines list -a "$APP" --json | jq -r '[.[]|select(.state!="destroyed")][0].id')"
          test -n "$MID" && test "$MID" != null
          flyctl ssh console -a "$APP" -s -C "sh -lc 'cd /app && echo $B64 | base64 -d >/app/phase7-proof.mjs && PHASE7_PROOF_ID=$PROOF_ID node /app/phase7-proof.mjs; rc=\$?; rm -f /app/phase7-proof.mjs; exit \$rc'"
          echo "RESULT=PASS"
