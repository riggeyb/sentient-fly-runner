name: Sentient Capability Tier Live Engineering
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options:
          - useful
          - protected
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sentient-capability-tier-live-engineering
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      MODE: ${{ inputs.mode }}
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Execute through live Sentient authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(useful|protected)$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          node --check scripts/capability-tier-live-engineering.mjs
          b64="$(base64 -w0 scripts/capability-tier-live-engineering.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/cap-tier-live.mjs && PROOF_MODE=$MODE EXPECTED_SHA=$SHA EXPECTED_TREE=$TREE node /tmp/cap-tier-live.mjs; rc=\$?; rm -f /tmp/cap-tier-live.mjs; exit \$rc'"
          echo "PRIVATE_ACTIONS_BRIDGE_USED=false"
          echo "GITHUB_ACTIONS_REQUIRED_FOR_RUNTIME=false"
          echo "RESOURCE_ENVELOPE_CHANGED=false"
