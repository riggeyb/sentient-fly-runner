name: Atlas Billing Evidence V1
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
    steps:
      - name: Query settled Atlas model billing buckets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ATLASCLOUD_API_KEY:-}"
          base="https://api.atlascloud.ai/public/v1"
          common=(
            --silent --show-error --fail-with-body
            -H "Authorization: Bearer ${ATLASCLOUD_API_KEY}"
            --get
            --data-urlencode "start_date=2026-10-29"
            --data-urlencode "end_date=2026-10-30"
            --data-urlencode "scope=self"
            --data-urlencode "group_by[]=model"
          )
          model_filters=(
            --data-urlencode "model_ids[]=deepseek-ai/deepseek-v3.2"
            --data-urlencode "model_ids[]=deepseek/deepseek-v3.2"
            --data-urlencode "model_ids[]=dots-studio/dots-3-note-prev-free"
            --data-urlencode "model_ids[]=dots-studio/dots-3-note-preview-20260813:free"
          )
          curl "${common[@]}" "${model_filters[@]}" "${base}/model-costs" > model-costs.json
          curl "${common[@]}" "${model_filters[@]}" "${base}/model-usage" > model-usage.json
          jq -e '.object == "list" and (.data | type == "array")' model-costs.json >/dev/null
          jq -e '.object == "list" and (.data | type == "array")' model-usage.json >/dev/null
          echo "ATLAS_BILLING_API=PASS"
          echo "ATLAS_BILLING_COST_BUCKETS=$(jq -c '{scope,data,has_more}' model-costs.json)"
          echo "ATLAS_BILLING_USAGE_BUCKETS=$(jq -c '{scope,data,has_more}' model-usage.json)"
          echo "ATLASCLOUD_SECRET_EXPOSED=false"
          rm -f model-costs.json model-usage.json
