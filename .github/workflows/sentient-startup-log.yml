name: Sentient Startup Log
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture Sentient startup logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs -a sentient-validation-runner --no-tail | tail -n 200
      - name: Diagnose exact live repository witness as runtime user
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=sentient-validation-runner
          id="$(flyctl machines list -a "$app" --json | jq -r '.[0].id')"
          state="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
          if [ "$state" != started ]; then flyctl machine start "$id" -a "$app" >/dev/null || true; fi
          for _ in $(seq 1 30); do
            state="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = started ] && break
            sleep 2
          done
          test "$state" = started
          flyctl ssh console -a "$app" -u node -C 'cd /opt/sentient-source || exit 40; echo NODE_REPOSITORY_WITNESS_BEGIN; stat -c "%u:%g %U:%G %n" . .git; git rev-parse HEAD; git rev-parse HEAD^{tree}; git status --short --branch; set +e; git fsck --connectivity-only --no-reflogs; fsc_rc=$?; tmp=$(mktemp -d); git clone --local --no-hardlinks --no-checkout -- /opt/sentient-source "$tmp/workspace"; clone_rc=$?; if [ "$clone_rc" -eq 0 ]; then git -C "$tmp/workspace" checkout --detach --force 997f59484e5ee1455d8eaf3694af487f47b7b24e; checkout_rc=$?; else checkout_rc=99; fi; rm -rf "$tmp"; echo NODE_REPO_FSCK_EXIT=$fsck_rc; echo NODE_REPO_CLONE_EXIT=$clone_rc; echo NODE_REPO_CHECKOUT_EXIT=$checkout_rc; echo NODE_REPOSITORY_WITNESS_END; exit 0'
          echo "SECRET_VALUES_EXPOSED=false"
