name: Phase0 Active Cert Observer
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      OBJECTIVE_ID: phase0-live-cert-40022553521
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Observe current certification objective
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/observe.mjs <<'NODE'
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const oid=String(process.env.OBJECTIVE_ID??"").trim();
          if(!token||!oid) process.exit(20);
          const r=await fetch(`http://127.0.0.1:8080/v1/objectives/${encodeURIComponent(oid)}`,{
            headers:{authorization:`Bearer ${token}`,accept:"application/json"},
            signal:AbortSignal.timeout(20000)
          });
          const b=await r.json().catch(()=>({}));
          const receipt=b.lastEngineeringReceipt??null;
          console.log("ACTIVE_CERT_OBJECTIVE="+JSON.stringify({
            httpStatus:r.status,
            objectiveId:b.objectiveId??null,
            status:b.status??null,
            activeEngineeringJobId:b.activeEngineeringJobId??null,
            lastEngineeringReceipt:receipt?{
              jobId:receipt.jobId??null,
              status:receipt.status??null,
              errorCode:receipt.errorCode??null,
              pushResult:receipt.pushResult??null,
              changedFiles:Array.isArray(receipt.changedFiles)?receipt.changedFiles.length:null
            }:null,
            error:b.error??null,
            updatedAt:b.updatedAt??null
          }));
          console.log("SECRET_VALUES_EXPOSED=false");
          if(!r.ok) process.exit(21);
          NODE
          b64="$(base64 -w0 /tmp/observe.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/observe.mjs && OBJECTIVE_ID=$OBJECTIVE_ID node /tmp/observe.mjs'"
