name: Phase0 Objective Stall Diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      GOV: sentient-deployment-governor
      OBJECTIVE_ID: phase0-live-cert-40021105488
      ENG_OBJECTIVE: phase0-live-cert-noop-40021105488
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Observe persisted objective and current live logs
        shell: bash
        run: |
          set -euo pipefail
          mid="$(flyctl machines list -a "$APP" --json | jq -r '[.[]|select(.state!="destroyed")][0].id')"
          test -n "$mid" && test "$mid" != "null"
          flyctl machine start "$mid" -a "$APP" >/dev/null || true
          for _ in $(seq 1 60); do
            state="$(flyctl machines list -a "$APP" --json | jq -r --arg id "$mid" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          cat >/tmp/objective-status.mjs <<'NODE'
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const oid=String(process.env.OBJECTIVE_ID??"");
          if(!token||!oid) process.exit(40);
          const r=await fetch(`http://127.0.0.1:8080/v1/objectives/${encodeURIComponent(oid)}`,{
            headers:{authorization:`Bearer ${token}`,accept:"application/json"},
            signal:AbortSignal.timeout(20000)
          });
          const b=await r.json().catch(()=>({}));
          console.log("OBJECTIVE_JSON="+JSON.stringify({
            httpStatus:r.status,
            objectiveId:b.objectiveId??null,
            status:b.status??null,
            activeEngineeringJobId:b.activeEngineeringJobId??null,
            lastEngineeringReceipt:b.lastEngineeringReceipt??null,
            updatedAt:b.updatedAt??null,
            error:b.error??null
          }));
          console.log("SECRET_VALUES_EXPOSEE=false");
          if(!r.ok) process.exit(41);
          NODE
          b64="$(base64 -w0 /tmp/objective-status.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/objective-status.mjs && OBJECTIVE_ID=$OBJECTIVE_ID node /tmp/objective-status.mjs'"
          echo "LIVE_LOG_DIAGNOSTIC_BEGIN"          flyctl logs -a "$APP" --no-tail 2>/dev/null \
            | grep -E 'sentient_application_initialized|engineering|objective|recovery|ERROR|Error|failed|FAILED' \
            | tail -n 250 || true
          echo "LIVE_LOG_DIAGNOSTIC_END"

      - name: Observe EngineeringJob and recovery ledgers
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/stall-ledger.mjs <<'NODE'
          import pg from "pg";
          const {Pool}=pg;
          const cs=String(process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??"").trim();
          const objective=String(process.env.ENG_OBJECTIVE??"");
          if(!cs||!objective) process.exit(50);
          const p=new Pool({connectionString:cs,max:1,connectionTimeoutMillis:10000});
          try{
            const jobs=await p.query(`
              SELECT job_id,status,error_code,created_at,completed_at
              FROM sentient_deployment_governor.engineering_jobs
              WHERE objective=$1
              ORDER BY created_at
            `,[objective]);
            const recovery=await p.query(`
              SELECT recovery_id,status,requested_sha,requested_tree,observed_sha,observed_tree,
                   recovery_policy_revision,error_code,diagnostic,started_at,completed_at
              FROM sentient_deployment_governor.governor_recovery_receipts
              WHERE started_at > NOW() - INTERVAL '30 minutes'
              ORDER BY started_at DESC
              LIMIT 10
            `);
            console.log("ENGINEERING_LEDGER_JSON="+JSON.stringify(jobs.rows));
            console.log("RECOVERY_LEDGER_JSON="+JSON.stringify(recovery.rows));
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await p.end(); }
          NODE
          b64="$(base64 -w0 /tmp/stall-ledger.mjs)"
          flyctl ssh console -a "$GOV" -C "sh -lc 'cd /app && echo $b64 | base64 -d > /app/.phase0-stall-ledger.mjs && ENG_OBJECTIVE=$ENG_OBJECTIVE node /app/.phase0-stall-ledger.mjs; rc=\$?; rm -f /app/.phase0-stall-ledger.mjs; exit \$rc'"
