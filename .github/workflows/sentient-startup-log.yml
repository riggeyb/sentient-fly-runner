name: Sentient Startup Log
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture Sentient startup logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs -a sentient-validation-runner --no-tail | tail -n 160
      - name: Diagnose repository capability in exact immutable image
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          app=sentient-validation-runner
          image=registry.fly.io/sentient-validation-runner:phase0-997f59484e5ee1455d8eaf3694af487f47b7b24e
          script="$(cat <<'NODE'
          import { createLocalRepositoryActionExecutorV1 } from "/app/dist/src/action-fabric/local-repository-executor.js";
          import { ProductionRepositoryCapabilityV1 } from "/app/dist/src/application/production-repository.js";

          const source = {
            repository: "riggeyb/sentient",
            commitSha: "997f59484e5ee1455d8eaf3694af487f47b7b24e",
            treeSha: "567f2675dc1e15ea7232f67ae39e15e6473ba03b",
          };
          const executor = createLocalRepositoryActionExecutorV1({
            repositoryPaths: { "riggeyb/sentient": "/opt/sentient-source" },
          });
          const description = await executor.describe();
          console.log("REPOSITORY_EXECUTOR=" + JSON.stringify({
            executorId: description.executorId,
            executorVersion: description.executorVersion,
            availability: description.availability,
            availabilityReason: description.availabilityReason,
          }));
          const capability = new ProductionRepositoryCapabilityV1({ source, actionExecutor: executor });
          const result = await capability.execute({
            objectiveId: "phase0-repository-live-defect-diagnostic",
            request: "verify repository connectivity",
          });
          console.log("REPOSITORY_CAPABILITY_RESULT=" + JSON.stringify(result));
          console.log("SECRET_VALUES_EXPOSED=false");
          if (result.status !== "SUCCEEDED") process.exit(42);
          NODE
          )"
          flyctl machine run --rm -a "$app" --region iad \
            --name "phase0-repo-diag-${GITHUB_RUN_ID}" \
            "$image" node --input-type=module -e "$script"
