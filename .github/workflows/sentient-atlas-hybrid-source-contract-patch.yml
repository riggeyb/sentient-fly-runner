name: Sentient Atlas Hybrid Source Contract Patch

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current successor SHA
        required: true
        type: string
      source_tree:
        description: Exact current successor tree
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable identity inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact source and apply bounded contract patch
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SOURCE_TREE"
          python - <<'PY'
          from pathlib import Path
          import re

          composition = Path("src/application/production-composition.ts")
          text = composition.read_text()
          text, n1 = re.subn(
              r'dots3Role:\s*"presentation_only"',
              'dots3Role: "co_cognition_and_synthesis"',
              text,
              count=1,
          )
          text, n2 = re.subn(
              r'transport:\s*"LOCAL"\s*\|\s*null;',
              'transport: "LOCAL" | "ATLAS_CLOUD" | null;',
              text,
              count=1,
          )
          text, n3 = re.subn(
              r'\s*assertDots3PresentationOnly\(o\);',
              '',
              text,
              count=1,
          )
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f"composition_patch_cardinality_failed:{n1}:{n2}:{n3}")
          composition.write_text(text)

          adapter = Path("src/model/providers/atlas-hybrid-adapters.ts")
          text = adapter.read_text()
          old = "ATLAS_HYBRID_ROUTE_MODD_ID_V1"
          if text.count(old) != 1:
              raise SystemExit("adapter_typo_cardinality_failed")
          text = text.replace(old, "ATLAS_HYBRID_ROUTE_MODEL_ID_V1")
          text = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
          adapter.write_text(text)

          test_file = Path("test/atlas-hybrid-router.test.ts")
          text = test_file.read_text()
          if text.count("DEEPSEEK_V3_2_MODD_V1") != 1:
              raise SystemExit("test_symbol_typo_cardinality_failed")
          text = text.replace("DEEPSEEK_V3_2_MODD_V1", "DEEPSEEK_V3_2_MODEL_V1")
          old_dots = 'const DOTS = "rednote-hilab/dots.llm1.inst";'
          if text.count(old_dots) != 1:
              raise SystemExit("test_dots_sentinel_cardinality_failed")
          text = text.replace(old_dots, 'const DOTS = "test/dots3-note-unresolved";')
          test_file.write_text(text)
          PY
          git diff --check
          git config user.name "sentient-atlas-engineering"
          git config user.email "sentient-atlas-engineering@users.noreply.github.com"
          git add src/application/production-composition.ts src/model/providers/atlas-hybrid-adapters.ts test/atlas-hybrid-router.test.ts
          git commit -m "atlas: migrate production contracts to hybrid cognition"
          git push origin HEAD:refs/heads/atlas-hybrid-cognition-mvp-v1-20261029
