name: Sentient Phase 5 Runtime Resource Diagnostic
'on':
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect sanitized Fly machine states without starting or changing machines
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[a-f0-9]{40}$ ]]
          flyctl machine list -a "$APP" --json > /tmp/sentient-machines.json
          jq -ce --arg sha "$EXPECTED_SHA" '
            if type == "array" then .
            elif type == "object" then (.machines // [])
            else [] end
            | {machineCount:length, machineStates:([.[]|{id: .id,state: .state,region: .region,imageExact: ((.config.image // .image // "")|tostring|contains($sha))}])}
          ' /tmp/sentient-machines.json
          echo "PHASE5_MACHINE_CONTROL_PLANE_READ_ONLY=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
