name: Sentient Storage HF Stage Validate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact riggeyb/sentient source SHA to validate"
        required: true
        type: string
      source_branch:
        description: "Expected source branch containing source_sha"
        required: false
        default: "storage-hf-buildout-20261025"
        type: string

permissions:
  contents: read

concurrency:
  group: sentient-storage-hf-stage-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient_test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fence exact source and storage boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ inputs.source_branch }}" sentient-production-composition-20261017
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "$(git rev-parse "origin/${{ inputs.source_branch }}")" = "${{ inputs.source_sha }}"
          test "$(git merge-base HEAD origin/sentient-production-composition-20261017)" = "e9bd0c9135f05da2be337e5e7ac4077af0f4649d"
          test -z "$(git ls-files 'node_modules/**')"
          test -z "$(git ls-files 'dist/**')"
          test -f .gitignore
          test -f .dockerignore
          grep -Fxq 'node_modules/' .gitignore
          grep -Fxq 'dist/' .gitignore
          echo "SOURCE_IDENTITY_FENCE=PASS"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "NODE_MODULES_TRACKING_REMOVED=PASS"
          echo "DIST_TRACKING_REMOVED=PASS"
          echo "PRIVATE_ACTIONS_BRIDGE_USED=false"
          echo "CANONICAL_BRANCH_MUTATED=false"
          echo "CERTIFIED_TAG_MUTATED=false"

      - name: Clean dependency install build and privacy-safe regressions
        shell: bash
        run: |
          set -euo pipefail
          run_hidden () {
            label="$1"; shift
            if "$@" >"/tmp/${label}.log" 2>&1; then
              echo "${label}=PASS"
            else
              echo "${label}=FAIL"
              echo "PRIVATE_SOURCE_DIAGNOSTICS_EXPOSED=false"
              exit 1
            fi
          }
          run_hidden NPM_CI npm ci --no-audit --no-fund
          run_hidden BUILD npm run build
          run_hidden ARTIFACT_STORAGE node --test dist/test/artifact-storage.test.js
          mapfile -t tests < <(find dist/test dist/tests -type f -name '*.test.js' 2>/dev/null | sort -u)
          test "${#tests[@]}" -gt 0
          run_hidden CUMULATIVE_REGRESSIONS node --test "${tests[@]}"
          echo "TEST_FILE_COUNT=${#tests[@]}"
          echo "BUILD_REPRODUCIBLE=PASS"
          echo "HF_PAID_INFERENCE_USED=false"
          echo "HF_PAID_TRAINING_USED=false"

      - name: Docker rebuild and source-witness proof
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          git bundle create sentient-source.bundle HEAD >/tmp/bundle-create.log 2>&1
          git bundle verify sentient-source.bundle >/tmp/bundle-verify.log 2>&1
          if docker build             --build-arg "SENTIENT_RUNTIME_SHA=$source_sha"             --build-arg "SENTIENT_RUNTIME_TREE=$source_tree"             --build-arg "SENTIENT_SKILLS_SHA=unset"             --build-arg "SENTIENT_PHASE0_ACCEPTANCE_BASE_SHA=e9bd0c9135f05da2be337e5e7ac4077af0f4649d"             -t "sentient-storage-hf-validate:${{ inputs.source_sha }}" . >/tmp/docker-build.log 2>&1; then
            image_id="$(docker image inspect "sentient-storage-hf-validate:${{ inputs.source_sha }}" --format '{{.Id}}')"
            test -n "$image_id"
            rm -f sentient-source.bundle
            echo "DOCKER_BUILD_REPRODUCIBLE=PASS"
            echo "SOURCE_BUNDLE_VERIFIED=PASS"
            echo "SOURCE_BUNDLE_COMMITTED=false"
          else
            rm -f sentient-source.bundle
            echo "DOCKER_BUILD_REPRODUCIBLE=FAIL"
            echo "PRIVATE_SOURCE_DIAGNOSTICS_EXPOSED=false"
            exit 1
          fi

      - name: Final receipt
        if: always()
        shell: bash
        run: |
          echo "RUNNER_WORKFLOW=sentient-storage-hf-stage-validate.yml"
          echo "SOURCE_SHA=${{ inputs.source_sha }}"
          echo "SOURCE_BRANCH=${{ inputs.source_branch }}"
          echo "SOURCE_REPO=riggeyb/sentient"
          echo "PUBLIC_RUNNER_REPO=riggeyb/sentient-fly-runner"
          echo "PRIVATE_ACTIONS_BRIDGE_USED=false"
          echo "SOURCE_MUTATION=false"
          echo "DEPLOYMENT=false"
          echo "CERTIFICATION_REOPENED=false"
