name: Dynamic Cognition Synthesis Byte Repair V1

on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        type: string
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Exact repair, build, test, push
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          from pathlib import Path
          p=Path("src/application/production-mission-control-synthesis.ts")
          s=p.read_text()
          bad='SUCCEE' + chr(0x12) + 'ED'
          if s.count(bad) != 1:
              raise SystemExit(f"bad status count={s.count(bad)}")
          s=s.replace(bad, "SUCCEEDED", 1)
          old='console.info(JSON.stringify(s\n    event:'
          if s.count(old) != 1:
              raise SystemExit(f"bad telemetry count={s.count(old)}")
          s=s.replace(old, 'console.info(JSON.stringify({\n    event:', 1)
          p.write_text(s)
          PY
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          npm test
          git config user.name "Sentient Engineering"
          git config user.email "sentient-engineering@users.noreply.github.com"
          git add src/application/production-mission-control-synthesis.ts
          git diff --cached --check
          git commit -m "cognition: repair synthesis hard-stop source bytes"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "SUCCESSOR_SHA=$(git rev-parse HEAD)"
          echo "SUCCESSOR_TREE=$(git rev-parse HEAD^{tree})"
          echo "DEPLOYMENT_PERFORMED=false"
