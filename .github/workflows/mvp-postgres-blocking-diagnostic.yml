name: MVP Postgres Blocking Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect sanitized database blockers
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/db-blockers.mjs" <<'NODE'
          import { Pool } from "pg";
          const cs=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          if(!cs) throw new Error("DB_BINDING_MISSING");
          const pool=new Pool({connectionString:cs,max:1});
          try {
            const rows=(await pool.query(`
              SELECT pid,state,wait_event_type,wait_event,
                     extract(epoch from (now()-query_start))::int AS query_age_s,
                     CASE WHEN xact_start IS NULL THEN NULL ELSE extract(epoch from (now()-xact_start))::int END AS xact_age_s,
                     pg_blocking_pids(pid) AS blockers,
                     CASE
                       WHEN query ILIKE 'UPDATE %sentient_durable_state%' THEN 'UPDATE_SENTIENT_DURABLE_STATE'
                       WHEN query ILIKE 'SELECT %sentient_durable_state%' THEN 'SELECT_SENTIENT_DURABLE_STATE'
                       WHEN query ILIKE '%sentient_durable_state%' THEN 'OTHER_SENTIENT_DURABLE_STATE'
                       ELSE 'OTHER'
                     END AS operation
              FROM pg_stat_activity
              WHERE datname=current_database()
                AND pid<>pg_backend_pid()
                AND state<>'idle'
              ORDER BY query_start
            `)).rows;
            console.log("ACTIVE_DB_SESSIONS="+JSON.stringify(rows));
            const locks=(await pool.query(`
              SELECT l.pid,l.mode,l.granted,pg_blocking_pids(l.pid) AS blockers
              FROM pg_locks l
              JOIN pg_class c ON c.oid=l.relation
              WHERE c.relname='sentient_durable_state'
              ORDER BY l.pid,l.granted,l.mode
            `)).rows;
            console.log("DURABLE_STATE_LOCKS="+JSON.stringify(locks));
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await pool.end(); }
          NODE
          B64="$(base64 -w0 "$RUNNER_TEMP/db-blockers.mjs")"
          timeout 120s flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $B64 | base64 -d >/app/db-blockers.mjs && node /app/db-blockers.mjs; rc=\$?; rm -f /app/db-blockers.mjs; exit \$rc'"
