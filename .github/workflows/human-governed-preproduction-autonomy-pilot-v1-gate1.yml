name: Human-Governed Preproduction Autonomy Pilot V1 Gate 1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string

permissions:
  contents: read

env:
  CANONICAL_SENTIENT_SHA: ${{ inputs.source_sha }}
  CANONICAL_SENTIENT_TREE: ${{ inputs.source_tree }}

jobs:
  gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout independent operator
        uses: actions/checkout@v4

      - name: Checkout exact accepted Sentient source
        shell: bash
        env:
          SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SENTIENT_SOURCE_GITHUB_TOKEN"
          auth="$(printf 'x-access-token:%s' "$SENTIENT_SOURCE_GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout https://github.com/riggeyb/sentient.git sentient
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$CANONICAL_SENTIENT_SHA"
          git -C sentient checkout --detach "$CANONICAL_SENTIENT_SHA"
          git -C sentient remote set-url origin disabled://sentient
          unset auth
          test "$(git -C sentient rev-parse HEAD)" = "$CANONICAL_SENTIENT_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$CANONICAL_SENTIENT_TREE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Strict build exact accepted Sentient source
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Zero-cost Gate 1 economic and transport preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/gate1-live-cognition-v2.mjs
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/gate1-live-cognition-v2.mjs").read_text()
          assert 'const SOFT=0.50, HARD=1.00' in s
          assert 'MAX_IN=4096, MAX_OUT=320, MAX_REASON=320' in s
          assert 'MAX_INPUT_RATE=4.00, MAX_OUTPUT_RATE=30.177, MAX_REASON_RATE=30.177' in s
          assert 'if(receipt.actualProviderSpendUsd+MAX_NEXT>HARD)' in s
          assert 'node scripts/gate1-live-cognition.mjs ' not in Path(".github/workflows/human-governed-preproduction-autonomy-pilot-v1-gate1.yml").read_text()
          print("ZERO_COST_GATE1_ADMISSION_SOURCE=PASS")
          PY
          node - <<'NODE'
          const maxNext=(4096*4+320*30.177+320*30.177)/1e6;
          if(Math.abs(maxNext-0.03569728)>1e-12)throw new Error("reservation mismatch");
          if(maxNext*2>0.50)throw new Error("planned exposure crosses soft budget");
          if(maxNext*2>1.00)throw new Error("planned exposure crosses hard budget");
          console.log(JSON.stringify({maxEstimatedNextCallCostUsd:maxNext,maximumPlannedExposureUsd:maxNext*2,providerCalls:0}));
          NODE
          set +e
          OPENROUTER_API_KEY= node scripts/gate1-live-cognition-v2.mjs > "$RUNNER_TEMP/gate1-nokey.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep 'OPENROUTER_API_KEY_UNAVAILABLE' "$RUNNER_TEMP/gate1-nokey.log"
          echo "ZERO_COST_NO_KEY_TRANSPORT_PREFLIGHT=PASS"

      - name: Live cognition within Gate 1 envelope
        id: live
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_KEY || secrets.OPENROUTER_API_KEY_SHARED || secrets.OPENROUTER_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          node scripts/gate1-live-cognition-v2.mjs 2>&1 | tee "$RUNNER_TEMP/gate1-live.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$RUNNER_TEMP/gate1-live-status.txt"
          grep '^GATE1_RECEIPT>' "$RUNNER_TEMP/gate1-live.log" > "$RUNNER_TEMP/gate1-receipt-line.txt"
          echo "live_exit_code=$status"

      - name: Independently validate and enrich Gate 1 receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/gate1-receipt-line.txt"
          node - "$RUNNER_TEMP/gate1-receipt-line.txt" <<'NODE'
          const fs=require("fs");
          const line=fs.readFileSync(process.argv[2],"utf8").trim();
          if(!line.startsWith("GATE1_RECEIPT>"))throw new Error("missing Gate 1 receipt");
          const r=JSON.parse(line.slice("GATE1_RECEIPT>".length));
          const eq=(k,v)=>{if(r[k]!==v)throw new Error(`${k}=${JSON.stringify(r[k])} expected ${JSON.stringify(v)}`)};
          eq("canonicalSentientSha",process.env.CANONICAL_SENTIENT_SHA);
          eq("canonicalSentientTree",process.env.CANONICAL_SENTIENT_TREE);
          eq("provider","openrouter");
          eq("model","moonshotai/kimi-k3.1-pro");
          eq("modelRoute","PRIMARY_COGNITION");
          eq("gateSoftBudgetUsd",0.50);
          eq("gateHardBudgetUsd",1.00);
          if(Math.abs(r.maxEstimatedNextCallCostUsd-0.03569728)>1e-12)throw new Error("incorrect worst-case reservation");
          if(!(r.actualProviderSpendUsd<=1.00))throw new Error("hard budget exceeded");
          if(r.hardBudgetExceeded)throw new Error("hard budget flag");
          if(r.providerRetries!==0)throw new Error("unexpected provider retries");
          if(r.authorityViolations!==0)throw new Error("authority violation");
          if(r.gateResult==="PASS"){
            eq("terminalState","OBJECTIVE_COMPLETE");
            eq("providerCalls",2);
            eq("successfulProviderCalls",2);
            eq("providerFailures",0);
            if(!(r.billedInputTokens>0&&r.billedOutputTokens>0))throw new Error("provider token telemetry missing");
            if(!r.calls.every(c=>c.requestId&&c.usage&&Number.isFinite(c.latencyMs)&&Number.isFinite(c.providerReportedCostUsd)))throw new Error("provider telemetry incomplete");
            if(!r.calls.every(c=>c.artifactValid&&c.constraintRetention&&c.evidenceRetention&&c.verificationRetention))throw new Error("artifact retention failed");
            const sum=r.calls.reduce((n,c)=>n+c.providerReportedCostUsd,0);
            if(Math.abs(sum-r.actualProviderSpendUsd)>1e-6)throw new Error("cost ledger mismatch");
          }
          const lat=r.calls.filter(c=>Number.isFinite(c.latencyMs)).map(c=>c.latencyMs);
          const enriched={...r,
            tokenAccountingSources:{billedInput:"PROVIDER_REPORTED",billedCache:"PROVIDER_REPORTED",billedOutput:"PROVIDER_REPORTED",billedReasoning:"PROVIDER_REPORTED",internalContext:"INTERNAL_ESTIMATE"},
            costCalculationMethod:"PROVIDER_REPORTED_USAGE_COST",
            latencySummary:lat.length?{minMs:Math.min(...lat),maxMs:Math.max(...lat),sumMs:lat.reduce((a,b)=>a+b,0)}:null,
            queueWaitSummary:"UNAVAILABLE_PROVIDER_NOT_EXPOSED",
            unboundedRetries:false,
            productionModelRouteChange:false,
            productionMutation:false,
            productionDeployment:false,
            unboundedGithubAuthority:false,
            stopPaidCognition:true,
            preserveState:true,
            nextGate:"GATE_2_LIVE_COGNITION_ARTIFACT_QUALITY",
            nextGateAuthorized:false
          };
          console.log("GATE1_ACCEPTED_RECEIPT>"+JSON.stringify(enriched));
          if(r.gateResult!=="PASS")process.exit(3);
          NODE

      - name: Re-fence immutable source and stop paid cognition
        if: always()
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SENTIENT_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANONICAL_SENTIENT_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "STOP_PAID_COGNITION=true"
          echo "PRESERVE_STATE=true"
          echo "NEXT_GATE_AUTHORIZED=false"
          echo "PRODUCTION_MODEL_ROUTE_CHANGE=false"
          echo "PRODUCTION_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
