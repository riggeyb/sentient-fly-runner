name: Final Sentient Governor Identity Audit
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-deployment-governor
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read exact Governor live identity
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          test "$(jq '[.[]|select(.state!="destroyed")]|length' <<<"$machines")" = "1"
          mid="$(jq -er '[.[]|select(.state!="destroyed")][0].id' <<<"$machines")"
          state="$(jq -er '[.[]|select(.state!="destroyed")][0].state' <<<"$machines")"
          if [ "$state" != "started" ]; then flyctl machine start "$mid" -a "$APP" >/dev/null; fi
          body=""
          for _ in $(seq 1 60); do
            body="$(flyctl ssh console -a "$APP" -C "sh -lc 'curl -fsS --max-time 5 http://127.0.0.1:8080/healthz'" 2>/dev/null || true)"
            if jq -e '.status=="ok" and .authorityBoundary=="DEPLOYMENT_GOVERNOR" and .fixedRepository==true and .fixedTargetApp==true and (.governorSha|test("^[a-f0-9]{40}$")) and (.governorTree|test("^[a-f0-9]{40}$")) and .recoveryPolicyRevision=="SENTIENT_GOVERNOR_RECOVERY_V1"' >/dev/null 2>&1 <<<"$body"; then break; fi
            sleep 2
          done
          jq -e '.status=="ok" and .authorityBoundary=="DEPLOYMENT_GOVERNOR" and .fixedRepository==true and .fixedTargetApp==true and (.governorSha|test("^[a-f0-9]{40}$")) and (.governorTree|test("^[a-f0-9]{40}$")) and .recoveryPolicyRevision=="SENTIENT_GOVERNOR_RECOVERY_V1"' >/dev/null <<<"$body"
          echo "GOVERNOR_SHA=$(jq -r .governorSha <<<"$body")"
          echo "GOVERNOR_TREE=$(jq -r .governorTree <<<"$body")"
          echo GOVERNOR_AUTHORITY=PASS
          echo GOVERNOR_IDENTITY=PASS
          echo SECRET_VALUES_EXPOSED=false
