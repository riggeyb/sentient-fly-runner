name: Stronger Sentient Output Envelope Experiment v1

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stronger-sentient-output-envelope-v1
  cancel-in-progress: false

env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab
  CORPUS_SOURCE_SHA: 9c037505f65663ae6b7e8990ae969639572860d9
  CORPUS_DIGEST: 611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.CORPUS_SOURCE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: corpus-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$BASELINE_TREE"
          actual="$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json | awk '{print $1}')"
          test "$actual" = "$CORPUS_DIGEST"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build exact accepted baseline
        working-directory: sentient
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Prepare causal experiment from existing baseline harness
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/stronger-sentient-baseline-measurement.mjs scripts/output-envelope-tmp.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/output-envelope-tmp.mjs")
          s=p.read_text()
          s=s.replace("for(const t of corpus.tasks){", 'for(const t of corpus.tasks.filter(t=>["cog-v1-02","cog-v1-05","cog-v1-13","cog-v1-14"].includes(t.taskId))){', 1)
          s=s.replace("maxOutputTokens:512", "maxOutputTokens:1024", 1)
          s=s.replace('"STRONGER_SENTIENT_BASELINE_V1"', '"STRONGER_SENTIENT_OUTPUT_ENVELOPE_V1"', 1)
          s=s.replace('"stronger-sentient-baseline-v1.json"', '"stronger-sentient-output-envelope-v1.json"', 1)
          p.write_text(s)
          PY
          grep -q 'maxOutputTokens:1024' scripts/output-envelope-tmp.mjs
          grep -q 'cog-v1-14' scripts/output-envelope-tmp.mjs

      - name: Run bounded output-envelope experiment
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          CORPUS_PATH: corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json
          MAX_PROVIDER_CALLS: "10"
        run: node scripts/output-envelope-tmp.mjs

      - name: Verify baseline immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$BASELINE_TREE"
          git -C sentient diff --exit-code
          git -C sentient diff --cached --exit-code
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-output-envelope-v1
          path: stronger-sentient-output-envelope-v1.json
          retention-days: 14

      - name: Deployment guard
        run: |
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "PRODUCTION_CONFIGURATION_CHANGE=false"
          echo "PRODUCTION_DATABASE_MIGRATION=false"
