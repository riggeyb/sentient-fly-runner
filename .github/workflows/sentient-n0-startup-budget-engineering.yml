name: Sentient N0 Startup Budget Engineering
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentient-n0-startup-budget-engineering
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Submit bounded N0 request through resident Governor
        shell: bash
        run: bash scripts/local-runtime-startup-budget-submit.sh
