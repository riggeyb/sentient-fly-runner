name: Mission Control Exact Failure Diagnostic V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: http://postgres:postgres@127.0.0.1:5432/sentient
      EXPECTED_SHA: a5f7aac214c4d111009d8dc469fcddc95b4cea6d
      EXPECTED_TREE: 486d495b0adb14ba4b035b170483f9f709d19b29
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: a5f7aac214c4d111009d8dc469fcddc95b4cea6d
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnose exact failing tests
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo "DIAGNOSTIC_SOURCE_SHA=$EXPECTED_SHA"
          echo "DIAGNOSTIC_SOURCE_TREE=$EXPECTED_TREE"
          cd sentient-orchestrator
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run migrate
          set +e
          npm test >/tmp/mission-control-tests.log 2>&1
          test_rc=$?
          set -e
          echo "NPM_TEST_EXIT=$test_rc"
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path("/tmp/mission-control-tests.log").read_text(errors="replace").splitlines()
          failure_ix = [i for i, line in enumerate(lines) if line.startswith("not ok ")]
          print(f"FAILURE_COUNT={len(failure_ix)}")
          for n, i in enumerate(failure_ix, 1):
              start = max(0, i - 3)
              end = min(len(lines), i + 52)
              print(f"--- FAILURE_{n}_BEGIN ---")
              for line in lines[start:end]:
                  line = re.sub(r'gh[pousr]_[A-Za-z0-9_]+', '[REDACTED]', line)
                  line = re.sub(r'flyv1_[A-Za-z0-9_-]+', '[REDACTED]', line)
                  line = re.sub(r'(?i)((?:authorization|token|secret|password|credential|cookie|api[_-]?key)\s*[:=]\s*)\S+)', r'\1[REDACTED]', line)
                  print(line)
              print(f"--- FAILURE_{n}_END ---")
          for line in lines:
              if re.match(r'^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ', line):
                  print(line)
          PY
          exit "$test_rc"
