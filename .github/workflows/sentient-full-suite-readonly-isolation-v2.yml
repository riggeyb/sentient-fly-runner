name: Sentient Mission Control Exact Acceptance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 90d45ee12dd9990df2d11b412afcd7ac4ebe3edc
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence and build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "90d45ee12dd9990df2d11b412afcd7ac4ebe3edc"
          test "$(git rev-parse 'HEAD^{tree}')" = "56557e957d320aaa065c20f626c33c819c6f9409"
          npm install --no-package-lock --no-audit --no-fund
          echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_BY_REPOSITORY_DESIGN"
          npm run build
          test -z "$(git status --porcelain)"
          echo "SENTIENT_TYPECHECK=PASS"
          echo "SENTIENT_BUILD=PASS"
      - name: Run every compiled test file
        run: |
          set -euo pipefail
          files="$(find dist/test -maxdepth 1 -type f -name '*.test.js' -print | sort)"
          test -n "$files"
          passed=0
          failed=0
          mkdir -p "$RUNNER_TEMP/sentient-test-logs"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            name="$(basename "$file")"
            if timeout 180s node --test "$file" >"$RUNNER_TEMP/sentient-test-logs/$name.log" 2>&1; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "FAILED_TEST_FILE=$file"
              tail -n 120 "$RUNNER_TEMP/sentient-test-logs/$name.log"
            fi
          done <<< "$files"
          total=$((passed+failed))
          printf '{"sourceSha":"%s","sourceTree":"%s","totalFiles":%d,"passedFiles":%d,"failedFiles":%d}\n' "90d45ee12dd9990df2d11b412afcd7ac4ebe3edc" "56557e957d320aaa065c20f626c33c819c6f9409" "$total" "$passed" "$failed" > "$RUNNER_TEMP/sentient-full-suite-report.json"
          echo "TOTAL_TEST_FILES=$total"
          echo "PASSED_TEST_FILES=$passed"
          echo "FAILED_TEST_FILES=$failed"
          test "$failed" -eq 0
          echo "SENTIENT_COMPILED_FULL_SUITE=PASS"
      - name: Run authored SpawnSentient runtime fixture
        run: |
          set -euo pipefail
          test -f tests/spawn-mission-control-context.test.ts
          node --experimental-strip-types --test tests/spawn-mission-control-context.test.ts
          echo "SPAWN_MISSION_CONTROL_RUNTIME_FIXTURE=PASS"
          echo "DYNAMIC_CHILD_AUTO_CONTEXT_TEST=PASS"
          echo "EFFECTIVE_GRANT_NON_EXPANSION_TEST=PASS"
      - name: Verify read-only source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "90d45ee12dd9990df2d11b412afcd7ac4ebe3edc"
          test "$(git rev-parse 'HEAD^{tree}')" = "56557e957d320aaa065c20f626c33c819c6f9409"
          test -z "$(git status --porcelain)"
          echo "SOURCE_MUTATION=false"
          echo "DEPLOYMENT=false"
          echo "CERTIFICATION_REOPENED=false"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentient-mission-control-acceptance
          path: |
            ${{ runner.temp }}/sentient-full-suite-report.json
            ${{ runner.temp }}/sentient-test-logs
          if-no-files-found: warn
          retention-days: 7
