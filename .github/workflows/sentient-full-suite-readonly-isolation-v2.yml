name: Sentient Full Suite Readonly Isolation V2
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      private_issue:
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTIENT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fence exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "SOURCE_IDENTITY=PASS"
          echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_IN_SOURCE"
          echo "DEPENDENCY_MANIFEST_SHA=$(git rev-parse HEAD:package.json)"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build
        run: npm run build
      - name: Run all compiled tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/test/*.test.js)
          test "${#files[@]}" -gt 0
          echo "TOTAL_TEST_FILES=${#files[@]}"
          node --test "${files[@]}"
          echo "FULL_TEST_SUITE=PASS"
      - name: Guard tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "SOURCE_MUTATION=false"
          echo "GENERATED_UNTRACKED_ARTIFACTS_ALLOWED=true"
          echo "DIRECT_EXACT_SHA_ACCEPTANCE=PASS"
