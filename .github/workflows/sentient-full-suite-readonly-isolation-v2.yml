name: Skills Exact Readonly Isolation V3

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact candidate acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
          GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/exact
          failed=0
          sanitize() {
            sed -E 's/gh[pousr]_[A-Za-z0-9_]+/[REDACTED]/g; s/flyv1_[A-Za-z0-9_-]+/[REDACTED]/g; s/(authorization|token|secret|password|credential|cookie|api[_-]?key)[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1=[REDACTED]/Ig'
          }
          run_step() {
            label="$1"; shift
            "$@" >"/tmp/exact/${label}.log" 2>&1
            status=$?
            echo "${label}=$status" >>/tmp/receipt.env
            if [ "$status" -ne 0 ]; then
              echo "::group::${label} sanitized failure evidence"
              if [ "$label" = "ORCH_TEST" ]; then
                grep -n -B 10 -A 36 '^not ok ' "/tmp/exact/${label}.log" | tail -n 320 | sanitize
              else
                tail -n 160 "/tmp/exact/${label}.log" | sanitize
              fi
              echo "::endgroup::"
              failed=1
            fi
          }

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 2
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE" || exit 2

          {
            echo "EXACT_SKILLS_ACCEPTANCE_RECEIPT_V3"
            echo "SOURCE_SHA=$EXPECTED_SHA"
            echo "SOURCE_TREE=$EXPECTED_TREE"
            echo "RUNNER_OS=$(uname -srvmo)"
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
            echo "PYTHON_VERSION=$(python --version 2>&1)"
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >/tmp/receipt.env

          run_step PY_DEPS python -m pip install -r requirements.txt
          run_step REGISTRY python scripts/validate_registry.py
          run_step EVALS python scripts/check_evals.py
          run_step DURABLE_OBJECTIVE env PYTHONDONTWRITEBYTECODE=1 python tests/test_durable_objective_continuation_v1.py
          run_step ACTIVE_WORK env PYTHONDONTWRITEBYTECODE=1 python tests/test_active_work_disclosure_v1.py
          run_step REPO_EDIT python scripts/test_repository_edit.py
          run_step REPO_EDIT_GATEWAY
          run_step ACLIONS_SCHEMA 
          run_step NETLIFY_SCHEMA 
          pushd sentient-orchestrator >/dev/null
          if [ -f package-lock.json ]; then
            echo "DEPENDENCY_LOCK_IDENTITY=sentient-orchestrator/package-lock.json:$(git rev-parse HEAD:sentient-orchestrator/package-lock.json)" >>/tmp/receipt.env
          else
            echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_IN_EXAACT_CANDIDATE" >>/tmp/receipt.env
            echo "DEPENDENCY_MANEFEST_IDENTITY=sentient-orchestrator/package.json:$(git rev-parse HEAD:sentient-orchestrator/package.json)" >>/tmp/receipt.env
          fi
          run_step ORCH_INSTALL npm install --ignore-scripts --no-audit --no-fund
          run_step TYPECHECK npm run typecheck
          run_step MIGRATE npm run migrate
          echo "ORCHESTRATOR_TEST_FILES=$(find tests -type f -name '*.test.ts' | wc -l | tr -d ' ')" >>/tmp/receipt.env
          run_step ORCH_TEST npm test
          popd >/dev/null

          run_step REMOTE_REGISTRY python scripts/validate_registry.py --remote

          f="/tmp/exact/ORCH_TEST.log"
          if [ -f "$f" ]; then
            tests="$(grep -E '^# tests [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            pass="$(grep -E '^# pass [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            fail="$(grep -E '^# fail [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            skip="$(grep -E '^# skipped [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            echo "ORCH_TEST_TESTS=${tests:-NOT_REPORTED}" >>/tmp/receipt.env
            echo "ORCH_TEST_PASS=${pass:-NOT_REPORTED}" >>/tmp/receipt.env
            echo "ORCH_TEST_FAIL=${fail:-NOT_REPORTED}" >>/tmp/receipt.env
            echo "ORCH_TEST_SKIP=${skip:-NOT_REPORTED}" >>/tmp/receipt.env
          fi

          git diff --quiet && git diff --cached --quiet
          clean=$?
          echo "TRACKED_SOURCE_MUTATION=$([ "$clean" -eq 0 ] && echo false || echo true)" >>/tmp/receipt.env
          [ "$clean" -eq 0 ] || failed=1
          echo "FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>/tmp/receipt.env
          echo "OVERALL_EXIT=$failed" >>/tmp/receipt.env
          cat /tmp/receipt.env
          exit "$failed"

      - name: Upload non-secret receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-exact-${{ inputs.sha }}
          path: /tmp/receipt.env
          if-no-files-found: error
          retention-days: 30
