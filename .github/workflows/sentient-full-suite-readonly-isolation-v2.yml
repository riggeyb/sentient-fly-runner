name: Coordination Substrate Exact Acceptance V1

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      integration_canonical_head:
        required: false
        type: string
        default: ""
      integration_pr_base_sha:
        required: false
        type: string
        default: ""
      integration_branch:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: a6d430ff775044a03f2fca9c63ee6bfa1796f558
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fence exact PR 245 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a6d430ff775044a03f2fca9c63ee6bfa1796f558"
          test "$(git rev-parse 'HEAD^{tree}')" = "785fb508b67515b1963914196ad7cbee50ccabe2"
          echo "COORDINATION_SHA=$(git rev-parse HEAD)"
          echo "COORDINATION_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Registry and repository validation
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python scripts/validate_registry.py
          python scripts/check_evals.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_durable_objective_continuation_v1.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_active_work_disclosure_v1.py
          python scripts/test_repository_edit.py
          python scripts/test_repository_edit_request.py
          python scripts/validate_actions_schema.py
      - name: Orchestrator typecheck
        working-directory: sentient-orchestrator
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run typecheck
      - name: Postgres migrations
        working-directory: sentient-orchestrator
        run: npm run migrate
      - name: Coordination substrate full tests
        working-directory: sentient-orchestrator
        run: npm test
      - name: Emit non-secret receipt
        if: always()
        shell: bash
        run: |
          {
            echo "COORDINATION_SUBSTRATE_EXACT_ACCEPTANCE_V1"
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
            echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "RUNNER_OS=$(uname -srvmo)"
            echo "NODE_VERSION=$(node --version 2>/dev/null || true)"
            echo "PYTHON_VERSION=$(python --version 2>/dev/null || true)"
            echo "FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/coordination-substrate-receipt.env
          cat /tmp/coordination-substrate-receipt.env
      - name: Upload non-secret receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordination-substrate-a6d430ff
          path: /tmp/coordination-substrate-receipt.env
          if-no-files-found: error
          retention-days: 30
