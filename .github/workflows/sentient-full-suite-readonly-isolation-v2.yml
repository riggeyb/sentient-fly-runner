name: Sentient Full Suite Readonly Isolation V2
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      private_issue:
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fence exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "SOURCE_IDENTITY=PASS"
          echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_IN_SOURCE"
          echo "DEPENDENCY_MANIFEST_SHA=$(git rev-parse HEAD:package.json)"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build
        run: npm run build
      - name: Run all compiled tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/test/*.test.js)
          test "${#files[@]}" -gt 0
          echo "TOTAL_TEST_FILES=${#files[@]}"
          node --test "${files[@]}"
          echo "FULL_TEST_SUITE=PASS"
      - name: Guard source mutation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "SOURCE_MUTATION=false"
          echo "DIRECT_EXACT_SHA_ACCEPTANCE=PASS"
