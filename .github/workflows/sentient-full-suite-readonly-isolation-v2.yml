name: Skills Exact Readonly Isolation V1

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      private_issue:
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://postgres:postgres@127.0.0.1:5432/sentient

    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact candidate acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
          GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/exact
          failed=0
          run_step() {
            label="$1"; shift
            "$@" >"/tmp/exact/${label}.log" 2>&1
            status=$?
            echo "${label}=$status" >>/tmp/receipt.env
            if [ "$status" -ne 0 ]; then failed=1; fi
          }

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 2
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE" || exit 2

          {
            echo "EXACT_SKILLS_ACCEPTANCE_RECEIPT_V1"
            echo "SOURCE_SHA=$EXPECTED_SHA"
            echo "SOURCE_TREE=$EXPECTED_TREE"
            echo "RUNNER_OS=$(uname -srvmo)"
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
            echo "PYTHON_VERSION=$(python --version 2>&1)"
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >/tmp/receipt.env

          run_step PY_DEPS python -m pip install -r requirements.txt
          run_step REGISTRY python scripts/validate_registry.py
          run_step EVALS python scripts/check_evals.py
          run_step DURABLE_OBJECTIVE env PYTHONDONTWRITEBYTECODE=1 python tests/test_durable_objective_continuation_v1.py
          run_step ACTIVE_WORK env PYTHONDONTWRITEBYTECODE=1 python tests/test_active_work_disclosure_v1.py
          run_step REPO_EDIT python scripts/test_repository_edit.py
          run_step REPO_EDIT_GATEWAY python scripts/test_repository_edit_request.py
          run_step ACTIONS_SCHEMA python scripts/validate_actions_schema.py
          run_step NETLIFY_SCHEMA python scripts/validate_netlify_actions_schema.py

          pushd sentient-orchestrator >/dev/null
          if [ -f package-lock.json ]; then
            echo "DEPENDENCY_LOCK_IDENTITY=sentient-orchestrator/package-lock.json:$(git rev-parse HEAD:sentient-orchestrator/package-lock.json)" >>/tmp/receipt.env
          else
            echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_IN_EXACT_CANDIDATE" >>/tmp/receipt.env
            echo "DEPENDENCY_MANIFEST_IDENTITY=sentient-orchestrator/package.json:$(git rev-parse HEAD:sentient-orchestrator/package.json)" >>/tmp/receipt.env
          fi
          run_step ORCH_INSTALL npm install --ignore-scripts --no-audit --no-fund
          run_step TYPECHECK npm run typecheck
          run_step MIGRATE npm run migrate
          test_files="$(find tests -type f -name '*.test.ts' | wc -l | tr -d ' ')"
          echo "ORCHESTRATOR_TEST_FILES=$test_files" >>/tmp/receipt.env
          run_step ORCH_TEST npm test
          popd >/dev/null

          run_step REMOTE_REGISTRY python scripts/validate_registry.py --remote

          f="/tmp/exact/ORCH_TEST.log"
          if [ -f "$f" ]; then
            tests="$(grep -E '^# tests [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            pass="$(grep -E '^# pass [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            fail="$(grep -E '^# fail [0-9]+' "$f" | tail -1 | awk '{print $3}')"
            echo "ORCH_TEST_TESTS=${tests:-NOT_REPORTED}" >>/tmp/receipt.env
            echo "ORCH_TEST_PASS=${pass:-NOT_REPORTED}" >>/tmp/receipt.env
            echo "ORCH_TEST_FAIL=${fail:-NOT_REPORTED}" >>/tmp/receipt.env
          fi

          test -z "$(git status --porcelain)"
          clean=$?
          echo "SOURCE_MUTATION=$([ "$clean" -eq 0 ] && echo false || echo true)" >>/tmp/receipt.env
          [ "$clean" -eq 0 ] || failed=1
          echo "FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>/tmp/receipt.env
          echo "OVERALL_EXIT=$failed" >>/tmp/receipt.env

          python3 - <<'PY'
          import pathlib,re
          out=[]
          pats=[
            (re.compile(r'gh[pousr]_[A-Za-z0-9_]+'),'[REDACTED]'),
            (re.compile(r'flyv1_[A-Za-z0-9_-]+'),'[REDACTED]'),
            (re.compile(r'(?i)(authorization|token|secret|password|credential|cookie|api[_-]?key)\s*[:=]\s*\S+'),r'\1=[REDACTED]')
          ]
          for p in sorted(pathlib.Path('/tmp/exact').glob('*.log')):
            t=p.read_text(errors='replace')
            for rx,r in pats:t=rx.sub(r,t)
            if 'error' in t.lower() or 'fail' in t.lower():
              out.append(f"## {p.name}\n{t[-10000:]}")
          pathlib.Path('/tmp/failures.txt').write_text('\n\n'.join(out))
          PY

          cat /tmp/receipt.env
          exit "$failed"

      - name: Upload non-secret receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-exact-${{ inputs.sha }}
          path: /tmp/receipt.env
          if-no-files-found: error
          retention-days: 30

      - name: Post private receipt
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          PRIVATE_ISSUE: ${{ inputs.private_issue }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_ISSUE" =~ ^[0-9]+$ ]]
          {
            echo "EXACT_SKILLS_ACCEPTANCE_RECEIPT_V1"
            echo '```text'
            cat /tmp/receipt.env
            echo '```'
            if [ -s /tmp/failures.txt ]; then
              echo "Sanitized failure tails:"
              echo '```text'
              cat /tmp/failures.txt
              echo '```'
            fi
            echo "PRODUCTION_DEPLOYMENT=false"
            echo "SOURCE_MUTATION=false"
          } >/tmp/body.txt
          jq -Rs '{body:.}' </tmp/body.txt >/tmp/payload.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST "https://api.github.com/repos/riggeyb/skills/issues/$PRIVATE_ISSUE/comments" \
            --data-binary @/tmp/payload.json >/dev/null
