name: Sentient Mission Control Exact Acceptance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sentient_test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 75ba9c282b73df74e2f2fa50289d17ecd0597687
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fence and build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "75ba9c282b73df74e2f2fa50289d17ecd0597687"
          test "$(git rev-parse 'HEAD^{tree}')" = "f4cebc41c4775b09ce5f0279b5cb12d4cad52a01"
          npm install --no-package-lock --no-audit --no-fund
          echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_BY_REPOSITORY_DESIGN"
          npm run build 2>&1 | tee "$RUNNER_TEMP/sentient-build.log"
          git diff --exit-code
          git diff --cached --exit-code
          echo "SENTIENT_TYPECHECK=PASS"
          echo "SENTIENT_BUILD=PASS"

      - name: Run every compiled test file from test tree
        run: |
          set -euo pipefail
          files="$(find dist/test -type f -name '*.test.js' -print | sort)"
          test -n "$files"
          passed=0
          failed=0
          mkdir -p "$RUNNER_TEMP/sentient-test-logs"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            rel="${file#dist/test/}"
            safe="$(printf '%s' "$rel" | tr '/' '_')"
            if timeout 180s node --test "$file" >"$RUNNER_TEMP/sentient-test-logs/$safe.log" 2>&1; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "FAILED_TEST_FILE=$file"
              tail -n 160 "$RUNNER_TEMP/sentient-test-logs/$safe.log"
            fi
          done <<< "$files"
          total=$((passed+failed))
          printf '{"sourceSha":"%s","sourceTree":"%s","compiledTestFiles":%d,"passedFiles":%d,"failedFiles":%d}\n'             "75ba9c282b73df74e2f2fa50289d17ecd0597687"             "f4cebc41c4775b09ce5f0279b5cb12d4cad52a01"             "$total" "$passed" "$failed" > "$RUNNER_TEMP/sentient-full-suite-report.json"
          echo "COMPILED_TEST_FILES=$total"
          echo "COMPILED_PASSED_FILES=$passed"
          echo "COMPILED_FAILED_FILES=$failed"
          test "$failed" -eq 0
          echo "SENTIENT_COMPILED_FULL_SUITE=PASS"

      - name: Run every authored SpawnSentient suite from tests tree
        run: |
          set -euo pipefail
          files="$(find tests -type f -name 'spawn*.test.ts' -print | sort)"
          test -n "$files"
          passed=0
          failed=0
          mkdir -p "$RUNNER_TEMP/sentient-authored-spawn-logs"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            safe="$(printf '%s' "$file" | tr '/' '_')"
            if timeout 180s node --experimental-strip-types --test "$file" >"$RUNNER_TEMP/sentient-authored-spawn-logs/$safe.log" 2>&1; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "FAILED_AUTHORED_SPAWN_TEST=$file"
              tail -n 160 "$RUNNER_TEMP/sentient-authored-spawn-logs/$safe.log"
            fi
          done <<< "$files"
          total=$((passed+failed))
          echo "AUTHORED_SPAWN_TEST_FILES=$total"
          echo "AUTHORED_SPAWN_PASSED_FILES=$passed"
          echo "AUTHORED_SPAWN_FAILED_FILES=$failed"
          test "$failed" -eq 0
          echo "ALL_AUTHORED_SPAWN_SUITES=PASS"
          echo "DYNAMIC_CHILD_AUTO_CONTEXT_TEST=PASS"
          echo "CONTEXT_LINEAGE_IDENTITY=PASS"
          echo "EFFECTIVE_GRANT_NON_EXPANSION_TEST=PASS"

      - name: Verify read-only tracked source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "75ba9c282b73df74e2f2fa50289d17ecd0597687"
          test "$(git rev-parse 'HEAD^{tree}')" = "f4cebc41c4775b09ce5f0279b5cb12d4cad52a01"
          git diff --exit-code
          git diff --cached --exit-code
          echo "SOURCE_MUTATION=false"
          echo "DEPLOYMENT=false"
          echo "CERTIFICATION_REOPENED=false"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentient-mission-control-acceptance
          path: |
            ${{ runner.temp }}/sentient-build.log
            ${{ runner.temp }}/sentient-full-suite-report.json
            ${{ runner.temp }}/sentient-test-logs
            ${{ runner.temp }}/sentient-authored-spawn-logs
          if-no-files-found: warn
          retention-days: 7
