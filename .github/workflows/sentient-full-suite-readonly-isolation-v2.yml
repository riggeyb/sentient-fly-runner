name: Sentient Exact Readonly Isolation V5

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact candidate source SHA
        required: true
        type: string
      tree:
        description: Exact candidate source tree
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: sentient
      PGDATABASE: sentient
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient@127.0.0.1:5432/sentient
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify and test exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
          CANDIDATE_SHA: 2a272b5a5fff37a4e5ad40fad050b2a8dd8425cf
          CANDIDATE_TREE: 0da3653232cd33afd5f5284c7fef763b140dbc18
          ISOLATED_BASE_SHA: 67b5f7f6bbac14dbf991e444947912deba2bdc3e
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const receiptPath = "/tmp/receipt.json";
          const logDir = "/tmp/exact-candidate";
          fs.mkdirSync(logDir, { recursive: true });

          const receipt = {
            contract: "sentient-narrow-read-exact-acceptance/v1",
            candidate: { sha: process.env.EXPECTED_SHA, tree: process.env.EXPECTED_TREE },
            isolatedBase: { sha: process.env.ISOLATED_BASE_SHA, tree: null },
            changedFiles: [],
            sourceScope: "BLOCKED",
            steps: [],
            tests: [],
            testExecution: { status: "NOT_STARTED", count: 0, passed: 0, failed: 0, missing: 0 },
            trackedTreeCleanAfterTests: false,
            invariants: {
              GENERATION_FENCING: "BLOCKED",
              CONCURRENT_WRITER_SAFETY: "BLOCKED",
              TRANSACTION_IMPLEMENTATION_OUTSIDE_SCOPE: "BLOCKED",
              CRASH_RECOVERY: "BLOCKED",
              STATE_EQUIVALENCE: "BLOCKED",
              EVIDENCE_INTEGRITY: "BLOCKED",
              GOVERNOR_AUTHORITY: "BLOCKED"
            },
            evidenceNotes: {},
            authorization: {
              MODEL_OUTPUT_IS_NEVER_AUTHORITY: true,
              AUTHORITY_EXPANSION: false,
              RESOURCE_EXPANSION: false,
              POLICY_WEAKENING: false,
              PRODUCTION_PROMOTION_AUTHORIZED: false,
              PRODUCTION_DEPLOYMENT_AUTHORIZED: false,
              DATABASE_MIGRATION_AUTHORIZED: false,
              RESOURCE_PROVISIONING_AUTHORIZED: false
            },
            startedAt: new Date().toISOString()
          };
          let failed = false;
          const saveReceipt = () => fs.writeFileSync(receiptPath, JSON.stringify(receipt, null, 2) + "\n");
          const run = (label, command, args, options = {}) => {
            const result = spawnSync(command, args, {
              cwd: process.cwd(),
              encoding: "utf8",
              timeout: options.timeout ?? 300000,
              maxBuffer: 16 * 1024 * 1024,
              env: process.env
            });
            const code = result.status ?? 1;
            const output = `${result.stdout ?? ""}${result.stderr ?? ""}`;
            fs.writeFileSync(path.join(logDir, `${label}.log`), output);
            const step = { name: label, exitCode: code };
            if (result.error) step.error = result.error.message;
            receipt.steps.push(step);
            if (code !== 0) {
              failed = true;
              const sanitized = output
                .replace(/gh[pousr]_[A-Za-z0-9_]+/g, "[REDACTED]")
                .replace(/flyv1_[A-Za-z0-9_-]+/g, "[REDACTED]")
                .replace(/(authorization|token|secret|password|credential|cookie|api[_-]?key)\s*[:=]\s*\S+/ig, "$1=[REDACTED]");
              console.error(`${label} failed (${code})`);
              console.error(sanitized.slice(-3000));
            } else {
              console.log(`${label}=PASS`);
            }
            return { code, output };
          };
          const gitValue = (args) => {
            const result = spawnSync("git", args, { encoding: "utf8", maxBuffer: 4 * 1024 * 1024 });
            if (result.status !== 0) throw new Error(`git ${args.join(" ")} failed`);
            return result.stdout.trim();
          };
          const validObjectId = (value) => /^[0-9a-f]{40}$/.test(value ?? "");
          const testCounts = (output) => {
            const value = (name) => {
              const matches = [...output.matchAll(new RegExp(`^# ${name} (\\d+)\\s*$`, "gm"))];
              return matches.length ? Number(matches.at(-1)[1]) : null;
            };
            return { tests: value("tests"), passed: value("pass"), failed: value("fail"), skipped: value("skipped") };
          };
          const runTest = (name, file, command = "node", prefix = ["--test"]) => {
            const result = run(`TEST_${name}`, command, [...prefix, file]);
            receipt.tests.push({
              name,
              file,
              exitCode: result.code,
              ...testCounts(result.output)
            });
            return result.code === 0;
          };
          const runOptionalFiles = (name, files, command = "node", prefix = ["--test"]) => {
            for (const file of files) runTest(`${name}_${path.basename(file).replace(/[^A-Za-z0-9]+/g, "_")}`, file, command, prefix);
          };
          const filesIn = (directory, pattern) => {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory)
              .filter((name) => pattern.test(name))
              .sort()
              .map((name) => path.join(directory, name));
          };

          saveReceipt();
          try {
            const { EXPECTED_SHA, EXPECTED_TREE, ISOLATED_BASE_SHA } = process.env;
            if (![EXPECTED_SHA, EXPECTED_TREE, ISOLATED_BASE_SHA].every(validObjectId)) {
              throw new Error("Candidate and base identities must be full lowercase Git object IDs");
            }
            if (EXPECTED_SHA !== process.env.CANDIDATE_SHA || EXPECTED_TREE !== process.env.CANDIDATE_TREE) {
              throw new Error("Dispatch identity does not match the pinned candidate");
            }

            const fetchedBase = run("FETCH_ISOLATED_BASE", "git", ["fetch", "--no-tags", "origin", ISOLATED_BASE_SHA]);
            spawnSync("git", ["config", "--local", "--unset-all", "http.https://github.com/.extraheader"]);
            if (fetchedBase.code !== 0) throw new Error("Could not independently fetch isolated base");

            const head = gitValue(["rev-parse", "HEAD"]);
            const candidateTree = gitValue(["rev-parse", `${EXPECTED_SHA}^{tree}`]);
            const baseCommit = gitValue(["rev-parse", `${ISOLATED_BASE_SHA}^{commit}`]);
            const baseTree = gitValue(["rev-parse", `${ISOLATED_BASE_SHA}^{tree}`]);
            receipt.isolatedBase.tree = baseTree;
            if (head !== EXPECTED_SHA || candidateTree !== EXPECTED_TREE || baseCommit !== ISOLATED_BASE_SHA) {
              throw new Error("Exact candidate or isolated-base identity fence failed");
            }
            gitValue(["merge-base", "--is-ancestor", ISOLATED_BASE_SHA, EXPECTED_SHA]);
            receipt.baseAncestry = "PASS";

            const allowed = [
              "src/state/service.ts",
              "test/mvp1-state-v2-lifecycle.test.ts"
            ].sort();
            const changed = gitValue(["diff", "--name-only", "--no-renames", ISOLATED_BASE_SHA, EXPECTED_SHA])
              .split("\n").filter(Boolean).sort();
            receipt.changedFiles = changed;
            if (JSON.stringify(changed) !== JSON.stringify(allowed)) {
              throw new Error(`Exact source scope mismatch: ${JSON.stringify(changed)}`);
            }
            const diffCheck = run("SOURCE_DIFF_CHECK", "git", ["diff", "--check", ISOLATED_BASE_SHA, EXPECTED_SHA]);
            if (diffCheck.code !== 0) throw new Error("Source diff whitespace check failed");
            receipt.sourceScope = "PASS";

            if (gitValue(["status", "--porcelain", "--untracked-files=no"]) !== "") {
              throw new Error("Candidate checkout was not clean before install");
            }
            if (run("INSTALL", "npm", ["install", "--no-audit", "--no-fund", "--package-lock=false"]).code !== 0) {
              throw new Error("Dependency installation failed");
            }
            if (run("BUILD", "npm", ["run", "build"]).code !== 0) {
              throw new Error("Candidate build failed");
            }

            const preTestSha = gitValue(["rev-parse", "HEAD"]);
            const preTestTree = gitValue(["rev-parse", "HEAD^{tree}"]);
            if (preTestSha !== EXPECTED_SHA || preTestTree !== EXPECTED_TREE ||
              gitValue(["status", "--porcelain", "--untracked-files=no"]) !== "") {
              throw new Error("Candidate identity or tracked-tree fence failed before tests");
            }
            receipt.preTestIdentity = { sha: preTestSha, tree: preTestTree, trackedTreeClean: true };
            receipt.testExecution.status = "RUNNING";

            const required = [
              ["MVP1_STATE_V2_LIFECYCLE", "dist/test/mvp1-state-v2-lifecycle.test.js"],
              ["MVP1_STATE_V2", "dist/test/mvp1-state-v2.test.js"],
              ["PERSISTENCE", "dist/test/persistence.test.js"],
              ["SECURITY_RETENTION", "dist/test/security-retention.test.js"],
              ["ACTION_FABRIC_AUTHORITY_REUSE", "dist/test/action-fabric-authority-reuse.test.js"],
              ["OBJECTIVE_CONTINUATION", "dist/test/objective-continuation.test.js"],
              ["OBJECTIVE_CONTINUATION_READINESS", "dist/test/objective-continuation-readiness.test.js"],
              ["ACTIVE_WORK_CORE", "dist/test/active-work-core.test.js"],
              ["ACTIVE_WORK_PERSISTENCE", "dist/test/active-work-persistence.test.js"],
              ["ACTIVE_WORK_EXPIRY_FENCING", "dist/test/active-work-expiry-fencing.test.js"]
            ];
            for (const [name, file] of required) {
              if (!fs.existsSync(file)) {
                failed = true;
                receipt.tests.push({ name, file, exitCode: 2, missing: true, tests: null, passed: null, failed: null, skipped: null });
                console.error(`REQUIRED_TEST_MISSING=${file}`);
              } else runTest(name, file);
            }

            const permanent = filesIn("dist/test", /^permanent-continuation-.*\.test\.js$/);
            if (!permanent.length) {
              failed = true;
              receipt.tests.push({ name: "PERMANENT_CONTINUATION", file: "dist/test/permanent-continuation-*.test.js", exitCode: 2, missing: true, tests: null, passed: null, failed: null, skipped: null });
              console.error("REQUIRED_TEST_GLOB_MISSING=dist/test/permanent-continuation-*.test.js");
            } else {
              for (const file of permanent) runTest("PERMANENT_CONTINUATION", file);
            }

            const optionalChecks = [];
            optionalChecks.push(...filesIn("dist/test/lab", /\.test\.js$/));
            const retrievalChecks = filesIn("tests/retrieval", /\.test\.ts$/);
            runOptionalFiles("RETRIEVAL", retrievalChecks, "node", ["--experimental-strip-types", "--test"]);
            for (const file of [
              "dist/src/model/providers/openrouter.test.js",
              "dist/src/lab/librechat/bridge.test.js"
            ]) if (fs.existsSync(file)) optionalChecks.push(file);
            runOptionalFiles("CURRENT_LINEAGE", [...new Set(optionalChecks)].sort());

            for (const config of ["tsconfig.worker-a.json", "tsconfig.worker-c.json", "tsconfig.worker-d.json"]) {
              if (fs.existsSync(config)) {
                run(`TYPECHECK_${path.basename(config, ".json").toUpperCase()}`, "npx", ["--no-install", "tsc", "-p", config, "--noEmit"]);
              }
            }
            const fullSuite = run("NPM_TEST", "npm", ["test"]);
            receipt.tests.push({ name: "NPM_TEST", file: "npm test", exitCode: fullSuite.code, ...testCounts(fullSuite.output) });

            const namedRecovery = filesIn("dist/test", /.*(?:recovery|restart).*\.test\.js$/i);
            for (const file of namedRecovery) runTest("CURRENT_LINEAGE_RECOVERY", file);
            const namedConcurrency = filesIn("dist/test", /.*(?:concurr|writer).*\.test\.js$/i);
            for (const file of namedConcurrency) runTest("CURRENT_LINEAGE_CONCURRENCY", file);
            receipt.testExecution.status = "COMPLETED";

            const afterSha = gitValue(["rev-parse", "HEAD"]);
            const afterTree = gitValue(["rev-parse", "HEAD^{tree}"]);
            const trackedStatus = gitValue(["status", "--porcelain", "--untracked-files=no"]);
            receipt.trackedTreeCleanAfterTests =
              afterSha === EXPECTED_SHA &&
              afterTree === EXPECTED_TREE &&
              trackedStatus === "" &&
              gitValue(["diff", "--cached", "--quiet"]) === "";
            receipt.postTestIdentity = { sha: afterSha, tree: afterTree };
            if (!receipt.trackedTreeCleanAfterTests) failed = true;

            const passed = (name) => receipt.tests.some((test) => test.name === name && test.exitCode === 0);
            const recoveryPresent = namedRecovery.length > 0 && namedRecovery.every((file) =>
              receipt.tests.some((test) => test.file === file && test.exitCode === 0));
            const concurrencyPresent = namedConcurrency.length > 0 && namedConcurrency.every((file) =>
              receipt.tests.some((test) => test.file === file && test.exitCode === 0));
            receipt.invariants = {
              GENERATION_FENCING: receipt.sourceScope === "PASS" &&
                passed("MVP1_STATE_V2_LIFECYCLE") && passed("ACTIVE_WORK_EXPIRY_FENCING") ? "PASS" : "BLOCKED",
              CONCURRENT_WRITER_SAFETY: "BLOCKED",
              TRANSACTION_IMPLEMENTATION_OUTSIDE_SCOPE: "BLOCKED",
              CRASH_RECOVERY: recoveryPresent ? "PASS" : "BLOCKED",
              STATE_EQUIVALENCE: receipt.sourceScope === "PASS" &&
                passed("MVP1_STATE_V2_LIFECYCLE") && passed("MVP1_STATE_V2") ? "PASS" : "BLOCKED",
              EVIDENCE_INTEGRITY: receipt.sourceScope === "PASS" &&
                passed("SECURITY_RETENTION") && passed("PERSISTENCE") ? "PASS" : "BLOCKED",
              GOVERNOR_AUTHORITY: receipt.sourceScope === "PASS" &&
                passed("ACTION_FABRIC_AUTHORITY_REUSE") ? "PASS" : "BLOCKED"
            };
            receipt.evidenceNotes.CONCURRENT_WRITER_SAFETY = concurrencyPresent
              ? "Concurrency/writer-named tests passed, but the transaction implementation location is not independently identified outside the allowed source scope."
              : "No concurrency/writer-named test was found in the current-lineage compiled test directory.";
            receipt.evidenceNotes.CRASH_RECOVERY = recoveryPresent
              ? "Current-lineage recovery/restart-named tests passed."
              : "No current-lineage recovery/restart-named test was found and passed.";
            if (Object.values(receipt.invariants).some((value) => value !== "PASS")) failed = true;
          } catch (error) {
            failed = true;
            receipt.failure = String(error.message ?? error);
            console.error(`ACCEPTANCE_PREFLIGHT_FAILED=${receipt.failure}`);
          } finally {
            if (receipt.testExecution.status === "RUNNING") receipt.testExecution.status = "INCOMPLETE";
            receipt.testExecution.count = receipt.tests.length;
            receipt.testExecution.passed = receipt.tests.filter((test) => test.exitCode === 0).length;
            receipt.testExecution.failed = receipt.tests.filter((test) => test.exitCode !== 0 && !test.missing).length;
            receipt.testExecution.missing = receipt.tests.filter((test) => test.missing).length;
            receipt.finishedAt = new Date().toISOString();
            receipt.overallExitCode = failed ? 1 : 0;
            saveReceipt();
          }

          console.log(`RECEIPT=${receiptPath}`);
          console.log(`OVERALL_EXIT=${receipt.overallExitCode}`);
          process.exitCode = receipt.overallExitCode;
          NODE

      - name: Upload machine-readable acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentient-narrow-read-exact-${{ inputs.sha }}
          path: /tmp/receipt.json
          if-no-files-found: warn
          retention-days: 30
