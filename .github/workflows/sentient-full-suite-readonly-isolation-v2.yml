name: Mission Control Skills Exact Acceptance V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordination-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: a6d430ff775044a03f2fca9c63ee6bfa1796f558
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fence exact candidate and dependency manifests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a6d430ff775044a03f2fca9c63ee6bfa1796f558"
          test "$(git rev-parse 'HEAD^{tree}')" = "785fb508b67515b1963914196ad7cbee50ccabe2"
          test ! -e sentient-orchestrator/package-lock.json
          sha256sum requirements.txt sentient-orchestrator/package.json
          echo "DEPENDENCY_LOCK_IDENTITY=NO_NODE_LOCKFILE_REPOSITORY_NATIVE_NPM_INSTALL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Registry and repository contracts
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python scripts/validate_registry.py
          python scripts/check_evals.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_durable_objective_continuation_v1.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_active_work_disclosure_v1.py
          python scripts/test_repository_edit.py
          python scripts/test_repository_edit_request.py
          python scripts/validate_actions_schema.py
      - name: Coordination substrate acceptance
        working-directory: sentient-orchestrator
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run typecheck
          npm run migrate
          npm test
          echo "PR_245_AUTOMATED_ACCEPTANCE=PASS"

  mission-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: b3df9b32b47370a7140d6fe814eeba97564663ab
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fence exact candidate and dependency manifests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b3df9b32b47370a7140d6fe814eeba97564663ab"
          test "$(git rev-parse 'HEAD^{tree}')" = "3173ee3cb2e39038921d3b125f1a74ecd783ff30"
          test ! -e sentient-orchestrator/package-lock.json
          sha256sum requirements.txt sentient-orchestrator/package.json
          echo "DEPENDENCY_LOCK_IDENTITY=NO_NODE_LOCKFILE_REPOSITORY_NATIVE_NPM_INSTALL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Registry and repository contracts
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python scripts/validate_registry.py
          python scripts/check_evals.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_durable_objective_continuation_v1.py
          PYTHONDONTWRITEBYTECODE=1 python tests/test_active_work_disclosure_v1.py
          python scripts/test_repository_edit.py
          python scripts/test_repository_edit_request.py
          python scripts/validate_actions_schema.py
      - name: Mission Control and C1 acceptance
        working-directory: sentient-orchestrator
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run typecheck
          npm run migrate
          npm test
          echo "PR_247_AUTOMATED_ACCEPTANCE=PASS"
