name: Stronger Sentient Measurement v2

on:
  workflow_dispatch:
    inputs:
      run_live_atlas:
        description: "Run bounded live Atlas baseline and targeted measurements"
        required: false
        default: false
        type: boolean
      targeted_only:
        description: "Skip repeated 15-task baseline and run only existing targeted controls"
        required: false
        default: false
        type: boolean
      max_provider_calls:
        description: "Hard ceiling for live Atlas HTTP attempts (1-40)"
        required: false
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: stronger-sentient-measurement-v2
  cancel-in-progress: false

env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab
  CORPUS_SOURCE_SHA: 9c037505f65663ae6b7e8990ae969639572860d9
  CORPUS_SOURCE_TREE: 7752a9b7e9a41253d8979159a837807c63d36702
  CORPUS_DIGEST: sha256:611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51
  DOCTRINE_DIGEST: sha256:ec2a36ce9ebc6a735e11593da32988083616a43f1eedddc2467b0d80affa4389
  MEASUREMENT_SCRIPT_SHA: bb65402734f9bac77e82ca05b8fadd8555abfc66

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch pinned measurement script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/riggeyb/sentient-fly-runner/contents/.github/measurement/stronger-sentient-measure-v1.mjs?ref=$MEASUREMENT_SCRIPT_SHA" \
            -o stronger-sentient-measure-v1.mjs
          node --check stronger-sentient-measure-v1.mjs

      - name: Apply pinned targeted-only adapter when requested
        if: ${{ inputs.targeted_only }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stronger-sentient-measure-v1.mjs")
          s = p.read_text()
          marker = 'const LIVE=String(process.env.RUN_LIVE_ATLAS).toLowerCase()==="true";\n'
          assert marker in s
          s = s.replace(marker, marker + 'const TARGETED_ONLY=String(process.env.TARGETED_ONLY).toLowerCase()==="true";\n', 1)
          old = '    for(const task of corpus.tasks){if(calls>=MAX_CALLS-2||Date.now()-wallStart>MAX_WALL-35_000)break;rows.push(await run(task,{stage:task.taskClass==="context_synthesis"?"synthesis":"cognition"}))}\n    if(rows.filter(x=>x.label==="baseline").length!==15)throw new Error(`baseline_incomplete:${rows.length}/15`);\n'
          new = '    if(!TARGETED_ONLY){\n      for(const task of corpus.tasks){if(calls>=MAX_CALLS-2||Date.now()-wallStart>MAX_WALL-35_000)break;rows.push(await run(task,{stage:task.taskClass==="context_synthesis"?"synthesis":"cognition"}))}\n      if(rows.filter(x=>x.label==="baseline").length!==15)throw new Error(`baseline_incomplete:${rows.length}/15`);\n    }\n'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check stronger-sentient-measure-v1.mjs
          grep -F 'if(!TARGETED_ONLY)' stronger-sentient-measure-v1.mjs

      - name: Checkout exact private baseline and frozen corpus source
        shell: bash
        env:
          SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SENTIENT_SOURCE_GITHUB_TOKEN"
          auth="$(printf 'x-access-token:%s' "$SENTIENT_SOURCE_GITHUB_TOKEN" | base64 -w0)"
          for pair in "sentient:$BASELINE_SHA" "corpus-source:$CORPUS_SOURCE_SHA"; do
            dir="${pair%%:*}"
            ref="${pair#*:}"
            git init "$dir"
            git -C "$dir" remote add origin https://github.com/riggeyb/sentient.git
            git -C "$dir" -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$ref"
            git -C "$dir" checkout --detach FETCH_HEAD
          done

      - name: Guard immutable identities and bounded envelope
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          test "$(git -C corpus-source rev-parse HEAD)" = "$CORPUS_SOURCE_SHA"
          test "$(git -C corpus-source rev-parse 'HEAD^{tree}')" = "$CORPUS_SOURCE_TREE"
          actual_corpus="sha256:$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json | awk '{print $1}')"
          actual_doctrine="sha256:$(sha256sum corpus-source/test/fixtures/cognitive-frontier/doctrine-v2.json | awk '{print $1}')"
          test "$actual_corpus" = "$CORPUS_DIGEST"
          test "$actual_doctrine" = "$DOCTRINE_DIGEST"
          calls="${{ inputs.max_provider_calls }}"
          test "$calls" -ge 1
          test "$calls" -le 40
          if [ "${{ inputs.run_live_atlas }}" = "true" ]; then
            test -n "${ATLASCLOUD_API_KEY:-}"
          fi
          echo "MAX_PROVIDER_CALLS=$calls"
          echo "TARGETED_ONLY=${{ inputs.targeted_only }}"
          echo "MAX_WALL_CLOCK_MS=240000"
          echo "MAX_PROVIDER_RETRIES_PER_ATTEMPT=1"
          echo "MAX_TOTAL_COST=UNAVAILABLE_PROVIDER_DOES_NOT_REPORT_COST"
          echo "PRODUCTION_DEPLOYMENT=false"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build exact accepted baseline
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Run bounded measurement
        shell: bash
        env:
          RUN_LIVE_ATLAS: ${{ inputs.run_live_atlas && 'true' || 'false' }}
          TARGETED_ONLY: ${{ inputs.targeted_only && 'true' || 'false' }}
          MAX_PROVIDER_CALLS: ${{ inputs.max_provider_calls }}
          BASELINE_ROOT: sentient
          CORPUS_ROOT: corpus-source
          MEASUREMENT_OUT: ${{ runner.temp }}/stronger-sentient-measurement.json
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: node ./stronger-sentient-measure-v1.mjs

      - name: Guard immutable source after measurement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"
          test "$(git -C corpus-source rev-parse HEAD)" = "$CORPUS_SOURCE_SHA"
          test "$(git -C corpus-source rev-parse 'HEAD^{tree}')" = "$CORPUS_SOURCE_TREE"
          test -z "$(git -C corpus-source status --porcelain --untracked-files=no)"
          echo "SOURCE_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"

      - name: Upload measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-measurement-v2-${{ env.BASELINE_SHA }}
          path: ${{ runner.temp }}/stronger-sentient-measurement.json
          if-no-files-found: error
          retention-days: 30

      - name: Deployment guard
        run: |
          echo "PROVIDER_POLICY_PROMOTION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "PRODUCTION_CONFIGURATION_CHANGE=false"
          echo "PRODUCTION_DATABASE_MIGRATION=false"
