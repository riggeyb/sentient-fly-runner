name: Stronger Sentient Measurement v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stronger-sentient-measurement-v2
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout measurement operator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout frozen Sentient baseline
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: c05ebe9ffed7254bb749cee1c72a965f970def7c
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout frozen cognition corpus source
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 3ca3c9dce1144518eda339bb170f8edc9372620f
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: corpus-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "c05ebe9ffed7254bb749cee1c72a965f970def7c"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "00296d7129fa8ab7f3254943a57df4444591ad1ab"
          actual="$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json | awk '{print $1}')"
          test "$actual" = "611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build exact accepted baseline
        working-directory: sentient
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Run bounded measurement
        shell: bash
        env:
          RUN_LIVE_ATLAS: "true"
          MAX_PROVIDER_CALLS: "16"
          BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
          BASELINE_TREE: 00296d7129fa8ab7f3254943a57df4444591ad1ab
          CORPUS_DIGEST: 611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51
          MEASUREMENT_OUT: ${{ runner.temp }}/stronger-sentient-measurement.json
          ATLAS_CLOUD_API_KEY: ${{ secrets.ATLAS_CLOUD_API_KEY }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: node .github/measurement/stronger-sentient-measure-v1.mjs
      - name: Verify baseline immutability
        shell: bash
        run: |
          test "$(git -C sentient rev-parse HEAD)" = "c05ebe9ffed7254bb749cee1c72a965f970def7c"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "00296d7129fa8ab7f3254943a57df4444591ad1ab"
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"
      - name: Upload measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-measurement-v2
          path: ${{ runner.temp }}/stronger-sentient-measurement.json
          retention-days: 14
      - name: Deployment guard
        run: |
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "PRODUCTION_CONFIGURATION_CHANGE=false"
