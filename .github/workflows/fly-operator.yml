name: Sentient Fly Operator
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded Sentient/Fly operation
        required: true
        type: choice
        options:
          - health
          - tools_list
          - fly_machines_list
          - fly_machine_get
          - engineering_create
          - engineering_get
          - public_probe
          - governor_deploy_exact
      arguments:
        description: JSON arguments for the selected operation
        required: false
        default: "{}"
        type: string
permissions:
  contents: read
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Invoke Sentient on Fly
        if: ${{ inputs.operation != 'governor_deploy_exact' }}
        env:
          MCP_CLIENT_TOKEN: ${{ secrets.MCP_CLIENT_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          ARGUMENTS: ${{ inputs.arguments }}
        run: node operator.mjs
      - name: Deploy exact Sentient candidate through Governor
        if: ${{ inputs.operation == 'governor_deploy_exact' }}
        env:
          SENTIENT_DEPLOYMENT_API_TOKEN: ${{ secrets.SENTIENT_DEPLOYMENT_API_TOKEN }}
          ARGUMENTS: ${{ inputs.arguments }}
        run: |
          node --input-type=module -e '
          const endpoint="https://sentient-deployment-governor.fly.dev/v1/deployments/sentient";
          const skillsSha="d85eb820f18ad6d944ab93b03150d606273891a5";
          const token=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN??"").trim();
          if(!token) throw new Error("SENTIENT_DEPLOYMENT_API_TOKEN_MISSING");
          let a;
          try{a=JSON.parse(process.env.ARGUMENTS??"{}")}catch{throw new Error("ARGUMENTS_MALFORMED_JSON")}
          if(!a||typeof a!=="object"||Array.isArray(a)||Object.keys(a).sort().join(",")!=="sha,tree")throw new Error("ARGUMENT_KEYS_INVALID");
          for(const k of ["sha","tree"])if(typeof a[k]!=="string"||!/^[0-9a-f]{40}$/.test(a[k]))throw new Error(`DEPLOY_${k.toUpperCase()}_INVALID`);
          const r=await fetch(endpoint,{method:"POST",redirect:"manual",signal:AbortSignal.timeout(600000),headers:{authorization:`Bearer ${token}`,accept:"application/json","content-type":"application/json","x-sentient-objective-id":`phase0-certification-${a.sha.slice(0,12)}`},body:JSON.stringify({sha:a.sha,tree:a.tree,skillsSha})});
          const t=await r.text();let b;try{b=JSON.parse(t)}catch{b={error:"non_json_response"}}
          const allow=["DEPLOYMENT_ID","REQUESTED_SHA","REQUESTED_TREE","DEPLOYED_SHA","DEPLOYED_TREE","SKILLS_SHA","BUILD_RESULT","BUILD_FAILURE","DEPLOYMENT_ATTEMPT_NUMBER","RATE_LIMIT_STATE","RETRY_LIMIT_STATE","RESOURCE_CHANGE_STATUS","RESOURCE_CHANGE_DETAIL","READYZ_FAILURE"];
          const out={};if(b&&typeof b==="object"&&!Array.isArray(b))for(const k of allow)if(k in b)out[k]=b[k];
          if(b?.HEALTHZ&&typeof b.HEALTHZ==="object")out.HEALTHZ={statusCode:b.HEALTHZ.statusCode??null,body:b.HEALTHZ.body??null};
          if(b?.READYZ&&typeof b.READYZ==="object")out.READYZ={statusCode:b.READYZ.statusCode??null,body:b.READYZ.body??null};
          console.log(`HTTP_STATUS=${r.status}`);console.log(`DATA=${JSON.stringify(out)}`);
          if(r.status===401||r.status===403)throw new Error("GOVERNOR_DEPLOY_AUTH_FAILED");
          if(r.status>=300&&r.status<400)throw new Error("GOVERNOR_DEPLOY_REDIRECT_REJECTED");
          if(!r.ok)throw new Error(`GOVERNOR_DEPLOY_HTTP_${r.status}`);
          if(b?.REQUESTED_SHA!==a.sha||b?.REQUESTED_TREE!==a.tree||b?.DEPLOYED_SHA!==a.sha||b?.DEPLOYED_TREE!==a.tree||b?.BUILD_RESULT!=="SUCCEEDED")throw new Error("GOVERNOR_DEPLOY_IDENTITY_MISMATCH");
          console.log("DEPLOY_REQUEST=PASS");console.log("DEPLOY_EXACT_SHA=PASS");console.log("DEPLOY_EXACT_TREE=PASS");console.log("SECRET_VALUES_EXPOSED=false");console.log("RESULT=PASS");
          '
