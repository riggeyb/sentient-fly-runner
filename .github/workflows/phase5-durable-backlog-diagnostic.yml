name: Sentient Phase 5 Durable Backlog Diagnostic
"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Count sanitized durable backog
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for _ in $(seq 1 120); do
            h="$(curl -fsS --max-time 5 https://sentient-validation-runner.fly.dev/healthz || true)"
            if [ -n "$h" ] && grep -Fq "$EXPECTED_SHA" <<<"$h" && grep -Fq "$EXPECTED_TREE" <<<"$h"; then ok=true; break; fi
            sleep 2
          done
          test "$ok" = true
          cat >/tmp/phase5-backlog.mjs <<'NODE'
          import { PostgresSpawnObjectiveRepository } from "/app/dist/src/objective-continuation/postgres-spawn-repository.js";
          const connectionString=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          if(!connectionString) throw new Error("PHASE5_DATABASE_BINDING_MISSING");
          const repo=new PostgresSpawnObjectiveRepository({connectionString});
          try {
            const started=Date.now();
            const snap=await repo.snapshot();
            console.log(`PHASE5_BACKLOG_SNAPSHOT_MS=${Date.now()-started}`);
            const tasks=snap.records?.tasks??[];
            const managed=tasks.filter(t=>t?.metadata?.contract==="sentient-fly-objective-runner/v1");
            const active=managed.filter(t=>t.status==="pending"||t.status==="running");
            console.log(`PHASE5_BACKLOG_TASK_TOTAL=${tasks.length}`);
            console.log(`PHASE5_BACKLOG_RUNNER_TASK_TOTAL=${managed.length}`);
            console.log(`PHASE5_BACKLOG_RUNNER_ACTIVE_TOTAL=${active.length}`);
            const works=snap.collaborationActiveWork?.records??[];
            const activeWorks=works.filter(w=>w.status==="ACTIVE");
            console.log(`PHASE5_BACKLOG_ACTIVE_WORK_TOTAL=${works.length}`);
            console.log(`PHASE5_BACKLOG_ACTIVE_WORK_ACTIVE=${activeWorks.length}`);
            const execs=snap.spawn?.records?.executions??[];
            const nonterminal=execs.filter(e=>["reserved","running"].includes(e?.identity?.status));
            console.log(`PHASE5_BACKLOG_SPAWN_EXECUTION_TOTAL=${execs.length}`);
            console.log(`PHASE5_BACKLOG_SPAWN_NONTERMINAL_TOTAL=${nonterminal.length}`);
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await repo.close().catch(()=>undefined); }
          NODE
          B64="$(base64 -w0 /tmp/phase5-backlog.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $B64 | base64 -d >/app/phase5-backlog.mjs && node /app/phase5-backlog.mjs; rc=\$?; rm -f /app/phase5-backlog.mjs; exit \$rc'"
