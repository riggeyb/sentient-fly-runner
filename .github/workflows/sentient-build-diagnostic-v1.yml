name: Sentient Exact Build Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        repository: riggeyb/sentient
        ref: 12372d0b2417c0521a7927b0cf0b3aa34ea1184c
        token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Print exact TypeScript diagnostics
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "12372d0b2417c0521a7927b0cf0b3aa34ea1184c"
        test "$(git rev-parse 'HEAD^{tree}')" = "2f5818abe9f15f50be62002e2f3a39b1b29ad440"
        npm install --no-package-lock --no-audit --no-fund
        npx tsc -p tsconfig.json --pretty false --noEmit
