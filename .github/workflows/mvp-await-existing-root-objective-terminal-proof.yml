name: MVP Await Existing Root Objective Terminal Proof
"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
permissions: {contents: read}
jobs:
  await:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
      OID: ${{ inputs.objective_id }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Wake and verify exact existing runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          for _ in $(seq 1 30); do
            h="$(curl -fsS --max-time 12 "https://${APP}.fly.dev/healthz" 2>/dev/null || true)"
            r="$(curl -fsS --max-time 12 "https://${APP}.fly.dev/readyz" 2>/dev/null || true)"
            if jq -e --arg s "$SHA" --arg t "$TREE" '.application.identity.source.sha==$s and .application.identity.source.tree==$t' >/dev/null 2>&1 <<<"$h" &&
               jq -e --arg s "$SHA" --arg t "$TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' >/dev/null 2>&1 <<<"$r"; then
              echo LIVE_EXACT_IDENTITY=PASS
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: GET-only terminal observation
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/a.mjs" <<'NODE'
          const oid=process.env.CERT_OBJECTIVE_ID;
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          if(!oid||!token) throw new Error("binding_missing");
          const h={authorization:`Bearer ${token}`};
          let b=null,e=null;
          for(let i=0;i<360;i++){
            try{
              const r=await fetch(`http://127.0.0.1:8080/v1/objectives/${encodeURIComponent(oid)}`,{headers:h,signal:AbortSignal.timeout(30000)});
              if(!r.ok) throw new Error(`http_${r.status}`);
              b=await r.json();
              if(["succeeded","failed","cancelled"].includes(String(b.status))) break;
            }catch(x){e=x}
            await new Promise(r=>setTimeout(r,2000));
          }
          if(!b) throw e??new Error("objective_unreadable");
          const p=b.rootProjection??null, x=b?.result?.body?.result??{}, c=String(x.authoritativeContent??"");
          console.log("TERMINAL_ROOT_OBS="+JSON.stringify({
            objectiveId:b.objectiveId??oid,status:b.status??null,rootProjectionPresent:!!p,
            contextVersion:p?.operatingContextVersion??null,contextDigest:p?.operatingContextDigest??null,
            participantContexts:Array.isArray(p?.participantOperatingContexts)?p.participantOperatingContexts.length:0,
            staleContexts:Array.isArray(p?.staleOperatingContextWorkers)?p.staleOperatingContextWorkers.length:0,
            acceptedEvidence:Array.isArray(p?.acceptedEvidence)?p.acceptedEvidence.length:0,
            workers:Array.isArray(p?.workers)?p.workers.length:0,
            finalResultPresent:typeof p?.finalResult==="string"&&!!p.finalResult.trim(),
            contractVersion:x.contractVersion??null,missionControlStatus:x.status??null,
            contextNotAuthority:x.operatingContextIsNotAuthority??null,workerEffectsCanonical:x.workerEffectsCanonical??null,
            sourceRepoKnown:c.includes("riggeyb/sentient"),operatorBridgeKnown:c.includes("riggeyb/sentient-fly-runner")
          }));
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          B64="$(base64 -w0 "$RUNNER_TEMP/a.mjs")"
          timeout 780s flyctl ssh console -a "$APP" -C "sh -lc 'echo $B64 | base64 -d >/tmp/a.mjs; CERT_OBJECTIVE_ID=$OID node /tmp/a.mjs; rc=\$?; rm -f /tmp/a.mjs; exit \$rc'"
