name: Phase1-7 Exact Cumulative Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Fence exact candidate
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo SOURCE_IDENTITY=PASS
      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          echo CUMULATIVE_BUILD=PASS
      - name: Cumulative regressions
        run: |
          set -euo pipefail
          node --test dist/test/phase1-core-runtime.test.js dist/test/phase1-acceptance-policy.test.js dist/test/fly-phase1-acceptance-policy.test.js dist/test/phase2-skill-execution.test.js dist/test/phase3-cognitive-components.test.js dist/test/phase3-local-hf-adapter.test.js dist/test/local-hf-worker-isolation.test.js dist/test/production-phase3-cognition.test.js dist/test/phase4-multistep-autonomy.test.js dist/test/phase5-collaborative-convergence.test.js dist/test/production-collaboration-restart-recovery.test.js dist/test/active-work-restart-edge.test.js dist/test/active-work-expiry-fencing.test.js dist/test/phase6-capability-integration.test.js dist/test/phase7-local-hf-feature-head.test.js dist/test/phase7-model-improvement.test.js dist/test/production-model-improvement.test.js dist/test/job2-self-execution.test.js dist/test/job2-production-convergence.test.js dist/test/permanent-continuation-http.test.js dist/test/permanent-continuation-multiprocess.test.js
          echo CUMULATIVE_PHASE1_7_TESTS=PASS
          echo SECRET_VALUES_EXPOSED=false
