name: MVP Final Recovery Composition V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: sentient/mvp-final-recovery-compose-v1
      START_SHA: 8c218b2d80ece71d8e95ec8a2999f0921021e1fc
      AA7C_SHA: aa7c5b5940041d79616dcd59d5bd3ff1f2810964
      FAIRNESS_SHA: cfaee5988cd70156b1c37bb72e8503df529ac494
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-final-recovery-compose-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compose exact bounded descendant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$START_SHA"
          git fetch origin "$AA7C_SHA" "$FAIRNESS_SHA"

          # Remove the excluded deterministic Root-timeout semantics by restoring
          # the exact already-accepted aa7c versions.
          git checkout "$AA7C_SHA" -- \
            src/application/production-mission-control.ts \
            test/root-direct-fallback.test.ts

          # Adopt only the already-tested recovery-fairness implementation/tests.
          git checkout "$FAIRNESS_SHA" -- \
            src/fly/self-execution.ts \
            test/final-cert-restart-backlog-serialization.test.ts \
            test/mvp-recovery-fairness-v2.test.ts

          # The local-HF serial-admission repair must remain byte-identical to aa7c.
          test "$(git hash-object src/model/providers/local-hf-serial-runner.ts)" = "$(git rev-parse "$AA7C_SHA:src/model/providers/local-hf-serial-runner.ts")"
          test "$(git hash-object src/fly/production-runtime.ts)" = "$(git rev-parse "$AA7C_SHA:src/fly/production-runtime.ts")"
          test "$(git hash-object test/job2-production-convergence.test.ts)" = "$(git rev-parse "$AA7C_SHA:test/job2-production-convergence.test.ts")"

          expected="$(printf '%s\n' \
            src/application/production-mission-control.ts \
            src/fly/self-execution.ts \
            test/final-cert-restart-backlog-serialization.test.ts \
            test/mvp-recovery-fairness-v2.test.ts \
            test/root-direct-fallback.test.ts | sort)"
          observed="$(git diff --name-only "$START_SHA" -- | sort)"
          test "$observed" = "$expected"
          git diff --check

      - name: Build and bounded regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          node --test dist/test/mvp-recovery-fairness-v2.test.js
          node --test dist/test/final-cert-restart-backlog-serialization.test.js
          node --test dist/test/phase5-fly-restart-lease-retry.test.js
          node --test dist/test/job2-production-convergence.test.js
          node --test dist/test/root-direct-fallback.test.js
          npm test

      - name: Commit exact tested composition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$START_SHA"
          git config user.name "sentient-mvp-activation"
          git config user.email "sentient-mvp-activation@users.noreply.github.com"
          git add \
            src/application/production-mission-control.ts \
            src/fly/self-execution.ts \
            test/final-cert-restart-backlog-serialization.test.ts \
            test/mvp-recovery-fairness-v2.test.ts \
            test/root-direct-fallback.test.ts
          git diff --cached --check
          git commit -m "mvp: compose serial HF admission with fair restart recovery"
          NEW_SHA="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse 'HEAD^{tree}')"
          git push --force-with-lease="refs/heads/$BRANCH:$START_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo "COMPOSED_SHA=$NEW_SHA"
          echo "COMPOSED_TREE=$NEW_TREE"
          echo "RESOURCE_EXPANSION=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "ROOT_TIMEOUT_FALLBACK_INCLUDED=false"
