name: Engineering Worker Machine Status Diagnostic
on:
  workflow_dispatch:
    inputs:
      machine_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect worker machine only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MACHINE_ID: ${{ inputs.machine_id }}
        shell: bash
        run: |
          set -euo pipefail
          APP="sentient-validation-runner"
          [[ "$MACHINE_ID" =~ ^[0-9a-f]{14}$ ]]
          flyctl machines list -a "$APP" --json >/tmp/machines.json
          jq -c --arg id "$MACHINE_ID" '[.[] | select(.id==$id) | {id:.id,state:.state,name:.name,created_at:.created_at,updated_at:.updated_at,image:.config.image,metadata:.config.metadata}]' /tmp/machines.json | sed 's/^/ENGINEERING_WORKER_MACHINE=/'
          echo "SECRET_VALUES_EXPOSED=false"
