name: Mission Control Exact Acceptance V1

"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
      request: {required: true, type: string}

permissions: {contents: read}

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: a6d430ff775044a03f2fca9c63ee6bfa1796f558
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: skills245
          persist-credentials: false
          fetch-depth: 0
      - name: Accept PR 245
        working-directory: skills245
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a6d430ff775044a03f2fca9c63ee6bfa1796f558"
          test "$(git rev-parse 'HEAD^{tree}')" = "785fb508b67515b1963914196ad7cbee50ccabe2"
          pip install -r requirements.txt
          python scripts/validate_registry.py
          python scripts/check_evals.py
          python scripts/test_repository_edit.py
          python scripts/test_repository_edit_request.py
          python scripts/validate_actions_schema.py
          cd sentient-orchestrator
          npm install --ignore-scripts
          npm run typecheck
          npm run migrate
          npm test
          echo PR_245_AUTOMATED_ACCEPTANCE=PASS

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: b3df9b32b47370a7140d6fe814eeba97564663ab
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: skills247
          persist-credentials: false
          fetch-depth: 0
      - name: Accept PR 247
        working-directory: skills247
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b3df9b32b47370a7140d6fe814eeba97564663ab"
          test "$(git rev-parse 'HEAD^{tree}')" = "3173ee3cb2e39038921d3b125f1a74ecd783ff30"
          pip install -r requirements.txt
          python scripts/validate_registry.py
          python scripts/check_evals.py
          python scripts/test_repository_edit.py
          python scripts/test_repository_edit_request.py
          python scripts/validate_actions_schema.py
          cd sentient-orchestrator
          npm install --ignore-scripts
          npm run typecheck
          npm run migrate
          npm test
          echo PR_247_AUTOMATED_ACCEPTANCE=PASS

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 12372d0b2417c0521a7927b0cf0b3aa34ea1184c
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: false
          fetch-depth: 0
      - name: Accept PR 307
        working-directory: sentient
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "12372d0b2417c0521a7927b0cf0b3aa34ea1184c"
          test "$(git rev-parse 'HEAD^{tree}')" = "2f5818abe9f15f50be62002e2f3a39b1b29ad440"
          npm install --no-audit --no-fund
          npm run build
          node --test dist/test/spawn-mission-control-context.test.js
          node --experimental-strip-types --test tests/spawn-mission-control-context.test.ts
          node --test dist/test/spawn*.test.js
          npm test
          echo PR_307_AUTOMATED_ACCEPTANCE=PASS
