name: Mission Control Exact Acceptance V2

"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
      request: {required: true, type: string}

permissions: {contents: read}

jobs:
  mission-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: b3df9b32b47370a7140d6fe814eeba97564663ab
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fence PR 247
        run: |
          test "$(git rev-parse HEAD)" = "b3df9b32b47370a7140d6fe814eeba97564663ab"
          test "$(git rev-parse 'HEAD^{tree}')" = "3173ee3cb2e39038921d3b125f1a74ecd783ff30"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install registry deps
        run: pip install -r requirements.txt
      - name: Registry validation
        run: python scripts/validate_registry.py
      - name: Eval validation
        run: python scripts/check_evals.py
      - name: Repository edit tests
        run: |
          python scripts/test_repository_edit.py
          python scripts/test_repository_edit_request.py
          python scripts/validate_actions_schema.py
      - name: Install orchestrator deps
        working-directory: sentient-orchestrator
        run: npm install --ignore-scripts
      - name: Mission Control typecheck
        working-directory: sentient-orchestrator
        run: npm run typecheck
      - name: Postgres migrations
        working-directory: sentient-orchestrator
        run: npm run migrate
      - name: Mission Control full tests
        working-directory: sentient-orchestrator
        run: npm test

  sentient-spawn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 12372d0b2417c0521a7927b0cf0b3aa34ea1184c
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fence PR 307
        run: |
          test "$(git rev-parse HEAD)" = "12372d0b2417c0521a7927b0cf0b3aa34ea1184c"
          test "$(git rev-parse 'HEAD^{tree}')" = "2f5818abe9f15f50be62002e2f3a39b1b29ad440"
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install Sentient deps
        run: npm install --no-audit --no-fund
      - name: Sentient strict build
        run: npm run build
      - name: Dist Mission Control spawn test
        run: node --test dist/test/spawn-mission-control-context.test.js
      - name: Source Mission Control spawn test
        run: node --experimental-strip-types --test tests/spawn-mission-control-context.test.ts
      - name: All dist spawn tests
        run: node --test dist/test/spawn*.test.js
      - name: Full Sentient tests
        run: npm test
