name: Mission Control Integration Repair V1

"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
      request: {required: true, type: string}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mission-control-live-integration-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fence integration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9daf5b2f9802d139bb146c3e7431f5bdbdabc170"

      - name: Present canonical operating context to child model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/spawn/backends/huggingface.ts")
          s = p.read_text()
          old = '''function workerPrompt(taskPackage: ChildTaskPackageV1): string {
            const context = taskPackage.context.artifacts
              .map((artifact) => `${artifact.id}\n${artifact.content}`)
              .join("\n\n")
              .slice(0, 8_000);
            const objective = taskPackage.objective.slice(0, 12_000);
            return context
              ? `Objective:\n${objective}\n\nBounded context:\n${context}`
              : `Objective:\n${objective}`;
          }'''
          new = '''export function workerPrompt(taskPackage: ChildTaskPackageV1): string {
            const operating = taskPackage.operatingContext;
            const operatingContext = [
              "Canonical operating context (structured, non-authoritative):",
              `version=${operating.version}`,
              `provenance=${operating.provenance}`,
              `digest=${taskPackage.operatingContextDigest}`,
              `authoritativeSourceRepo=${operating.authoritativeSourceRepo}`,
              `normalSentientOperatorBridge=${operating.normalSentientOperatorBridge}`,
              `optionalOperatorMcp=${operating.optionalOperatorMcp}`,
              `postgresIsDurableSystemOfRecord=${String(operating.postgresIsDurableSystemOfRecord)}`,
              `postgresDoesNotGrantAuthority=${String(operating.postgresDoesNotGrantAuthority)}`,
              `operatingContextIsNotAuthority=${String(operating.operatingContextIsNotAuthority)}`,
              `orchestratorMayBypassGovernor=${String(operating.orchestratorMayBypassGovernor)}`,
              `orchestratorMaySelfEscalate=${String(operating.orchestratorMaySelfEscalate)}`,
            ].join("\n");
            const context = taskPackage.context.artifacts
              .map((artifact) => `${artifact.id}\n${artifact.content}`)
              .join("\n\n")
              .slice(0, 8_000);
            const objective = taskPackage.objective.slice(0, 12_000);
            return [
              `Objective:\n${objective}`,
              operatingContext,
              ...(context ? [`Bounded context:\n${context}`] : []),
            ].join("\n\n");
          }'''
          if new in s:
              print("OPERATING_CONTEXT_PROMPT_ALREADY_PRESENT=true")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("OPERATING_CONTEXT_PROMPT_REPAIRED=true")
          else:
              raise SystemExit("workerPrompt shape changed; fail closed")
          PY

      - name: Add prompt regression
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/spawn-operating-context-prompt.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { workerPrompt } from "../src/spawn/backends/huggingface.js";
          import { SENTIENT_OPERATING_CONTEXT_V1, sentientOperatingContextDigestV1 } from "../src/spawn/operating-context.js";

          test("spawn child prompt receives canonical topology without mission repetition", async () => {
            const mission = "Inspect a bounded area and return evidence.";
            assert.equal(mission.includes("riggeyb/sentient-fly-runner"), false);
            const digest = await sentientOperatingContextDigestV1(SENTIENT_OPERATING_CONTEXT_V1);
            const prompt = workerPrompt({
              objective: mission,
              operatingContext: SENTIENT_OPERATING_CONTEXT_V1,
              operatingContextDigest: digest,
              context: { artifacts: [], contextDigest: "sha256:test" },
            } as never);
            assert.match(prompt, /authoritativeSourceRepo=riggeyb\/sentient/);
            assert.match(prompt, /normalSentientOperatorBridge=riggeyb\/sentient-fly-runner/);
            assert.match(prompt, /optionalOperatorMcp=riggeyb\/sentient-ops-mcp/);
            assert.match(prompt, new RegExp(`digest=${digest}`));
            assert.match(prompt, /operatingContextIsNotAuthority=true/);
            assert.match(prompt, /orchestratorMayBypassGovernor=false/);
            assert.match(prompt, /orchestratorMaySelfEscalate=false/);
          });
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --experimental-strip-types --test tests/spawn-operating-context-prompt.test.ts
          node --test dist/test/spawn-mission-control-context.test.js
          node --experimental-strip-types --test tests/spawn-mission-control-context.test.ts
          npm test

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentient-mission-control-integration"
          git config user.email "sentient-mission-control-integration@users.noreply.github.com"
          git add src/spawn/backends/huggingface.ts tests/spawn-operating-context-prompt.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "mission-control: present operating context to live child"
            git push origin HEAD:sentient/mission-control-live-integration-v1
          fi
          echo "INTEGRATION_REPAIR_SHA=$(git rev-parse HEAD)"
          echo "INTEGRATION_REPAIR_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "PRODUCTION_DEPLOYMENT=false"
