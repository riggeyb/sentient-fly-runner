name: MVP Verifier Grammar Repair V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 622ab8c64afc5792e17401a6ea50f0a79d48d6eb
      BRANCH: sentient/mvp-verifier-grammar-v1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-verifier-grammar-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded verifier grammar repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/application/production-collaboration.ts")
          s = p.read_text()
          old = '      maxOutputTokens: 64 ,'
          new = '      maxOutputTokens: role === "independent-verification" ? 8 : 64,'
          if s.count(old) != 1:
              raise SystemExit(f"budget_matches={s.count(old)}")
          s = s.replace(old, new, 1)
          old = '"Your first token MUST be AGREE when the candidate is supported, or DISAGREE when it is contradicted, materially unsupported, or unsafe to accept.",\n    "Then give a concise rationale. Your verdict is evidence only; Sentient owns convergence.",'
          new = '"Return exactly one verdict token and nothing else: AGREE when the candidate is supported; DISAGREE when it is contradicted, materially unsupported, or unsafe to accept.",\n    "Do not preface, explain, qualify, punctuate, or add any other token. Your verdict is evidence only; Sentient owns convergence.",'
          if s.count(old) != 1:
              raise SystemExit(f"objective_matches={s.count(old)}")
          p.write_text(s.replace(old, new, 1))

          p = Path("src/spawn/backends/huggingface.ts")
          s = p.read_text()
          marker = 'function workerSystemPrompt(role: string): string {\n'
          if s.count(marker) != 1:
              raise SystemExit("worker_prompt_marker_missing")
          insert = '''function workerSystemPrompt(role: string): string {
            if (role === "independent-verification") {
              return [
                "You are approved local Hugging Face subordinate verification for a Sentient Spawn worker.",
                "Your assigned role is independent-verification.",
                "Return exactly one token and nothing else: AGREE or DISAGREE.",
                "Use AGREE only when the candidate is supported by the objective; use DISAGREE when it is contradicted, materially unsupported, or unsafe to accept.",
                "Do not preface, explain, qualify, punctuate, or add any other token.",
                "Your verdict is evidence only; Sentient owns convergence.",
              ].join(" ");
            }
          '''
          p.write_text(s.replace(marker, insert, 1))

          p = Path("test/job2-production-convergence.test.ts")
          s = p.read_text()
          anchor = '  assert.doesNotMatch(collaboration, /maxOutputTokens:\\s*1_024/);\n});\n'
          addition = '''  assert.doesNotMatch(collaboration, /maxOutputTokens:\s*1_024/);
            assert.match(collaboration, /maxOutputTokens:\s*role === "independent-verification" \? 8 : 64/);
            assert.match(collaboration, /Return exactly one verdict token and nothing else/);
            assert.doesNotMatch(collaboration, /Then give a concise rationale/);
            const backend = await readFile("src/spawn/backends/huggingface.ts", "utf8");
            assert.match(backend, /role === "independent-verification"/);
            assert.match(backend, /Return exactly one token and nothing else: AGREE or DISAGREE/);
          });
          '''
          if s.count(anchor) != 1:
              raise SystemExit(f"test_anchor_matches={s.count(anchor)}")
          p.write_text(s.replace(anchor, addition, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/application/production-collaboration.ts src/spawn/backends/huggingface.ts test/job2-production-convergence.test.ts | sort)"
      - name: Build and bounded tests
        shell: bash
        run: |
          set +e
          failed=0
          run_step() {
            label="$1"; shift
            "$@" >"/tmp/${label}.log" 2>&1
            rc=$?
            echo "${label}_EXIT=${rc}"
            if [ "$rc" -ne 0 ]; then
              echo "::group::${label} failure tail"
              tail -n 120 "/tmp/${label}.log"
              echo "::endgroup::"
              failed=1
            fi
          }
          run_step NPM_INSTALL npm install --no-audit --no-fund
          if [ "$failed" -eq 0 ]; then run_step BUILD npm run build; fi
          if [ "$failed" -eq 0 ]; then run_step JOB2 node --test dist/test/job2-production-convergence.test.js; fi
          if [ "$failed" -eq 0 ]; then run_step NPM_TEST npm test; fi
          git diff --check
          diff_rc=$?
          echo "DIFF_CHECK_EXIT=${diff_rc}"
          if [ "$diff_rc" -ne 0 ]; then failed=1; fi
          exit "$failed"
      - name: Commit isolated repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config user.name "sentient-mvp-activation"
          git config user.email "sentient-mvp-activation@users.noreply.github.com"
          git add src/application/production-collaboration.ts src/spawn/backends/huggingface.ts test/job2-production-convergence.test.ts
          git commit -m "mvp: tighten local verifier verdict grammar"
          git push --force-with-lease="refs/heads/$BRANCH:$BASE_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo "REPAIRED_SHA=$(git rev-parse HEAD)"
          echo "REPAIRED_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "RESOURCE_EXPANSION=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "PARSER_BROADENING=false"
