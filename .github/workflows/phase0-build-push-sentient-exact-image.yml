name: Phase0 Build Push Sentient Exact Image
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET_SHA: d2ae0d7d77ebb4c2ad52d9bd4ca667f860071cb3
      TARGET_TREE: 715b9323f7928d2fa31a43e4d4fae51b2f4b2980
      TARGET_PARENT: d21164ca4eab39c2c62ff46fa5c4c786fea38166
      SKILLS_SHA: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: d2ae0d7d77ebb4c2ad52d9bd4ca667f860071cb3
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and push exact immutable image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$TARGET_PARENT"
          git bundle create sentient-source.bundle HEAD
          flyctl deploy             --app sentient-validation-runner             --config fly.toml             --remote-only             --build-only             --push             --image-label "phase0-$TARGET_SHA"             --build-arg "SENTIENT_RUNTIME_SHA=$TARGET_SHA"             --build-arg "SENTIENT_RUNTIME_TREE=$TARGET_TREE"             --build-arg "SENTIENT_SKILLS_SHA=$SKILLS_SHA"             --build-arg "SENTIENT_PHASE0_ACCEPTANCE_BASE_SHA=$TARGET_PARENT"
          rm -f sentient-source.bundle
          echo "EXACT_IMAGE_BUILD_PUSH=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
