name: Engineering Recent Jobs Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: List sanitized recent EngineeringJobs from Governor authority
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          APP="sentient-deployment-governor"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          cat >/tmp/recent-jobs.mjs <<'NODE'
          import pg from "/app/node_modules/pg/lib/index.js";
          const {Pool}=pg;
          const head=String(process.env.EXPECTED_HEAD??"").trim();
          const db=String(process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??"").trim();
          if(!db)throw new Error("GOVERNOR_LEDGER_DB_MISSING");
          const pool=new Pool({connectionString:db,max:1,connectionTimeoutMillis:10000});
          try{
            const r=await pool.query(`
              select job_id,status,expected_head,left(objective,180) as objective_prefix,
                     worker_machine_id,created_at,started_at,completed_at,error_code
              from sentient_deployment_governor.engineering_jobs
              where expected_head=$1
                and created_at > now() - interval '30 minutes'
              order by created_at desc
              limit 10`,[head]);
            console.log("RECENT_ENGINEERING_JOBS="+JSON.stringify(r.rows));
          }finally{await pool.end();}
          NODE
          B64="$(base64 -w0 /tmp/recent-jobs.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $B64 | base64 -d >/app/recent-jobs.mjs && EXPECTED_HEAD=$EXPECTED_HEAD node /app/recent-jobs.mjs; rc=\$?; rm -f /app/recent-jobs.mjs; exit \$rc'"
          echo "HARNESS_BINDING_CORRECT=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
