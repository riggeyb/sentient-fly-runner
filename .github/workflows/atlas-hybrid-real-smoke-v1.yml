name: Atlas Hybrid Real Smoke V1

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact riggeyb/sentient source SHA
        required: true
        type: string
      tree:
        description: Exact expected source tree SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  atlas-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          path: .runner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo "SOURCE_CHECKOUT=PASS"
      - name: Install and build exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1
          npm run build >/tmp/build.log 2>&1
          echo "BUILD=PASS"
      - name: Run minimal Atlas smoke with billed deltas
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ATLASCLOUD_API_KEY:-}"
          bash .runner/scripts/atlas-billed-smoke.sh "$PWD" "$PWD/.runner"
