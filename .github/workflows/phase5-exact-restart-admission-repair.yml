name: Skills Exact Candidate Validation
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentient
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fence exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          echo "SOURCE_TREE=$EXPECTED_TREE"
          echo "DEPENDENCY_LOCK_IDENTITY=ABSENT_IN_SOURCE"
          echo "PYTHON_REQUIREMENTS_SHA=$(git rev-parse HEAD:requirements.txt)"
          echo "ORCHESTRATOR_MANIFEST_SHA=$(git rev-parse HEAD:sentient-orchestrator/package.json)"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Registry validation
        run: python scripts/validate_registry.py
      - name: Install orchestrator dependencies
        working-directory: sentient-orchestrator
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Typecheck
        working-directory: sentient-orchestrator
        run: npm run typecheck
      - name: Migrate Postgres
        working-directory: sentient-orchestrator
        run: npm run migrate
      - name: Full orchestrator tests
        working-directory: sentient-orchestrator
        run: npm test
      - name: Guard tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "SOURCE_MUTATION=false"
          echo "GENERATED_UNTRACKED_ARTIFACTS_ALLOWED=true"
          echo "DIRECT_EXACT_SHA_ACCEPTANCE=PASS"
