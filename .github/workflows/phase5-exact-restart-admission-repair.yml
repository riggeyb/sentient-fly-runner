name: Phase5 Exact Restart Admission Repair
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions: {contents: read}
concurrency:
  group: phase5-canonical-source-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sentient, POSTGRES_PASSWORD: sentient, POSTGRES_DB: sentient}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
      TARGET_BRANCH: sentient-production-composition-20261017
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient
      FIXTURE_REF: a939f9df6f09ca2815fcc65dc310ae5d0e705965
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Fence exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
      - name: Serialize inherited backlog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/fly/self-execution.ts"); s=p.read_text()
          old="        this.#schedule(objectiveId, true);\n        await new Promise<void>((resolve) =>\n          setTimeout(resolve, PHASE5_RESTART_ADMISSION_PACING_MS)\n        );"
          new="        this.#schedule(objectiveId, true);\n        const work = this.#active.get(objectiveId);\n        if (work !== undefined) await work;\n        await new Promise<void>((resolve) =>\n          setTimeout(resolve, PHASE5_RESTART_ADMISSION_PACING_MS)\n        );"
          assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))
          t=Path("test/phase5-fly-restart-lease-retry.test.ts"); q=t.read_text()
          q=q.replace("restart recovery paces admission without waiting for a previous objective lifetime","restart recovery serializes inherited backlog while fresh admission stays independent")
          old2='assert.ok(!source.includes("if (work !== undefined) await work"));'
          new2='assert.ok(source.includes("const work = this.#active.get(objectiveId)"));\\n  assert.ok(source.includes("if (work !== undefined) await work"));'
          assert q.count(old2)==1, q.count(old2); t.write_text(q.replace(old2,new2,1))
          PY
          git diff --check
      - name: Build and behavioral liveness
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          curl -fsSL "https://raw.githubusercontent.com/riggeyb/sentient-fly-runner/${FIXTURE_REF}/scripts/phase5-admission-liveness-test.mjs" -o ./phase5-admission-liveness-test.mjs
          node ./phase5-admission-liveness-test.mjs
          rm -f ./phase5-admission-liveness-test.mjs
      - name: Targeted and cumulative regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test dist/test/phase5-fly-restart-lease-retry.test.js dist/test/production-collaboration-restart-recovery.test.js dist/test/active-work-restart-edge.test.js dist/test/active-work-expiry-fencing.test.js dist/test/phase5-collaborative-convergence.test.js dist/test/job2-self-execution.test.js dist/test/local-hf-worker-isolation.test.js
          node --test dist/test/phase0-control-recovery.test.js dist/test/phase0-engineering-readiness.test.js dist/test/phase1-core-runtime.test.js dist/test/phase1-acceptance-policy.test.js dist/test/fly-phase1-acceptance-policy.test.js dist/test/phase2-skill-execution.test.js dist/test/phase3-cognitive-components.test.js dist/test/phase3-local-hf-adapter.test.js dist/test/production-phase3-cognition.test.js dist/test/phase4-multistep-autonomy.test.js dist/test/phase5-collaborative-convergence.test.js dist/test/production-collaboration-restart-recovery.test.js dist/test/phase5-fly-restart-lease-retry.test.js dist/test/phase6-capability-integration.test.js dist/test/phase7-local-hf-feature-head.test.js dist/test/phase7-model-improvement.test.js dist/test/production-model-improvement.test.js dist/test/job2-production-convergence.test.js dist/test/permanent-continuation-http.test.js dist/test/permanent-continuation-multiprocess.test.js
      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name sentient-final-cert-convergence
          git config user.email sentient-final-cert-convergence@users.noreply.github.com
          git add src/fly/self-execution.ts test/phase5-fly-restart-lease-retry.test.ts
          git diff --cached --check
          git commit -m "fix: serialize inherited restart backlog"
          echo "END_SHA=$(git rev-parse HEAD)"
          echo "END_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo PHASE5_SOURCE_PUSH=PASS
          echo SECRET_VALUES_EXPOSED=false
