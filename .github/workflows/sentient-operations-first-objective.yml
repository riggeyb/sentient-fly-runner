name: Sentient Operations First Objective
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-operations-first-objective
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: e9bd0c9135f05da2be337e5e7ac4077af0f4649d
      EXPECTED_TREEN€ 0d5317a5434f20530d4814d748ae9fa9a7a520f3
      OBJECTIVE_ID: sentient-operations-001
      SESSION_ID: sentient-operations
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake and verify certified production identity
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            r="$(curl -fsS --max-time 5 "https://${APP}.fly.dev/readyz" || true)"
            if jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" \
              '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' \
              >/dev/null 2>&1 <<<$ r"; then
              echo "CERTIFIED_RUNTIME_IDENTITY=PASS"
              exit 0
            fi
            sleep 2
          done
          echo "CERTIFIED_RUNTIME_IDENTITY=FAIL"
          exit 1

      - name: Submit first real objective idempotently and read durable state
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sentient-operations-first-objective.mjs <<'NODE'
          const oid = String(process.env.OBJECTIVE_ID ?? "").trim();
          const sid = String(process.env.SESSION_ID ?? "").trim();
          const token = String(process.env.SENTIENT_API_TOKEN ?? "").trim();
          if (!oid || !sid || !token) throw new Error("OPERATIONAL_INGRESS_BINDING_MISSING");

          const base = "http://127.0.0.1:8080";
          const headers = { authorization: `Bearer ${token}`, "content-type": "application/json" };
          const request =
            "Examine the existing Sentient production repository and Fly configuration. " +
            "Identify avoidable storage consumption, resource inefficiencies, and operational costs. " +
            "Produce a prioritized report with concrete source references. " +
            "Do not modify source, databases, infrastructure, deployment configuration, or secrets.";

          async function getObjective() {
            return fetch(`${base}/v1/objectives/${encodeURIComponent(oid)}`, {
              method: "GET",
              headers: { authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(30000),
            });
          }

          let existing;
          try {
            existing = await getObjective();
          } catch (error) {
            console.log(`S`OBJECTIVE_PRECHECK_TRANSPORT=${error instanceof Error ? error.name : "UNKNOWN"}`);
            throw error;
          }

          let accepted = false;
          if (existing.status === 200) {
            console.log("OBJECTIVE_ALREADY_EXISTS=true");
          } else if (existing.status === 404) {
            let response;
            try {
              response = await fetch(`${base}/v1/objectives`, {
              method: "POST",
              headers,
              body: JSON.stringify({
                objectiveId: oid,
                sessionId: sid,
                mode: "auto",
                privacy: "private",
                deployOnSuccess: false,
                request,
              }),
              signal: AbortSignal.timeout(120000),
            });
            } catch (error) {
              console.log(`OBJECTIVE_SUBMIT_TRANSPORT=${error instanceof Error ? error.name : "UNKNOWN"}`);
              const check = await getObjective().catch(() => undefined);
              if (!check || check.status !== 200) {
                throw new Error("OBJECTIVE_SUBMIT_OUTCOME_UNKNOWN_NO_DURABLE_RECEIPT");
              }
              console.log("OBJECTIVE_ACCEPTED_AFTER_TRANSPORT_AMBIGUITY=true");
              accepted = true;
            }

            if (response) {
              const raw = await response.text();
              let receipt = {};
              try { receipt = raw ? JSON.parse(raw) : {}; } catch {}
              console.log(`OBJECTIVE_SUBMIT_STATUS=${response.status}`);
              if (response.status !== 202 || receipt.objectiveId !== oid) {
                throw new Error(`S`OBJECTIVE_NOT_ACCEPTED:${response.status}`);
              }
              accepted = true;
              console.log("OBJECTIVE_ACCEPTED=true");
            }
          } else {
            throw new Error(`S`OBJECTIVE_PRECHECK_UNEXPECTED_STATUS:${existing.status}`);
          }

          const stateResponse = await getObjective();
          if (stateResponse.status !== 200) {
            throw new Error(`OBJECTIVE_NOT_PERSISTED:${stateResponse.status}`);
          }
          const state = await stateResponse.json();
          const view = {
            objectiveId: state.objectiveId,
            status: state.status,
            activeEngineeringJobId: state.activeEngineeringJobId ?? null,
            lastEngineeringReceipt: state.lastEngineeringReceipt ?? null,
            updatedAt: state.updatedAt ?? null,
            error: state.error ?? null,
            result: state.result ?? null,
          };
          if (view.objectiveId !== oid) throw new Error("OBJECTIVE_ID_MISMATCH");
          console.log("OBJECTIVE_PERSISTED=true");
          console.log(`OBJECTIVE_STATE=${JSON.stringify(view)}`);
          console.log("DEPLOY_ON_SUCCESS=false");
          console.log("UNAUTHORIZED_MUTATIONS_REQUESTED=false");
          console.log("ACTIONS_CONTINUATION_ROLE=NONE");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE

          B64="$(base64 -w0 /tmp/sentient-operations-first-objective.mjs)"
          timeout 180s flyctl ssh console -a "$APP" -C \
            "sh -lc 'echo $B64 | base64 -d >/tmp/sentient-operations-first-objective.mjs && OBJECTIVE_ID=$OBJECTIVE_ID SESSION_ID=$SESSION_ID node /tmp/sentient-operations-first-objective.mjs; rc=\$?; rm -f /tmp/sentient-operations-first-objective.mjs; exit \$rc'" \
            | tee /tmp/sentient-operations-first-objective.out
          rm -f /tmp/sentient-operations-first-objective.mjs

          grep -Fq 'OBJECTIVE_PERSISTED=true' /tmp/sentient-operations-first-objective.out
          grep -Fq 'DEPLOY_ON_SUCCESS=false' /tmp/sentient-operations-first-objective.out
          grep -Fq 'ACTIONS_CONTINUATION_ROLE=NONE' /tmp/sentient-operations-first-objective.out
          grep -Fq 'SECRET_VALUES_EXPOSED=false' /tmp/sentient-operations-first-objective.out
