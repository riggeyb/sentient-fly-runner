name: Sentient Operations First Objective
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-operations-first-objective
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: e9bd0c9135f05da2be337e5e7ac4077af0f4649d
      EXPECTED_TREE: 0d5317a5434f20530d4814d748ae9fa9a7a520f3
      OBJECTIVE_ID: sentient-operations-002
      SESSION_ID: sentient-operations
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Wake and verify certified runtime
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            r="$(curl -fsS --max-time 5 "https://${APP}.fly.dev/readyz" || true)"
            if jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' >/dev/null 2>&1 <<<"$r"; then
              echo CERTIFIED_RUNTIME_IDENTITY=PASS
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Submit once and read durable state
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/operations-first-objective.mjs
          b64="$(base64 -w0 scripts/operations-first-objective.mjs)"
          timeout 180s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/operations-first-objective.mjs && OBJECTIVE_ID=$OBJECTIVE_ID SESSION_ID=$SESSION_ID node /tmp/operations-first-objective.mjs; rc=\$?; rm -f /tmp/operations-first-objective.mjs; exit \$rc'" | tee /tmp/operations-first-objective.out
          grep -Fq 'OBJECTIVE_PERSISTED=true' /tmp/operations-first-objective.out
          grep -Fq 'DEPLOY_ON_SUCCESS=false' /tmp/operations-first-objective.out
          grep -Fq 'ACTIONS_CONTINUATION_ROLE=NONE' /tmp/operations-first-objective.out
          grep -Fq 'SECRET_VALUES_EXPOSED=false' /tmp/operations-first-objective.out
