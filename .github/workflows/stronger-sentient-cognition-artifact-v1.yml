name: Stronger Sentient Cognition Artifact Optimization v1

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stronger-sentient-cognition-artifact-optimization-v1
  cancel-in-progress: false

env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab
  CORPUS_SHA: 9c037505f65663ae6b7e8990ae969639572860d9
  CORPUS_DIGEST: 611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51
  CONTRACT_DIGEST: sha256:62f98338f60164620a3fe93fd69e7c94b33e8ec4602ba3337c1b06b89651673d

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.CORPUS_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: corpus-source
          persist-credentials: false

      - name: Guard frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          test "$(git -C corpus-source rev-parse HEAD)" = "$CORPUS_SHA"
          test "$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json | awk '{print $1}')" = "$CORPUS_DIGEST"
          test "sha256:$(sha256sum measurement-contracts/stronger-sentient-cognition-artifact-v1.schema.json | awk '{print $1}')" = "$CONTRACT_DIGEST"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build exact accepted baseline
        working-directory: sentient
        run: npm install --no-audit --no-fund --package-lock=false && npm run build

      - name: Enforce Dots3 synthesis no-thinking and literal-retention contract in measurement runner
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const p="scripts/stronger-sentient-cognition-artifact-v1.mjs";
          let s=fs.readFileSync(p,"utf8");
          const old='const F=async(...a)=>{if(calls>=M)throw Error("call_ceiling");const n=++calls,z=Date.now(),res=await fetch(...a);events.push({n,status:res.status,latencyMs:Date.now()-z});return res};';
          if((s.split(old).length-1)!==1) throw Error("fetch_wrapper_anchor_mismatch");
          const next='const F=async(...a)=>{if(calls>=M)throw Error("call_ceiling");const n=++calls,z=Date.now();const [url,init0]=a;let init=init0;if(init0?.body){const b=JSON.parse(String(init0.body));if(b.model===DOTS3_NOTE_MODEL_V1){b.enable_thinking=false;init={...init0,body:JSON.stringify(b)}}}const res=await fetch(url,init);events.push({n,status:res.status,latencyMs:Date.now()-z});return res};';
          s=s.replace(old,next);
          const rewrites=[
            [
              '`Preserve every important finding, constraint, uncertainty, required tool recommendation, and verification need from the artifact, but express them naturally rather than as audit tags.`',
              '`Preserve the artifact literally where identity matters: explicitly state every keyFindings[].claim; include every constraints[] string verbatim; include every uncertainties[] string verbatim; include every verificationNeeded[] string verbatim. You may organize these in compact prose or bullets, but do not omit or rename identifiers.`'
            ],
            [
              '`Cite every evidence reference exactly as [evidence: ID]. Mention each required tool by its exact tool name and explain its rationale naturally.`',
              '`For every evidenceRefs[] item, include exactly one citation in the form [evidence: ID]. For every toolRecommendations[] item, include the exact tool name and preserve its rationale verbatim. Literal artifact strings are required interface data, not a separate audit block.`'
            ]
          ];
          for(const [from,to] of rewrites){
            if((s.split(from).length-1)!==1) throw Error("synthesis_prompt_anchor_mismatch");
            s=s.replace(from,to);
          }
          fs.writeFileSync(p,s);
          NODE
          node --check scripts/stronger-sentient-cognition-artifact-v1.mjs
          grep -q 'enable_thinking=false' scripts/stronger-sentient-cognition-artifact-v1.mjs
          grep -Fq 'include every constraints[] string verbatim' scripts/stronger-sentient-cognition-artifact-v1.mjs
          grep -Fq 'include exactly one citation in the form [evidence: ID]' scripts/stronger-sentient-cognition-artifact-v1.mjs

      - name: Validate canonical prose-synthesis harness
        shell: bash
        run: |
          set -euo pipefail
          node -e 'JSON.parse(require("fs").readFileSync("measurement-contracts/stronger-sentient-cognition-artifact-v1.schema.json","utf8"))'
          node --check scripts/stronger-sentient-cognition-artifact-v1.mjs
          grep -q 'maxOutputTokens:1536' scripts/stronger-sentient-cognition-artifact-v1.mjs
          grep -q 'ordinary prose' scripts/stronger-sentient-cognition-artifact-v1.mjs
          grep -q 'String(r.text??"")' scripts/stronger-sentient-cognition-artifact-v1.mjs

      - name: Run canonical artifact validation
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          BASELINE_SHA: ${{ env.BASELINE_SHA }}
          BASELINE_TREE: ${{ env.BASELINE_TREE }}
          CORPUS_DIGEST: ${{ env.CORPUS_DIGEST }}
          EXPERIMENT_OUT: ${{ runner.temp }}/stronger-sentient-cognition-artifact-v1.json
        run: node scripts/stronger-sentient-cognition-artifact-v1.mjs

      - name: Guard immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-cognition-artifact-v1
          path: ${{ runner.temp }}/stronger-sentient-cognition-artifact-v1.json
          retention-days: 14

      - name: Guard receipt
        run: |
          echo MAX_PROVIDER_CALLS=5
          echo DOTS3_DIRECT_SYNTHESIS_ONLY=true
          echo DOTS3_SYNTHESIS_RESPONSE_FORMAT=USER_FACING_PROSE
          echo DOTS3_SYNTHESIS_ENABLE_THINKING=false
          echo DOTS3_SYNTHESIS_LITERAL_RETENTION_REQUIRED=true
          echo DOTS3_SYNTHESIS_MAX_OUTPUT_TOKENS=1536
          echo DEEPSEEK_PROVIDER_CALLS=0
          echo CHALLENGER_PROVIDER_CALLS=0
          echo PROVIDER_RETRIES=0
          echo VERIFIER_TEXT_NULL_SAFE=true
          echo MODEL_ROLE_CHANGE=false
          echo SOURCE_CHANGE=false
          echo PRODUCTION_DEPLOYMENT=false
