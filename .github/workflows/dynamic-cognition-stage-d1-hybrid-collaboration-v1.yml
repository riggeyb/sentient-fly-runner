name: Dynamic Cognition Stage D1 Hybrid Collaboration V1
on:
  workflow_dispatch:
    inputs:
      source_branch: {required: true, type: string}
      expected_sha: {required: true, type: string}
      expected_tree: {required: true, type: string}
permissions:
  contents: read
jobs:
  d1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 0
      - name: Exact migration, regression, concurrency-safe push
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          cd sentient
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"

          awk '
            /python - <<'\''PY'\''/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' ../runner/.github/workflows/atlas-hybrid-collaboration-patch-v1.yml > /tmp/d1.py
          python -m py_compile /tmp/d1.py
          python /tmp/d1.py

          git diff --check
          grep -q 'ATLAS_HYBRID_SPAWN_BACKEND_ID_V1' src/application/production-collaboration.ts
          grep -q 'ATLAS_HYBRID_PROVIDER_ID_V1' src/application/production-collaboration.ts
          grep -q 'ATLAS_HYBRID_ROUTE_MODD_ID_V1' src/application/production-collaboration.ts
          grep -q 'maxCostMicros: 25_000' src/application/production-collaboration.ts
          grep -q 'maxCostMicros: 100_000' src/application/production-collaboration.ts
          grep -q 'modelOutputIsAuthority === false' src/application/production-collaboration.ts
          grep -q 'sentientOwnsAcceptance === true' src/application/production-collaboration.ts
          grep -q 'governorOwnsEffectAuthority === true' src/application/production-collaboration.ts
          ! grep -q 'HUGGINGFACE_LOCAL_SPAWN_BACKEND_ID_V1' src/application/production-collaboration.ts
          ! grep -q 'approved-zero-cost' src/application/production-collaboration.ts

          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/dynamic-hard-stops-core.test.js \
            dist/test/dynamic-objective-envelope-runtime-v1.test.js \
            dist/test/atlas-hybrid-router.test.js \
            dist/test/governor-convergence-v1.test.js
          npm test

          git config user.name "Sentient Engineering"
          git config user.email "sentient-engineering@users.noreply.github.com"
          git add src/application/production-collaboration.ts
          git diff --cached --check
          git commit -m "cognition: admit existing hybrid Spawn route for collaboration"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "SUCCESSOR_SHA=$new_sha"
          echo "SUCCESSOR_TREE=$new_tree"
          echo "DEPLOYMENT_PERFORMED=false"
