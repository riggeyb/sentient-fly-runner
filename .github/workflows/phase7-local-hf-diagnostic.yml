name: Phase7 Local HF Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Diagnose exact live Phase7 local HF feature extractor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          APP=sentient-validation-runner
          curl -fsS "https://${APP}.fly.dev/readyz" >/tmp/ready.json
          jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/ready.json >/dev/null
          cat >/tmp/diag.mjs <<'NODE'
          import { TransformersJsPhase7FeatureExtractorV1 } from "./dist/src/phase7/local-hf-feature-head.js";
          const extractor=new TransformersJsPhase7FeatureExtractorV1();
          try {
            const rows=await extractor.embed(["positive healthy fixed result","negative broken failed result"]);
            if(rows.length!==2||!rows[0]?.length) throw new Error("phase7_feature_embedding_empty");
            console.log(`PHASE7_LOCAL_HF_DIAGNOSTIC=PASS dimension=${rows[0].length}`);
          } catch (error) {
            const message=error instanceof Error?error.message:String(error);
            console.log("PHASE7_LOCAL_HF_DIAGNOSTIC=FAIL");
            console.log("PHASE7_LOCAL_HF_ERROR="+message.replace(/[\r\n]+/g," ").slice(0,500));
            process.exitCode=1;
          } finally {
            await extractor.close().catch(()=>undefined);
          }
          NODE
          B64="$(base64 -w0 /tmp/diag.mjs)"
          flyctl ssh console -a "$APP" -s -C "sh -lc 'cd /app && echo $B64 | base64 -d >/app/phase7-hf-diag.mjs && node /app/phase7-hf-diag.mjs; rc=\$?; rm -f /app/phase7-hf-diag.mjs; exit \$rc'"
          echo "SECRET_VALUES_EXPOSED=false"
