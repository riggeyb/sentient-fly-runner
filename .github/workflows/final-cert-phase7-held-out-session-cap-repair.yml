name: Final Cert Phase7 Held-Out Session Cap Repair
"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: final-cert-phase7-single-source-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BRANCH: sentient-production-composition-20261017
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact head and apply scoped source regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"
          curl -fsSL https://raw.githubusercontent.com/riggeyb/sentient-fly-runner/7684c23da2d68859b661856d22f8dbec26adde1b/scripts/final-cert-phase7-held-out-repair.py -o /tmp/repair.py
          python3 -m py_compile /tmp/repair.py
          python3 /tmp/repair.py
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx 'src/phase7/production-lineage.ts'
          printf '%s\n' "$changed" | grep -Fx 'src/application/production-model-improvement.ts'
          printf '%s\n' "$changed" | grep -Fx 'test/final-cert-phase7-held-out-robustness.test.ts'
      - name: Build and Phase7 targeted regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --test             dist/test/final-cert-phase7-held-out-robustness.test.js             dist/test/phase7-model-improvement.test.js
          git diff --check
      - name: Commit and push only tested exact repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"
          git config user.name sentient-final-cert-convergence
          git config user.email sentient-final-cert-convergence@users.noreply.github.com
          git add src/phase7/production-lineage.ts src/application/production-model-improvement.ts test/final-cert-phase7-held-out-robustness.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_REPAIR_CHANGE; exit 1; }
          git commit -m "fix: scope verified Phase7 held-out selection before bounded label-aware cap"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo "PRIOR_SHA=$EXPECTED_SHA"
          echo "NEW_SHA=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "PHASE7_HELD_OUT_SELECTION_ROBUSTNESS_REPAIR=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
