name: Sentient V4 Transparent Diagnostic V3
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read Fly machine state only
        shell: bash
        run: |
          set -euo pipefail
          flyctl machines list -a "$APP" --json | jq '[.[] | {id,state,region,image,created_at,updated_at}]'
          flyctl status -a "$APP" || true
          echo READ_ONLY_FLY_STATE=PASS
