name: Sentient V4 Transparent Diagnostic V3
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      MACHINE_ID: 8469e7b243d558
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Restore existing machine after failed restart transport
        shell: bash
        run: |
          set -euo pipefail
          before="$(flyctl machines list -a "$APP" --json)"
          test "$(jq -r --arg id "$MACHINE_ID" '.[]|select(.id==$id)|.state' <<<"$before")" = "stopped"
          test "$(jq -r 'length' <<<"$before")" = "1"
          flyctl machine start "$MACHINE_ID" -a "$APP"
          for _ in $(seq 1 120); do
            r="$(curl -fsS --max-time 5 "https://${APP}.fly.dev/readyz" || true)"
            if jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' >/dev/null 2>&1 <<<"$r"; then
              after="$(flyctl machines list -a "$APP" --json)"
              test "$(jq -r 'length' <<<"$after")" = "1"
              echo EXISTING_MACHINE_RESTORED=PASS
              echo EXACT_RUNTIME_READY=PASS
              echo NEW_FLY_MACHINE=false
              echo FLY_RESOURCE_ENVELOPE_CHANGED=false
              exit 0
            fi
            sleep 2
          done
          exit 1
