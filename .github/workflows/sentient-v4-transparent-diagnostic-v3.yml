name: Sentient V4 Transparent Diagnostic V3
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Chunk exact Director lock receipt
        shell: bash
        run: |
          set -euo pipefail
          src="receipts/director-studio/package-lock-3d9b0735.json"
          test -f "$src"
          ! grep -Fq '@clerk/nextjs' "$src"
          dir="receipts/director-studio/package-lock-3d9b0735.b64.parts"
          rm -rf "$dir"
          mkdir -p "$dir"
          base64 -w0 "$src" | split -b 20000 -d -a 3 - "$dir/part-"
          sha256sum "$src" > receipts/director-studio/package-lock-3d9b0735.sha256
          wc -c "$src" > receipts/director-studio/package-lock-3d9b0735.bytes
          git config user.name "sentient-proof-runner"
          git config user.email "sentient-proof-runner@users.noreply.github.com"
          git add "$dir" receipts/director-studio/package-lock-3d9b0735.sha256 receipts/director-studio/package-lock-3d9b0735.bytes
          git commit -m "proof: chunk Director lock receipt"
          git push origin HEAD:main
          echo "DIRECTOR_LOCK_CHECKSUM=$(cat receipts/director-studio/package-lock-3d9b0735.sha256)"
          echo "DIRECTOR_LOCK_CHUNKS=$(find "$dir" -type f | wc -l | tr -d ' ')"
          echo "CLERK_DEPENDENCY_PRESENT=false"
          echo "DIRECTOR_LOCK_CHUNK_TRANSPORT=PASS"
