name: Governor Skills Approval Readonly Diagnostic V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-deployment-governor
      CANDIDATE_SKILLS_SHA: b3df9b32b47370a7140d6fe814eeba97564663ab
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect Governor approval metadata without mutation
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          id="$(printf '%s' "$machines" | jq -r '.[0].id')"
          state="$(printf '%s' "$machines" | jq -r '.[0].state')"
          test -n "$id"
          if [ "$state" != "started" ]; then flyctl machine start "$id" -a "$APP" >/dev/null; fi
          for _ in $(seq 1 45); do
            state="$(flyctl machines list -a "$APP" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          cat >/tmp/approval-probe.mjs <<'NODE'
          import pg from "pg";
          const cs=String(process.env.SENTIENT_DATABASE_BOOTSTRAP_URL??process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??"").trim();
          const candidate=String(process.env.CANDIDATE_SKILLS_SHA??"").trim();
          if(!cs||!/^[0-9a-f]{40}$/.test(candidate)) process.exit(30);
          const pool=new pg.Pool({connectionString:cs,max:1,connectionTimeoutMillis:10000});
          const safeName=(s)=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(s);
          try{
            const meta=await pool.query(`
              SELECT table_schema, table_name, column_name, data_type
              FROM information_schema.columns
              WHERE table_schema NOT IN ('pg_catalog','information_schema')
                AND (
                  lower(table_name) LIKE '%skill%'
                  OR lower(table_name) LIKE '%approv%'
                  OR lower(table_name) LIKE '%revision%'
                  OR lower(column_name) LIKE '%skill%'
                  OR lower(column_name) LIKE '%approv%'
                  OR lower(column_name) LIKE '%revision%'
                )
              ORDER BY table_schema, table_name, ordinal_position
            `);
            const grouped=new Map();
            for(const r of meta.rows){
              const key=`${r.table_schema}.${r.table_name}`;
              if(!grouped.has(key)) grouped.set(key,[]);
              grouped.get(key).push(r.column_name);
            }
            console.log("POLICY_METADATA="+JSON.stringify(meta.rows));
            let candidateObserved=false;
            for(const [key,cols] of grouped){
              const [schema,table]=key.split(".");
              if(!safeName(schema)||!safeName(table)) continue;
              const selected=cols.filter(c =>
                safeName(c)
                && /(sha|revision|approved|enabled|active|status|created|updated)/i.test(c)
                && !/(token|secret|password|credential|url|email)/i.test(c)
              );
              if(!selected.length) continue;
              const quoted=selected.map(c=>`"${c}"`).join(",");
              const q=`SELECT ${quoted} FROM "${schema}"."${table}" ORDER BY 1 NULLS LAST LIMIT 50`;
              let rows=[];
              try { rows=(await pool.query(q)).rows; } catch { continue; }
              for(const row of rows){
                for(const v of Object.values(row)){
                  if(typeof v==="string" && v===candidate) candidateObserved=true;
                }
              }
              console.log("POLICY_ROWS="+JSON.stringify({table:key,columns:selected,rows}));
            }
            console.log(`CANDIDATE_SKILLS_SHA=${candidate}`);
            console.log(`CANDIDATE_PRESENT_IN_DISCOVERED_POLICY_ROWS=${candidateObserved}`);
            console.log("POLICY_MUTATION=false");
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await pool.end(); }
          NODE
          b64="$(base64 -w0 /tmp/approval-probe.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $b64 | base64 -d >/tmp/approval-probe.mjs && CANDIDATE_SKILLS_SHA=$CANDIDATE_SKILLS_SHA node /tmp/approval-probe.mjs; rc=\$?; rm -f /tmp/approval-probe.mjs; exit \$rc'"
