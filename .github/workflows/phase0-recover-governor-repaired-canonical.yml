name: Phase0 Recover Governor From Repaired Canonical
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase0-recover-governor-repaired-canonical
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 5d642c9e337e99639a4af8640249cc8f27595764
      TARGGET_TREE: 5a895ad4403792dfd64f004f392dd55ce7c1b63
      RECOVERY_POLICY_REVISION: SENTIENT_GOVERNOR_RECOVERY_V1
      GOVERNOR_APP: sentient-deployment-governor
      RECOVERY_APP: sentient-governor-recovery-root
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 5d642c9e337e99639a4af8640249cc8f27595764
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fence exact repaired canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          echo "CANONICAL_FENCE=PASS"
      - name: Transfer schema-scoped Governor DB authority internally
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$GOVERNOR_APP" --json)"
          id="$(printf '%s' "$machines" | jq -r '.[0].id')"
          state="$(printf '%s' "$machines" | jq -r '.[0].state')"
          test -n "$id"
          if [ "$state" != "started" ]; then
            flyctl machine start "$id" -a "$GOVERNOR_APP" >/dev/null
          fi
          for _ in $(seq 1 60); do
            state="$(flyctl machines list -a "$GOVERNOR_APP" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          DB="$(
            flyctl ssh console -a "$GOVERNOR_APP" -C \
              "node -e 'const v=String(process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??\"\").trim();if(!v)process.exit(2);process.stdout.write(v)'" \
              2>/dev/null
          )"
          test -n "$DB"
          echo "::add-mask::$DB"
          printf 'SENTIENT_DATABASE_BOOTSTRAP_URL=%s\n' "$DB" | flyctl secrets import -a "$RECOVERY_APP" --stage >/dev/null
          unset DB
          echo "RECOVERY_DATABASE_AUTHORITY=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
      - name: Deploy repaired exact recovery root
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          flyctl deploy \
            --app "$RECOVERY_APP" \
            --config fly.recovery.toml \
            --remote-only \
            --yes \
            --ha=false
          echo "RECOVERY_ROOT_EXACT_SOURCE_DEPLOY=PASS"
      - name: Verify recovery root health
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for _ in $(seq 1 120); do
            code="$(curl -sS --max-time 5 -o /tmp/recovery-health.json -w '%{http_code}' "https://${RECOVERY_APP}.fly.dev/healthz" || true)"
            if [ "$code" = "200" ] && jq -e --arg rev "$RECOVERY_POLICY_REVISION" \
              '.status=="ok" and .role=="INDEPENDENT_FLY_GOVERNOR_RECOVERY_ROOT" and .recoveryPolicyRevision==$rev and .oldGovernorRequired==false and .netlifyRequired==false and .githubActionsRequiredForRecoveryDesign==false' \
              /tmp/recovery-health.json >/dev/null; then
              ok=true
              break
            fi
            sleep 2
          done
          test "$ok" = "true"
          echo "RECOVERY_ROOT_FLY_NATIVE=PASS"
      - name: Invoke exact Governor recovery from inside recovery root
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          cat >/tmp/recover-request.mjs <<'NODE'
          const sha=process.env.TARGET_SHA;
          const tree=process.env.TARGET_TREE;
          const rev=process.env.RECOVERY_POLICY_REVISION;
          const token=String(process.env.SENTIENT_GOVERNOR_RECOVERY_API_TOKEN??"").trim();
          if(!token) process.exit(20);
          const r=await fetch("http://127.0.0.1:8080/v1/recovery/governor",{
            method:"POST",
            headers:{authorization:"Bearer "+token,"content-type":"application/json"},
            body:JSON.stringify({repository:"riggeyb/sentient",sha,tree,recoveryPolicyRevision:rev}),
            signal:AbortSignal.timeout(1100000)
          });
          const v=await r.json().catch(()=>({}));
          const safe={
            httpStatus:r.status,
            recoveryId:v.recoveryId??null,
            requestedSha:v.requestedSha??null,
            requestedTree:v.requestedTree??null,
            observedSha:v.observedSha??null,
            observedTree:v.observedTree??null,
            recoveryPolicyRevision:v.recoveryPolicyRevision??null,
            machineIds:Array.isArray(v.machineIds)?v.machineIds:[],
            deploymentId:v.deploymentId??null,
            status:v.status??null,
            errorCode:v.errorCode??null
          };
          console.log(JSON.stringify(safe));
          if(!r.ok||v.status!=="PASS"||v.requestedSha!==sha||v.requestedTree!==tree||v.observedSha!==sha||v.observedTree!==tree||v.recoveryPolicyRevision!==rev||!Array.isArray(v.machineIds)||v.machineIds.length===0) process.exit(21);
          NODE
          script_b64="$(base64 -w0 /tmp/recover-request.mjs)"
          set +e
          flyctl ssh console -a "$RECOVERY_APP" -C \
            "sh -lc 'echo $script_b64 | base64 -d >/tmp/recover-request.mjs && TARGET_SHA=$TARGET_SHA TARGET_TREE=$TARGET_TREE RECOVERY_POLICY_REVISION=$RECOVERY_POLICY_REVISION node /tmp/recover-request.mjs'" \
            > /tmp/recovery-receipt.json
          rc=$?
          set -e
          cat /tmp/recovery-receipt.json
          test "$rc" -eq 0
          echo "GOVERNOR_RECOVERY_REQUEST=PASS"
          echo "EXACT_SOURCE_RECOVERY=PASS"
          echo "RECOVERY_RECEIPT=PASS"
      - name: Verify recovered Governor live identity
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$GOVERNOR_APP" --json)"
          id="$(printf '%s' "$machines" | jq -r '.[0].id')"
          state="$(printf '%s' "$machines" | jq -r '.[0].state')"
          test -n "$id"
          if [ "$state" != "started" ]; then
            flyctl machine start "$id" -a "$GOVERNOR_APP" >/dev/null
          fi
          cat >/tmp/verify-governor.mjs <<'NODE'
          let r;
          for(let i=0;i<90;i++){
            try{
              r=await fetch("http://127.0.0.1:8080/healthz",{signal:AbortSignal.timeout(5000)});
              if(r.ok) break;
            }catch{}
            await new Promise(x=>setTimeout(x,2000));
          }
          if(!r||!r.ok) process.exit(30);
          const v=await r.json();
          console.log(JSON.stringify({status:v.status,role:v.role,governorSha:v.governorSha,governorTree:v.governorTree,recoveryPolicyRevision:v.recoveryPolicyRevision}));
          if(v.status!=="ok"||v.governorSha!==process.env.TARGET_SHA||v.governorTree!==process.env.TARGET_TREE||v.recoveryPolicyRevision!==process.env.RECOVERY_POLICY_REVISION) process.exit(31);
          NODE
          script_b64="$(base64 -w0 /tmp/verify-governor.mjs)"
          flyctl ssh console -a "$GOVERNOR_APP" -C \
            "sh -lc 'echo $script_b64 | base64 -d >/tmp/verify-governor.mjs && TARGET_SHA=$TARGET_SHA TARGET_TREE=$TARGET_TREE RECOVERY_POLICY_REVISION=$RECOVERY_POLICY_REVISION node /tmp/verify-governor.mjs'"
          echo "GOVERNOR_IDENTITY_LIVE=PASS"
          echo "RECOVERED_GOVERNOR_IDENTITY=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
