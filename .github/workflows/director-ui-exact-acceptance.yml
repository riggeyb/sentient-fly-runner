name: Director UI exact acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      CF_ACCESS_TEAM_DOMAIN: https://x.invalid
      CF_ACCESS_POLICY_AUD: x
      DIRECTOR_SENTIENT_BASE_URL: https://x.invalid
      DIRECTOR_SENTIENT_TOKEN: x
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          test "$(git rev-parse HEAD)" = 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
          test "$(git rev-parse 'HEAD^{tree}')" = 2707935c55452e67e31428c26a669a03802daae7
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run check:vinext
          npm run build:vinext
          npx wrangler deploy --dry-run
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain)"
          echo DIRECTOR_UI_ACCEPTANCE=PASS
          echo PRODUCTION_DEPLOYMENT=false
