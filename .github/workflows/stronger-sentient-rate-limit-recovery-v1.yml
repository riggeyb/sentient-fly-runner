name: Stronger Sentient Rate Limit Recovery v1

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stronger-sentient-rate-limit-recovery-v1
  cancel-in-progress: false

env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build exact baseline
        working-directory: sentient
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Repair checked-out measurement harness only
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#"\./sentient/dist/src/index.js"#"../sentient/dist/src/index.js"#' scripts/stronger-sentient-rate-limit-recovery-v1.mjs
          sed -i 's/try{M=/try{m=/' scripts/stronger-sentient-rate-limit-recovery-v1.mjs
          node --check scripts/stronger-sentient-rate-limit-recovery-v1.mjs
      - name: Run bounded recovery characterization
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          EXPERIMENT_OUT: ${{ runner.temp }}/stronger-sentient-rate-limit-recovery-v1.json
        run: node scripts/stronger-sentient-rate-limit-recovery-v1.mjs

      - name: Verify baseline immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          git -C sentient diff --exit-code
          git -C sentient diff --cached --exit-code
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"

      - uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-rate-limit-recovery-v1
          path: ${{ runner.temp }}/stronger-sentient-rate-limit-recovery-v1.json
          retention-days: 14

      - name: Guard
        run: |
          echo "MAX_PROVIDER_CALLS=24"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "PRODUCTION_CONFIGURATION_CHANGE=false"
          echo "PRODUCTION_DATABASE_MIGRATION=false"
