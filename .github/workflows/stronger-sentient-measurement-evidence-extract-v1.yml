name: Stronger Sentient Measurement Evidence Extract v1

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed measurement run ID"
        required: true
        type: string
      artifact_name:
        description: "Measurement artifact name"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Persist existing measurement artifact as durable evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir evidence
          file="evidence/stronger-sentient-measurement.json"
          test -f "$file"
          path="measurement-evidence/stronger-sentient-v2-run-${RUN_ID}.json"
          encoded="$(base64 -w0 "$file")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path"             -f message="measure: persist Stronger Sentient v2 evidence run $RUN_ID"             -f content="$encoded"             -f branch=main >/dev/null
          echo "EVIDENCE_EXTRACTION_PROVIDER_CALLS=0"
          echo "EVIDENCE_PATH=$path"
          echo "PRODUCTION_DEPLOYMENT=false"
