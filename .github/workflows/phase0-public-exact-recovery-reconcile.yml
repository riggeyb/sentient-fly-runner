name: Phase 0 Public Exact Recovery Reconciliation
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-public-exact-recovery-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
      TARGET_SHA: 562174af336feaf20abdf44d069abb45db1c799b
      TARGET_TREE: 6cb7159c28e935fe81c5bf20f49c8d9307b4bfff
      TARGET_BRANCH: sentient-production-composition-20261017
      RECOVERY_POLICY_REVISION: SENTIENT_GOVERNOR_RECOVERY_V1
      SKILLS_SHA: d85eb820f18ad6d944ab93b03150d606273891a5
      SENTIENT_APP: sentient-validation-runner
      GOVERNOR_APP: sentient-deployment-governor
      RECOVERY_APP: sentient-governor-recovery-root
      SENTIENT_MACHINE_ID: 8469e7b243d558
      FLY_ORG: personal
    steps:
      - name: Checkout exact canonical Sentient source
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 562174af336feaf20abdf44d069abb45db1c799b
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: sentient

      - name: Fence exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          observed_sha="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$observed_sha" = "$TARGET_SHA"
          test "$observed_tree" = "$TARGET_TREE"
          echo "CANONICAL_FENCE_SHA=PASS"
          echo "CANONICAL_FENCE_TREE=PASS"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure exact existing Sentient machine is running for database handoff
        shell: bash
        run: |
          set -euo pipefail
          state="$(flyctl machines list -a "$SENTIENT_APP" --json | jq -r --arg id "$SENTIENT_MACHINE_ID" '.[] | select(.id==$id) | .state')"
          test -n "$state"
          if [ "$state" != "started" ]; then
            flyctl machine start "$SENTIENT_MACHINE_ID" -a "$SENTIENT_APP" >/dev/null
          fi
          for _ in $(seq 1 60); do
            state="$(flyctl machines list -a "$SENTIENT_APP" --json | jq -r --arg id "$SENTIENT_MACHINE_ID" '.[] | select(.id==$id) | .state')"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          echo "SENTIENT_DATABASE_SOURCE_MACHINE_READY=PASS"

      - name: Create recovery app and provision separated recovery authorities
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          test -n "${SENTIENT_SOURCE_GITHUB_TOKEN:-}"

          if ! flyctl apps list --json | jq -e --arg app "$RECOVERY_APP" 'any(.[]; ((.Name // .name // "") == $app))' >/dev/null; then
            flyctl apps create "$RECOVERY_APP" --org "$FLY_ORG" >/dev/null
            echo "RECOVERY_ROOT_APP_CREATED=PASS"
          else
            echo "RECOVERY_ROOT_APP_CREATED=ALREADY_PRESENT"
          fi

          RECOVERY_API_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$RECOVERY_API_TOKEN"

          flyctl tokens debug -t "$FLY_API_TOKEN" > /tmp/fly-token-debug.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const value=JSON.parse(fs.readFileSync("/tmp/fly-token-debug.json","utf8"));
          let id=null;
          const visit=(v)=>{
            if(id!==null||v===null||typeof v!=="object") return;
            if(!Array.isArray(v) && v.type==="Organization" && v.body && (typeof v.body.id==="number"||typeof v.body.id==="string")) {
              id=String(v.body.id);
              return;
            }
            for(const x of (Array.isArray(v)?v:Object.values(v))) visit(x);
          };
          visit(value);
          if(!id || !/^\d+$/.test(id)) process.exit(2);
          fs.writeFileSync("/tmp/recovery-caveats.json",JSON.stringify([{type:"Organization",body:{id:Number(id),mask:"rwcdC"}}]));
          NODE

          raw_recovery_token="$(flyctl tokens attenuate -t "$FLY_API_TOKEN" -f /tmp/recovery-caveats.json)"
          RECOVERY_FLY_TOKEN="$(printf '%s\n' "$raw_recovery_token" | awk 'NF{v=$NF} END{print v}')"
          test -n "$RECOVERY_FLY_TOKEN"
          echo "::add-mask::$RECOVERY_FLY_TOKEN"

          FLY_API_TOKEN="$RECOVERY_FLY_TOKEN" flyctl status -a "$GOVERNOR_APP" >/dev/null
          echo "RECOVERY_FLY_AUTHORITY_DERIVED=PASS"

          flyctl secrets set -a "$RECOVERY_APP" --stage \
            SENTIENT_GOVERNOR_RECOVERY_API_TOKEN="$RECOVERY_API_TOKEN" \
            SENTIENT_GOVERNOR_RECOVERY_FLY_TOKEN="$RECOVERY_FLY_TOKEN" \
            SENTIENT_SOURCE_GITHUB_TOKEN="$SENTIENT_SOURCE_GITHUB_TOKEN" >/dev/null

          flyctl ssh console -a "$SENTIENT_APP" -C \
            'node -e '"'"'const v=String(process.env.DATABASE_URL??"").trim(); if(!v) process.exit(2); process.stdout.write("SENTIENT_DATABASE_BOOTSTRAP_URL="+v+"\n");'"'"'' \
            2>/tmp/sentient-db-handoff.err \
            | tail -n 1 \
            | flyctl secrets import -a "$RECOVERY_APP" --stage >/dev/null

          flyctl secrets set -a "$SENTIENT_APP" --stage \
            SENTIENT_GOVERNOR_RECOVERY_API_TOKEN="$RECOVERY_API_TOKEN" >/dev/null

          printf '%s' "$RECOVERY_API_TOKEN" > /tmp/recovery-api-token
          chmod 600 /tmp/recovery-api-token
          echo "RECOVERY_ROOT_SECRETS_STAGED=PASS"
          echo "SENTIENT_RECOVERY_CLIENT_SECRET_STAGED=PASS"
          echo "SECRET_VALUES_EXPOSED=false"

      - name: Deploy recovery root from exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          flyctl deploy \
            --app "$RECOVERY_APP" \
            --config fly.recovery.toml \
            --remote-only \
            --yes \
            --ha=false
          echo "RECOVERY_ROOT_EXACT_SOURCE_DEPLOY=PASS"

      - name: Verify recovery root health and invoke exact Governor recovery
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_API_TOKEN="$(cat /tmp/recovery-api-token)"
          echo "::add-mask::$RECOVERY_API_TOKEN"

          healthy=false
          for _ in $(seq 1 120); do
            code="$(curl -sS --max-time 5 -o /tmp/recovery-health.json -w '%{http_code}' "https://${RECOVERY_APP}.fly.dev/healthz" || true)"
            if [ "$code" = "200" ] \
              && jq -e --arg rev "$RECOVERY_POLICY_REVISION" '.status=="ok" and .role=="INDEPENDENT_FLY_GOVERNOR_RECOVERY_ROOT" and .recoveryPolicyRevision==$rev and .oldGovernorRequired==false and .netlifyRequired==fals`and .githubActionsRequiredForRecoveryDesign==false' /tmp/recovery-health.json >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = "true"
          echo "RECOVERY_ROOT_FLY_NATIVE=PASS"

          cat > /tmp/recovery-request.json <<JSON
          {"repository":"riggeyb/sentient","sha":"$TARGET_SHA","tree":"$TARGET_TREE","recoveryPolicyRevision":"$RECOVERY_POLICY_REVISION"}
          JSON

          http="$(curl -sS --max-time 1100 \
            -o /tmp/recovery-receipt.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $RECOVERY_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/recovery-request.json \
            "https://${RECOVERY_APP}.fly.dev/v1/recovery/governor" || true)"
          jq '{contract,recoveryId,repository,targetApp,requestedSha,requestedTree,observedSha,observedTree,recoveryPolicyRevision,machineIds,deploymentId,status,errorCode,startedAt,completedAt}' /tmp/recovery-receipt.json
          test "$http" = "200"
          jq -e --arg sha "$TARGET_SHA" --arg tree "$TARGET_TREE" --arg rev "$RECOVERY_POLICY_REVISION" \
            '.status=="PASS" and .requestedSha==$sha and .requestedTree==$tree and .observedSha==$sha and .observedTree==$tree and .recoveryPolicyRevision==$rev and (.machineIds|length)>0' \
            /tmp/recovery-receipt.json >/dev/null
          echo "GOVERNOR_RECOVERY_REQUEST=PASS"
          echo "EXACT_SOURCE_RECOVERY=PASS"
          echo "RECOVERY_RECEIPT=PASS"

      - name: Verify recovered Governor live identity
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$GOVERNOR_APP" --json)"
          id="$(printf '%s' "$machines" | jq -r '.[0].id')"
          state="$(printf '%s' "$machines" | jq -r '.[0].state')"
          test -n "$id"
          if [ "$state" != "started" ]; then
            flyctl machine start "$id" -a "$GOVERNOR_APP" >/dev/null
          fi
          for _ in $(seq 1 90); do
            state="$(flyctl machines list -a "$GOVERNOR_APP" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state')"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"

          flyctl ssh console -a "$GOVERNOR_APP" -C \
            'node -e '"'"'fetch("http://127.0.0.1:8080/healthz").then(async r=>{const v=await r.json(); console.log(JSON.stringify({statusCode:r.status,status:v.status,governorSha:v.governorSha,governorTree:v.governorTree,recoveryPolicyRevision:v.recoveryPolicyRevision})); if(r.status!==200)process.exit(2)}).catch(()=>process.exit(3))' ""'' \
            > /tmp/governor-health.json
          tail -n 1 /tmp/governor-health.json > /tmp/governor-health-last.json
          cat /tmp/governor-health-last.json
          jq -e --arg sha "$TARGET_SHA" --arg tree "$TARGET_TREE" --arg rev "$RECOVERY_POLICY_REVISION" \
            '.statusCode==200 and .status=="ok" and .governorSha==$sha and .governorTree==$tree and .recoveryPolicyRevision==$rev' \
            /tmp/governor-health-last.json >/dev/null
          echo "GOVERNOR_IDENTITY_LIVE=PASS"
          echo "RECOVERED_GOVERNOR_IDENTITY=PASS"

      - name: Request exact Sentient deployment through recovered Governor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/governor-rollout.mjs <<'NODE'
          const sha="562174af336feaf20abdf44d069abb45db1c799b";
          const tree="6cb7159c28e935fe81c5bf20f49c8d9307b4bfff";
          const skillsSha="d85eb820f18ad6d944ab93b03150d606273891a5";
          const token=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN??"").trim();
          if(!token){console.log(JSON.stringify({error:"deployment_api_token_missing"}));process.exit(31)}
          let r;
          try {
            r=await fetch("http://127.0.0.1:8080/v1/deployments/sentient",{
              method:"POST",
              headers:{
                authorization:"Bearer "+token,
                "content-type":"application/json",
                "x-sentient-objective-id":"phase0-certification-reconciliation-public"
              },
              body:JSON.stringify({sha,tree,skillsSha}),
              signal:AbortSignal.timeout(900000)
            });
          } catch {
            console.log(JSON.stringify({error:"governor_rollout_transport_failed"}));
            process.exit(32);
          }
          const text=await r.text();
          let v={}; try{v=JSON.parse(text)}catch{}
          const safe={
            statusCode:r.status,
            DEPLOYMENT_ID:v.DEPLOYMENT_ID??null,
            REQUESTED_SHA:v.REQUESTED_SHA??null,
            REQUESTED_TREE:v.REQUESTED_TREE??null,
            BUILD_RESULTO:v.BUILD_RESULT??null,
            DEPLOYED_SHA:v.DEPLOYED_SHA??null,
            DEPLOYED_TREE:v.DEPLOYED_TREE??null,
            READYZ_FAILURE:v.READYZ_FAILURE??null,
            RESOURCE_CHANGE_STATUS:v.RESOURCE_CHANGE_STATUS??null
          };
          console.log(JSON.stringify(safe));
          if(!r.ok || v.BUILD_RESULT!=="SUCCEEDED" || v.DEPLOYED_SHA!==sha || v.DEPLOYED_TREE!==tree || v.READYZ_FAILURE!==null) process.exit(33);
          NODE
          rollout_b64="$(base64 -w0 /tmp/governor-rollout.mjs)"
          set +e
          flyctl ssh console -a "$GOVERNOR_APP" -C \
            "sh -lc 'echo $rollout_b64 | base64 -d > /tmp/governor-rollout.mjs && node /tmp/governor-rollout.mjs'" \
            > /tmp/governor-rollout.out
          rc=$?
          set -e
          tail -n 1 /tmp/governor-rollout.out > /tmp/governor-rollout.json
          cat /tmp/governor-rollout.json
          test "$rc" -eq 0
          jq -e --arg sha "$TARGET_SHA" --arg tree "$TARGET_TREE" \
            '.statusCode==200 and .BUILD_RESULT=="SUCCEEDED" and .DEPLOYED_SHA==$sha and .DEPLOYED_TREE==$tree and .READYZ_FAILURE==null' \
            /tmp/governor-rollout.json >/dev/null
          echo "DEPLOY_REQUEST=PASS"
          echo "DEPLOY_EXACT_SHA=PASS"
          echo "DEPLOY_EXACT_TREE=PASS"

      - name: Independently verify live Sentient exact identity
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for _ in $(seq 1 180); do
            health_code="$(curl -sS --max-time 5 -o /tmp/sentient-health.json -w '%{http_code}' "https://${SENTIENT_APP}.fly.dev/healthz" || true)"
            ready_code="$(curl -sS --max-time 5 -o /tmp/sentient-ready.json -w '%{http_code}' "https://${SENTIENT_APP}.fly.dev/readyz" || true)"
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ] \
              && grep -Fq "$TARGET_SHA" /tmp/sentient-health.json \
              && grep -Fq "$TARGET_TREE" /tmp/sentient-health.json \
              && grep -Fq "$TARGET_SHA" /tmp/sentient-ready.json \
              && grep -Fq "$TARGET_TREE" /tmp/sentient-ready.json; then
              matched=true
              break
            fi
            sleep 2
          done
          test "$matched" = "true"
          echo "RUNTIME_SHA=$TARGET_SHA"
          echo "RUNTIME_TREE=$TARGET_TREE"
          echo "RUNTIME_SHA_MATCH=PASS"
          echo "RUNTIME_TREE_MATCH=PASS"
          echo "CERTIFICATION_TARGET_SHA=$TARGET_SHA"
          echo "CERTIFICATION_TARGET_TREE=$TARGET_TREE"
          echo "CERTIFICATION_TARGET_READY_TO_FREEZE=true"
          echo "SECRET_VALUES_EXPOSED=false"
