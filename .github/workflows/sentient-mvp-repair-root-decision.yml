name: Normalize Sentient MVP dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-mission-control-integration-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence, normalize, and push package lock only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "34d81fd3890ca662705ea33775983e73ab1a77e3"
          test "$(git rev-parse 'HEAD^{tree}')" = "10a9012c0817d6d70b16673298db834cf0f4a5d1"
          npm install --no-audit --no-fund
          changed="$(git diff --name-only)"
          echo "TRACKED_DIFF=${changed//$'\n'/,}"
          test "$changed" = "package-lock.json"
          npm ci --no-audit --no-fund
          npm run build
          git diff --name-only | grep -qx 'package-lock.json'
          git config user.name sentient-mvp-activation
          git config user.email sentient-mvp-activation@users.noreply.github.com
          git add package-lock.json
          git commit -m "mvp: normalize Mission Control dependency lock"
          git push origin HEAD:sentient/mvp-mission-control-integration-v1
          echo "NORMALIZED_SHA=$(git rev-parse HEAD)"
          echo "NORMALIZED_TREE=$(git rev-parse 'HEAD^{tree}')"
