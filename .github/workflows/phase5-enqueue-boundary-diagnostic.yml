name: Sentient Phase 5 Enqueue Boundary Diagnostic
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify exact live identity and inspect collaborative enqueue response
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          ready="$(curl -fsS --max-time 10 https://sentient-validation-runner.fly.dev/readyz)"
          grep -Fq "$EXPECTED_SHA" <<<"$ready"
          grep -Fq "$EXPECTED_TREE" <<<"$ready"
          grep -Fq '"ready":true' <<<"$ready"
          echo "PHASE5_ENQUEUE_DIAG_IDENTITY=PASS"

          OBJ="phase5-enqueue-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat >/tmp/enqueue-diag.mjs <<'NODE'
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const objectiveId=String(process.env.PHASE5_DIAG_OBJECTIVE_ID??"").trim();
          if(!token||!objectiveId) throw new Error("PHASE5_DIAG_BINDING_MISSING");

          const started=Date.now();
          let response;
          try {
            response=await fetch("http://127.0.0.1:8080/v1/objectives",{
              method:"POST",
              headers:{
                authorization:`Bearer ${token}`,
                "content-type":"application/json",
                accept:"application/json"
              },
              body:JSON.stringify({
                request:"Independently analyze restart-safe durable collaboration, verify it, and converge under Sentient authority.",
                objectiveId,
                sessionId:`session-${objectiveId}`,
                mode:"collaborative",
                privacy:"public_fixture"
              }),
              signal:AbortSignal.timeout(120000)
            });
          } catch(error) {
            const clean=String(error?.message??error).replace(/[\r\n]/g," ").slice(0,500);
            console.log(`PHASE5_DIAG_POST_FETCH_ERROR=${String(error?.name??"Error")}:${clean}`);
            console.log(`PHASE5_DIAG_POST_ELAPSED_MS=${Date.now()-started}`);
            console.log(`PHASE5_DIAG_OBJECTIVE_ID=${objectiveId}`);
            console.log("SECRET_VALUES_EXPOSED=false");
            process.exit(2);
          }
          const elapsed=Date.now()-started;
          const raw=await response.text();
          let body={};
          try { body=JSON.parse(raw); } catch {}
          const clean=(value)=>typeof value==="string"?value.replace(/[\r\n]/g," ").slice(0,800):"none";
          console.log(`PHASE5_DIAG_POST_STATUS=${response.status}`);
          console.log(`PHASE5_DIAG_POST_ELAPSED_MS=${elapsed}`);
          console.log(`PHASE5_DIAG_POST_ERROR=${clean(body.error)}`);
          console.log(`PHASE5_DIAG_POST_REASON=${clean(body.reason)}`);
          console.log(`PHASE5_DIAG_OBJECTIVE_ID=${objectiveId}`);
          console.log("SECRET_VALUES_EXPOSED=false");
          if(response.status!==202) process.exit(3);
          NODE
          B64="$(base64 -w0 /tmp/enqueue-diag.mjs)"
          flyctl ssh console -a "$APP" -C \
            "sh -lc 'cd /app && echo $B64 | base64 -d >/tmp/enqueue-diag.mjs && PHASE5_DIAG_OBJECTIVE_ID=$OBJ node /tmp/enqueue-diag.mjs; rc=\$?; rm -f /tmp/enqueue-diag.mjs; exit \$rc'"
