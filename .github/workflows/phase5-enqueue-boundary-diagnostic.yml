name: Sentient Phase 5 Enqueue Boundary Diagnostic
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify exact live identity and inspect enqueue boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          ready="$(curl -fsS --max-time 10 https://sentient-validation-runner.fly.dev/readyz)"
          grep -Fq "$EXPECTED_SHA" <<<"$ready"
          grep -Fq "$EXPECTED_TREE" <<<"$ready"
          grep -Fq '"ready":true' <<<"$ready"
          echo "PHASE5_ENQUEUE_DIAG_IDENTITY=PASS"

          OBJ="phase5-enqueue-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat >/tmp/enqueue-diag.mjs <<'NODE'
          import { Pool } from "pg";
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const db=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          const objectiveId=String(process.env.PHASE5_DIAG_OBJECTIVE_ID??"").trim();
          if(!token||!db||!objectiveId) throw new Error("PHASE5_DIAG_BINDING_MISSING");
          const pool=new Pool({connectionString:db,max:1,connectionTimeoutMillis:10000});
          const state=async(label)=>{
            const row=(await pool.query(
              `SELECT generation::text AS generation,
                      pg_column_size(snapshot)::bigint::text AS bytes,
                      updated_at::text AS updated_at
                 FROM sentient_durable_state
                WHERE state_key='canonical'`
            )).rows[0]??{};
            let activity={total:null,waiting:null};
            try {
              activity=(await pool.query(
                `SELECT count(*)::int AS total,
                        count(*) FILTER (WHERE wait_event_type IS NOT NULL)::int AS waiting
                   FROM pg_stat_activity
                  WHERE datname=current_database()`
              )).rows[0]??activity;
            } catch {}
            console.log(`PHASE5_DIAG_${label}_GENERATION=${String(row.generation??"missing")}`);
            console.log(`PHASE5_DIAG_${label}_SNAPSHOT_BYTES=${String(row.bytes??"missing")}`);
            console.log(`PHASE5_DIAG_${label}_DB_CONNECTIONS=${String(activity.total??"unavailable")}`);
            console.log(`PHASE5_DIAG_${label}_DB_WAITING=${String(activity.waiting??"unavailable")}`);
          };
          await state("BEFORE");
          await pool.end();

          const started=Date.now();
          let response;
          try {
            response=await fetch("http://127.0.0.1:8080/v1/objectives",{
              method:"POST",
              headers:{
                authorization:`Bearer ${token}`,
                "content-type":"application/json",
                accept:"application/json"
              },
              body:JSON.stringify({
                request:"Return the exact text ENQUEUE_BOUNDARY_OK.",
                objectiveId,
                sessionId:`session-${objectiveId}`,
                mode:"ordinary",
                privacy:"public_fixture"
              }),
              signal:AbortSignal.timeout(30000)
            });
          } catch(error) {
            console.log(`PHASE5_DIAG_POST_FETCH_ERROR=${String(error?.name??"Error")}:${String(error?.message??error).replace(/[\r\n]/g," ").slice(0,300)}`);
            console.log(`PHASE5_DIAG_POST_ELAPSED_MS=${Date.now()-started}`);
            console.log("SECRET_VALUES_EXPOSED=false");
            process.exit(2);
          }
          const elapsed=Date.now()-started;
          const raw=await response.text();
          let body={};
          try { body=JSON.parse(raw); } catch {}
          const clean=(value)=>typeof value==="string"?value.replace(/[\r\n]/g," ").slice(0,500):"none";
          console.log(`PHASE5_DIAG_POST_STATUS=${response.status}`);
          console.log(`PHASE5_DIAG_POST_ELAPSED_MS=${elapsed}`);
          console.log(`PHASE5_DIAG_POST_ERROR=${clean(body.error)}`);
          console.log(`PHASE5_DIAG_POST_REASON=${clean(body.reason)}`);

          const afterPool=new Pool({connectionString:db,max:1,connectionTimeoutMillis:10000});
          const task=(await afterPool.query(
            `SELECT EXISTS(
               SELECT 1
                 FROM sentient_durable_state s,
                      jsonb_array_elements(s.snapshot->'records'->'tasks') AS task
                WHERE s.state_key='canonical'
                  AND task->>'id'=$1
             ) AS present`,
            [objectiveId]
          )).rows[0]??{};
          const row=(await afterPool.query(
            `SELECT generation::text AS generation,
                    pg_column_size(snapshot)::bigint::text AS bytes
               FROM sentient_durable_state
              WHERE state_key='canonical'`
          )).rows[0]??{};
          await afterPool.end();
          console.log(`PHASE5_DIAG_TASK_PRESENT=${String(task.present===true)}`);
          console.log(`PHASE5_DIAG_AFTER_GENERATION=${String(row.generation??"missing")}`);
          console.log(`PHASE5_DIAG_AFTER_SNAPSHOT_BYTES=${String(row.bytes??"missing")}`);
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          B64="$(base64 -w0 /tmp/enqueue-diag.mjs)"
          flyctl ssh console -a "$APP" -C \
            "sh -lc 'cd /app && echo $B64 | base64 -d >/app/enqueue-diag.mjs && PHASE5_DIAG_OBJECTIVE_ID=$OBJ node /app/enqueue-diag.mjs; rc=\$?; rm -f /app/enqueue-diag.mjs; exit \$rc'"
