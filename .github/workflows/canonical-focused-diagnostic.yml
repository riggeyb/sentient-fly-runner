name: Governor Approved Skills Runtime Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GOVERNOR_APP: sentient-deployment-governor
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect non-secret approval identity
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/diag.mjs <<'NODE'
          const keys=Object.keys(process.env).filter(k=>/SKILL|APPROV|REVISION|GOVERNOR/i.test(k)).sort();
          const safe={};
          for(const k of keys){
            const v=String(process.env[k]??"").trim();
            if(/sha|revision/i.test(k) && /^[0-9a-f]{40}$/i.test(v)) safe[k]=v;
            else safe[k]="PRESENT";
          }
          let health=null;
          try{
            const r=await fetch("http://127.0.0.1:8080/healthz",{signal:AbortSignal.timeout(5000)});
            const b=await r.json().catch(()=>({}));
            health={statusCode:r.status,status:b.status??null,governorSha:b.governorSha??null,governorTree:b.governorTree??null,recoveryPolicyRevision:b.recoveryPolicyRevision??null};
          }catch{health={statusCode:null,status:"unavailable"}}
          console.log("GOVERNOR_HEALTH_SAFE="+JSON.stringify(health));
          console.log("APPROVAL_ENV_SAFE="+JSON.stringify(safe));
          NODE
          b64="$(base64 -w0 /tmp/diag.mjs)"
          flyctl ssh console -a "$GOVERNOR_APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/diag.mjs; node /tmp/diag.mjs; status=\$?; rm -f /tmp/diag.mjs; exit \$status'"
          echo "SOURCE_MUTATION=false"
          echo "SECRET_VALUES_EXPOSED=false"
