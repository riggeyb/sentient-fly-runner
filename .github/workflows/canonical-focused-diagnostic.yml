name: Skills Mission Control Failure Isolation
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact skills candidate SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: hpostgres://postgres:postgres@localhost:5432/sentient
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fence exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install and migrate
        working-directory: sentient-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false >/dev/null
          npm run typecheck >/dev/null
          npm run migrate >/dev/null
      - name: Execute each test file independently
        working-directory: sentient-orchestrator
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          failed=0
          total=0
          for file in tests/**/*.test.ts; do
            total=$((total+1))
            out="${RUNNER_TEMP}/test-${total}.log"
            if npx tsx --test "$file" >"$out" 2>&1; then
              echo "PASS_FILE=$file"
            else
              code=$?
              echo "FAIL_FILE=$file"
              echo "FAIL_EXIT=$code"
              tail -n 80 "$out"
              failed=$((failed+1))
            fi
          done
          echo "TOTAL_TEST_FILES=$total"
          echo "FAILED_TEST_FILES=$failed"
          test "$failed" -eq 0
