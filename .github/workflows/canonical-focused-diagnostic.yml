name: Mission Control Exact Typecheck Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact Mission Control candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "d074b3170069b188fd71caf28c6ec11ef677f4ff"
          echo "SOURCE_SHA=${{ inputs.sha }}"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install orchestrator dependencies
        working-directory: sentient-orchestrator
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Typecheck exact candidate
        working-directory: sentient-orchestrator
        run: npm run typecheck
