name: Sentient Objective API Projection Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Locate objective endpoint and projection exposure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          echo OBJECTIVE_ENDPOINT_MATCHES_BEGIN
          grep -R -n -F '/v1/objectives' src test tests 2>/dev/null | head -n 80 || true
          echo OBJECTIVE_ENDPOINT_MATCHES_END
          echo MISSION_CONTROL_PROJECTION_MATCHES_BEGIN
          grep -R -n -E 'RootObjectiveProjection|activeSubOrchestrators|acceptedEvidence|rootProjection|missionControl' src 2>/dev/null | head -n 120 || true
          echo MISSION_CONTROL_PROJECTION_MATCHES_END
          echo SOURCE_MUTATION=false
