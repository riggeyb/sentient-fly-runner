name: Sentient Mission Control Boundary Repair
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Fence and repair only the observed typo
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -<<'PY'
          from pathlib import Path
          p = Path("src/spawn/context.ts")
          s = p.read_text()
          old = "!number.isInteger(taskPackage.identitySeed.depth)"
          new = "!Number.isInteger(taskPackage.identitySeed.depth)"
          if s.count(old) != 1:
              raise SystemExit(f"unexpected typo count={s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/spawn/context.ts
      - name: Install and build
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
      - name: Run Mission Control spawn acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --test dist/test/spawn-mission-control-context.test.js
          echo "MISSION_CONTROL_SPAWN_TESTS=PASS"
      - name: Verify canonical context identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { SENTIENT_OPERATING_CONTEXT_V1, sentientOperatingContextDigestV1 } from "./dist/src/spawn/operating-context.js";
          const d = await sentientOperatingContextDigestV1(SENTIENT_OPERATING_CONTEXT_V1);
          if (d !== "sha256:ef32887bbc1736dce2ed5a73a90a628160edede479bd686ce47cdf0f7507e209") throw new Error("operating context digest drift");
          console.log("OPERATING_CONTEXT_DIGEST="+d);
          NODE
      - name: Commit exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentient-mission-control-acceptance"
          git config user.email "sentient-mission-control-acceptance@users.noreply.github.com"
          git add src/spawn/context.ts
          git diff --cached --quit && { echo "NO_REPAIR_CHANGE"; exit 1; }
          git commit -m "mission-control: fix child package depth validation"
          git push origin HEAD:sentient/mission-control-v1
          echo "REPAIR_PUSHED=true"
