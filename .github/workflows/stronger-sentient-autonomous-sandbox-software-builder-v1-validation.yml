name: Stronger Sentient Autonomous Sandbox Software Builder V1 Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      parent_sha:
        required: true
        type: string
      parent_tree:
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.sha }}
  CANDIDATE_TREE: ${{ inputs.tree }}
  PARENT_SHA: ${{ inputs.parent_sha }}
  PARENT_TREE: ${{ inputs.parent_tree }}
  SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and fence scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SENTIENT_SOURCE_GITHUB_TOKEN"
          auth="$(printf 'x-access-token:%s' "$SENTIENT_SOURCE_GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout https://github.com/riggeyb/sentient.git sentient
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$CANDIDATE_SHA" "$PARENT_SHA"
          git -C sentient checkout --detach "$CANDIDATE_SHA"
          git -C sentient remote set-url origin disabled://sentient
          unset auth
          cd sentient
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test "$(git show -s --format=%T "$PARENT_SHA")" = "$PARENT_TREE"
          git diff --name-only "$PARENT_SHA" "$CANDIDATE_SHA" | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            src/runtime/autonomous-sandbox-software-builder-v1.ts \
            test/autonomous-sandbox-software-builder-v1.test.ts | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"

      - name: Strict build focused proofs regression and receipt
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm install 22; nvm use 22; fi
          node --version
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          node --test \
            dist/test/integrated-smarter-sentient-shadow-benchmark-v1.test.js \
            dist/test/bounded-smarter-path-activation-v1.test.js \
            dist/test/autonomous-sandbox-software-builder-v1.test.js \
            2>&1 | tee "$RUNNER_TEMP/focused.log"
          grep 'AUTONOMOUS_SANDBOX_SOFTWARE_BUILDER_V1_ACCEPTANCE>' "$RUNNER_TEMP/focused.log"
          grep '"SENTIENT_COMPLETES_REAL_SOFTWARE_OBJECTIVE_WITH_VERIFIED_RESULT":true' "$RUNNER_TEMP/focused.log"
          grep '"OBJECTIVES_COMPLETED":1' "$RUNNER_TEMP/focused.log"
          grep '"VERIFIED_SUCCESS_RATE":1' "$RUNNER_TEMP/focused.log"
          grep '"REPAIR_CYCLES":1' "$RUNNER_TEMP/focused.log"
          grep '"UNPRODUCTIVE_RECURSION":0' "$RUNNER_TEMP/focused.log"
          grep '"PROVIDER_CALLS":0' "$RUNNER_TEMP/focused.log"
          grep '"EZACT_EVIDENCE_RETAINED":true' "$RUNNER_TEMP/focused.log" || grep '"EXACT_EVIDENCE_RETAINED":true' "$RUNNER_TEMP/focused.log"
          grep '"ISOLATED_WORKSPACE":true' "$RUNNER_TEMP/focused.log"
          grep '"WRITEB_ACK_POLICY":"NONE"' "$RUNNER_TEMP/focused.log"
          grep '"PRODUCTION_MUTATIONS":0' "$RUNNER_TEMP/focused.log"
          grep '"AUTHORITY_VIOLATIONS":0' "$RUNNER_TEMP/focused.log"
          grep '"TERMINAL":"VERIFIED"' "$RUNNER_TEMP/focused.log"
          grep 'BOUNDED_SMARTER_PATH_ACTIVATION_V1_ACCEPTANCE>' "$RUNNER_TEMP/focused.log"
          grep '"PRODUCTION_REQUEST_PATH_CHANGED":false' "$RUNNER_TEMP/focused.log"
          grep '"PRODUCTION_MODEL_ROUTE_CHANGE":false' "$RUNNER_TEMP/focused.log"
          grep '"EXECUTION_AUTHORIZED":false' "$RUNNER_TEMP/focused.log"
          grep '"CONSEQUENTIAL_EFFECTS_AUTHORIZED":false' "$RUNNER_TEMP/focused.log"
          grep '"AUTHORITY_EXPANDED":false' "$RUNNER_TEMP/focused.log"
          grep '"GOVERNOR_BYPASS":false' "$RUNNER_TEMP/focused.log"
          grep '"PROVIDER_CALLS":0' "$RUNNER_TEMP/focused.log"
          grep 'INTEGRATED_SMARTER_SENTIENT_SHADOW_BENCHMARK_V1_ACCEPTANCE>' "$RUNNER_TEMP/focused.log"
          grep '"AUTHORITY_VIOLATIONS":0' "$RUNNER_TEMP/focused.log"
          grep '"PRODUCTION_MUTATIONS":0' "$RUNNER_TEMP/focused.log"
          grep '"PRODUCTION_MODEL_ROUTE_CHANGE":false' "$RUNNER_TEMP/focused.log"
          grep '"PRODUCTION_DEPLOYMENT":false' "$RUNNER_TEMP/focused.log"
          npm test
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "AUTONOMOUS_SANDBOX_SOFTWARE_BUILDER_V1_VALIDATION=PASS"
          echo "INDEPENDENT_EXACT_SHA_TREE=PASS"
          echo "STRICT_TYPESCRIPT_BUILD=PASS"
          echo "SMARTER_SENTIENT_LINEAGE_REGRESSION=PASS"
          echo "FULL_REPOSITORY_REGRESSION=PASS"
          echo "PRODUCTION_MUTATION=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "GOVERNOR_BYPASS=false"
          echo "RUNTIME_GITHUB_EXECUTION_CONNECTED=false"
          echo "PRODUCTION_DEPLOYMENT=false"
