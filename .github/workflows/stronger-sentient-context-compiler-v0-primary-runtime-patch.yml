name: Stronger Sentient Context Compiler V0 Primary Runtime Patch

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Sentient implementation branch
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: true
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply canonical primary-runtime shadow patch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$EXPECTED_SHA"
          gzip -dc scripts/patch-context-compiler-primary-runtime-v0.py.gz > "$RUNNER_TEMP/patch-context-v0.py"
          python3 "$RUNNER_TEMP/patch-context-v0.py"
          python3 - <<'PY'
          from pathlib import Path

          compiler = Path("sentient/src/retrieval/context-compiler-v0.ts")
          text = compiler.read_text()
          text = text.replace(
              'import type { JsonObject, JsonValue, ContextArtifact, PreparedTask } from "../model/types.js";',
              'import type { JsonObject, JsonValue, ContextArtifact, PreparedTask, ContextBundle } from "../model/types.js";',
              1,
          )
          text = text.replace(
              'input: Pick<ContextCompilerInputV0, "context" | "skills">,',
              'input: { context: ContextBundle; skills: readonly { stableId: string }[] },',
              1,
          )
          compiler.write_text(text)

          test_file = Path("sentient/test/context-runtime-shadow-v0.test.ts")
          test_text = test_file.read_text()
          test_text = test_text.replace("  sha256Text,\n", "", 1)
          test_text = test_text.replace(
              '} from "../src/index.js";\n',
              '} from "../src/index.js";\nimport { sha256Text } from "../src/retrieval/digest.js";\n',
              1,
          )
          test_file.write_text(test_text)
          PY
          cd sentient
          grep -q 'ContextBundle' src/retrieval/context-compiler-v0.ts
          grep -q '../src/retrieval/digest.js' test/context-runtime-shadow-v0.test.ts
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          node --test \
            dist/test/context-compiler-v0.test.js \
            dist/test/context-shadow-v0.test.js \
            dist/test/context-runtime-shadow-v0.test.js
          files=$(find dist/test -maxdepth 1 -name '*.test.js' \
            ! -name 'permanent-continuation-http.test.js' \
            ! -name 'permanent-continuation-multiprocess.test.js' -print)
          node --test $files
          git diff --check
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Commit and push exact candidate
        working-directory: sentient
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "riggeyb"
          git config user.email "burke.steffan@gmail.com"
          git add src/retrieval/context-compiler-v0.ts src/runtime/sentient-runtime.ts test/context-runtime-shadow-v0.test.ts
          git commit -m "feat: shadow compile primary cognition context"
          git push origin HEAD:"$BRANCH"
          echo "PRIMARY_RUNTIME_CONTEXT_COMPILER_SHADOW=PASS"
          echo "PROVIDER_CALLS=0"
          echo "PRODUCTION_DEPLOYMENT=false"
