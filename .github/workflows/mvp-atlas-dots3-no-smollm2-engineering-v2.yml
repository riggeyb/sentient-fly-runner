name: MVP Atlas Dots3 No SmolLM2 Engineering V2

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout runner support
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient-fly-runner
          ref: main
          path: runner

      - name: Checkout exact Sentient engineering branch
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: sentient

      - name: Exact fence and bounded edit
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ inputs.expected_tree }}"
          test -z "$(git status --porcelain)"
          python3 ../runner/scripts/mvp-atlas-dots3-no-smollm2-v2.py
          git diff --check
          echo "PATCH_FILES:"
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n'             src/application/production-collaboration.ts             src/fly/production-runtime.ts             src/model/providers/atlas-hybrid-router.ts             test/atlas-hybrid-router.test.ts | sort)"

      - name: Build focused tests and existing suite
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node --test             dist/test/mvp-root-routing-containment-v1.test.js             dist/test/atlas-hybrid-router.test.js
          npm test

      - name: Commit only after green
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          git config user.name "sentient-mvp-root-engineering"
          git config user.email "sentient-mvp-root-engineering@users.noreply.github.com"
          git add             src/application/production-collaboration.ts             src/fly/production-runtime.ts             src/model/providers/atlas-hybrid-router.ts             test/atlas-hybrid-router.test.ts
          git diff --cached --check
          git commit -m "mvp: use Dots3 after paid ceiling and retire SmolLM2 production fallback"
          successor_sha="$(git rev-parse HEAD)"
          successor_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch origin "${{ inputs.branch }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ inputs.expected_sha }}"
          git push origin "HEAD:refs/heads/${{ inputs.branch }}"
          echo "SUCCESSOR_SHA=$successor_sha"
          echo "SUCCESSOR_TREE=$successor_tree"
          echo "DEPLOYMENT=false"
