name: Stronger Sentient Integration Acceptance v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stronger-sentient-integration-acceptance-v1
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/riggeyb/sentient.git
  BASE_SHA: 67b5f7f6bbac14dbf991e444947912deba2bdc3e
  EXPECTED_SHA: b0570465c9dba174db5195495e55d59383a26956
  EXPECTED_TREE: 17dbb00e7218a2f02daa532c2b3af4eded8116e0
  NODE_VERSION: "22"

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact SHA and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Verify bounded source scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA" "$EXPECTED_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'SCOPE'
          src/index.ts
          src/model/cognitive-policy.ts
          src/model/providers/atlas-admission-controller.ts
          src/model/providers/atlas-cloud-client.ts
          src/model/providers/atlas-cloud-codec.ts
          src/model/providers/atlas-hybrid-router.ts
          src/model/types.ts
          src/retrieval/context-builder.ts
          src/state/service.ts
          test/lab/atlas-admission-and-client.test.ts
          test/lab/atlas-hybrid-router-current.test.ts
          test/lab/cognitive-policy-context.test.ts
          test/mvp1-state-v2-lifecycle.test.ts
          SCOPE
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Verify authority and persistence boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$EXPECTED_SHA" --             src/state/postgres-state-repository.ts             src/state/repository.ts             src/deployment-governor             src/production             src/action-fabric

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run baseline persistence test
        run: npm test

      - name: Run focused Stronger Sentient tests
        shell: bash
        run: |
          set -euo pipefail
          node --test             dist/test/mvp1-state-v2-lifecycle.test.js             dist/test/lab/atlas-admission-and-client.test.js             dist/test/lab/atlas-hybrid-router-current.test.js             dist/test/lab/cognitive-policy-context.test.js

      - name: Verify source immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
