name: HF Shape
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions: {contents: read}
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      A: sentient-validation-runner
      S: ${{ inputs.sha }}
      T: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - shell: bash
        run: |
          set -euo pipefail
          m=$(flyctl machines list -a "$A" --json|jq -er '.[0].id')
          st=$(flyctl machines list -a "$A" --json|jq -er '.[0].state')
          [ "$st" = started ] || flyctl machine start "$m" -a "$A" >/dev/null
          for _ in $(seq 1 90); do
            curl -fsS --max-time 8 "https://${A}.fly.dev/readyz" >/tmp/r 2>/dev/null || true
            jq -e --arg s "$S" --arg t "$T" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/r >/dev/null 2>&1 && break
            sleep 2
          done
          jq -e --arg s "$S" --arg t "$T" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/r >/dev/null
          cat >/tmp/x.mjs <<'NODE'
          import{pipeline,env}from"@huggingface/transformers";
          import{LOCAL_HF_CACHE_DIR_V1 as C,LOCAL_HF_DTYPE_V1 as D,LOCAL_HF_MODEL_REVISION_V1 as R,LOCAL_HF_MODEL_V1 as M}from"/app/dist/src/model/providers/huggingface.js";
          env.cacheDir=C;
          const p=await pipeline("text-generation",M,{revision:R,dtype:D,device:"cpu"});
          const opts={max_new_tokens:64,do_sample:false,return_full_text:false};
          const f=(n,v)=>{const g=(Array.isArray(v)?v[0]:v)?.generated_text;console.log(n+"="+JSON.stringify({type:Array.isArray(g)?"array":typeof g,len:typeof g==="string"?g.length:Array.isArray(g)?g.length:null,roles:Array.isArray(g)?g.map(x=>x?.role??null):[],lens:Array.isArray(g)?g.map(x=>typeof x?.content==="string"?x.content.length:null):[]}));};
          const q="System:\nYou are subordinate cognition. Return a short candidate answer only.\n\nUser:\nWhy does exact source identity matter?\n\nAssistant:";
          try{f("PLAIN",await p(q,o))}catch(e){console.log("PLAIN_THROW="+String(e?.message??e))}
          const c=[{role:"system",content:"You are subordinate cognition. Return a short candidate answer only."},{role:"user",content:"Why does exact source identity matter?"}];
          try{f("CHAT",await p(c,o))}catch(e){console.log("CHAT_THROW="+String(e?.message??e))}
          await p.dispose?.();
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          b=$(base64 -w0 /tmp/x.mjs)
          timeout 240s flyctl ssh console -a "$A" -C "sh -lc 'echo $b|base64 -d >/app/.x.mjs;cd /app;node /app/.x.mjs;rc=\$?;rm -f /app/.x.mjs;exit \$rc'"
