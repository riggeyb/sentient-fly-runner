name: Director Access smoke credential probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check service credential availability
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "CF_ACCESS_SERVICE_CREDENTIAL_AVAILABLE=true"
          else
            echo "CF_ACCESS_SERVICE_CREDENTIAL_AVAILABLE=false"
          fi
