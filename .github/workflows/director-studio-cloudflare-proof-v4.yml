name: Director Studio Regenerate Cloudflare Lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 51d2b8e61248ce4c5608af47da2a42ab43204138
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact Director candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "51d2b8e61248ce4c5608af47da2a42ab43204138"
          test "$(git rev-parse 'HEAD^{tree}')" = "2a64f91d805d5b7a234c91e6962315835a5d9976"
          echo "DIRECTOR_SOURCE_IDENTITY=PASS"
      - name: Regenerate lock from Cloudflare manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          ! grep -q '"@clerk/nextjs"' package-lock.json
          grep -q '"vinext"' package-lock.json
          grep -q '"wrangler"' package-lock.json
          echo "CLERK_LOCK_REFERENCE=0"
          echo "CLOUDFLARE_LOCK_BINDING=PASS"
      - name: Verify lock-only mutation
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain)"
          printf '%s\n' "$changes"
          test "$(printf '%s\n' "$changes" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changes" | grep -Eq '^ M package-lock.json$'
      - name: Commit lock if branch remains exact
        shell: bash
        env:
          START_SHA: 51d2b8e61248ce4c5608af47da2a42ab43204138
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/sentient-ui-activation-v1 | awk '{print $1}')"
          test "$remote_sha" = "$START_SHA"
          git config user.name "riggeyb"
          git config user.email "burke.steffan@gmail.com"
          git add package-lock.json
          git commit -m "cloudflare: regenerate lock without Clerk"
          git push origin HEAD:refs/heads/sentient-ui-activation-v1
          echo "DIRECTOR_LOCK_PUSH=PASS"
