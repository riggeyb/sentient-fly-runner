name: Director Studio Vinext Compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 082e9e39ac797118668b02b2d159ca5b5151d747
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fence exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "082e9e39ac797118668b02b2d159ca5b5151d747"
          test "$(git rev-parse 'HEAD^{tree}')" = "1b5c1abad16092878eb325d5f3b0663758469a60"
          echo "DIRECTOR_SOURCE_IDENTITY=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Vinext compatibility check
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vinext@latest check
          echo "VINEXT_COMPATIBILITY=PASS"
      - name: Inspect initializer contract
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vinext@latest init --help
          test -z "$(git status --porcelain)"
          echo "SOURCE_MUTATION=false"
