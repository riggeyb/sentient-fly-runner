name: Director Studio Cloudflare Exact Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 3d9b0735ce744e640c177c3e83d2eb5cfacdce88
      EXPECTED_TREE: 12acbca22c7aaaeaccf303a252d5dba35bf03668
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact Director Studio candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Fence exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo "DIRECTOR_SOURCE_IDENTITY=PASS"
          echo "DIRECTOR_INITIAL_SHA=$EXPECTED_SHA"
          echo "DIRECTOR_INITIAL_TREE=$EXPECTED_TREE"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate dependency lock if required
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "PACKAGE_LOCK_CHANGED=false"
          else
            git config user.name "sentient-cloudflare-acceptance"
            git config user.email "sentient-cloudflare-acceptance@users.noreply.github.com"
            git add package-lock.json
            git commit -m "cloudflare: regenerate vinext dependency lock"
            git push origin HEAD:sentient-ui-activation-v1
            echo "PACKAGE_LOCK_CHANGED=true"
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "DIRECTOR_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "DIRECTOR_CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Install locked dependencies and prove Clerk absent
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if npm ls @clerk/nextjs --all --json 2>/dev/null | grep -Fq '"@clerk/nextjs"'; then
            echo "CLERK_DEPENDENCY_PRESENT=true"
            exit 1
          fi
          echo "CLERK_DEPENDENCY_PRESENT=false"

      - name: Cloudflare Access and target contract tests
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test \
            tests/cloudflare-access.test.ts \
            tests/cloudflare-target-contract.test.ts \
            tests/sentient-cloudflare-contract.test.ts
          echo "ACCESS_JWT_VALIDATION=PASS"
          echo "CLOUDFLARE_TARGET_CONTRACT=PASS"

      - name: Typecheck
        run: |
          set -euo pipefail
          npm run typecheck
          echo "DIRECTOR_TYPECHECK=PASS"

      - name: Vinext compatibility
        run: |
          set -euo pipefail
          npm run check:vinext
          echo "VINEXT_COMPATIBILITY=PASS"

      - name: Cloudflare type generation
        run: |
          set -euo pipefail
          npm run cf-typegen
          echo "CLOUDFLARE_TYPEGEN=PASS"

      - name: Vinext production build
        run: |
          set -euo pipefail
          npm run build:vinext
          echo "VINEXT_BUILD=PASS"

      - name: Wrangler dry run
        run: |
          set -euo pipefail
          npx @vinext/cloudflare deploy --dry-run
          echo "WRANGLER_DRY_RUN=PASS"

      - name: Report live deployment credential availability
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_DEPLOY_CREDENTIALS=AVAILABLE"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_DEPLOY_CREDENTIALS=MISSING"
          fi

      - name: Deploy temporary Worker when authorized
        if: steps.creds.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/director-deploy.txt"
          npx wrangler deploy --temporary >"$out" 2>&1
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$out" | tail -n1)"
          test -n "$url"
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
          echo "WRANGLER_DEPLOY=PASS"
          echo "WORKER_URL=$url"

      - name: Smoke unauthenticated objective boundary
        if: steps.deploy.outputs.worker_url != ''
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/objective-response.txt -w '%{http_code}' --max-time 20 \
            -X POST -H 'content-type: application/json' \
            --data '{"objective":"read-only acceptance probe"}' \
            "$WORKER_URL/api/sentient/objectives")"
          test "$code" = "401"
          echo "UNAUTHENTICATED_OBJECTIVE_BLOCK=PASS"

      - name: Final source identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "DIRECTOR_FINAL_SHA=$(git rev-parse HEAD)"
          echo "DIRECTOR_FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SOURCE_MUTATION_AFTER_LOCK=false"
          echo "NETLIFY_FALLACK_USED=false"
          echo "CLERK_FALLACK_USED=false"
