name: Director Studio Cloudflare Runtime Proof V4
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 267cb30f9cebd996f387535c67dc629420351bc7
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Fence exact Director source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "267cb30f9cebd996f387535c67dc629420351bc7"
          test "$(git rev-parse 'HEAD^{tree}')" = "9e95ccf990d6f0986424b8257adef7e8d8e68411"
          git fetch origin sentient-ui-activation-v1
          test "$(git rev-parse origin/sentient-ui-activation-v1)" = "267cb30f9cebd996f387535c67dc629420351bc7"
          echo INITIAL_DIRECTOR_SHA=267cb30f9cebd996f387535c67dc629420351bc7
          echo INITIAL_DIRECTOR_TREE=9e95ccf990d6f0986424b8257adef7e8d8e68411
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Regenerate lock mechanically
        id: lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name sentient-cloudflare-proof
            git config user.email sentient-cloudflare-proof@users.noreply.github.com
            git add package-lock.json
            git commit -m "cloudflare: regenerate vinext dependency lock"
            git push origin HEAD:sentient-ui-activation-v1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Install and prove Clerk absent
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ! npm ls @clerk/nextjs --all --json 2>/dev/null | grep -Fq '"@clerk/nextjs"'
          echo CLERK_DEPENDENCY_PRESENT=false
      - name: Security target tests
        run: |
          set -euo pipefail
          npx tsx --test tests/cloudflare-access.test.ts tests/cloudflare-target-contract.test.ts tests/sentient-cloudflare-contract.test.ts
          echo ACCESS_JWT_VALIDATION=PASS
      - name: Typecheck and vinext
        run: |
          set -euo pipefail
          npm run typecheck
          npm run check:vinext
          npm run cf-typegen
          npm run build:vinext
          npx @vinext/cloudflare deploy --dry-run
          echo VINEXT_COMPATIBILITY=PASS
          echo VINEXT_BUILD=PASS
          echo WRANGLER_DRY_RUN=PASS
      - name: Deploy temporary Worker
        id: deploy
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          out="$RUNNER_TEMP/deploy.txt"
          npx wrangler deploy --temporary >"$out" 2>&1
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$out" | tail -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo TEMPORARY_WORKER_DEPLOY=PASS
      - name: Tail Worker
        run: |
          set -euo pipefail
          (timeout 60s npx wrangler tail --format json >"$RUNNER_TEMP/tail.jsonl" 2>"$RUNNER_TEMP/tail.err") &
          echo $! > "$RUNNER_TEMP/tail.pid"
          sleep 5
      - name: Smoke Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do curl -fsS --max-time 20 "$WORKER_URL/" >/dev/null; done
          code="$(curl -sS -o "$RUNNER_TEMP/objective.txt" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' --data '{"objective":"read-only test"}' "$WORKER_URL/api/sentient/objectives")"
          test "$code" = 401
          sleep 5
          echo UNAUTHENTICATED_OBJECTIVE_BLOCK=PASS
      - name: CPU receipt
        if: always()
        run: |
          set -uo pipefail
          [ ! -f "$RUNNER_TEMP/tail.pid" ] || kill "$(cat "$RUNNER_TEMP/tail.pid")" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/tail.jsonl" <<'PY'
          import json,math,pathlib,sys
          p=pathlib.Path(sys.argv[1]); v=[]; exceeded=0
          def walk(x):
            global exceeded
            if isinstance(x,dict):
              for k,y in x.items():
                if k in {"cpuTimeMs","CPUTimeMs"} and isinstance(y,(int,float)): v.append(float(y))
                if k=="exceededCpu" and y is True: exceeded+=1
                walk(y)
            elif isinstance(x,list):
              for y in x: walk(y)
          if p.exists():
            for line in p.read_text(errors="replace").splitlines():
              try: walk(json.loads(line))
              except Exception: pass
          v.sort()
          def pct(q):
            pos=(len(v)-1)*q; lo=math.floor(pos); hi=math.ceil(pos)
            return v[lo] if lo==hi else v[lo]+(v[hi]-v[lo])*(pos-lo)
          print(f"CPU_SAMPLE_COUNT={len(v)}")
          if v:
            print(f"CPU_P50={pct(.5):.6g}"); print(f"CPU_P95={pct(.95):.6g}"); print(f"CPU_P99={pct(.99):.6g}"); print(f"CPU_MAX={max(v):.6g}")
            print(f"EXCEEDED_CPU_COUNT={exceeded}")
          else:
            print("CPU_P50=NOT_VERIFIED"); print("CPU_P95=NOT_VERIFIED"); print("CPU_P99=NOT_VERIFIED"); print("CPU_MAX=NOT_VERIFIED"); print("EXCEEDED_CPU_COUNT=NOT_VERIFIED")
          PY
          echo DIRECTOR_FINAL_SHA=${{ steps.lock.outputs.sha }}
          echo DIRECTOR_FINAL_TREE=${{ steps.lock.outputs.tree }}
          echo PRODUCTION_DEPLOYMENT=false
          echo NETLIFY_USAGE=0
          echo SECRET_VALUES_EXPOSED=false
