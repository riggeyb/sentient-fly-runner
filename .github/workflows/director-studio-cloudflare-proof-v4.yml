name: Director Studio Cloudflare Runtime Proof V4
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIRECTOR_MANIFEST_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate exact Director dependency lock receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/director-lock receipts/director-studio
          printf '%s' "$DIRECTOR_MANIFEST_B64" | base64 -d > /tmp/director-lock/package.json
          test "$(git hash-object /tmp/director-lock/package.json)" = "8ddeee2364c3ab3b29780264f0b743ab61c5c4f2"
          cd /tmp/director-lock
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          ! grep -Fq '@clerk/nextjs' package-lock.json
          cp package-lock.json "$GITHUB_WORKSPACE/receipts/director-studio/package-lock-3d9b0735.json"
          cd "$GITHUB_WORKSPACE"
          git config user.name "sentient-proof-runner"
          git config user.email "sentient-proof-runner@users.noreply.github.com"
          git add receipts/director-studio/package-lock-3d9b0735.json
          if ! git diff --cached --quiet; then
            git commit -m "proof: record Director 3d9b0735 dependency lock"
            git push origin HEAD:main
          fi
          echo "DIRECTOR_LOCK_GENERATION=PASS"
          echo "CLERK_DEPENDENCY_PRESENT=false"
          echo "DIRECTOR_MANIFEST_BLOB=8ddeee2364c3ab3b29780264f0b743ab61c5c4f2"
