name: Director Studio Cloudflare Runtime Proof V4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Chunk exact Director lock receipt for deterministic transport
        shell: bash
        run: |
          set -euo pipefail
          src="receipts/director-studio/package-lock-3d9b0735.json"
          test -f "$src"
          ! grep -Fq '@clerk/nextjs' "$src"
          mkdir -p receipts/director-studio/package-lock-3d9b0735.b64.parts
          rm -f receipts/director-studio/package-lock-3d9b0735.b64.parts/*
          base64 -w0 "$src" | split -b 20000 -d -a 3 - receipts/director-studio/package-lock-3d9b0735.b64.parts/part-
          sha256sum "$src" > receipts/director-studio/package-lock-3d9b0735.sha256
          wc -c "$src" > receipts/director-studio/package-lock-3d9b0735.bytes
          git config user.name "sentient-proof-runner"
          git config user.email "sentient-proof-runner@users.noreply.github.com"
          git add receipts/director-studio/package-lock-3d9b0735.b64.parts receipts/director-studio/package-lock-3d9b0735.sha256 receipts/director-studio/package-lock-3d9b0735.bytes
          if ! git diff --cached --quiet; then
            git commit -m "proof: chunk Director dependency lock transport"
            git push origin HED:main
          fi
          echo "DIRECTOR_LOCK_CHUNK_TRANSPORT=PASS"
          echo "DIRECTOR_LOCK_CHUNK_COUNT=$(find receipts/director-studio/package-lock-3d9b0735.b64.parts -type f | wc -l | tr -d ' ')"
          echo "CLERK_DEPENDENCY_PRESENT=false"
