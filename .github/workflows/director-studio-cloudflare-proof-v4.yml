name: Director Studio Cloudflare Runtime Proof V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Director Studio candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 51d2b8e61248ce4c5608af47da2a42ab43204138
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fence exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "51d2b8e61248ce4c5608af47da2a42ab43204138"
          test "$(git rev-parse 'HEAD^{tree}')" = "2a64f91d805d5b7a234c91e6962315835a5d9976"
          git fetch origin sentient-ui-activation-v1
          test "$(git rev-parse origin/sentient-ui-activation-v1)" = "51d2b8e61248ce4c5608af47da2a42ab43204138"
          git checkout -B sentient-ui-activation-v1 "51d2b8e61248ce4c5608af47da2a42ab43204138"
          echo "INITIAL_DIRECTOR_SHA=51d2b8e61248ce4c5608af47da2a42ab43204138"
          echo "INITIAL_DIRECTOR_TREE=2a64f91d805d5b7a234c91e6962315835a5d9976"
          echo "PROOF_CANDIDATE_IDENTITY=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate dependency lock as one mechanical successor
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "PACKAGE_LOCK_CHANGED=false"
          else
            git config user.name "sentient-cloudflare-proof"
            git config user.email "sentient-cloudflare-proof@users.noreply.github.com"
            git add package-lock.json
            git commit -m "cloudflare: regenerate vinext dependency lock"
            git push origin HEAD:sentient-ui-activation-v1
            echo "PACKAGE_LOCK_CHANGED=true"
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "DIRECTOR_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "DIRECTOR_CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "PACKAGE_LOCK_REGENERATED=PASS"

      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if npm ls @clerk/nextjs --all --json 2>/dev/null | grep -Fq '"@clerk/nextjs"'; then
            echo "CLERK_DEPENDENCY_PRESENT=true"
            exit 1
          fi
          echo "CLERK_DEPENDENCY_PRESENT=false"

      - name: Focused Cloudflare security and target contract tests
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test \
            tests/cloudflare-access.test.ts \
            tests/cloudflare-target-contract.test.ts \
            tests/sentient-cloudflare-contract.test.ts
          echo "CLOUDFLARE_TARGET_CONTRACT_TESTS=PASS"

      - name: Typecheck Director Studio
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          echo "DIRECTOR_TYPECHECK=PASS"

      - name: Vinext compatibility check
        shell: bash
        run: |
          set -euo pipefail
          npm run check:vinext
          echo "VINEXT_COMPATIBILITY=PASS"

      - name: Generate Cloudflare types
        shell: bash
        run: |
          set -euo pipefail
          npm run cf-typegen
          echo "CLOUDFLARE_TYPEGEN=PASS"

      - name: Build vinext production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build:vinext
          echo "VINEXT_BUILD=PASS"

      - name: Dry-run Cloudflare deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          npx @vinext/cloudflare deploy --dry-run
          echo "WRANGLER_DRY_RUN=PASS"

      - name: Deploy one temporary non-production Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/director-cf-temporary-deploy.txt"
          npx wrangler deploy --temporary >"$out" 2>&1
          public_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$out" | tail -n1)"
          test -n "$public_url"
          echo "worker_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "TEMPORARY_WORKER_DEPLOY=PASS"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "CANONICAL_HOST_CHANGE=false"
          # Never print raw deploy output: it may contain a short-lived claim URL.

      - name: Start real-time Worker tail
        id: tail
        shell: bash
        run: |
          set -euo pipefail
          tail_out="${RUNNER_TEMP}/director-cf-tail.jsonl"
          tail_err="${RUNNER_TEMP}/director-cf-tail.err"
          (timeout 60s npx wrangler tail --format json >"$tail_out" 2>"$tail_err") &
          echo "$!" > "${RUNNER_TEMP}/director-cf-tail.pid"
          sleep 5
          echo "tail_out=$tail_out" >> "$GITHUB_OUTPUT"

      - name: Smoke real Worker and capture invocations
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            curl -fsS --max-time 20 "$WORKER_URL/" >/dev/null
          done
          code="$(curl -sS -o "${RUNNER_TEMP}/objective-response.txt" -w '%{http_code}' --max-time 20 \
            -X POST -H 'content-type: application/json' \
            --data '{"objective":"read-only test"}' \
            "$WORKER_URL/api/sentient/objectives")"
          test "$code" = "401"
          sleep 5
          echo "TEMPORARY_WORKER_SMOKE=PASS"
          echo "UNAUTHENTICATED_OBJECTIVE_BLOCK=PASS"

      - name: Stop tail and summarize authoritative CPU fields
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pid_file="${RUNNER_TEMP}/director-cf-tail.pid"
          if [ -f "$pid_file" ]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
          wait 2>/dev/null || true
          tail_out="${RUNNER_TEMP}/director-cf-tail.jsonl"
          python3 - "$tail_out" <<'PY'
          import json, math, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          values = []
          exceeded = 0
          def walk(x):
              global exceeded
              if isinstance(x, dict):
                  for k, v in x.items():
                      if k in {"cpuTimeMs", "CPUTimeMs"} and isinstance(v, (int, float)):
                          values.append(float(v))
                      if k == "exceededCpu" and v is True:
                          exceeded += 1
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  try:
                      walk(json.loads(line))
                  except Exception:
                      pass
          values.sort()
          def pct(q):
              if not values:
                  return None
              pos=(len(values)-1)*q
              lo=math.floor(pos); hi=math.ceil(pos)
              if lo == hi: return values[lo]
              return values[lo] + (values[hi]-values[lo])*(pos-lo)
          print(f"CPU_SAMPLE_COUNT={len(values)}")
          if values:
              print(f"CPU_P50_MS={pct(.50):.6g}")
              print(f"CPU_P95_MS={pct(.95):.6g}")
              print(f"CPU_P99_MS={pct(.99):.6g}")
              print(f"CPU_MAX_MS={max(values):.6g}")
              print(f"CPU_EXCEEDED_10MS_COUNT={sum(v>10 for v in values)}")
              print(f"EXCEEDED_CPU_COUNT={exceeded}")
          else:
              print("CPU_P50_MS=NOT_VERIFIED")
              print("CPU_P95_MS=NOT_VERIFIED")
              print("CPU_P99_MS=NOT_VERIFIED")
              print("CPU_MAX_MS=NOT_VERIFIED")
              print("CPU_EXCEEDED_10MS_COUNT=NOT_VERIFIED")
              print("EXCEEDED_CPU_COUNT=NOT_VERIFIED")
          PY
          echo "DIRECTOR_FINAL_SHA=${{ steps.lock.outputs.candidate_sha }}"
          echo "DIRECTOR_FINAL_TREE=${{ steps.lock.outputs.candidate_tree }}"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "CANONICAL_HOST_CHANGE=false"
          echo "SECRET_VALUES_EXPOSED=false"
