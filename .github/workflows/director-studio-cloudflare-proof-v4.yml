name: Director Studio Cloudflare Runtime Proof V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Director Studio candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: ed2be6442d98b248d8003a851dcca92edac09425
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fence exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ed2be6442d98b248d8003a851dcca92edac09425"
          test "$(git rev-parse 'HEAD^{tree}')" = "a4de82ea5eac6b7715b2c7642dcb727d2713da49"
          git fetch origin sentient-ui-activation-v1
          test "$(git rev-parse origin/sentient-ui-activation-v1)" = "ed2be6442d98b248d8003a851dcca92edac09425"
          git checkout -B sentient-ui-activation-v1 "ed2be6442d98b248d8003a851dcca92edac09425"
          echo "INITIAL_DIRECTOR_SHA=ed2be6442d98b248d8003a851dcca92edac09425"
          echo "INITIAL_DIRECTOR_TREE=a4de82ea5eac6b7715b2c7642dcb727d2713da49"
          echo "PROOF_CANDIDATE_IDENTITY=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate dependency lock as one mechanical successor
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "PACKAGE_LOCK_CHANGED=false"
          else
            git config user.name "sentient-cloudflare-proof"
            git config user.email "sentient-cloudflare-proof@users.noreply.github.com"
            git add package-lock.json
            git commit -m "cloudflare: regenerate vinext dependency lock"
            git push origin HEAD:sentient-ui-activation-v1
            echo "PACKAGE_LOCK_CHANGED=true"
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "DIRECTOR_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "DIRECTOR_CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "PACKAGE_LOCK_REGENERATED=PASS"

      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if npm ls @clerk/nextjs --all --json 2>/dev/null | grep -Fq '"@clerk/nextjs"'; then
            echo "CLERK_DEPENDENCY_PRESENT=true"
            exit 1
          fi
          echo "CLERK_DEPENDENCY_PRESENT=false"

      - name: Verify no active Clerk or Netlify target references
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -I -E '(@clerk/|ClerkProvider|clerkMiddleware|CLERK_)' -- package.json package-lock.json app lib proxy.ts tests scripts .env.example
          ! grep -q '"netlify' package.json
          ! grep -q '\.netlify\.app' .env.example
          echo "CLERK_RUNTIME_REFERENCES=0"
          echo "NETLIFY_TARGET_REFERENCES=0"

      - name: Focused Cloudflare security and target contract tests
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test \
            tests/cloudflare-access.test.ts \
            tests/cloudflare-target-contract.test.ts \
            tests/sentient-cloudflare-contract.test.ts
          echo "CLOUDFLARE_TARGET_CONTRACT_TESTS=PASS"

      - name: Full unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm test
          echo "DIRECTOR_UNIT_TESTS=PASS"

      - name: Typecheck Director Studio
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          echo "DIRECTOR_TYPECHECK=PASS"

      - name: Vinext compatibility check
        shell: bash
        run: |
          set -euo pipefail
          npm run check:vinext
          echo "VINEXT_COMPATIBILITY=PASS"

      - name: Generate Cloudflare types
        shell: bash
        run: |
          set -euo pipefail
          npm run cf-typegen
          echo "CLOUDFLARE_TYPEGEN=PASS"

      - name: Build vinext production candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build:vinext
          echo "VINEXT_BUILD=PASS"

      - name: Dry-run Cloudflare deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          npx @vinext/cloudflare deploy --dry-run
          echo "WRANGLER_DRY_RUN=PASS"

      - name: Deploy one temporary non-production Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/director-cf-temporary-deploy.txt"
          npx wrangler deploy --temporary >"$out" 2>&1
          public_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$out" | tail -n1)"
          test -n "$public_url"
          echo "worker_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "TEMPORARY_WORKER_DEPLOY=PASS"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "CANONICAL_HOST_CHANGE=false"

      - name: Smoke real Worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            curl -fsS --max-time 20 "$WORKER_URL/" >/dev/null
          done
          code="$(curl -sS -o "${RUNNER_TEMP}/objective-response.txt" -w '%{http_code}' --max-time 20 \
            -X POST -H 'content-type: application/json' \
            --data '{"objective":"read-only test"}' \
            "$WORKER_URL/api/sentient/objectives")"
          test "$code" = "401"
          echo "TEMPORARY_WORKER_SMOKE=PASS"
          echo "UNAUTHENTICATED_OBJECTIVE_BLOCK=PASS"

      - name: Receipt
        if: always()
        shell: bash
        run: |
          echo "DIRECTOR_FINAL_SHA=${{ steps.lock.outputs.candidate_sha }}"
          echo "DIRECTOR_FINAL_TREE=${{ steps.lock.outputs.candidate_tree }}"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "SECRET_VALUES_EXPOSED=false"
