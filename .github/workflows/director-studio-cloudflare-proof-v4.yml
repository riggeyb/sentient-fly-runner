name: Director Studio Cloudflare Convergence via Operator Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_DIRECTOR_SHA: f00e1ee970bb1965f4940ea5ac944ab8e7417270
      EXPECTED_DIRECTOR_TREE: 936b6ecf2d2147db3ceb3a4ff257d32bd9d57c99
      DIRECTOR_BRANCH: sentient-ui-activation-v1
      SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_POLICY_AUD: ${{ vars.CF_ACCESS_POLICY_AUD }}
      DIRECTOR_SENTIENT_BASE_URL: ${{ vars.DIRECTOR_SENTIENT_BASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DIRECTOR_SENTIENT_TOKEN: ${{ secrets.DIRECTOR_SENTIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator

      - name: Checkout private Director source
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: sentient-ui-activation-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: director

      - name: Fence exact Director candidate
        shell: bash
        working-directory: director
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DIRECTOR_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_DIRECTOR_TREE"
          test "$(git branch --show-current)" = "$DIRECTOR_BRANCH"
          echo "DIRECTOR_PRIVATE_CHECKOUT=PASS"

      - name: Require Cloudflare, source, and Director runtime bindings
        shell: bash
        run: |
          set -euo pipefail
          for k in SENTIENT_SOURCE_GITHUB_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCESS_TEAM_DOMAIN CF_ACCESS_POLICY_AUD DIRECTOR_SENTIENT_BASE_URL DIRECTOR_SENTIENT_TOKEN; do
            test -n "${!k:-}" || { echo "MISSING_BINDING=$k"; exit 1; }
          done
          echo "SOURCE_TOKEN_PRESENT=true"
          echo "OPERATOR_RUNTIME_BINDINGS_PRESENT=true"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: director/package-lock.json

      - name: Run canonical convergence from operator bridge
        id: canonical_convergence
        shell: bash
        working-directory: director
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/director-convergence.log"
          if bash ../operator/scripts/director-cloudflare-convergence.sh >"$log" 2>&1; then
            cat "$log"
          else
            rc=$?
            echo "CANONICAL_CONVERGENCE=FAIL"
            tail -n 160 "$log" > "$RUNNER_TEMP/director-convergence-tail.log"
            marker="$(grep -Eo 'DIRECTOR_GATE_FAILED=[A-Za-z0-9_-]+' "$RUNNER_TEMP/director-convergence-tail.log" | tail -n1 || true)"
            if [ -n "$marker" ]; then
              gate="${marker#DIRECTOR_GATE_FAILED=}"
              echo "failure_gate=$gate" >> "$GITHUB_OUTPUT"
              echo "::error::$marker"
              if [ "$gate" = "tests" ]; then
                test_marker="$(grep -Eo 'DIRECTOR_TEST_FAILURE=[A-Za-z0-9._-]+' "$RUNNER_TEMP/director-convergence-tail.log" | tail -n1 || true)"
                if [ -n "$test_marker" ]; then
                  test_slug="${test_marker#DIRECTOR_TEST_FAILURE=}"
                  echo "failure_test=$test_slug" >> "$GITHUB_OUTPUT"
                  echo "::error::$test_marker"
                else
                  test_line="$(grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/director-convergence-tail.log" | head -n1 || true)"
                  if [ -n "$test_line" ]; then
                    test_name="${test_line#* - }"
                    test_slug="$(printf '%s' "$test_name" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9._-' | cut -c1-80)"
                    echo "failure_test=$test_slug" >> "$GITHUB_OUTPUT"
                    echo "::error title=Director test failure::$test_line"
                  fi
                fi
              fi
            fi
            echo "FAILURE_LOG_TAIL_BEGIN"
            cat "$RUNNER_TEMP/director-convergence-tail.log"
            echo "FAILURE_LOG_TAIL_END"
            exit "$rc"
          fi

      - name: Preserve bounded convergence failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: director-convergence-failure-${{ steps.canonical_convergence.outputs.failure_gate }}-${{ steps.canonical_convergence.outputs.failure_test }}
          path: ${{ runner.temp }}/director-convergence-tail.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Report execution ownership
        run: |
          echo "SOURCE_REPOSITORY=riggeyb/director-studio-beta"
          echo "EXECUTION_REPOSITORY=riggeyb/sentient-fly-runner"
          echo "PRIVATE_DIRECTOR_ACTIONS_REQUIRED=false"
