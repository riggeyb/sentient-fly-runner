name: Final Cert Objective Residency Wiring
"on":
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      expected_head:
        required: true
        type: string
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: sentient
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch, build, and test
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 ../runner/scripts/apply-objective-residency-wiring.py
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          node --test dist/test/fly-objective-residency.test.js dist/test/job2-self-execution.test.js dist/test/permanent-continuation-http.test.js dist/test/phase5-fly-restart-lease-retry.test.js
          echo OBJECTIVE_RESIDENCY_TARGETED_TESTS=PASS
      - name: Commit tested wiring
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          git config user.name "sentient-final-cert"
          git config user.email "sentient-final-cert@users.noreply.github.com"
          git add src/fly/self-execution.ts src/fly/production-runtime.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m "fix: wire active-objective Fly residency lease"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:Refs/heads/${TARGET_BRANCH}"
          echo STAGING_SHA="$(git rev-parse HEAD)"
          echo STAGING_TREE="$(git rev-parse 'HEAD^{tree}')"
          echo RESOURCE_ENVELOPE_UNCHANGED=true
          echo SECRET_VALUES_EXPOSED=false
