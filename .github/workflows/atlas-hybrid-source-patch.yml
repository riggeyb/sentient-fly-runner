name: Atlas Hybrid Source Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-deployment-ready-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: fc67a71248eb0ad355b0fb6043d93b2acfff4840
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify, patch Dots3 default, build, test, and push isolated successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fc67a71248eb0ad355b0fb6043d93b2acfff4840"
          test "$(git rev-parse 'HEAD^{tree}')" = "ec1bf1cf79de9cc4c5eed9498215cdc62030a7d6"

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, got {count}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          router = "src/model/providers/atlas-hybrid-router.ts"
          replace_once(
              router,
              'export const DEEPSEEK_V3_2_MODEL_V1 = "deepseek-ai/deepseek-v3.2" as const;\n',
              'export const DEEPSEEK_V3_2_MODEL_V1 = "deepseek-ai/deepseek-v3.2" as const;\n'
              'export const DOTS3_NOTE_ATLAS_MODD_V1 = "dots-studio/dots-3-note-prev-free" as const;\n',
          )

          runtime = "src/fly/production-runtime.ts"
          replace_once(
              runtime,
              'import { AtlasHybridModelRouterV1, type HybridModelTelemetryV1 } from "../model/providers/atlas-hybrid-router.js";',
              'import { AtlasHybridModelRouterV1, DOTS3_NOTE_ATLAS_MODEL_V1, type HybridModelTelemetryV1 } from "../model/providers/atlas-hybrid-router.js";',
          )
          replace_once(
              runtime,
              '''  const atlasApiKey = optional(process.env.ATLASCLOUD_API_KEY);
          const dots3Model = optional(process.env.ATLASCLOUD_DOTS3_MODEL);
          const atlasClient = atlasApiKey !== null && dots3Model !== null ? new AtlasCloudClientV1({ apiKey: atlasApiKey }) : null;
          ''',
              '''  const atlasApiKey = optional(process.env.ATLASCLOUD_API_KEY);
          const dots3Model = resolveAtlasDots3ModelV1(process.env.ATLASCLOUD_DOTS3_MODEL);
          const atlasClient = atlasApiKey !== null ? new AtlasCloudClientV1({ apiKey: atlasApiKey }) : null;
          ''',
          )
          replace_once(
              runtime,
              '''function optional(value: unknown): string | null {
          ''',
              '''export function resolveAtlasDots3ModelV1(value: unknown): string {
            return optional(value) ?? DOTS3_NOTE_ATLAS_MODEL_V1;
          }

          function optional(value: unknown): string | null {
          ''',
          )

          test_path = "test/atlas-hybrid-production-wiring.test.ts"
          replace_once(
              test_path,
              'import { AtlasHybridModelRouterV1 } from "../src/model/providers/atlas-hybrid-router.js";',
              'import { AtlasHybridModelRouterV1, DOTS3_NOTE_ATLAS_MODEL_V1 } from "../src/model/providers/atlas-hybrid-router.js";',
          )
          replace_once(
              test_path,
              'import { runRootSynthesisV1 } from "../src/application/production-mission-control.js";',
              'import { runRootSynthesisV1 } from "../src/application/production-mission-control.js";\n'
              '
import { resolveAtlasDots3ModelV1 } from "../src/fly/production-runtime.js";',
          )
          p = Path(test_path)
          p.write_text(p.read_text() + '''

          test("production Atlas activation uses the provider-resolved Dots3 model by default and preserves an override", () => {
            assert.equal(resolveAtlasDots3ModelV1(undefined), DOTS3_NOTE_ATLAS_MODEL_V1);
            assert.equal(resolveAtlasDots3ModelV1("  dots-studio/future-note  "), "dots-studio/future-note");
          });
          ''')
          PY

          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          npm run test:atlas
          npm test

          git config user.name "sentient-atlas-engineering"
          git config user.email "sentient-atlas-engineering@users.noreply.github.com"
          git add src/model/providers/atlas-hybrid-router.ts src/fly/production-runtime.ts test/atlas-hybrid-production-wiring.test.ts
          git diff --cached --check
          git commit -m "atlas: default Dots3 to provider-resolved model"
          git push origin HEAD:atlas-hybrid-cognition-mvp-v1-deployment-ready-20261029
