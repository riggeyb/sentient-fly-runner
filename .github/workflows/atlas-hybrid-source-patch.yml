name: Atlas Hybrid Source Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-private-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 8411570237f220e3fbec017c9932fc8d75dfe476
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify, patch, build, test, and push isolated successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8411570237f220e3fbec017c9932fc8d75dfe476"
          test "$(git rev-parse HEAD^)" = "55d5d9145121b87fd580f1afd1312d02cc4d697e"
          test "$(git rev-parse 'HEAD^{tree}')" = "40f5b584a7eafa97771614cae2ff8538fe640269"
          test "$(git hash-object .github/atlas-dots3-catalog-resolution.patch)" = "159cd0cb478c55ae13a8654b7de6febbafb684a3"
          git apply --check .github/atlas-dots3-catalog-resolution.patch
          git apply .github/atlas-dots3-catalog-resolution.patch
          rm .github/atlas-dots3-catalog-resolution.patch
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
          npm test
          git config user.name "sentient-atlas-engineering"
          git config user.email "sentient-atlas-engineering@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "atlas: resolve Dots3 Note from Atlas model catalog"
          git push origin HEAD:atlas-hybrid-cognition-mvp-v1-final-20261029
