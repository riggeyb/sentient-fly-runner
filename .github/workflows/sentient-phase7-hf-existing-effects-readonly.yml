name: Sentient Phase7 HF Existing Effects Readonly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-phase7-hf-existing-effects-readonly
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_MACHINE_ID: 8469e7b243d558
      EXPECTED_SOURCE_SHA: ff2e8164a2e6888f3b58b15fb143c73d016f4fb9
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fence machine and preserve prior state
        id: fence
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          test "$(jq 'length' <<<"$machines")" -eq 1
          machine_id="$(jq -r '.[0].id' <<<"$machines")"
          original_state="$(jq -r '.[0].state' <<<"$machines")"
          image="$(jq -r '.[0].config.image' <<<"$machines")"
          test "$machine_id" = "$EXPECTED_MACHINE_ID"
          case "$original_state" in stopped|started) ;; *) echo unsupported_machine_state; exit 1;; esac
          case "$image" in *"$EXPECTED_SOURCE_SHA"*) ;; *) echo machine_source_image_mismatch; exit 1;; esac
          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
          echo "original_state=$original_state" >> "$GITHUB_OUTPUT"
          echo "SECRET_VALUES_EXPOSED=false"

      - name: Start only if stopped and wait
        if: steps.fence.outputs.original_state == 'stopped'
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine start "${{ steps.fence.outputs.machine_id }}" -a "$APP" >/tmp/start.log 2>&1
          for attempt in $(seq 1 30); do
            state="$(flyctl machines list -a "$APP" --json | jq -r '.[0].state')"
            if [ "$state" = "started" ]; then
              echo "TEMPORARY_MACHINE_START=PASS"
              exit 0
            fi
            sleep 2
          done
          echo temporary_machine_start_failed
          exit 1

      - name: Probe prior binding effects read-only
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/sentient-phase7-hf-existing-effects-readonly.mjs
          b64="$(base64 -w0 scripts/sentient-phase7-hf-existing-effects-readonly.mjs)"
          cmd="printf '%s' '$b64' | base64 -d >/tmp/effects.mjs && node /tmp/effects.mjs; rc=\$?; rm -f /tmp/effects.mjs; exit \$rc"
          set +e
          output="$(flyctl ssh console -a "$APP" -s "${{ steps.fence.outputs.machine_id }}" -C "$cmd" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 0
          for marker in \
            READONLY_EFFECTS_CHECK=PASS \
            HF_WRITE_PERFORMED=false \
            POSTGRES_WRITE_PERFORMED=false \
            SECRET_VALUES_EXPOSED=false
          do
            grep -Fxq "$marker" <<<"$output"
          done

      - name: Restore prior Machine state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          machine_id="${{ steps.fence.outputs.machine_id }}"
          original_state="${{ steps.fence.outputs.original_state }}"
          if [ -n "$machine_id" ] && [ "$original_state" = "stopped" ]; then
            flyctl machine stop "$machine_id" -a "$APP" >/tmp/stop.log 2>&1 || true
            for attempt in $(seq 1 30); do
              state="$(flyctl machines list -a "$APP" --json | jq -r '.[0].state')"
              if [ "$state" = "stopped" ]; then
                echo "MACHINE_STATE_RESTORED=true"
                exit 0
              fi
              sleep 2
            done
            echo machine_state_restore_failed
            exit 1
          fi
          if [ -n "$machine_id" ] && [ "$original_state" = "started" ]; then
            state="$(flyctl machines list -a "$APP" --json | jq -r '.[0].state')"
            test "$state" = "started"
          fi
          echo "MACHINE_STATE_RESTORED=true"
