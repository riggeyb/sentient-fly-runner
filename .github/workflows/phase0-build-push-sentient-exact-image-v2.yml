name: Phase0 Build Push Sentient Exact Image V2
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SHA: b07e90c43e2336dfb5cba0066ae8004976d67179
      TREE: 8086ac182ca08d86a386e8f6952746f5e624a238
      PARENT: d62260ec6b295bf9f155964ac05fbc6ca467c8d1
      SKILLS: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: b07e90c43e2336dfb5cba0066ae8004976d67179
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build and push exact immutable image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git bundle create sentient-source.bundle HEAD
          flyctl deploy -a sentient-validation-runner -c fly.toml --remote-only --build-only --push \
            --image-label "phase0-$SHA" \
            --build-arg "SENTIENT_RUNTIME_SHA=$SHA" \
            --build-arg "SENTIENT_RUNTIME_TREE=$TREE" \
            --build-arg "SENTIENT_SKILLS_SHA=$SKILLS" \
            --build-arg "SENTIENT_PHASE0_ACCEPTANCE_BASE_SHA=$PARENT"
          rm -f sentient-source.bundle
          echo "EXACT_IMAGE_BUILD_PUSH=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
