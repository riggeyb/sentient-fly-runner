name: Phase0 Build Push Sentient Exact Image V2
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SHA: 40137d96c631d53440d0afed320d9d7630d8909c
      TREE: a15feec87c25297a654dddce47e17085b124f590
      PARENT: 3d44129e066cfaa3aa21d60116b936500f964d96
      SKILLS: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 40137d96c631d53440d0afed320d9d7630d8909c
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build and push exact immutable image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          git bundle create sentient-source.bundle HEAD
          flyctl deploy -a sentient-validation-runner -c fly.toml --remote-only --build-only --push             --image-label "phase0-$SHA"             --build-arg "SENTIENT_RUNTIME_SHA=$SHA"             --build-arg "SENTIENT_RUNTIME_TREE=$TREE"             --build-arg "SENTIENT_SKILLS_SHA=$SKILLS"             --build-arg "SENTIENT_PHASE0_ACCEPTANCE_BASE_SHA=$PARENT"
          rm -f sentient-source.bundle
          echo "EXACT_IMAGE_BUILD_PUSH=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
