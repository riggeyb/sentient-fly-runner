name: Phase0 Build Push Sentient Exact Image V2
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Pull and smoke exact runtime image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          flyctl auth docker
          IMAGE="registry.fly.io/sentient-validation-runner:phase0-$SHA"
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -lc 'set -eu; echo "NODE_MODULE_LINK=$(readlink node_modules/sentient-orchestrator || true)"; test -e vendor/sentient-orchestrator/package.json; test -e node_modules/sentient-orchestrator/package.json; node --input-type=module -e '\''await import("sentient-orchestrator/mission-control-context"); console.log("RUNTIME_MISSION_CONTROL_IMPORT=PASS")'\'''
          echo "REGISTRY_IMAGE_SMOKE=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
