name: Sentient Final Exact Live Gate V2
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
      APP_URL: https://sentient-validation-runner.fly.dev
    steps:
      - name: Verify exact live identity and production readiness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 10 "$APP_URL/healthz" >/tmp/h.json 2>/dev/null &&
               curl -fsS --max-time 10 "$APP_URL/readyz" >/tmp/r.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          node <<'NODE'
          const fs=require("fs");
          const sha=String(process.env.EXPECTED_SHA??"");
          const tree=String(process.env.EXPECTED_TREE??"");
          const h=JSON.parse(fs.readFileSync("/tmp/h.json","utf8"));
          const r=JSON.parse(fs.readFileSync("/tmp/r.json","utf8"));
          const hi=h.application?.identity?.source,ri=r.identity?.source;
          console.log("SANITIZED_LIVE_GATE="+JSON.stringify({
            healthCode:200,readyCode:200,
            healthSha:hi?.sha??null,healthTree:hi?.tree??null,
            readySha:ri?.sha??null,readyTree:ri?.tree??null,
            ready:r.ready??null,
            missingRequired:(r.bindings??[]).filter(x=>x.requiredForReadiness&&x.availability!=="AVAILABLE").map(x=>x.name),
            readinessScope:r.readinessScope??null
          }));
          if(hi?.sha!==sha||hi?.tree!==tree||ri?.sha!==sha||ri?.tree!==tree||r.ready!==true) throw Error("FROZEN_LIVE_GATE_FAILED");
          if(r.authorityOwner!=="SENTIENT_RUNTIME"||r.modelOutputIsNeverAuthority!==true) throw Error("AUTHORITY_GATE_FAILED");
          const names=(r.bindings??[]).filter(x=>x.requiredForReadiness&&x.availability==="AVAILABLE").map(x=>x.name);
          if(!names.includes("COGNITION")||!names.includes("PHASE3_HF_COGNITION")) throw Error("COGNITION_NOT_READY");
          console.log("LIVE_RUNTIME_SHA="+ri.sha);
          console.log("LIVE_RUNTIME_TREE="+ri.tree);
          for(const k of ["LIVE_SHA_MATCH","LIVE_TREE_MATCH","LIVE_HEALTHZ","LIVE_READYZ","LOCAL_HF_COGNITION_LIVE"]) console.log(k+"=PASS");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
