name: Phase5 Admission Liveness Repair

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BRANCH: sentient-production-composition-20261017
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: sentient

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fence exact canonical
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"

      - name: Apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          python3 ../runner/scripts/phase5-admission-liveness-repair.py
          git diff --check

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          npm ci --no-audit --no-fund
          npm run build

      - name: Behavioral liveness fixture
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          node ../runner/scripts/phase5-admission-liveness-test.mjs

      - name: Targeted cumulative regressions
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          node --test \
            dist/test/job2-self-execution.test.js \
            dist/test/production-collaboration-restart-recovery.test.js \
            dist/test/active-work-restart-edge.test.js \
            dist/test/active-work-expiry-fencing.test.js \
            dist/test/phase5-collaborative-convergence.test.js \
            dist/test/phase4-multistep-autonomy.test.js \
            dist/test/phase1-core-runtime.test.js \
            dist/test/phase1-acceptance-policy.test.js \
            dist/test/fly-phase1-acceptance-policy.test.js \
            dist/test/production-phase3-cognition.test.js \
            dist/test/phase0-control-recovery.test.js \
            dist/test/phase0-engineering-readiness.test.js
          git diff --check

      - name: Push exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          cd sentient
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"
          git config user.name "sentient-phase5-liveness"
          git config user.email "sentient-phase5-liveness@users.noreply.github.com"
          git add src/fly/self-execution.ts
          git diff --cached --check
          git diff --cached --quiet && { echo "NO_LIVENESS_CHANGE"; exit 1; }
          git commit -m "fix: bound Fly restart recovery admission contention"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo "PRIOR_SHA=$EXPECTED_SHA"
          echo "NEW_SHA=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "PHASE5_ADMISSION_LIVENESS_REPAIR=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
