name: MVP Root Fallback Evidence Repair V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRANCH: sentient/mvp-root-fallback-evidence-v3
      START_SHA: 3fe66d2bffc9bf46d717235d131e633692756c85
    steps:
      - name: Checkout operator
        uses: actions/checkout@v4
        with:
          path: operator
          persist-credentials: false

      - name: Checkout exact Sentient repair branch
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-root-fallback-evidence-v3
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch exact bounded evidence linkage
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$START_SHA"
          test -z "$(git status --porcelain)"
          python3 ../operator/scripts/mvp-root-fallback-evidence-v3.py
          cp ../operator/scripts/mvp-root-fallback-evidence-v3.test.ts test/mvp-root-fallback-evidence.test.ts
          expected="$(printf '%s\n' \
            src/application/production-collaboration.ts \
            src/application/production-mission-control.ts \
            test/mvp-root-fallback-evidence.test.ts | sort)"
          observed="$(git status --porcelain | sed 's/^...//' | sort)"
          test "$observed" = "$expected"
          git diff --check

      - name: Build and bounded regression suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          node --test dist/test/mvp-root-fallback-evidence.test.js
          node --test dist/test/root-direct-fallback.test.js
          node --test dist/test/job2-production-convergence.test.js
          npm test

      - name: Commit exact tested repair
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$START_SHA"
          git config user.name sentient-mvp-activation
          git config user.email sentient-mvp-activation@users.noreply.github.com
          git add \
            src/application/production-collaboration.ts \
            src/application/production-mission-control.ts \
            test/mvp-root-fallback-evidence.test.ts
          git diff --cached --check
          git commit -m "mvp: preserve verified analysis evidence through Root fallback"
          NEW_SHA="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse 'HEAD^{tree}')"
          git push --force-with-lease="refs/heads/$BRANCH:$START_SHA" origin "HEAD:refs/heads/$BRANCH"
          echo "CANDIDATE_SHA=$NEW_SHA"
          echo "CANDIDATE_TREE=$NEW_TREE"
          echo "BASE_SHA=$START_SHA"
          echo "RESOURCE_EXPANSION=false"
          echo "CAPABILITY_EXPANSION=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "EXPLICIT_DISAGREE_FAIL_CLOSED=true"
          echo "FALLBACK_ACCEPTED_EVIDENCE_SCOPE=independent-analysis-only"
