name: Final Sentient Exact Live Runtime Audit
'on':
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP: sentient-validation-runner
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
    steps:
      - name: Audit exact live runtime over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          health=""
          ready=""
          for _ in $(seq 1 30); do
            health="$(curl -fsS --max-time 8 "https://${APP}.fly.dev/healthz" || true)"
            ready="$(curl -fsS --max-time 8 "https://${APP}.fly.dev/readyz" || true)"
            if [ -n "$health" ] || [ -n "$ready" ]; then break; fi
            sleep 2
          done
          test -n "$health"
          test -n "$ready"
          node - "$SHA" "$TREE" "$health" "$ready" <<'NODE'
          const [expectedSha, expectedTree, healthRaw, readyRaw] = process.argv.slice(2);
          const health = JSON.parse(healthRaw);
          const ready = JSON.parse(readyRaw);
          const healthSha = health?.application?.identity?.source?.sha ?? null;
          const healthTree = health?.application?.identity?.source?.tree ?? null;
          const readySha = ready?.identity?.source?.sha ?? null;
          const readyTree = ready?.identity?.source?.tree ?? null;
          console.log(`LIVE_HEALTH_STATUS=${health?.status ?? "UNKNOWN"}`);
          console.log(`LIVE_READY=${String(ready?.ready ?? false)}`);
          console.log(`LIVE_HEALTH_SHA=${healthSha ?? "UNKNOWN"}`);
          console.log(`LIVE_HEALTH_TREE=${healthTree ?? "UNKNOWN"}`);
          console.log(`LIVE_READY_SHA=${readySha ?? "UNKNOWN"}`);
          console.log(`LIVE_READY_TREE=${readyTree ?? "UNKNOWN"}`);
          console.log(`LIVE_RUNTIME_SHA_MATCH=${healthSha===expectedSha && readySha===expectedSha}`);
          console.log(`LIVE_RUNTIME_TREE_MATCH=${healthTree===expectedTree && readyTree===expectedTree}`);
          console.log(`SELF_EXECUTION_READY=${String(ready?.selfExecution?.ready ?? false)}`);
          console.log(`AUTHORITY_OWNER=${ready?.authorityOwner ?? "UNKNOWN"}`);
          console.log(`MODEL_OUTPUT_IS_NEVER_AUTHORITY=${String(ready?.modelOutputIsNeverAuthority ?? false)}`);
          const requiredUnavailable = Array.isArray(ready?.bindings)
            ? ready.bindings.filter((b) => b?.requiredForReadiness===true && b?.availability!=="AVAILABLE").length
            : null;
          console.log(`REQUIRED_BINDINGS_UNAVAILABLE=${requiredUnavailable ?? "UNKNOWN"}`);
          const healthy = health?.status==="ok";
          const readiness = ready?.ready===true && ready?.readinessScope==="FULL_SENTIENT_RUNTIME";
          if (!healthy || !readiness) process.exit(21);
          if (healthSha!==expectedSha || healthTree!==expectedTree || readySha!==expectedSha || readyTree!==expectedTree) process.exit(22);
          if (ready?.selfExecution?.ready!==true || ready?.selfExecution?.actionsRequired!==false) process.exit(23);
          if (ready?.authorityOwner!=="SENTIENT_RUNTIME" || ready?.modelOutputIsNeverAuthority!==true) process.exit(24);
          if (requiredUnavailable!==0) process.exit(25);
          NODE
          echo LIVE_HEALTHZ=PASS
          echo LIVE_READYZ=PASS
          echo POST_CERT_LIVE_SHA_MATCH=PASS
          echo POST_CERT_LIVE_TREE_MATCH=PASS
          echo GITHUB_ACTIONS_REQUIRED_FOR_RUNTIME=false
          echo SECRET_VALUES_EXPOSED=false
