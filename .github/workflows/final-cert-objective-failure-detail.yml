name: Final Cert Objective Failure Detail
"on":
  workflow_dispatch:
    inputs:
      objective_id:
        required: true
        type: string
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      ID: ${{ inputs.objective_id }}
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect sanitized persisted failure result
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          mid="$(flyctl machines list -a "$APP" --json | jq -er '.[0].id')"
          state="$(flyctl machines list -a "$APP" --json | jq -er '.[0].state')"
          if [ "$state" != "started" ]; then flyctl machine start "$mid" -a "$APP" >/dev/null; fi
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 8 "https://${APP}.fly.dev/readyz" >/tmp/r.json 2>/dev/null && jq -e --arg s "$SHA" --arg t "$TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/r.json >/dev/null; then break; fi
            sleep 2
          done
          jq -e --arg s "$SHA" --arg t "$TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' /tmp/r.json >/dev/null
          cat >/tmp/detail.mjs <<'NODE'
          import {PostgresSpawnObjectiveRepository as Repo} from "/app/dist/src/objective-continuation/postgres-spawn-repository.js";
          const id=String(process.env.CERT_ID??"").trim();
          const db=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          if(!id||!db) throw new Error("CERT_DETAIL_BINDING_MISSING");
          const repo=new Repo({connectionString:db});
          const firstToken=v=>typeof v==="string"?(v.trim().split(/\s+/,1)[0]??"").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,32):null;
          try{
            const task=await repo.get("task",id);
            if(task?.kind!=="task") throw new Error("CERT_DETAIL_TASK_MISSING");
            const md=(task.metadata&&typeof task.metadata==="object"&&!Array.isArray(task.metadata))?task.metadata:{};
            const root=await repo.getObjectiveContinuation(id);
            const snap=await repo.spawnSnapshot();
            const episodes=snap.records.episodes
              .filter(e=>e.taskId===id)
              .map(e=>({
                role:e.role,
                executionId:e.executionId,
                finalOutcome:e.finalOutcome,
                failureClass:e.failureClass,
                policyDecision:e.policyDecision?.decision??null,
                policyReasons:e.policyDecision?.reasonCodes??[],
                verificationOutcome:e.verification?.outcome??null,
                verificationReasons:e.verification?.reasonCodes??[],
                verificationEvidenceCount:Array.isArray(e.verification?.evidenceRefs)?e.verification.evidenceRefs.length:0,
                backend:e.selectedTarget?.backendId??null,
                provider:e.selectedTarget?.provider??null,
                model:e.selectedTarget?.model??null
              }));
            const results=snap.records.results
              .filter(r=>r.result?.identity?.taskId===id)
              .map(r=>({
                executionId:r.executionId,
                role:r.result.identity.role,
                terminalStatus:r.result.terminalStatus,
                evidenceCount:Array.isArray(r.result.evidenceRefs)?r.result.evidenceRefs.length:0,
                failureClass:r.result.failure?.class??null,
                failureRetryable:r.result.failure?.retryable??null,
                verdictToken:r.result.identity.role==="independent-verification"?firstToken(r.result.output):null,
                provider:r.result.providerReceipt?.provider??null,
                model:r.result.providerReceipt?.model??null,
                revision:r.result.providerReceipt?.revision??null,
                transport:r.result.providerReceipt?.transport??null,
                costPolicy:r.result.providerReceipt?.costPolicy??null,
                modelOutputIsAuthority:r.result.providerReceipt?.modelOutputIsAuthority??null
              }));
            console.log("CERT_DETAIL="+JSON.stringify({
              objectiveId:id,
              taskStatus:task.status,
              taskError:md.error??null,
              rootRevision:root?.revision??null,
              rootTerminal:root?.terminal??null,
              dependencies:(root?.evidenceDependencies??[]).map(d=>({id:d.id,status:d.status,evidenceId:d.evidenceId??null})),
              episodes,
              results
            }));
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await repo.close().catch(()=>undefined); }
          NODE
          B64="$(base64 -w0 /tmp/detail.mjs)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $B64|base64 -d >/app/.failure-detail.mjs; CERT_ID=$ID node /app/.failure-detail.mjs; rc=\$?; rm -f /app/.failure-detail.mjs; exit \$rc'"
