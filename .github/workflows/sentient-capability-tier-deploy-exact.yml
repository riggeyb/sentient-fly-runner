name: Sentient Capability Tier Deploy Exact
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      objective_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: ${{ inputs.sha }}
      T: ${{ inputs.tree }}
      O: ${{ inputs.objective_id }}
      K: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy exact candidate through resident Governor
        shell: bash
        run: |
          set -euo pipefail
          [[ "$S" =~ ^[0-9a-f]{40}$ ]]
          [[ "$T" =~ ^[0-9a-f]{40}$ ]]
          [[ "$O" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          cat >/tmp/deploy.mjs <<'NODE'
          const sha=process.env.S,tree=process.env.T,objectiveId=process.env.O,skillsSha=process.env.K;
          const token=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN??"").trim();
          if(!token) throw new Error("GOVERNOR_RESIDENT_DEPLOYMENT_CREDENTIAL_MISSING");
          const r=await fetch("http://127.0.0.1:8080/v1/deployments/sentient",{
            method:"POST",
            headers:{authorization:"Bearer "+token,"content-type":"application/json","x-sentient-objective-id":objectiveId},
            body:JSON.stringify({sha,tree,skillsSha}),
            signal:AbortSignal.timeout(900000)
          });
          const raw=await r.text();let b={};try{b=JSON.parse(raw)}catch{}
          const out={HTTP_STATUS:r.status,OBJECTIVE_ID:objectiveId,DEPLOYMENT_ID:b.DEPLOYMENT_ID??null,REQUESTED_SHA:b.REQUESTED_SHA??null,REQUESTED_TREE:b.REQUESTED_TREE??null,DEPLOYED_SHA:b.DEPLOYED_SHA??null,DEPLOYED_TREE:b.DEPLOYED_TREE??null,BUILD_RESULT:b.BUILD_RESULT??null,RESOURCE_CHANGE_STATUS:b.RESOURCE_CHANGE_STATUS??null,RETRY_LIMIT_STATE:b.RETRY_LIMIT_STATE??null,RATE_LIMIT_STATE:b.RATE_LIMIT_STATE??null};
          if(b.HEALTHZ)out.HEALTHZ={statusCode:b.HEALTHZ.statusCode??null};
          if(b.READYZ)out.READYZ={statusCode:b.READYZ.statusCode??null};
          console.log(JSON.stringify(out));
          if(!r.ok||b.REQUESTED_SHA!==sha||b.REQUESTED_TREE!==tree||b.DEPLOYED_SHA!==sha||b.DEPLOYED_TREE!==tree||b.BUILD_RESULT!=="SUCCEEDED"||b.HEALTHZ?.statusCode!==200||b.READYZ?.statusCode!==200) process.exit(21);
          console.log("TIER_3_GOVERNOR_DEPLOY=PASS");
          console.log("AUTHORIZATION_BOUND_TO_IDENTITY=PASS");
          console.log("HIGH_TIER_ACTION_REQUIRES_VERIFICATION_RECEIPT=PASS");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          b64="$(base64 -w0 /tmp/deploy.mjs)"
          flyctl machines list -a sentient-deployment-governor --json >/tmp/m.json
          id="$(jq -r '.[0].id // empty' /tmp/m.json)"
          test -n "$id"
          flyctl machine start "$id" -a sentient-deployment-governor >/dev/null || true
          for _ in $(seq 1 60); do
            st="$(flyctl machines list -a sentient-deployment-governor --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$st" = "started" ] && break
            sleep 2
          done
          test "$st" = "started"
          flyctl ssh console -a sentient-deployment-governor -C "sh -lc 'echo $b64 | base64 -d >/tmp/deploy.mjs && S=$S T=$T O=$O K=$K node /tmp/deploy.mjs; rc=\$?; rm -f /tmp/deploy.mjs; exit \$rc'"
          echo "RESULT=PASS"
