name: Sentient Failing Test Filenames
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fence and isolate filenames
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          test -z "$(git status --porcelain)"
          node <<'NODE'
          const fs=require("node:fs");
          const path=require("node:path");
          const {spawnSync}=require("node:child_process");
          const dir=path.join(process.cwd(),"dist","test");
          const files=fs.readdirSync(dir).filter(f=>f.endsWith(".test.js")).sort();
          let failed=0;
          for(const file of files){
            const r=spawnSync(process.execPath,["--test",path.join(dir,file)],{
              encoding:"utf8",timeout:120000,maxBuffer:1024*1024,env:{...process.env}
            });
            if(r.status===0 && !r.error) continue;
            failed++;
            console.log(`FAILED_TEST_FILE=${file} EXIT_CODE=${r.status ?? "null"} SIGNAL=${r.signal ?? "null"} ERROR=${r.error?.code ?? "none"}`);
          }
          console.log(`FAILED_TEST_FILES=${failed}`);
          console.log("SOURCE_MUTATION=false");
          console.log("DEPLOYMENT=false");
          console.log("SECRET_VALUES_EXPOSED=false");
          process.exit(failed===2 ? 0 : 1);
          NODE
