name: Dynamic Cognition Stage D OAI Integration

on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      expected_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 0
      - name: Exact fence and source-only Stage D integration
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C sentient rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git -C sentient status --porcelain)"
          python runner/scripts/dynamic-topology-stage-d-oai.py
          git -C sentient diff --check
          cd sentient
          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/dynamic-hard-stops-core.test.js \
            dist/test/dynamic-topology-integration.test.js \
            dist/test/spawn-mission-control-context.test.js \
            dist/test/deployment-governor-convergence.test.js
          npm test
          git config user.name "Sentient Engineering"
          git config user.email "sentient-engineering@users.noreply.github.com"
          git add \
            src/application/dynamic-cognition.ts \
            src/application/objective-budget.ts \
            src/application/production-collaboration.ts \
            src/application/production-composition.ts \
            src/application/production-mission-control-context.ts \
            src/application/production-mission-control.ts \
            src/application/production-mission-control-synthesis.ts \
            test/dynamic-topology-integration.test.ts
          git diff --cached --check
          git commit -m "cognition: integrate bounded dynamic worker topology"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "SUCCESSOR_SHA=$new_sha"
          echo "SUCCESSOR_TREE=$new_tree"
          echo "DEPLOYMENT_PERFORMED=false"
          echo "DIRECTOR_MODIFIED=false"
          echo "RESOURCE_CHANGE=false"
