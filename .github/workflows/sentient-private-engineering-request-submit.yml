name: Sentient Private Engineering Request Submit

"on":
  workflow_dispatch:
    inputs:
      issue_number: {required: true, type: string}
      request_sha256: {required: true, type: string}
      expected_head: {required: true, type: string}
      expected_tree: {required: true, type: string}
      objective_id: {required: true, type: string}

permissions:
  contents: read

concurrency:
  group: sentient-private-engineering-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
      APP: sentient-deployment-governor
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      OBJECTIVE_ID: ${{ inputs.objective_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify private request and submit through resident Governor
        shell: bash
        run: bash scripts/private-engineering-submit.sh
