name: Sentient Private Engineering Request Submit

"on":
  workflow_dispatch:
    inputs:
      issue_number:
        description: Private riggeyb/sentient issue containing encoded EngineeringJob request
        required: true
        type: string
      request_sha256:
        description: SHA-256 of decoded request JSON
        required: true
        type: string
      expected_head:
        description: Exact authorized source head
        required: true
        type: string
      expected_tree:
        description: Exact authorized source tree
        required: true
        type: string
      objective_id:
        description: Exact objective identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentient-private-engineering-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
      APP: sentient-deployment-governor
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      OBJECTIVE_ID: ${{ inputs.objective_id }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fetch and bind private request without logging payload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]{1,10}$ ]]
          [[ "$REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OBJECTIVE_ID" =~ ^[A-Za-z0-9._:/-]{1,200}$ ]]
          test -n "$SOURCE_GITHUB_TOKEN"

          code="$(curl -sS -o /tmp/private-issue.json -w '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/riggeyb/sentient/issues/$ISSUE_NUMBER")"
          test "$code" = "200"

          node > /tmp/request.gz.b64 <<'NODE'
          const fs=require("node:fs");
          const {gunzipSync}=require("node:zlib");
          const {createHash}=require("node:crypto");
          const issue=JSON.parse(fs.readFileSync("/tmp/private-issue.json","utf8"));
          const body=typeof issue?.body==="string"?issue.body:"";
          const m=body.match(/REQUEST_BASE64_BEGIN\s+([A-Za-z0-9+/=\s]+?)\s+REQUEST_BASE64_END/);
          if(!m)throw new Error("PRIVATE_REQUEST_PAYLOAD_MISSING");
          const compressed=Buffer.from(m[1].replace(/\s+/g,""),"base64");
          const bytes=gunzipSync(compressed);
          const digest=createHash("sha256").update(bytes).digest("hex");
          if(digest!==process.env.REQUEST_SHA256)throw new Error("PRIVATE_REQUEST_DIGEST_MISMATCH");
          const request=JSON.parse(bytes.toString("utf8"));
          if(request.repo!=="riggeyb/sentient")throw new Error("PRIVATE_REQUEST_REPO_MISMATCH");
          if(request.branch!=="sentient-production-composition-20261017")throw new Error("PRIVATE_REQUEST_BRANCH_MISMATCH");
          if(request.expectedHead!==process.env.EXPECTED_HEAD)throw new Error("PRIVATE_REQUEST_HEAD_MISMATCH");
          if(request.expectedTree!==process.env.EXPECTED_TREE)throw new Error("PRIVATE_REQUEST_TREE_MISMATCH");
          if(request.objectiveId!==process.env.OBJECTIVE_ID)throw new Error("PRIVATE_REQUEST_OBJECTIVE_MISMATCH");
          if(request.policyVersion!=="sentient-capability-tier/v1")throw new Error("PRIVATE_REQUEST_POLICY_MISMATCH");
          if(!Array.isArray(request.authorizedPaths)||request.authorizedPaths.length<1||request.authorizedPaths.length>16)throw new Error("PRIVATE_REQUEST_SCOPE_INVALID");
          if( Array.isArray(request.commands)!==true||request.commands.length<1||request.commands.at(-1)?.category!=="test")throw new Error("PRIVATE_REQUEST_FINAL_TEST_REQUIRED");
          process.stdout.write(compressed.toString("base64"));
          NODE
          rm -f /tmp/private-issue.json
          echo "PRIVATE_REQUEST_FETCH=PASS"
          echo "PRIVATE_REQUEST_DIGEST=PASS"
          echo "PRIVATE_SOURCE_PAYLOAD_EXPOSED=false"

      - name: Submit digest-bound bytes through existing Governor
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          machine_id="$(jq -r '[.[] | select((.config.auto_destroy // false) != true and .state == "started")] | .[0].id // empty' <<<"$machines")"
          test -n "$machine_id"
          payload_b64="$(cat /tmp/request.gz.b64)"
          rm -f /tmp/request.gz.b64

          cat > /tmp/governor-submit.mjs <<'NODE'
          import { createHash } from "node:crypto";
          import { gunzipSync } from "node:zlib";
          const expectedDigest=required("REQUEST_SHA256");
          const expectedHead=required("EXPECTED_HEAD");
          const expectedTree=required("EXPECTED_TREE");
          const objectiveId=required("OBJECTIVE_ID");
          const engineeringToken=required("SENTIENT_ENGINEERING_API_TOKEN");
          const compressed=Buffer.from(required("REQUEST_GZIP_B64"),"base64");
          const requestBytes=gunzipSync(compressed);
          if(createHash("sha256").update(requestBytes).digest("hex")!==expectedDigest)fail("PRIVATE_REQUEST_DIGEST_MISMATCH");
