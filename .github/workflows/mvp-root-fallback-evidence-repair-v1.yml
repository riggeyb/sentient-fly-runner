name: MVP Root Fallback Evidence Repair V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRANCH: sentient/mvp-root-fallback-evidence-v1
      START_SHA: 27b1a1060562de9e7efc70f72e1dd1375294032b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-root-fallback-evidence-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fence exact repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$START_SHA"
          test "$(git status --porcelain)" = ""

      - name: Apply bounded evidence-linkage repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/application/production-collaboration.ts",
              '''    const verifierUnavailable =
                contributions.length >= 2 && verificationDisposition === "UNAVAILABLE";
              const result = contributions.length >= 2 && !verifierUnavailable
                ? convergeCollaborativeObjectiveV1(input.objectiveId, contributions)
                : Object.freeze({
                    contractVersion: identity.applicationVersion,
                    objectiveId: input.objectiveId,
                    status: "UNAVAILABLE" as const,
                    authorityOwner: "SENTIENT_RUNTIME" as const,
                    authoritativeResultRef: null,
                    authoritativeContent: null,
                    reason: backends.length === 0
                      ? "no_approved_local_zero-cost_spawn_execution_backend_present"
                      : verifierUnavailable
                        ? "independent_verification_verdict_unparseable"
                        : "spawn_execution_did_not_produce_two_verified_contributions",
                    spawnEpisodes: Object.freeze(episodes),
                    workerEffectsCanonical: false as const,
                  });
          ''',
              '''    const verifierUnavailable =
                contributions.length >= 2 && verificationDisposition === "UNAVAILABLE";
              const verifiedAnalysis = verifierUnavailable ? contributions[0] : undefined;
              const deterministicallyVerifiedAnalysisContent =
                verifiedAnalysis.^erification.outcome === "accept"
                && typeof verifiedAnalysis.result.output === "string"
                && verifiedAnalysis.result.output.trim()
                  ? verifiedAnalysis.result.output.trim()
                  : null;
              const deterministicallyVerifiedAnalysisEvidenceRefs =
                verifiedAnalysis?.verification.outcome === "accept"
                  ? [...verifiedAnalysis.verification.evidenceRefs]
                  : [];
              const result = contributions.length >= 2 && !verifierUnavailable
                ? convergeCollaborativeObjectiveV1(input.objectiveId, contributions)
                : Object.freeze({
                      contractVersion: identity.applicationVersion,
                      objectiveId: input.objectiveId,
                      status: "UNAVAILABLE" as const,
                      authorityOwner: "SENTIENT_RUNTIME" as const,
                      authoritativeResultRef: null,
                      authoritativeContent: null,
                      reason: backends.length === 0
                        ? "no_approved_local_zero-cost_spawn_execution_backend_present"
                        : verifierUnavailable
                          ? "independent_verification_verdict_unparseable"
                          : "spawn_execution_did_not_produce_two_verified_contributions",
                      deterministicallyVerifiedAnalysisContent,
                      deterministicallyVerifiedAnalysisEvidenceRefs: Object.freeze(
                        deterministicallyVerifiedAnalysisEvidenceRefs,
                      ),
                      spawnEpisodes: Object.freeze(episodes),
                      workerEffectsCanonical: false as const,
                    });
          '''
          )

          replace_once(
              "src/application/production-mission-control.ts",
              '''    const row = record(result);
              const collaborationStatus = typeof row.status === "string" ? row.status : null;
              const converged = collaborationStatus === "CONVERGED";
              const rootDirectContent =
                !converged && collaborationStatus === "UNAVAILABLE"
                  ? await runRootDirectFallbackV1({
                      input,
                     root,
                     cognition: this.#rootCognition,
                      acceptancePolicy: this.#rootAcceptancePolicy,
                    })
                  : null;
              const succeeded = converged || rootDirectContent !== null;
              const evidenceRefs = strings(row.evidenceRefs);
          '',
              '''    const row = record(result);
              const collaborationStatus = typeof row.status === "string" ? row.status : null;
              const converged = collaborationStatus === "CONVERGED";
              const fallbackEvidence = rootFallbackEvidenceV1(row);
              const rootDirectContent =
                !converged && collaborationStatus === "UNAVAILABLE"
                  ? await runRootDirectFallbackV1({
                      input,
                      root,
                      cognition: this.#rootCognition,
                      acceptancePolicy: this.#rootAcceptancePolicy,
                      supportingEvidence: fallbackEvidence,
                    })
                  : null;
              const succeeded = converged || rootDirectContent !== null;
              const evidenceRefs = strings(row.evidenceRefs);
              const fallbackAcceptedEvidence =
