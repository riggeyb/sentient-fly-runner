name: Director Sentient Credential Bind V1

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Generate and atomically bind dedicated Director credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || { echo "FLY_API_TOKEN_PRESENT=false"; exit 2; }
          token="$(openssl rand -hex 32)"
          test "${#token}" -eq 64
          echo "::add-mask::$token"

          # Write the operator-side secret first. If the runner identity lacks
          # repository-secret authority, no Fly mutation has occurred.
          set +e
          printf '%s' "$token" | gh secret set DIRECTOR_SENTIENT_TOKEN \
            --repo "$GITHUB_REPOSITORY" --body -
          gh_rc=$?
          set -e
          if [ "$gh_rc" -ne 0 ]; then
            unset token
            echo "DIRECTOR_SENTIENT_TOKEN_GENERATED=true"
            echo "DIRECTOR_SENTIENT_TOKEN_BOUND_OPERATOR=false"
            echo "DIRECTOR_SENTIENT_TOKEN_BOUND_FLY=false"
            echo "TOKEN_VALUE_EXPOSED=false"
            echo "BOUNDARY=OPERATOR_REPOSITORY_SECRET_WRITE_AUTHORITY"
            exit 3
          fi

          # Bind the exact same in-memory value to Fly. Roll back the operator
          # secret if Fly refuses the write so no partial credential remains.
          set +e
          flyctl secrets set --app "$APP" DIRECTOR_SENTIENT_TOKEN="$token" >/dev/null 2>&1
          fly_rc=$?
          set -e
          if [ "$fly_rc" -ne 0 ]; then
            gh secret delete DIRECTOR_SENTIENT_TOKEN --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            unset token
            echo "DIRECTOR_SENTIENT_TOKEN_GENERATED=true"
            echo "DIRECTOR_SENTIENT_TOKEN_BOUND_OPERATOR=false"
            echo "DIRECTOR_SENTIENT_TOKEN_BOUND_FLY=false"
            echo "TOKEN_VALUE_EXPOSED=false"
            echo "BOUNDARY=FLY_SECRET_WRITE_AUTHORITY"
            exit 4
          fi
          unset token

          flyctl secrets list -a "$APP" --json |
            jq -e 'any(.[]; ((.Name // .name // "") == "DIRECTOR_SENTIENT_TOKEN"))' >/dev/null
          gh secret list --repo "$GITHUB_REPOSITORY" |
            awk '{print $1}' | grep -Fxq DIRECTOR_SENTIENT_TOKEN

          echo "DIRECTOR_SENTIENT_TOKEN_GENERATED=true"
          echo "DIRECTOR_SENTIENT_TOKEN_BOUND_OPERATOR=true"
          echo "DIRECTOR_SENTIENT_TOKEN_BOUND_FLY=true"
          echo "TOKEN_VALUE_EXPOSED=false"
