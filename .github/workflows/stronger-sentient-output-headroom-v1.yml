name: Stronger Sentient Output Headroom V1

on:
  workflow_dispatch:
    inputs:
      live_atlas:
        description: "Run bounded live Atlas calls (false = validate policy mapping only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stronger-sentient-output-headroom-v1
  cancel-in-progress: false

env:
  BASELINE_SHA: "c05ebe9ffed7254bb749cee1c72a965f970def7c"
  BASELINE_TREE: "00296d7129fa8ab7f3254943a57df444591ad1ab"
  CORPUS_SOURCE_SHA: "9c037505f65663ae6b7e8990ae969639572860d9"
  CORPUS_DIGEST: "611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout measurement operator
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout immutable accepted baseline
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frozen corpus
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.CORPUS_SOURCE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: corpus-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          actual="$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json | awk '{print $1}')"
          test "$actual" = "$CORPUS_DIGEST"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build exact accepted baseline
        working-directory: sentient
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Validate task-aware output-headroom policy
        shell: bash
        env:
          LIVE_ATLAS: "false"
          BASELINE_SHA: ${{ env.BASELINE_SHA }}
          BASELINE_TREE: ${{ env.BASELINE_TREE }}
          CORPUS_DIGEST: ${{ env.CORPUS_DIGEST }}
          EXPERIMENT_OUT: ${{ runner.temp }}/stronger-sentient-output-headroom-v1.json
        run: node scripts/stronger-sentient-output-headroom-v1.mjs

      - name: Run bounded live task-aware headroom experiment
        if: ${{ inputs.live_atlas }}
        shell: bash
        env:
          LIVE_ATLAS: "true"
          BASELINE_SHA: ${{ env.BASELINE_SHA }}
          BASELINE_TREE: ${{ env.BASELINE_TREE }}
          CORPUS_DIGEST: ${{ env.CORPUS_DIGEST }}
          EXPERIMENT_OUT: ${{ runner.temp }}/stronger-sentient-output-headroom-v1.json
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: node scripts/stronger-sentient-output-headroom-v1.mjs

      - name: Verify baseline immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          git -C sentient diff --exit-code
          git -C sentient diff --cached --exit-code
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-output-headroom-v1
          path: ${{ runner.temp }}/stronger-sentient-output-headroom-v1.json
          retention-days: 14

      - name: Guard
        run: |
          echo "MAX_PROVIDER_CALLS=7"
          echo "TASK_AWARE_POLICY=true"
          echo "TOOLS_EXECUTED=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "PRODUCTION_CONFIGURATION_CHANGE=false"
          echo "PRODUCTION_DATABASE_MIGRATION=false"
