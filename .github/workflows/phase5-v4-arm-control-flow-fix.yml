name: Phase5 V4 Arm Control Flow Fix

on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
      - name: Patch and syntax-check V4 arm script
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/phase5-live-spawn-proof-v4.yml")
          s = p.read_text()
          old_loop = '            for(let i=0;i<1200;i++){'
          new_loop = '            let armed=false;\n            for(let i=0;i<1200;i++){'
          old_exit = '                  process.exitCode=0;\n                  return;'
          new_exit = '                  armed=true;\n                  break;'
          old_throw = '            throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          new_throw = '            if(!armed) throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          for old in (old_loop, old_exit, old_throw):
              assert s.count(old) == 1, (old, s.count(old))
          p.write_text(s.replace(old_loop,new_loop,1).replace(old_exit,new_exit,1).replace(old_throw,new_throw,1))
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path(".github/workflows/phase5-live-spawn-proof-v4.yml").read_text()
          marker = "          cat >/tmp/arm.mjs <<'NODE'\n"
          start = s.index(marker) + len(marker)
          end = s.index("\n          NODE", start)
          Path("/tmp/arm.mjs").write_text(s[start:end] + "\n")
          PY
          node --check /tmp/arm.mjs
      - name: Commit exact harness fix
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          git config user.name "sentient-phase5-convergence"
          git config user.email "sentient-phase5-convergence@users.noreply.github.com"
          git add .github/workflows/phase5-live-spawn-proof-v4.yml
          git diff --cached --check
          git diff --cached --quiet && { echo NO_CHANGE; exit 1; }
          git commit -m "ops: fix Phase5 V4 arm module control flow"
          git push --force-with-lease="refs/heads/main:$EXPECTED_HEAD" origin HEAD:refs/heads/main
          echo "RUNNER_NEW_SHA=$(git rev-parse HEAD)"
