name: Phase5 V4 Arm Control Flow Fix

on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Fence and patch V4 only
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/phase5live-spawn-proof-v4.yml")
          s = p.read_text()
          a = '            for(let i=0;i<1200;i++){'
          b = '            let armed=false;\n            for(let i=0;i<1200;i++){'
          c = '                  process.exitCode=0;\u 0a00                  return;'.replace('\u0a00','')
          d = '                  armed=true;\u 0a00                  break;'.replace('\u0a00','')
          e = '            throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          f = '            if(!armed) throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          for old in (a, c, e):
              if s.count(old) != 1:
                  raise SystemExit(f"anchor mismatch for {old!r}: {s.count(old)}")
          s = s.replace(a, b, 1).replace(c, d, 1).replace(e, f, 1)
          p.write_text(s)
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path(".github/workflows/phase5-live-spawn-proof-v4.yml").read_text()
          start = s.index("          cat >/tmp/arm.mjs <<'NODE'\n") + len("          cat >/tmp/arm.mjs <<'NODE'\n")
          end = s.index("\n          NODE", start)
          Path("/tmp/arm.mjs").write_text(s[start:end] + "\n")
          PY
          node --check /tmp/arm.mjs
      - name: Commit exact harness fix
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          git config user.name "sentient-phase5-convergence"
          git config user.email "sentient-phase5-convergence@users.noreply.github.com"
          git add .github/workflows/phase5live-spawn-proof-v4.yml
          git diff --cached --check
          git diff --cached --quiet && { echo NO_CHANGE; exit 1; }
          git commit -m "ops: fix Phase5 V4 arm module control flow"
          git push --force-with-lease="refs/heads/main:$EXPECTED_HEAD" origin HEAD:refs/heads/main
          echo "RUNNER_NEW_SHA=$(git rev-parse HEAD)"
