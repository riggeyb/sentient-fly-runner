name: Phase5 V4 Arm Control Flow Fix

on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Patch, syntax-check, and emit validated V4
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/phase5-live-spawn-proof-v4.yml")
          s = p.read_text()
          old_loop = '            for(let i=0;i<1200;i++){'
          new_loop = '            let armed=false;\n            for(let i=0;i<1200;i++){'
          old_exit = '                  process.exitCode=0;\n                  return;'
          new_exit = '                  armed=true;\n                  break;'
          old_throw = '            throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          new_throw = '            if(!armed) throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          for old in (old_loop, old_exit, old_throw):
              assert s.count(old) == 1, (old, s.count(old))
          p.write_text(s.replace(old_loop,new_loop,1).replace(old_exit,new_exit,1).replace(old_throw,new_throw,1))
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path(".github/workflows/phase5-live-spawn-proof-v4.yml").read_text()
          marker = "          cat >/tmp/arm.mjs <<'NODE'\n"
          start = s.index(marker) + len(marker)
          end = s.index("\n          NODE", start)
          Path("/tmp/arm.mjs").write_text(s[start:end] + "\n")
          PY
          node --check /tmp/arm.mjs
          echo "PATCHED_V4_BASE64=$(base64 -w0 .github/workflows/phase5-live-spawn-proof-v4.yml)"
