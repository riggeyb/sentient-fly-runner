name: Skills Mission Control Focused Diagnostic

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient_orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient_orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sentient_orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fence exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ inputs.tree }}"
      - name: Install and migrate
        working-directory: sentient-orchestrator
        run: |
          npm ci --no-audit --no-fund
          npm run migrate
      - name: Focus Mission Control tests
        working-directory: sentient-orchestrator
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test tests/mission-control*.test.ts 2>&1 | tee /tmp/mission-control-tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "FOCUSED_TEST_RESULT=FAIL"
            grep -E '^(not ok|# Subtest:|  error:|  code:|  expected:|  actual:|  operator:)|AssertionError|ERR_ASSERTION'On /tmp/mission-control-tests.log | tail -n 160 || true
            exit "$rc"
          fi
          echo "FOCUSED_TEST_RESULT=PASS"
      - name: Guard tracked source mutation
        working-directory: sentient-orchestrator
        run: |
          git diff --quiet
          git diff --cached --quiet
