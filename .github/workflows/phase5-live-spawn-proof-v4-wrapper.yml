name: Skills Mission Control Focused Diagnostic

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/skills
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fence exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ inputs.tree }}"
      - name: Install and migrate
        working-directory: sentient-orchestrator
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run migrate
      - name: Run full suite with concise failure receipt
        working-directory: sentient-orchestrator
        shell: bash
        run: |
          set +e
          npm test >/tmp/orchestrator-tests.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "FULL_TEST_RESULT=FAIL"
            grep -E '^(not ok|# Subtest:|  error:|  code:|  expected:|  actual:|  operator:)|AssertionError|ERR_ASSERTION|TypeError|ReferenceError|Error:' /tmp/orchestrator-tests.log | tail -n 220 || true
            exit "$rc"
          fi
          echo "FULL_TEST_RESULT=PASS"
      - name: Guard tracked source mutation
        working-directory: sentient-orchestrator
        run: |
          git diff --quiet
          git diff --cached --quiet
