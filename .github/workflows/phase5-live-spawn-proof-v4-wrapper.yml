name: Phase5 V4 Exact Patched Wrapper

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  phase5-live-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Execute current V4 with validated arm control-flow patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path(".github/workflows/phase5-live-spawn-proof-v4.yml")
          s=p.read_text()
          old_loop='            for(let i=0;i<1200;i++){'
          new_loop='            let armed=false;\\n            for(let i=0;i<1200;i++){'
          old_exit='                  process.exitCode=0;\\n                  return;'
          new_exit='                  armed=true;\\n                  break;'
          old_throw='            throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          new_throw='            if(!armed) throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");'
          for old in (old_loop,old_exit,old_throw):
              assert s.count(old)==1,(old,s.count(old))
          s=s.replace(old_loop,new_loop,1).replace(old_exit,new_exit,1).replace(old_throw,new_throw,1)
          marker="      - name: Arm, restart externally, and prove durable recovery\\n        shell: bash\\n        run: |\\n"
          assert s.count(marker)==1
          body=textwrap.dedent(s.split(marker,1)[1])
          Path("/tmp/v4-proof.sh").write_text(body)
          arm_marker="cat >/tmp/arm.mjs <<'NODE'\\n"
          assert body.count(arm_marker)==1
          start=body.index(arm_marker)+len(arm_marker)
          end=body.index("\\nNODE",start)
          arm=body[start:end]+"\\n"
          if "return;" in arm:
              raise SystemExit("phase5_wrapper_illegal_top_level_return_remaining")
          Path("/tmp/arm.mjs").write_text(arm)
          PY
          node --check /tmp/arm.mjs
          bash -n /tmp/v4-proof.sh
          grep -Fq 'observe-once.mjs' /tmp/v4-proof.sh
          bash /tmp/v4-proof.sh
