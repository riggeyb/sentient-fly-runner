name: Phase5 Postgres State CAS Merge
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      expected_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentient
          POSTGRES_PASSWORD: sentient
          POSTGRES_DB: sentient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRANCH: sentient-production-composition-20261017
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@127.0.0.1:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fence exact canonical
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"

      - name: Apply bounded generation-CAS state repair
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/riggeyb/sentient-fly-runner/7054189b6a0f3789a7a1e34e6bc6c2dc179299dc/scripts/phase5-postgres-state-cas-repair.py -o /tmp/repair.py
          python3 /tmp/repair.py
          git diff --check
          git diff -- src/state/postgres-state-repository.ts test/phase5-fly-restart-lease-retry.test.ts

      - name: Install and build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Phase5 targeted
        shell: bash
        run: |
          set -euo pipefail
          node --test             dist/test/phase5-fly-restart-lease-retry.test.js             dist/test/production-collaboration-restart-recovery.test.js             dist/test/active-work-core.test.js             dist/test/active-work-persistence.test.js             dist/test/active-work-restart-edge.test.js             dist/test/active-work-expiry-fencing.test.js             dist/test/phase5-collaborative-convergence.test.js             dist/test/job2-self-execution.test.js             dist/test/local-hf-worker-isolation.test.js

      - name: Phase0 Postgres critical
        shell: bash
        run: |
          set -euo pipefail
          node --test             dist/test/active-work-core.test.js             dist/test/active-work-expiry-fencing.test.js             dist/test/active-work-persistence.test.js             dist/test/active-work-restart-edge.test.js             dist/test/engineering-jobs.test.js             dist/test/objective-continuation.test.js             dist/test/objective-continuation-readiness.test.js             dist/test/permanent-continuation-http.test.js             dist/test/permanent-continuation-multiprocess.test.js             dist/test/phase0-control-recovery.test.js             dist/test/phase0-engineering-readiness.test.js             dist/test/deployment-governor.test.js             dist/test/deployment-governor-boundaries.test.js             dist/test/deployment-governor-skills-fence.test.js

      - name: Phase1-7 cumulative
        shell: bash
        run: |
          set -euo pipefail
          node --test             dist/test/phase1-core-runtime.test.js             dist/test/phase1-acceptance-policy.test.js             dist/test/fly-phase1-acceptance-policy.test.js             dist/test/phase2-skill-execution.test.js             dist/test/phase2-dependency-boundary.test.js             dist/test/action-fabric-authority-reuse.test.js             dist/test/phase3-cognitive-components.test.js             dist/test/phase3-local-hf-adapter.test.js             dist/test/test/production-phase3-cognition.test.js             dist/test/phase4-multistep-autonomy.test.js             dist/test/phase5-collaborative-convergence.test.js             dist/test/production-collaboration-restart-recovery.test.js             dist/test/phase5-fly-restart-lease-retry.test.js             dist/test/test/phase6-capability-integration.test.js             dist/test/production-repository-capability.test.js             dist/test/production-director-capability.test.js             dist/test/phase7-model-improvement.test.js             dist/test/phase7-local-hf-feature-head.test.js             dist/test/production-model-improvement.test.js

      - name: Push exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$EXPECTED_SHA"
          git config user.name sentient-phase5-recovery
          git config user.email sentient-phase5-recovery@users.noreply.github.com
          git add src/state/postgres-state-repository.ts test/phase5-fly-restart-lease-retry.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_PHASE5_CHANGE; exit 1; }
          git commit -m "fix: bound durable state generation contention"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA" origin "HEAD:befs/heads/$BRANCH"
          echo "NEW_SHA=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "PHASE5_DURABLE_STATE_CAS_REPAIR=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
