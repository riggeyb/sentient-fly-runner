name: Phase0 Deploy Sentient Exact
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: a6eb540a33fcb509d7aa3e833096d5d6a88d7167
      T: 07f1d6a0c7990706e06fedd9005b72d925b82d71
      K: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy exact Sentient through recovered Governor
        shell: bash
        run: |
          set -euo pipefail
          app=sentient-deployment-governor
          id="$(flyctl machines list -a "$app" --json | jq -r '.[0].id')"
          flyctl machine start "$id" -a "$app" >/dev/null || true
          for _ in $(seq 1 60); do
            st="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$st" = started ] && break
            sleep 2
          done
          test "$st" = started
          cat >/tmp/deploy.mjs <<'NODE'
          const sha=process.env.S,tree=process.env.T,skillsSha=process.env.K;
          const token=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN??"").trim();
          if(!token) process.exit(20);
          const r=await fetch("http://127.0.0.1:8080/v1/deployments/sentient",{
            method:"POST",
            headers:{authorization:"Bearer "+token,"content-type":"application/json","x-sentient-objective-id":"phase1-7-final-convergence"},
            body:JSON.stringify({sha,tree,skillsSha}),
            signal:AbortSignal.timeout(1100000)
          });
          const v=await r.json().catch(()=>({}));
          console.log(JSON.stringify({httpStatus:r.status,DEPLOYMENT_ID:v.DEPLOYMENT_ID??null,REQUESTED_SHA:v.REQUESTED_SHA??null,REQUESTED_TREE:v.REQUESTED_TREE??null,DEPLOYED_SHA:v.DEPLOYED_SHA??null,DEPLOYED_TREE:v.DEPLOYED_TREE??null,BUILD_RESULT:v.BUILD_RESULT??null,BUILD_FAILURE:v.BUILD_FAILURE??null,HEALTHZ_STATUS:v.HEALTHZ?.statusCode??null,READYZ_STATUS:v.READYZ?.statusCode??null,READYZ_FAILURE:v.READYZ_FAILURE??null,error:v.error??null,reason:v.reason??null}));
          if(!r.ok||v.REQUESTED_SHA!==sha||v.REQUESTED_TREE!==tree||v.DEPLOYED_SHA!==sha||v.DEPLOYED_TREE!==tree||v.BUILD_RESULT!=="SUCCEEDED"||v.HEALTHZ?.statusCode!==200||v.READYZ?.statusCode!==200||v.READYZ_FAILURE!==null) process.exit(21);
          NODE
          b64="$(base64 -w0 /tmp/deploy.mjs)"
          flyctl ssh console -a "$app" -C "sh -lc 'echo $b64 | base64 -d >/tmp/deploy.mjs && S=$S T=$T K=$K node /tmp/deploy.mjs'"
          ok=false
          for _ in $(seq 1 180); do
            h="$(curl -fsS --max-time 5 https://sentient-validation-runner.fly.dev/healthz || true)"
            r="$(curl -fsS --max-time 5 https://sentient-validation-runner.fly.dev/readyz || true)"
            if [ -n "$h" ] && [ -n "$r" ] && grep -Fq "$S" <<<"$h" && grep -Fq "$T" <<<"$h" && grep -Fq "$S" <<<"$r" && grep -Fq "$T" <<<"$r"; then ok=true; break; fi
            sleep 2
          done
          test "$ok" = true
          echo "RUNTIME_SHA=$S"
          echo "RUNTIME_TREE=$T"
          echo "RUNTIME_SHA_MATCH=PASS"
          echo "RUNTIME_TREE_MATCH=PASS"
          echo "HEALTHZ=PASS"
          echo "READYZ=PASS"
          echo "CERTIFICATION_TARGET_READY_TO_FREEZE=true"
          echo "SECRET_VALUES_EXPOSED=false"
