name: Phase0 Deploy Sentient Exact
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: 64d46db2e6a78048a07f81d683ce08ec7d95e367
      T: dd2261700980b3da0764dcfe7e865b6bf3174a29
      K: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy exact Sentient through recovered Governor
        shell: bash
        run: |
          set -euo pipefail
          app=sentient-deployment-governor
          id="$(flyctl machines list -a "$app" --json | jq -r '.[0].id')"
          flyctl machine start "$id" -a "$app" >/dev/null || true
          for _ in $(seq 1 60); do
            st="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$st" = started ] && break
            sleep 2
          done
          test "$st" = started
          cat >/tmp/deploy.mjs <<'NODE'
          const sha=process.env.S, tree=process.env.T, skillsSha=process.env.K;
          const token=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN??"").trim();
          if(!token) process.exit(20);
          const r=await fetch("http://127.0.0.1:8080/v1/deployments/sentient",{
            method:"POST",
            headers:{authorization:"Bearer "+token,"content-type":"application/json","x-sentient-objective-id":"phase0-certification-reconciliation-public"},
            body:JSON.stringify({sha,tree,skillsSha}),
            signal:AbortSignal.timeout(1100000)
          });
          const v=await r.json().catch(()=>({}));
          const safe={
            httpStatus:r.status,error:v.error??null,reason:v.reason??null,
            DEPLOYMENT_ID:v.DEPLOYMENT_ID??null,REQUESTED_SHA:v.REQUESTED_SHA??null,REQUESTED_TREE:v.REQUESTED_TREE??null,
            DEPLOYED_SHA:v.DEPLOYED_SHA??null,DEPLOYED_TREE:v.DEPLOYED_TREE??null,SKILLS_SHA:v.SKILLS_SHA??null,
            BUILD_RESULT:v.BUILD_RESULT??null,BUILD_FAILURE:v.BUILD_FAILURE??null,RATE_LIMIT_STATE:v.RATE_LIMIT_STATE??null,RETRY_LIMIT_STATE:v.RETRY_LIMIT_STATE??null,HEALTHZ_STATUS:v.HEALTHZ?.statusCode??null,
            READYZ_STATUS:v.READYZ?.statusCode??null,READYZ_FAILURE:v.READYZ_FAILURE??null,
            RESOURCE_CHANGE_STATUS:v.RESOURCE_CHANGE_STATUS??null
          };
          console.log(JSON.stringify(safe));
          if(!r.ok || v.REQUESTED_SHA!==sha || v.REQUESTED_TREE!==tree || v.DEPLOYED_SHA!==sha || v.DEPLOYED_TREE!==tree ||
             v.SKILLS_SHA!==skillsSha || v.BUILD_RESULT!=="SUCCEEDED" || v.HEALTHZ?.statusCode!==200 ||
             v.READYZ?.statusCode!==200 || v.READYZ_FAILURE!==null || v.RESOURCE_CHANGE_STATUS!=="APPROVED_BASELINE") process.exit(21);
          NODE
          b64="$(base64 -w0 /tmp/deploy.mjs)"
          flyctl ssh console -a "$app" -C "sh -lc 'echo $b64 | base64 -d >/tmp/deploy.mjs && S=$S T=$T K=$K node /tmp/deploy.mjs'" | tee /tmp/deploy-result.json

          live=false
          for _ in $(seq 1 180); do
            hc="$(curl -sS --max-time 5 -o /tmp/h.json -w '%{http_code}' https://sentient-validation-runner.fly.dev/healthz || true)"
            rc="$(curl -sS --max-time 5 -o /tmp/r.json -w '%{http_code}' https://sentient-validation-runner.fly.dev/readyz || true)"
            if [ "$hc" = 200 ] && [ "$rc" = 200 ] &&
               grep -Fq "$S" /tmp/h.json && grep -Fq "$T" /tmp/h.json &&
               grep -Fq "$S" /tmp/r.json && grep -Fq "$T" /tmp/r.json; then
              live=true
              break
            fi
            sleep 2
          done
          test "$live" = true
          echo "RUNTIME_SHA=$S"
          echo "RUNTIME_TREE=$T"
          echo "RUNTIME_SHA_MATCH=PASS"
          echo "RUNTIME_TREE_MATCH=PASS"
          echo "HEALTHZ=PASS"
          echo "READYZ=PASS"
          echo "LIVE_SENTIENT_EXACT_IDENTITY=PASS"
          echo "CERTIFICATION_TARGET_READY_TO_FREEZE=true"
          echo "SECRET_VALUES_EXPOSED=false"
