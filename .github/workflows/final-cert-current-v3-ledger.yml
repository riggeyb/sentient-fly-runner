name: Final Cert Current V3 Durable Ledger
'on':
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
      session_id: {required: true, type: string}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
      OID: ${{ inputs.objective_id }}
      SID: ${{ inputs.session_id }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read exact durable V3 recovery ledger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          [[ "$SID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          machines="$(flyctl machines list -a "$APP" --json)"
          jq -e --arg s "$SHA" 'any(.[]; ((.config.image // .image_ref.tag // "") | contains($s)))' <<<"$machines" >/dev/null
          mid="$(jq -er '.[0].id' <<<"$machines")"
          state="$(jq -er '.[0].state' <<<"$machines")"
          test "$state" = started
          cat >/tmp/v3-ledger.mjs <<'NODE'
          import {PostgresSpawnObjectiveRepository as Repo} from "/app/dist/src/objective-continuation/postgres-spawn-repository.js";
          const oid=process.env.CERT_OID,sid=process.env.CERT_SID,sha=process.env.CERT_SHA,tree=process.env.CERT_TREE;
          if(process.env.SENTIENT_RUNTIME_SHA!==sha||process.env.SENTIENT_RUNTIME_TREE!==tree) throw Error("EXACT_SOURCE_MISMATCH");
          const db=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          if(!db) throw Error("DB_BINDING_MISSING");
          const repo=new Repo({connectionString:db});
          try{
            const task=await repo.get("task",oid);
            const root=await repo.getObjectiveContinuation(oid);
            const works=(await repo.activeWork(sid,true)).filter(w=>String(w.objectiveId??"").startsWith(oid+":"));
            const spawn=await repo.spawnSnapshot();
            const ids=new Set(works.flatMap(w=>[w.participantId,w.workId].filter(Boolean)));
            const children=spawn.records.executions.filter(e =>
              String(e.identity.taskId??"").startsWith(oid+":") ||
              ids.has(e.requestId) ||
              String(e.id??"").startsWith(`spawn:${oid}:`)
            );
            const out={
              taskStatus:task?.status??null,
              taskUpdatedAt:task?.updatedAt??null,
              rootRevision:root?.revision??null,
              rootTerminal:root?.terminal?.status??null,
              rootTerminalReason:root?.terminal?.reason??null,
              satisfied:(root?.evidenceDependencies??[]).filter(d=>d.status==="SATISFIED").length,
              works:works.map(w=>({
                workId:w.workId,workKey:w.workKey,status:w.status,reclaimCount:w.reclaimCount,
                participantId:w.participantId,reservationState:w.reservationState,revision:w.revision,
                leaseExpiresAt:w.leaseExpiresAt
              })),
              children:children.map(e=>({
                id:e.id,requestId:e.requestId,role:e.identity.role,status:e.identity.status,
                reservationReconciled:e.reservationReconciled,
                completionReason:e.completion?.reason??null
              }))
            };
            console.log("CURRENT_V3_LEDGER="+JSON.stringify(out));
            console.log("EXACT_SOURCE_IDENTITY=PASS");
            console.log("SECRET_VALUES_EXPOSED=false");
          }finally{await repo.close();}
          NODE
          b="$(base64 -w0 /tmp/v3-ledger.mjs)"
          timeout 70s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b|base64 -d >/tmp/v3-ledger-${GITHUB_RUN_ID}.mjs; CERT_OID=$OID CERT_SID=$SID CERT_SHA=$SHA CERT_TREE=$TREE node /tmp/v3-ledger-${GITHUB_RUN_ID}.mjs; rc=\$?; rm -f /tmp/v3-ledger-${GITHUB_RUN_ID}.mjs; exit \$rc'"
