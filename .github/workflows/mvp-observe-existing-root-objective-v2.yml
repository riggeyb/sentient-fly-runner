name: MVP Observe Existing Root Objective V2
"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
permissions: {contents: read}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
      OID: ${{ inputs.objective_id }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify live identity over Fly SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          cat >"$RUNNER_TEMP/identity.mjs" <<'NODE'
          const sha=process.env.SHA, tree=process.env.TREE;
          const h=await (await fetch("http://127.0.0.1:8080/healthz",{signal:AbortSignal.timeout(8000)})).json();
          const r=await (await fetch("http://127.0.0.1:8080/readyz",{signal:AbortSignal.timeout(8000)})).json();
          if(h?.application?.identity?.source?.sha!==sha || h?.application?.identity?.source?.tree!==tree) throw new Error("health_identity_mismatch");
          if(r?.ready!==true || r?.identity?.source?.sha!==sha || r?.identity?.source?.tree!==tree) throw new Error("ready_identity_mismatch");
          console.log("LIVE_EXACT_IDENTITY=PASS");
          NODE
          b64="$(base64 -w0 "$RUNNER_TEMP/identity.mjs")"
          timeout 120s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/identity.mjs; SHA=$SHA TREE=$TREE node /tmp/identity.mjs; rc=\$?; rm -f /tmp/identity.mjs; exit \$rc'"
      - name: GET only existing objective
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/read.mjs" <<'NODE'
          const oid=process.env.CERT_OBJECTIVE_ID;
          const token=process.env.SENTIENT_API_TOKEN;
          if(!oid||!token) throw new Error("binding_missing");
          let b=null,e=null;
          for(let i=0;i<60;i++){
            try{
              const r=await fetch(`http://127.0.0.1:8080/v1/objectives/${encodeURIComponent(oid)}`,{
                headers:{authorization:`Bearer ${token}`},signal:AbortSignal.timeout(8000)
              });
              if(!r.ok) throw new Error(`http_${r.status}`);
              b=await r.json(); break;
            }catch(x){e=x; await new Promise(r=>setTimeout(r,1000));}
          }
          if(!b) throw e??new Error("no_body");
          const p=b.rootProjection??null;
          const x=b?.result?.body?.result??{};
          const c=String(x.authoritativeContent??"");
          console.log("ROOT_OBS="+JSON.stringify({
            objectiveId:b.objectiveId??oid,status:b.status??null,rootProjectionPresent:!!p,
            rootStatus:p?.rootStatus??null,currentPhase:p?.currentPhase??null,
            contextVersion:p?.operatingContextVersion??null,contextDigest:p?.operatingContextDigest??null,
            participantContexts:Array.isArray(p?.participantOperatingContexts)?p.participantOperatingContexts.length:0,
            staleContexts:Array.isArray(p?.staleOperatingContextWorkers)?p.staleOperatingContextWorkers.length:0,
            acceptedEvidence:Array.isArray(p?.acceptedEvidence)?p.acceptedEvidence.length:0,
            workers:Array.isArray(p?.workers)?p.workers.length:0,
            subOrchestrators:Array.isArray(p?.subOrchestrators)?p.subOrchestrators.length:0,
            blockers:Array.isArray(p?.blockers)?p.blockers.length:0,
            proofStatus:p?.proofStatus??null,waitingAuthority:p?.waitingAuthority??null,
            finalResultPresent:typeof p?.finalResult==="string"&&p.finalResult.trim().length>0,
            contractVersion:x.contractVersion??null,missionControlStatus:x.status??null,
            contextNotAuthority:x.operatingContextIsNotAuthority??null,
            workerEffectsCanonical:x.workerEffectsCanonical??null,
            sourceRepoKnown:c.includes("riggeyb/sentient"),
            operatorBridgeKnown:c.includes("riggeyb/sentient-fly-runner")
          }));
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          b64="$(base64 -w0 "$RUNNER_TEMP/read.mjs")"
          timeout 180s flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/read.mjs; CERT_OBJECTIVE_ID=$OID node /tmp/read.mjs; rc=\$?; rm -f /tmp/read.mjs; exit \$rc'"
