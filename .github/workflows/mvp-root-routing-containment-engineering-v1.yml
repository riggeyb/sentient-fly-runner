name: MVP Root Routing Containment Engineering V1

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Exact engineering branch
        required: true
        type: string
      expected_sha:
        description: Exact branch head before mutation
        required: true
        type: string
      expected_tree:
        description: Exact tree before mutation
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Sentient engineering branch
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.branch }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: sentient

      - name: Fence exact source and apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/mvp-root-routing-containment-v1.py.part00 \
              scripts/mvp-root-routing-containment-v1.py.part01 \
              scripts/mvp-root-routing-containment-v1.py.part02 \
              scripts/mvp-root-routing-containment-v1.py.part03 \
              > /tmp/mvp-root-routing-containment-v1.py
          python3 -m py_compile /tmp/mvp-root-routing-containment-v1.py
          test "$(git -C sentient rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git -C sentient rev-parse HEAD^{tree})" = "${{ inputs.expected_tree }}"
          test -z "$(git -C sentient status --porcelain)"
          python3 /tmp/mvp-root-routing-containment-v1.py
          cd sentient
          git diff --check
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          expected="$(printf '%s\n' \
            src/application/production-collaboration.ts \
            src/application/production-mission-control-context.ts \
            src/spawn/selection.ts \
            test/mvp-root-routing-containment-v1.test.ts | sort)"
          test "$actual" = "$expected"
          git status --short

      - name: Build and deterministic acceptance
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node --test dist/test/mvp-root-routing-containment-v1.test.js
          npm test

      - name: Commit and concurrency-safe push
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          git config user.name "sentient-mvp-root-engineering"
          git config user.email "sentient-mvp-root-engineering@users.noreply.github.com"
          git add \
            src/application/production-collaboration.ts \
            src/application/production-mission-control-context.ts \
            src/spawn/selection.ts \
            test/mvp-root-routing-containment-v1.test.ts
          git diff --cached --check
          git commit -m "mvp: repair root cognition routing and containment"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          git fetch origin "${{ inputs.branch }}"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          test "$remote_sha" = "${{ inputs.expected_sha }}"
          git push origin "HEAD:refs/heads/${{ inputs.branch }}"
          echo "SUCCESSOR_SHA=$new_sha"
          echo "SUCCESSOR_TREE=$new_tree"
          echo "TRACKED_SOURCE_MUTATION=false"
