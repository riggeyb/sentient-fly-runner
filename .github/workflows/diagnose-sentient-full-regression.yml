name: Diagnose Sentient Full Regression

on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ inputs.sha }}
      TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
    steps:
      - name: Checkout exact source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout https://github.com/riggeyb/sentient.git sentient
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$CANDIDATE_SHA"
          git -C sentient checkout --detach "$CANDIDATE_SHA"
          git -C sentient remote set-url origin disabled://sentient
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: sentient
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Diagnose full regression
        working-directory: sentient
        shell: bash
        run: |
          set +e
          node --test dist/test/*.test.js > /tmp/full-regression.log 2>&1
          code=$?
          echo "FAILURE_INDEX>"
          grep -n -E '(^not ok|failureType:|error:|code:|actual:|expected:|stack:)' /tmp/full-regression.log | tail -n 180 || true
          echo "FAILURE_TAIL>"
          tail -n 80 /tmp/full-regression.log
          exit "$code"
