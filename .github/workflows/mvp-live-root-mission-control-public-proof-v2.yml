name: MVP Live Root Mission Control Public Proof V2

"on":
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}

permissions: {contents: read}

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DIRECTOR_SENTIENT_TOKEN: ${{ secrets.DIRECTOR_SENTIENT_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify exact resident runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DIRECTOR_SENTIENT_TOKEN:-}" || { echo DIRECTOR_SENTIENT_TOKEN_PRESENT=false; exit 1; }
          for i in $(seq 1 45); do
            h="$(curl -fsS --max-time 12 "https://${APP}.fly.dev/healthz" 2>/dev/null || true)"
            r="$(curl -fsS --max-time 12 "https://${APP}.fly.dev/readyz" 2>/dev/null || true)"
            if jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.application.identity.source.sha==$s and .application.identity.source.tree==$t' >/dev/null 2>&1 <<<"$h" &&
               jq -e --arg s "$EXPECTED_SHA" --arg t "$EXPECTED_TREE" '.ready==true and .identity.source.sha==$s and .identity.source.tree==$t' >/dev/null 2>&1 <<<"$r" &&
               jq -e '.bindings[] | select(.name=="ROOT_MISSION_CONTROL" and .availability=="AVAILABLE")' >/dev/null 2>&1 <<<"$r" &&
               jq -e '.bindings[] | select(.name=="POSTGRES_STATE" and .availability=="AVAILABLE")' >/dev/null 2>&1 <<<"$r"; then
              echo LIVE_EXACT_IDENTITY=PASS
              echo DIRECTOR_SENTIENT_TOKEN_PRESENT=true
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify legacy and scoped auth then execute harmless Root objective
        shell: bash
        run: |
          set -euo pipefail
          OBJ="mvp-director-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cat >"$RUNNER_TEMP/legacy-auth.mjs" <<'NODE'
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          if(!token) throw new Error("sentient_api_token_missing");
          const base="http://127.0.0.1:8080";
          let r=await fetch(base+"/v1/objectives/auth-probe-legacy",{signal:AbortSignal.timeout(30000)});
          if(r.status!==401) throw new Error(`legacy_missing_status_${r.status}`);
          r=await fetch(base+"/v1/objectives/auth-probe-legacy",{
            headers:{authorization:`Bearer ${token}`},
            signal:AbortSignal.timeout(30000)
          });
          if(r.status!==404) throw new Error(`legacy_auth_status_${r.status}`);
          console.log("EXISTING_SENTIENT_API_AUTH_LIVE=PASS");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          B64_LEGACY="$(base64 -w0 "$RUNNER_TEMP/legacy-auth.mjs")"
          timeout 120s flyctl ssh console -a "$APP" -C \
            "sh -lc 'echo $B64_LEGACY | base64 -d >/tmp/legacy-auth.mjs && node /tmp/legacy-auth.mjs; rc=\$?; rm -f /tmp/legacy-auth.mjs; exit \$rc'" \
            | tee "$RUNNER_TEMP/legacy-auth.out"
          grep -Fq 'EXISTING_SENTIENT_API_AUTH_LIVE=PASS' "$RUNNER_TEMP/legacy-auth.out"

          cat >"$RUNNER_TEMP/director-proof.mjs" <<'NODE'
          const token=String(process.env.DIRECTOR_SENTIENT_TOKEN??"").trim();
          if(!token) throw new Error("director_sentient_token_missing");
          const objectiveId=process.env.CERT_OBJECTIVE_ID;
          const base="https://sentient-validation-runner.fly.dev";
          const sleep=ms=>new Promise(x=>setTimeout(x,ms));
          async function get(path, auth) {
            const headers=auth?{authorization:auth}:{};
            return fetch(base+path,{headers,signal:AbortSignal.timeout(30000)});
          }

          let r=await get("/v1/objectives/auth-probe-missing");
          if(r.status!==401) throw new Error(`missing_token_${r.status}`);
          r=await get("/v1/objectives/auth-probe-invalid","Bearer definitely-invalid");
          if(r.status!==401) throw new Error(`invalid_token_${r.status}`);
          r=await get("/v1/objectives/auth-probe-not-found",`Bearer ${token}`);
          if(r.status!==404) throw new Error(`director_status_auth_${r.status}`);
          r=await get("/v1/engineering/jobs/auth-probe-not-found",`Bearer ${token}`);
          if(r.status!==401) throw new Error(`director_scope_expanded_${r.status}`);

          console.log("NO_TOKEN_REJECT=PASS");
          console.log("INVALID_TOKEN_REJECT=PASS");
          console.log("DIRECTOR_STATUS_AUTH_LIVE=PASS");
          console.log("DIRECTOR_PRIVILEGED_SCOPE_REJECT=PASS");
          console.log("AUTHORITY_EXPANSION=false");

          const headers={authorization:`Bearer ${token}`,"content-type":"application/json"};
          const request=[
            "Inspect your current production system and tell me the highest-value improvement you can safely make next.",
            "Use inherited operating context to identify the authoritative source repository and normal operator bridge.",
            "Read-only TIER_0 proof only: do not edit source, open a PR, deploy, or mutate external systems."
          ].join(" ");

          r=await fetch(base+"/v1/objectives",{method:"POST",headers,body:JSON.stringify({
            objectiveId,
            sessionId:`session:${objectiveId}`,
            request,
            mode:"collaborative",
            privacy:"private",
            deployOnSuccess:false
          }),signal:AbortSignal.timeout(600000)});
          let body=await r.json();
          if(r.status!==202||body.objectiveId!==objectiveId) throw new Error(`ingress_${r.status}`);
          console.log("DIRECTOR_OBJECTIVE_CREATE_AUTH_LIVE=PASS");

          const end=Date.now()+12*60_000;
          let lastStatus="";
          while(Date.now()<end){
            try {
              r=await fetch(base+`/v1/objectives/${encodeURIComponent(objectiveId)}`,{headers,signal:AbortSignal.timeout(30000)});
              if(r.status===401) throw new Error("director_status_auth_lost");
              if(r.status!==200){ await sleep(1000); continue; }
              body=await r.json();
              lastStatus=String(body.status??"");
              if(["succeeded","failed","cancelled"].includes(lastStatus)) break;
            } catch (e) {
              if(String(e?.message??e)==="director_status_auth_lost") throw e;
            }
            await sleep(1000);
          }
          if(body?.status!=="succeeded") throw new Error(`objective_${body?.status??lastStatus??"unknown"}`);
          const p=body.rootProjection;
          if(!p||p.objectiveId!==objectiveId) throw new Error("root_projection_missing");
          if(p.operatingContextVersion!=="SENTIENT_OPERATING_CONTEXT_V1") throw new Error("context_version_mismatch");
          if(p.operatingContextDigest!=="sha256:ef32887bbc1736dce2ed5a73a90a628160edede479bd686ce47cdf0f7507e209") throw new Error("context_digest_mismatch");
          if(Array.isArray(p.staleOperatingContextWorkers)&&p.staleOperatingContextWorkers.length!==0) throw new Error("stale_child_context");
          if(typeof p.finalResult!=="string"||!p.finalResult.trim()) throw new Error("final_root_result_missing");

          const result=body?.result?.body?.result??{};
          if(result.contractVersion!=="sentient-production-mission-control/v1"||result.status!=="SUCCEEDED") throw new Error("mission_control_result_invalid");
          if(result.operatingContextIsNotAuthority!==true||result.workerEffectsCanonical!==false) throw new Error("authority_boundary_invalid");
          const content=String(result.authoritativeContent??"");
          if(!content.includes("riggeyb/sentient")) throw new Error("source_repo_not_derived");
          if(!content.includes("riggeyb/sentient-fly-runner")) throw new Error("operator_bridge_not_derived");

          console.log("OBJECTIVE_ID="+objectiveId);
          console.log("DIRECTOR_SCOPED_AUTH_LIVE=PASS");
          console.log("ROOT_MISSION_CONTROL_USED=PASS");
          console.log("ROOT_PROJECTION_OBSERVED=PASS");
          console.log("C1_COORDINATION_OBSERVED=PASS");
          console.log("SOURCE_REPO_KNOWN_AUTOMATICALLY=PASS");
          console.log("OPERATOR_BRIDGE_KNOWN_AUTOMATICALLY=PASS");
          console.log("OPERATING_CONTEXT_IS_NOT_AUTHORITY=true");
          console.log("GOVERNOR_BYPASS_USED=false");
          console.log("DEPLOY_ON_SUCCESS=false");
          console.log("FINAL_ROOT_RESULT_PRESENT=true");
          console.log("FINAL_ROOT_RESULT_JSON="+JSON.stringify(p.finalResult.slice(0,6000)));
          NODE
          CERT_OBJECTIVE_ID="$OBJ" node "$RUNNER_TEMP/director-proof.mjs" | tee "$RUNNER_TEMP/director-proof.out"
          grep -Fq 'DIRECTOR_SCOPED_AUTH_LIVE=PASS' "$RUNNER_TEMP/director-proof.out"
          grep -Fq 'ROOT_MISSION_CONTROL_USED=PASS' "$RUNNER_TEMP/director-proof.out"
          grep -Fq 'ROOT_PROJECTION_OBSERVED=PASS' "$RUNNER_TEMP/director-proof.out"
          grep -Fq 'FINAL_ROOT_RESULT_PRESENT=true' "$RUNNER_TEMP/director-proof.out"
          echo LIVE_ROOT_OBJECTIVE_PROOF=PASS
