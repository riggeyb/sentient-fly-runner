name: Stronger Sentient Context Compiler V0 Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Sentient candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: false
          fetch-depth: 0

      - name: Guard candidate identity and source scope
        working-directory: sentient
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"
          git cat-file -e "$BASELINE_SHA^{commit}"
          test "$(git show -s --format=%T "$BASELINE_SHA")" = "$BASELINE_TREE"

          git diff --name-only "$BASELINE_SHA" "$EXPECTED_SHA" | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'SCOPE'
          src/retrieval/context-compiler.ts
          src/retrieval/context-compressor.ts
          src/retrieval/index.ts
          src/runtime/sentient-runtime.ts
          test/context-compiler-v0.test.ts
          SCOPE
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

          git diff --exit-code "$BASELINE_SHA" "$EXPECTED_SHA" --             src/model             src/state             src/deployment-governor             src/production             src/action-fabric

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        working-directory: sentient
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Run Context Compiler V0 proofs
        working-directory: sentient
        run: node --test dist/test/context-compiler-v0.test.js

      - name: Run full repository tests
        working-directory: sentient
        run: npm test

      - name: Guard invariants and emit receipt
        working-directory: sentient
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "$(git show -s --format=%T HEAD)" = "${{ inputs.tree }}"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CONTEXT_COMPILER_V0_VALIDATION=PASS"
          echo "SHADOW_MODE_VALIDATED=true"
          echo "COGNITION_ARTIFACT_V1_CHANGED=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "GOVERNOR_BYPASS=false"
          echo "PROVIDER_CALLS=0"
          echo "PRODUCTION_DEPLOYMENT=false"
