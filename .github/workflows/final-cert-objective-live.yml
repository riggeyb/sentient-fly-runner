name: Final Cert Objective Live
"on":
  workflow_dispatch:
    inputs:
      certification_id: {required: true, type: string}
      kind:
        required: true
        type: choice
        options: [phase2, phase6, phase4]
permissions: {contents: read}
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      CERTIFICATION_ID: ${{ inputs.certification_id }}
      CERT_KIND: ${{ inputs.kind }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - shell: bash
        run: |
          set -euo pipefail
          node --check scripts/final-cert-objective.mjs
          B64="$(base64 -w0 scripts/final-cert-objective.mjs)"
          P="${CERTIFICATION_ID}:run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $B64 | base64 -d >/tmp/final-cert-objective.mjs && CERT_ID=$P CERT_KIND=$CERT_KIND node /tmp/final-cert-objective.mjs; rc=\$?; rm -f /tmp/final-cert-objective.mjs; exit \$rc'" | tee /tmp/out
          grep -Fq 'SECRET_VALUES_EXPOSED=false' /tmp/out
