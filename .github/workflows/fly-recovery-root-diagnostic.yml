name: Sentient Recovery Root Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-governor-recovery-root
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect sanitized recovery ledger
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machines list -a "$APP" --json)"
          id="$(printf '%s' "$machines" | jq -r '.[0].id // empty')"
          test -n "$id"
          flyctl machine start "$id" -a "$APP" >/dev/null || true
          for _ in $(seq 1 60); do
            state="$(flyctl machines list -a "$APP" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = started ] && break
            sleep 2
          done
          test "$state" = started
          cat >/tmp/diag.mjs <<'NODE'
          import pg from "pg";
          const names=["SENTIENT_GOVERNOR_RECOVERY_API_TOKEN","SENTIENT_GOVERNOR_RECOVERY_FLY_TOKEN","SENTIENT_DATABASE_BOOTSTRAP_URL","SENTIENT_SOURCE_GITHUB_TOKEN"];
          for(const name of names) console.log(`${name}_PRESENT=${Boolean(String(process.env[name]??"").trim())}`);
          const cs=String(process.env.SENTIENT_DATABASE_BOOTSTRAP_URL??"").trim();
          if(!cs) process.exit(20);
          const {Pool}=pg;
          const pool=new Pool({connectionString:cs,max:1,connectionTimeoutMillis:10000});
          try{
            const q=await pool.query(`
              SELECT recovery_id,requested_sha,requested_tree,observed_sha,observed_tree,status,error_code,diagnostic,started_at,completed_at
              FROM sentient_deployment_governor.governor_recovery_receipts
              ORDER BY started_at DESC LIMIT 3
            `);
            console.log("RECOVERY_LEDGER="+JSON.stringify(q.rows.map(r=>({
              recoveryId:r.recovery_id,requestedSha:r.requested_sha,requestedTree:r.requested_tree,
              observedSha:r.observed_sha,observedTree:r.observed_tree,status:r.status,errorCode:r.error_code,
              diagnostic:String(r.diagnostic??"").slice(0,1024),startedAt:r.started_at,completedAt:r.completed_at
            }))));
          } finally { await pool.end(); }
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          b64="$(base64 -w0 /tmp/diag.mjs)"
          flyctl ssh console -a "$APP" --machine "$id" -C "sh -lc 'cd /app && echo $b64 | base64 -d >/tmp/diag.mjs && node /tmp/diag.mjs; rc=\$?; rm -f /tmp/diag.mjs; exit \$rc'"
