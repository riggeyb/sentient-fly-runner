name: Sentient Capability Tier Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentient-capability-tier-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and validate bounded rev8 EngineeringJob request
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/capability-tier-hardening-rev8-build-request.cjs
          node scripts/capability-tier-hardening-rev8-build-request.cjs > /tmp/request.json
          node - <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/request.json","utf8"));
          if(r.repo!=="riggeyb/sentient" ||
             r.branch!=="sentient-production-composition-20261017" ||
             r.expectedHead!=="5ce976089532a86ac262a2760367318b6f4b72a5" ||
             !Array.isArray(r.commands) || r.commands.length<10 || r.commands.length>32 ||
             r.commands.some(c=>!Array.isArray(c.args)||c.args.length>64||
               c.args.some(a=>typeof a!=="string"||a.length>8192)||
               c.timeoutMs<1000||c.timeoutMs>600000) ||
             r.commands.reduce((n,c)=>n+c.timeoutMs,0)>r.timeoutMs ||
             r.timeoutMs>1800000 ||
             r.commands.at(-1)?.category!=="test") throw Error("REV8_REQUEST_INVALID");
          const names=new Set(r.commands.map(c=>c.name));
          for(const required of ["prebuild","apply","compat-phase0","compat-job2","compat-valid-spawn-tier-fixture","postbuild","authority-tests","governor-tests","diff-check"]) {
            if(!names.has(required)) throw Error("REV8_REQUIRED_STEP_MISSING:"+required);
          }
          const forbidden=/deploy|resize|gpu|paid|secret|resource[-_ ]?increase/i;
          if(r.commands.some(c=>forbidden.test(c.name))) throw Error("REV8_FORBIDDEN_EFFECT_COMMAND");
          if(names.has("diagnostic-stop")) throw Error("REV8_DIAGNOSTIC_STOP_PRESENT");
          console.log("REV8_REQUEST_VALIDATED=true");
          console.log("PRIVATE_ACTIONS_BRIDGE_USED=false");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
      - name: Create bounded EngineeringJob
        env:
          MCP_CLIENT_TOKEN: ${{ secrets.MCP_CLIENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args="$(cat /tmp/request.json)"
          OPERATION=engineering_create ARGUMENTS="$args" node operator.mjs
