name: Sentient Phase 5 Live Restart Reclaim Proof
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  phase5-live-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPECTED_TREE: ${{ inputs.tree }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Interrupt exactly one active Spawn child and recover exact runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          OBJ="phase5-restart-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SESSION="session-${OBJ}"

          ok=false
          for _ in $(seq 1 120); do
            r="$(curl -fsS --max-time 5 https://sentient-validation-runner.fly.dev/readyz || true)"
            if [ -n "$r" ] && grep -Fq "$EXPECTED_SHA" <<<"$r" && grep -Fq "$EXPECTED_TREE" <<<"$r" && grep -Fq '"ready":true' <<<"$r"; then
              ok=true; break
            fi
            sleep 2
          done
          test "$ok" = true
          echo "PHASE5_PRE_INTERRUPT_IDENTITY=PASS"

          cat >/tmp/arm.mjs <<'NODE'
          import fs from "node:fs";
          import { PostgresSpawnObjectiveRepository } from "/app/dist/src/objective-continuation/postgres-spawn-repository.js";
          const objectiveId=process.env.PHASE5_OBJECTIVE_ID;
          const sessionId=process.env.PHASE5_SESSION_ID;
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const db=String(process.env.DATABASE_URL??process.env.DIRECT_URL??"").trim();
          if(!objectiveId||!sessionId||!token||!db) throw new Error("PHASE5_RUNTIME_BINDING_MISSING");
          const repo=new PostgresSpawnObjectiveRepository({connectionString:db});
          const response=await fetch("http://127.0.0.1:8080/v1/objectives",{
            method:"POST",
            headers:{authorization:`Bearer ${token}`,"content-type":"application/json"},
            body:JSON.stringify({
              request:"Independently analyze restart-safe durable collaboration, verify it, and converge under Sentient authority.",
              objectiveId,sessionId,mode:"collaborative",privacy:"public_fixture"
            }),
            signal:AbortSignal.timeout(10000)
          });
          if(response.status!==202) throw new Error(`PHASE5_OBJECTIVE_HTTP_${response.status}`);
          let armed=null;
          for(let i=0;i<1200;i++){
            const work=(await repo.activeWork(sessionId,true)).find(
              row=>row.objectiveId===objectiveId&&row.workKey==="independent-analysis"&&row.status==="ACTIVE"
            );
            if(work){
              const snapshot=await repo.spawnSnapshot();
              const child=snapshot.records.executions.find(
                row=>row.requestId===work.participantId
                  && ["reserved","running"].includes(row.identity.status)
                  && row.reservationReconciled===false
              );
              if(child){armed={work,child};break;}
            }
            await new Promise(resolve=>setTimeout(resolve,50));
          }
          if(!armed) throw new Error("PHASE5_INTERRUPT_WINDOW_NOT_OBSERVED");
          fs.writeSync(1,JSON.stringify({
            event:"PHASE5_INTERRUPT_ARMED",objectiveId,sessionId,
            workId:armed.work.workId,requestId:armed.work.participantId,
            childExecutionId:armed.child.id
          })+"\n");
          fs.writeSync(1,"PHASE5_INTERRUPT_ARMED=PASS\n");
          await new Promise(resolve=>setTimeout(resolve,100));
          process.kill(1,"SIGKILL");
          await new Promise(()=>{});
          NODE

          B64="$(base64 -w0 /tmp/arm.mjs)"
          set +e
          OUT="$(flyctl ssh console -a "$APP" -C "sh -lc 'cd /app && echo $B64 | base64 -d >/tmp/arm.mjs && PHASE5_OBJECTIVE_ID=$OBJ PHASE5_SESSION_ID=$SESSION node /tmp/arm.mjs'" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          grep -Fq "PHASE5_INTERRUPT_ARMED=PASS" <<<"$OUT"
          echo "PHASE5_PROCESS_INTERRUPTED=PASS"
          echo "PHASE5_INTERRUPT_COMMAND_RC=$RC"

          ok=false
          for _ in $(seq 1 180); do
            r="$(curl -fsS --max-time 5 https://sentient-validation-runner.fly.dev/readyz || true)"
            if [ -n "$r" ] && grep -Fq "$EXPECTED_SHA" <<<"$r" && grep -Fq "$EXPECTED_TREE" <<<"$r" && grep -Fq '"ready":true' <<<"$r"; then
              ok=true; break
            fi
            sleep 2
          done
          test "$ok" = true
          echo "PHASE5_FLY_RESIDENT_RESTART=PASS"
          echo "PHASE5_POST_RESTART_IDENTITY=PASS"
          echo "PHASE5_OBJECTIVE_ID=$OBJ"
          echo "PHASE5_SESSION_ID=$SESSION"
          echo "SECRET_VALUES_EXPOSED=false"
