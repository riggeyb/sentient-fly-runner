name: Phase0 Provision Engineering Request Token
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-provision-engineering-request-token
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GOVERNOR_APP: sentient-deployment-governor
      TARGET_APP: sentient-validation-runner
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Provision distinct engineering request authority
        shell: bash
        run: |
          set -euo pipefail
          engineering_token="$(openssl rand -hex 32)"
          test -n "$engineering_token"
          echo "::add-mask::$engineering_token"
          flyctl secrets set --app "$GOVERNOR_APP" SENTIENT_ENGINEERING_API_TOKEN="$engineering_token" >/dev/null
          flyctl secrets set --app "$TARGET_APP" SENTIENT_ENGINEERING_API_TOKEN="$engineering_token" >/dev/null
          unset engineering_token

          for app in "$GOVERNOR_APP" "$TARGET_APP"; do
            ready=false
            for _ in $(seq 1 90); do
              machines="$(flyctl machines list -a "$app" --json)"
              id="$(printf '%s' "$machines" | jq -r '.[0].id // empty')"
              state="$(printf '%s' "$machines" | jq -r '.[0].state // empty')"
              if [ -n "$id" ] && [ "$state" = started ]; then
                set +e
                flyctl ssh console -a "$app" -C "node -e 'const e=String(process.env.SENTIENT_ENGINEERING_API_TOKEN||\"\");const d=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN||\"\");if(!e||!d||e===d)process.exit(2)'" >/dev/null 2>&1
                rc=$?
                set -e
                if [ "$rc" -eq 0 ]; then ready=true; break; fi
              fi
              sleep 2
            done
            test "$ready" = true
          done
          echo "ENGINEERING_REQUEST_AUTHORITY_PROVISIONED=PASS"
          echo "CREDENTIAL_AUTHORITY_SEPARATION=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
