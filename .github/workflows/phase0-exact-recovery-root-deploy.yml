name: Phase0 Exact Recovery Root Deploy
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-phase0-recovery-root-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: dcd7a5a8df4d504d8e173403073b10bc6ef2ec2b
      TARGET_TREE: 5bac8a69d2333b723b2258904f83f4a82634b85d
      RECOVERY_APP: sentient-governor-recovery-root
      RECOVERY_POLICY_REVISION: SENTIENT_GOVERNOR_RECOVERY_V1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: dcd7a5a8df4d504d8e173403073b10bc6ef2ec2b
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact source and focused recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          npm install --package-lock=false --no-audit --no-fund
          npm run build
          node --test dist/test/recovery-executor.test.js

      - name: Install fixed Fly CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://fly.io/install.sh | sh -s 0.4.89
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy existing recovery root and verify
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          export PATH="$HOME/.fly/bin:$PATH"
          flyctl deploy --app "$RECOVERY_APP" --config fly.recovery.toml --remote-only --yes --ha=false
          machines="$(flyctl machines list --app "$RECOVERY_APP" --json)"
          test "$(printf '%s' "$machines" | jq 'length')" -ge 1
          printf '%s' "$machines" | jq -e 'all(.[]; .state=="started")' >/dev/null
          healthy=false
          for _ in $(seq 1 90); do
            code="$(curl -sS --max-time 5 -o /tmp/health.json -w '%{http_code}' "https://${RECOVERY_APP}.fly.dev/healthz" || true)"
            if [ "$code" = "200" ] && jq -e --arg rev "$RECOVERY_POLICY_REVISION" '.status=="ok" and .role=="INDEPENDENT_FLY_GOVERNOR_RECOVERY_ROOT" and .recoveryPolicyRevision==$rev and .oldGovernorRequired==false and .netlifyRequired==false and .githubActionsRequiredForRecoveryDesign==false' /tmp/health.json >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = "true"
