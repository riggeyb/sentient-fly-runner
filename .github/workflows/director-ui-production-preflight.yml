      - name: Verify canonical front door is still protected
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/head" -w '%{http_code}' --max-time 20 "$CANONICAL_URL/" || true)"
          test "$code" != "200"
          echo "CANONICAL_UNAUTH_STATUS=$code"
          echo "CLOUDFLARE_ACCESS_STILL_ENFORCED=true"
      - name: Final preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo "ACTIVE_CONFLICTING_DIRECTOR_DEPLOYS=0"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "DIRECTOR_UI_PRODUCTION_PREFLIGHT=PASS"
