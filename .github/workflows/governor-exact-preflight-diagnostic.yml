name: Governor Exact Preflight Diagnostic
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      S: ${{ inputs.sha }}
      PROD: 3ce2b2e2104a1000a7a82b4cb0e465bdc1789282
      TREE: f4cebc41c4775b09ce5f0279b5cb12d4cad52a01
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Two-ref ancestry and resource fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROD"
          git fetch origin "$S"
          test "$(git rev-parse FETCH_HEAD)" = "$S"
          test "$(git rev-parse "$S^{tree}")" = "$TREE"
          if git merge-base --is-ancestor "$PROD" "$S"; then
            echo "PRODUCTION_IS_ANCESTOR_OF_TARGET=true"
          else
            echo "PRODUCTION_IS_ANCESTOR_OF_TARGET=false"
            exit 22
          fi
          git diff --exit-code "$PROD" "$S" -- fly.toml
          echo "FLY_RESOURCE_ENVELOPE_CHANGED=false"
          echo "TWO_REF_PREFLIGHT=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
