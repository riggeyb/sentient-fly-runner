name: Governor Exact Preflight Diagnostic
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: ${{ inputs.sha }}
      APP: sentient-deployment-governor
      BRANCH: sentient-production-composition-20261017
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Reproduce Governor source preflight read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$S" =~ ^[0-9a-f]{40}$ ]]
          cat >/tmp/preflight.sh <<'SH'
          set -eu
          s="$S"
          branch="$BRANCH"
          echo "GOVERNOR_PREFLIGHT_SHA=$s"
          echo "GOVERNOR_PREFLIGHT_DISK_BEGIN"
          df -h / /tmp 2>/dev/null || true
          df -i / /tmp 2>/dev/null || true
          echo "GOVERNOR_PREFLIGHT_TMP_COUNT=$(find /tmp -maxdepth 1 -type d -name 'sentient-governor-source-*' 2>/dev/null | wc -l | tr -d ' ')"
          root="$(mktemp -d /tmp/sentient-governor-preflight-XXXXXX)"
          repo="$root/sentient"
          trap 'rm -rf "$root"' EXIT
          token="${SENTIENT_SOURCE_GITHUB_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "GOVERNOR_PREFLIGHT_SOURCE_CREDENTIAL=PRESENT_FALSE"
            exit 20
          fi
          echo "GOVERNOR_PREFLIGHT_SOURCE_CREDENTIAL=PRESENT_TRUE"
          basic="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          export GIT_TERMINAL_PROMPT=0
          stage=init
          git init --quiet "$repo"
          stage=remote
          git -C "$repo" remote add origin https://github.com/riggeyb/sentient.git
          stage=fetch
          if ! git -C "$repo" fetch --quiet --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
            echo "GOVERNOR_PREFLIGHT_FAILURE_STAGE=$stage"
            exit 21
          fi
          echo "GOVERNOR_PREFLIGHT_FETCH=PASS"
          stage=ancestor
          if ! git -C "$repo" merge-base --is-ancestor "$s" "refs/remotes/origin/$branch"; then
            echo "GOVERNOR_PREFLIGHT_FAILURE_STAGE=$stage"
            exit 22
          fi
          echo "GOVERNOR_PREFLIGHT_ANCESTOR=PASS"
          stage=object
          git -C "$repo" cat-file -t "$s" | sed 's/^/GOVERNOR_PREFLIGHT_OBJECT_TYPE=/'
          stage=checkout
          set +e
          out="$(git -C "$repo" checkout --detach "$s" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "GOVERNOR_PREFLIGHT_FAILURE_STAGE=$stage"
            echo "$out" | sed -E 's/(x-access-token:)[^ @]+/\1[REDACTED]/g' | head -c 3000
            echo
            exit 23
          fi
          echo "GOVERNOR_PREFLIGHT_CHECKOUT=PASS"
          git -C "$repo" rev-parse HEAD | sed 's/^/GOVERNOR_PREFLIGHT_HEAD=/'
          git -C "$repo" rev-parse 'HEAD^{tree}' | sed 's/^/GOVERNOR_PREFLIGHT_TREE=/'
          echo "GOVERNOR_PREFLIGHT_DIAGNOSTIC=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
          SH
          b64="$(base64 -w0 /tmp/preflight.sh)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/preflight.sh && S=$S BRANCH=$BRANCH sh /tmp/preflight.sh; rc=\$?; rm -f /tmp/preflight.sh; exit \$rc'"
