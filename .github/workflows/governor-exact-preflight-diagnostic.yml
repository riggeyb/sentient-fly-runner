name: Governor Exact Preflight Diagnostic
"on":
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S: ${{ inputs.sha }}
      BASE: 3ce2b2e2104a1000a7a82b4cb0e465bdc1789282
      EXPECTED_INTEGRATION: 574a7181c7db83e63a76cf717dc2a77072a85a1e
      TARGET_TREE: f4cebc41c4775b09ce5f0279b5cb12d4cad52a01
      BRANCH: integration/mission-control-production-75ba9c28
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: integration/mission-control-production-75ba9c28
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Replace defective integration with accepted source and preserved Fly config
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION"
          test "$(git rev-parse "$S^{tree}")" = "$TARGET_TREE"
          git show "$BASE:fly.toml" > "$RUNNER_TEMP/production-fly.toml"
          production_fly_sha="$(sha256sum "$RUNNER_TEMP/production-fly.toml" | awk '{print $1}')"
          git config user.name sentient-mission-control-integrator
          git config user.email sentient-mission-control-integrator@users.noreply.github.com
          git checkout -B clean-mission-control-integration "$BASE"
          git merge --no-ff --no-edit "$S"
          git checkout "$BASE" -- fly.toml
          git add fly.toml
          git commit --amend --no-edit
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git rev-parse HEAD^2)" = "$S"
          git merge-base --is-ancestor "$S" HEAD
          git diff --exit-code "$BASE" HEAD -- fly.toml
          test "$(sha256sum fly.toml | awk '{print $1}')" = "$production_fly_sha"
          merged="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_INTEGRATION" origin "HEAD:refs/heads/$BRANCH"
          echo "INTEGRATION_BRANCH=$BRANCH"
          echo "INTEGRATION_SHA=$merged"
          echo "INTEGRATION_TREE=$tree"
          echo "ACCEPTED_CANDIDATE_ANCESTOR=true"
          echo "PRODUCTION_PARENT=true"
          echo "FLY_CONFIG_PRESERVED=true"
          echo "FLY_RESOURCE_ENVELOPE_CHANGED=false"
          echo "PRODUCTION_REF_MUTATED=false"
