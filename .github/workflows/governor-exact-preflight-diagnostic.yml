name: Governor Exact Preflight Diagnostic
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: false
        type: string
        default: ""
      branch:
        required: true
        type: choice
        default: sentient-production-composition-20261017
        options:
          - sentient-production-composition-20261017
          - atlas-hybrid-cognition-mvp-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: ${{ inputs.sha }}
      T: ${{ inputs.tree }}
      APP: sentient-deployment-governor
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Reproduce Governor source preflight read-only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$S" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$T" ]; then [[ "$T" =~ ^[0-9a-f]{40}$ ]]; fi
          case "$BRANCH" in
            sentient-production-composition-20261017|atlas-hybrid-cognition-mvp-v1) ;;
            *) echo "GOVERNOR_PREFLIGHT_BRANCH=REJECTED"; exit 2 ;;
          esac
          cat >/tmp/preflight.sh <<'SH'
          set -eu
          s="$S"
          t="${T:-}"
          branch="$BRANCH"
          echo "GOVERNOR_PREFLIGHT_SHA=$s"
          echo "GOVERNOR_PREFLIGHT_BRANCH=$branch"
          root="$(mktemp -d /tmp/sentient-governor-preflight-XXXXXX)"
          repo="$root/sentient"
          trap 'rm -rf "$root"' EXIT
          token="${SENTIENT_SOURCE_GITHUB_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "GOVERNOR_PREFLIGHT_SOURCE_CREDENTIAL=PRESENT_FALSE"
            exit 20
          fi
          echo "GOVERNOR_PREFLIGHT_SOURCE_CREDENTIAL=PRESENT_TRUE"
          basic="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          export GIT_TERMINAL_PROMPT=0
          stage=init
          git init --quiet "$repo"
          stage=remote
          git -C "$repo" remote add origin https://github.com/riggeyb/sentient.git
          stage=fetch
          if ! git -C "$repo" fetch --quiet --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
            echo "GOVERNOR_PREFLIGHT_FAILURE_STAGE=$stage"
            exit 21
          fi
          echo "GOVERNOR_PREFLIGHT_FETCH=PASS"
          stage=ancestor
          if ! git -C "$repo" merge-base --is-ancestor "$s" "refs/remotes/origin/$branch"; then
            echo "GOVERNOR_PREFLIGHT_FAILURE_STAGE=$stage"
            exit 22
          fi
          echo "GOVERNOR_PREFLIGHT_ANCESTOR=PASS"
          stage=object
          test "$(git -C "$repo" cat-file -t "$s")" = "commit"
          echo "GOVERNOR_PREFLIGHT_OBJECT_TYPE=commit"
          stage=checkout
          set +e
          out="$(git -C "$repo" checkout --detach "$s" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "GOVERNOR_PREFLIGHT_FAILURE_STAGE=$stage"
            echo "$out" | sed -E 's/(x-access-token:)[^ @]+/\1[REDACTED]/g' | head -c 3000
            echo
            exit 23
          fi
          actual_head="$(git -C "$repo" rev-parse HEAD)"
          actual_tree="$(git -C "$repo" rev-parse 'HEAD^{tree}')"
          test "$actual_head" = "$s"
          if [ -n "$t" ]; then test "$actual_tree" = "$t"; fi
          echo "GOVERNOR_PREFLIGHT_CHECKOUT=PASS"
          echo "GOVERNOR_PREFLIGHT_HEAD=$actual_head"
          echo "GOVERNOR_PREFLIGHT_TREE=$actual_tree"
          echo "GOVERNOR_PREFLIGHT_DIAGNOSTIC=PASS"
          echo "DEPLOYMENT_PERFORMED=false"
          echo "SECRET_VALUES_EXPOSED=false"
          SH
          b64="$(base64 -w0 /tmp/preflight.sh)"
          flyctl ssh console -a "$APP" -C "sh -lc 'echo $b64 | base64 -d >/tmp/preflight.sh && S=$S T=$T BRANCH=$BRANCH sh /tmp/preflight.sh; rc=\$?; rm -f /tmp/preflight.sh; exit \$rc'"
