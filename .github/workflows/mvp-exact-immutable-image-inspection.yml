name: MVP Exact Immutable Image Inspection
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      parent:
        required: true
        type: string
      skills_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
      PARENT: ${{ inputs.parent }}
      SKILLS: ${{ inputs.skills_sha }}
      APP: sentient-validation-runner
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect exact immutable image without deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PARENT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SKILLS" =~ ^[0-9a-f]{40}$ ]]
          flyctl auth docker >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo >/dev/null
          image="registry.fly.io/${APP}:phase0-${SHA}"
          skopeo inspect --authfile "$HOME/.docker/config.json" "docker://${image}" > /tmp/image.json
          actual_sha="$(jq -r '.Env[]? | select(startswith("SENTIENT_RUNTIME_SHA=")) | split("=")[1]' /tmp/image.json)"
          actual_tree="$(jq -r '.Env[]? | select(startswith("SENTIENT_RUNTIME_TREE=")) | split("=")[1]' /tmp/image.json)"
          actual_skills="$(jq -r '.Env[]? | select(startswith("SENTIENT_SKILLS_SHA=")) | split("=")[1]' /tmp/image.json)"
          actual_parent="$(jq -r '.Env[]? | select(startswith("SENTIENT_PHASE0_ACCEPTANCE_BASE_SHA=")) | split("=")[1]' /tmp/image.json)"
          digest="$(jq -r '.Digest' /tmp/image.json)"
          test "$actual_sha" = "$SHA"
          test "$actual_tree" = "$TREE"
          test "$actual_skills" = "$SKILLS"
          test "$actual_parent" = "$PARENT"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "EXACT_IMAGE_EXISTS=true"
          echo "IMAGE_RUNTIME_SHA=$actual_sha"
          echo "IMAGE_RUNTIME_TREE=$actual_tree"
          echo "IMAGE_SKILLS_SHA=$actual_skills"
          echo "IMAGE_ACCEPTANCE_PARENT_SHA=$actual_parent"
          echo "IMAGE_TAG=phase0-$SHA"
          echo "IMAGE_DIGEST=$digest"
          echo "DEPLOYMENT_PERFORMED=false"
          echo "SECRET_VALUES_EXPOSED=false"
