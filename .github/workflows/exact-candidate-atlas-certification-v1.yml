name: Exact Candidate Atlas Certification V1
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Exact source build and real Atlas certification
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          node --input-type=module <<'NODE'
          import { AtlasCloudClientV1 } from "./dist/src/model/providers/atlas-cloud-client.js";
          const key = String(process.env.ATLASCLOUD_API_KEY ?? "").trim();
          if (!key) throw new Error("atlas_key_missing");
          const client = new AtlasCloudClientV1({ apiKey: key });
          const deep = await client.complete({
            model: "deepseek-ai/deepseek-v3.2",
            systemPrompt: 'Return only {"answer":"ok"}.',
            userPrompt: "Return the requested JSON.",
            maxOutputTokens: 128,
            timeoutMs: 15_000,
            maxCostMicros: 25_000,
            requireJsonObject: true,
          });
          if (!deep.ok) throw new Error(`deepseek_${deep.reason}`);
          const answer = deep.structuredOutput?.answer;
          if (typeof answer !== "string" || !answer.trim()) throw new Error("deepseek_invalid");
          console.log(`DEEPSEEK=PASS LATENCY_MS=${deep.latencyMs} COST_USD=${deep.reportedCostUsd ?? "UNREPORTED"}`);

          const dots = await client.complete({
            model: "dots-studio/dots-3-note-prev-free",
            systemPrompt: "You are non-authoritative subordinate cognition.",
            userPrompt: "Reply with ok",
            maxOutputTokens: 64,
            timeoutMs: 15_000,
            maxCostMicros: 25_000,
          });
          if (!dots.ok || !dots.text.trim()) throw new Error(`dots3_${dots.ok ? "invalid" : dots.reason}`);
          console.log(`DOTS3=PASS LATENCY_MS=${dots.latencyMs} COST_USD=${dots.reportedCostUsd ?? "UNREPORTED"}`);
          console.log("ATLASCLOUD_SECRET_EXPOSED=false");
          console.log("DEPLOYMENT_PERFORMED=false");
          NODE
          git diff --quiet
          git diff --cached --quiet
