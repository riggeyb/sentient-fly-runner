name: Atlas Hybrid Real Provider Smoke FC67

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact riggeyb/sentient candidate SHA
        required: true
        type: string
      source_tree:
        description: Exact riggeyb/sentient candidate tree
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE: ${{ inputs.source_tree }}
    steps:
      - name: Validate immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          echo "SOURCE_CHECKOUT=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          echo "BUILD=PASS"

      - name: Minimal real Atlas calls through candidate AtlasCloudClientV1
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const key = String(process.env.ATLASCLOUD_API_KEY ?? "").trim();
          if (!key) throw new Error("atlas_secret_unavailable");

          const { AtlasCloudClientV1 } = await import("./dist/src/model/providers/atlas-cloud-client.js");
          const { DEEPSEEK_V3_2_MODEL_V1 } = await import("./dist/src/model/providers/atlas-hybrid-router.js");
          const DOTS3_MODD = "dots-studio/dots-3-note-prev-free";

          const client = new AtlasCloudClientV1({ apiKey: key });

          async function call(label, input) {
            const result = await client.complete(input);
            if (!result.ok) {
              console.log(`${label}_CONNECTIVITY=FAIL`);
              console.log(`${label}_FAILURE_REASON=${result.reason}`);
              console.log(`${label}_LATENCY_MS=${result.latencyMs}`);
              return { ok: false, auth: result.reason !== "authentication", result };
            }
            const usageCaptured = [result.usage.inputTokens, result.usage.outputTokens, result.usage.totalTokens]
              .every((value) => typeof value === "number");
            console.log(`${label}_CONNECTIVITY=PASS`);
            console.log(`${label}_RESPONSE_VALID=PASS`);
            console.log(`${label}_USAGE_CAPTURED=${usageCaptured ? "PASS" : "FAIL"}`);
            console.log(`${label}_INPUT_TOKENS=${result.usage.inputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_CACHED_INPUT_TOKENS=${result.usage.cachedInputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_OUTPUT_TOKENS=${result.usage.outputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_REASONING_TOKENS=${result.usage.reasoningTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_TOTAL_TOKENS=${result.usage.totalTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_LATENCY_MS=${result.latencyMs}`);
            console.log(`${label}_FINISH_REASON=${result.finishReason ?? "NOT_REPORTED"}`);
            console.log(`${label}_PROVIDER_REQUEST_ID_PRESENT=${result.providerRequestId ? "true" : "false"}`);
            console.log(`ACTUAL_${label}_SMOKE_COST=${result.reportedCostUsd ?? "UNREPORTED"}`);
            return { ok: usageCaptured, auth: true, result };
          }

          let deepSeek = await call("DEEPSeek", {
            model: DEEPSEEK_V3_2_MODEL_V1,
            systemPrompt: "Connectivity test only. You are non-authoritative. Reason carefully, cross-check the result, return valid JSON, and take no actions.",
            userPrompt: 'Seven jobs A-G occupy slots 1-7. B is immediately after E. E precedes A. A precedes D. F is later than D. C is neither first nor last. G is later than B but earlier than F. D is not slot 6. Return JSON {"answer":"<first valid order>","checks":["..."]}.',
            maxOutputTokens: 320,
            timeoutMs: 12_000,
            requireJsonObject: true,
            requiredTextValidator: (text) => text.includes("answer"),
          });

          if (deepSeek.ok && deepSeek.result.latencyMs <= 8_000) {
            deepSeek = await call("DEEPSEEK_RETRY", {
              model: DEEPSEEK_V3_2_MODEL_V1,
              systemPrompt: "Connectivity test only. You are non-authoritative. Reason carefully and independently verify two ways before returning valid JSON. Take no actions.",
              userPrompt: 'Eight jobs A-H occupy slots 1-8. B is immediately after E. E precedes A. A precedes D. F is later than D. C is neither first nor last. G is later than B but earlier than F. H is after C but before F. D is not slot 7. Return JSON {"answer":"<first valid order>","checks":["..."]}.',
              maxOutputTokens: 384,
              timeoutMs: 12_000,
              requireJsonObject: true,
              requiredTextValidator: (text) => text.includes("answer"),
            });
          }

          const deepLatency = deepSeek.result?.latencyMs ?? 0;
          console.log(`DEEPSEEEK_OLD_8S_THRESHOLD_EXCEEDED=${deepSeek.ok && deepLatency > 8_000 ? "PASS" : "FAIL"}`);
          console.log(`DEEPSEEK_WITHIN_12S_PROVIDER_MAX=${deepSeek.ok && deepLatency < 12_000 ? "PASS" : "FAIL"}`);

          const dots3 = await call("DOTS3", {
            model: DOTS3_MODEL,
            systemPrompt: "Connectivity test only. You are non-authoritative. Return a tiny answer and take no actions.",
            userPrompt: "Reply with exactly: ok",
            maxOutputTokens: 128,
            timeoutMs: 9_000,
            requiredTextValidator: (text) => text.trim().length > 0,
          });

          let abortObserved = false;
          const synthetic = new AtlasCloudClientV1({
            apiKey: "synthetic-not-a-secret",
            fetchImpl: async (_url, init) => await new Promise((_resolve, reject) => {
              const signal = init?.signal;
              const onAbort = () => {
                abortObserved = true;
                reject(new Error("synthetic_abort"));
              };
              if (signal?.aborted) onAbort();
              else signal?.addEventListener("abort", onAbort, { once: true });
            }),
          });
          const controller = new AbortController();
          setTimeout(() => controller.abort(), 5);
          const aborted = await synthetic.complete({
            model: DEEPSEEK_V3_2_MODEL_V1,
            systemPrompt: "s",
            userPrompt: "u",
            maxOutputTokens: 8,
            timeoutMs: 2_000,
            signal: controller.signal,
          });
          const abortPass = !aborted.ok && aborted.reason === "timeout" && abortObserved;

          const authPass = deepSeek.auth && dots3.auth;
          console.log(`ATLAS_AUTH=${authPass ? "PASS" : "FAIL"}`);
          console.log(`DEEPSEEK_MODEL=${DEEPSEEEK_V3_2_MODD_V1}`);
          console.log(`DOTS3_MODEL=${DOTS3_MODEL}`);
          console.log(`ABORT_SIGNAL_PATH=${abortPass ? "PASS" : "FAIL"}`);
          console.log("ATLASCLOUD_SECRET_EXPOSED=false");
          const overall = deepSeek.ok && deepLatency > 8_000 && deepLatency < 12_000 && dots3.ok && authPass && abortPass;
          console.log(`REAL_ATLAS_SMOKE=${overall ? "PASS" : "FAIL"}`);
          if (!overall) process.exit(3);
          NODE

      - name: Guard clean source and no deployment
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "TRACKED_SOURCE_MUTATION=false"
          echo "DEPLOYMENT_PERFORMED=false"
