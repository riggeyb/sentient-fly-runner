name: Dynamic Cognition Hard Stops Core Patch V2

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: sentient
      - name: Apply corrected reuse-first hard-stop core
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C operator hash-object scripts/dynamic-core-patch.gz.part0)" = "241dd919a21436cc2d37859a158dbd52ebc7f174"
          test "$(git -C operator hash-object scripts/dynamic-core-patch.gz.part1)" = "f6ca390283266e158927c394d3da7907b7f1d307"
          cd sentient
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SOURCE_TREE"
          cat ../operator/scripts/dynamic-core-patch.gz.part0 ../operator/scripts/dynamic-core-patch.gz.part1 > /tmp/dynamic-core-patch.py.gz
          gzip -dc /tmp/dynamic-core-patch.py.gz > /tmp/dynamic-core-patch.py
          python /tmp/dynamic-core-patch.py
          git diff --check
          npm ci --no-audit --no-fund >/dev/null
          npm run build
          node --test dist/test/dynamic-hard-stops-core.test.js dist/test/atlas-cloud-client.test.js dist/test/atlas-hybrid-router.test.js dist/test/local-hf-worker-isolation.test.js
          git config user.name "sentient-dynamic-cognition-engineering"
          git config user.email "sentient-dynamic-cognition-engineering@users.noreply.github.com"
          git add src/application/contracts.ts src/application/objective-budget.ts src/phase1/core-runtime.ts src/model/providers/huggingface.ts src/model/providers/atlas-cloud-client.ts src/model/providers/atlas-hybrid-router.ts src/model/providers/atlas-hybrid-adapters.ts src/spawn/orchestrator.ts test/dynamic-hard-stops-core.test.ts test/atlas-hybrid-router.test.ts
          git commit -m "cognition: reuse existing budgets and signals for hard model stops"
          git push origin HEAD:refs/heads/dynamic-cognition-hard-stops-v1
