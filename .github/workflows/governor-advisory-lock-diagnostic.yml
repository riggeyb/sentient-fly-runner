name: Governor Advisory Lock Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect sanitized Governor advisory lock and limits
        shell: bash
        run: |
          set -euo pipefail
          app=sentient-deployment-governor
          machines="$(flyctl machines list -a "$app" --json)"
          id="$(jq -r '[.[] | select((.config.auto_destroy // false) != true)] | sort_by(.id) | .[0].id // empty' <<<"$machines")"
          test -n "$id"
          cat >/tmp/lockdiag.mjs <<'NODE'
          import pg from "/app/node_modules/pg/slib/index.js";
          const {Pool}=pg;
          const db=String(process.env.SENTIENT_DEPLOYMENT_LEDGER_DATABASE_URL??"").trim();
          if(!db) throw new Error("GOVERNOR_LEDGER_DB_MISSING");
          const pool=new Pool({connectionString:db,max:1,connectionTimeoutMillis:10000});
          try {
            const locks=await pool.query(`
              select count()::int as count
              from pg_locks
              where locktype='advisory' and granted=true
                and objid=$1::bigint
            `,[2026101701]);
            const counts=await pool.query(`
              select
                count(*) filter (where started_at >= now()-interval '1 hour')::int as hourly,
                count() filter (where completed_at is null and result='ACTIVE')::int as active
              from sentient_deployment_governor.deployment_attempts
            `);
            console.log("GOVERNOR_ADVISORY_LOCK_COUNT="+String(locks.rows[0]?.count??0));
            console.log("GOVERNOR_ATTEMPTS_LAST_HOUR="+String(counts.rows[0]?.hourly??0));
            console.log("GOVERNOR_ACTIVE_ATTEMPTS="+String(counts.rows[0]?.active??0));
            console.log("SECRET_VALUES_EXPOSED=false");
          } finally { await pool.end(); }
          NODE
          b64="$(base64 -w0 /tmp/lockdiag.mjs)"
          flyctl ssh console -a "$app" --machine "$id" -C "sh -lc 'echo $b64 | base64 -d >/tmp/lockdiag.mjs && node /tmp/lockdiag.mjs; rc=\$?; rm -f /tmp/lockdiag.mjs; exit \$rc'"
