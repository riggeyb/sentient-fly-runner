name: Phase0 Invoke Governor Recovery Exact
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: a6eb540a33fcb509d7aa3e833096d5d6a88d7167
      T: 07f1d6a0c7990706e06fedd9005b72d925b82d71
      R: SENTIENT_GOVERNOR_RECOVERY_V1
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recover exact Governor
        shell: bash
        run: |
          set -euo pipefail
          app=sentient-governor-recovery-root
          id="$(flyctl machines list -a "$app" --json | jq -r '.[0].id')"
          flyctl machine start "$id" -a "$app" >/dev/null || true
          for _ in $(seq 1 60); do
            st="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$st" = started ] && break
            sleep 2
          done
          test "$st" = started
          cat >/tmp/recover.mjs <<'NODE'
          const sha=process.env.S,tree=process.env.T,revision=process.env.R;
          const token=String(process.env.SENTIENT_GOVERNOR_RECOVERY_API_TOKEN??"").trim();
          if(!token) process.exit(20);
          const q=await fetch("http://127.0.0.1:8080/v1/recovery/governor",{
            method:"POST",headers:{authorization:"Bearer "+token,"content-type":"application/json"},
            body:JSON.stringify({repository:"riggeyb/sentient",sha,tree,recoveryPolicyRevision:revision}),
            signal:AbortSignal.timeout(1100000)
          });
          const v=await q.json().catch(()=>({}));
          console.log(JSON.stringify({httpStatus:q.status,recoveryId:v.recoveryId??null,requestedSha:v.requestedSha??null,requestedTree:v.requestedTree??null,observedSha:v.observedSha??null,observedTree:v.observedTree??null,status:v.status??null,errorCode:v.errorCode??null}));
          if(!q.ok||v.status!=="PASS"||v.requestedSha!==sha||v.requestedTree!==tree||v.observedSha!==sha||v.observedTree!==tree) process.exit(21);
          NODE
          b64="$(base64 -w0 /tmp/recover.mjs)"
          flyctl ssh console -a "$app" -C "sh -lc 'echo $b64 | base64 -d >/tmp/recover.mjs && S=$S T=$T R=$R node /tmp/recover.mjs'"
          echo "GOVERNOR_RECOVERY_REQUEST=PASS"
          echo "EXACT_SOURCE_RECOVERY=PASS"
          echo "RECOVERY_RECEIPT=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
