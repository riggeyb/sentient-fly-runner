name: Phase0 Invoke Governor Recovery Exact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: 997f59484e5ee1455d8eaf3694af487f47b7b24e
      T: 567f2675dc1e15ea7232f67ae39e15e6473ba03b
      R: SENTIENT_GOVERNOR_RECOVERY_V1
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recover exact Governor
        shell: bash
        run: |
          set -euo pipefail
          app=sentient-governor-recovery-root
          id="$(flyctl machines list -a "$app" --json | jq -r '.[0].id')"
          flyctl machine start "$id" -a "$app" >/dev/null || true
          for _ in $(seq 1 60); do
            st="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$st" = started ] && break
            sleep 2
          done
          test "$st" = started
          flyctl ssh console -a "$app" -C "sh -lc 'echo  | base64 -d >/tmp/r.mjs && S=$S T=$T R=$R node /tmp/r.mjs'"
          echo "GOVERNOR_RECOVERY_REQUEST=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
