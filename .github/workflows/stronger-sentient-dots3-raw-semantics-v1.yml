name: Stronger Sentient Cognition Challenger Screen Execution Harness v1

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stronger-sentient-cognition-challenger-screen-execution-v1
  cancel-in-progress: false

env:
  BASELINE_SHA: c05ebe9ffed7254bb749cee1c72a965f970def7c
  BASELINE_TREE: 00296d7129fa8ab7f3254943a57df444591ad1ab
  CORPUS_SHA: 9c037505f65663ae6b7e8990ae969639572860d9
  CORPUS_DIGEST: 611acebce942ad9228618a42154efe56d3064c188b30cf13ec7893ef6cee6f51
  CONTRACT_DIGEST: sha256:62f98338f60164620a3fe93fd69e7c94b33e8ec4602ba3337c1b06b89651673d

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ env.CORPUS_SHA }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: corpus-source
          persist-credentials: false

      - name: Guard frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ATLASCLOUD_API_KEY:-}"
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$BASELINE_TREE"
          test "$(git -C corpus-source rev-parse HEAD)" = "$CORPUS_SHA"
          test "$(sha256sum corpus-source/test/fixtures/cognitive-frontier/corpus-v1.json | awk '{print $1}')" = "$CORPUS_DIGEST"
          test "sha256:$(sha256sum measurement-contracts/stronger-sentient-cognition-artifact-v1.schema.json | awk '{print $1}')" = "$CONTRACT_DIGEST"
          test -f measurement-contracts/stronger-sentient-cognition-artifact-v1.freeze.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build accepted baseline
        working-directory: sentient
        run: npm install --no-audit --no-fund --package-lock=false && npm run build

      - name: Repair observed measurement-runner typos in checked-out canonical script
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/minStartIntervalMs=750/minStartIntervalMs:750/' scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
          sed -i 's/update(q)\.digest("hex")/update(s).digest("hex")/' scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
          node --check scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
          node --check scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
          ! grep -q 'minStartIntervalMs=750' scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
          ! grep -q 'update(q)\.digest("hex")' scripts/stronger-sentient-cognition-challenger-screen-v1.mjs

      - name: Zero-provider measurement-integrity gate
        env:
          EXPERIMENT_OUT: ${{ runner.temp }}/static-validation.json
        run: |
          set -euo pipefail
          node scripts/stronger-sentient-cognition-challenger-screen-fair-wrapper-v1.mjs
          jq -e '.fairnessGateStaticValidation=="PASS" and .measurementIntegrityRequired==true and .incumbentCognitionSuccessRequired==false and .providerCalls==0 and .challengerCalls==0 and .freezeReceiptVerified==true and .models==4 and .tasks==3 and .maximumInitialTaskArms==12 and .cognitionInitialProviderCompletionTokens==2000 and .cognitionAdaptiveProviderCompletionMaxTokens==4000 and .dots3Thinking==false and .dots3MandatoryForMachineExecution==false' "$EXPERIMENT_OUT"
          echo "MEASUREMENT_INTEGRITY_STATIC_VALIDATION=PASS"
          echo "STATIC_VALIDATION_PROVIDER_CALLS=0"

      - name: Run bounded adaptive four-model cognition screen
        env:
          EXPERIMENT_OUT: ${{ runner.temp }}/challenger-screen-v2.json
        run: node scripts/stronger-sentient-cognition-challenger-screen-v1.mjs
      - name: Summarize
        run: jq '{schemaVersion,taskIds,models,actualInitialTaskArms,actualProviderCalls,completionPolicy,dots3Called,byModel}' "$RUNNER_TEMP/challenger-screen-v2.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stronger-sentient-cognition-challenger-screen-execution-v1
          path: |
            ${{ runner.temp }}/static-validation.json
            ${{ runner.temp }}/challenger-screen-v2.json
          retention-days: 14

      - name: Guard immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$BASELINE_TREE"
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"
          echo "SENTIENT_SOURCE_CHANGE=false"
          echo "PRODUCTION_DEPLOYMENT=false"
