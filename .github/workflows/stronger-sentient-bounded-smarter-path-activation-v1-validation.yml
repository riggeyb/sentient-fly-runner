name: Stronger Sentient Bounded Smarter Path Activation V1 Validation
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      parent_sha: {required: true, type: string}
      parent_tree: {required: true, type: string}
permissions: {contents: read}
env:
  CANDIDATE_SHA: ${{ inputs.sha }}
  CANDIDATE_TREE: ${{ inputs.tree }}
  PARENT_SHA: ${{ inputs.parent_sha }}
  PARENT_TREE: ${{ inputs.parent_tree }}
  SENTIENT_SOURCE_GITHUB_TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Sentient candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SENTIENT_SOURCE_GITHUB_TOKEN"
          auth="$(printf 'x-access-token:%s' "$SENTIENT_SOURCE_GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout https://github.com/riggeyb/sentient.git sentient
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin "$CANDIDATE_SHA" "$PARENT_SHA"
          git -C sentient checkout --detach "$CANDIDATE_SHA"
          git -C sentient remote set-url origin disabled://sentient
          unset auth
      - name: Fence exact identity lineage and scope
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          git cat-file -e "$PARENT_SHA^{commit}"
          test "$(git show -s --format=%T "$PARENT_SHA")" = "$PARENT_TREE"
          git diff --name-only "$PARENT_SHA" "$CANDIDATE_SHA" | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' src/runtime/bounded-smarter-path-activation-v1.ts test/bounded-smarter-path-activation-v1.test.ts | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
      - name: Use Node 22
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm install 22; nvm use 22; fi
          node --version
      - name: Install and strict build
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use 22; fi
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Run bounded activation and accepted lineage proofs
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use 22; fi
          node --test \
            dist/test/context-compiler-v0.test.js \
            dist/test/progressive-disclosure-v1.test.js \
            dist/test/recursive-cognition-v1-proof-a.test.js \
            dist/test/recursive-cognition-v1-proof-b.test.js \
            dist/test/recursive-cognition-v1-proof-c.test.js \
            dist/test/recursive-cognition-v1-proof-d.test.js \
            dist/test/adaptive-execution-routing-v1.test.js \
            dist/test/semantic-compression-v1.test.js \
            dist/test/integrated-smarter-sentient-shadow-benchmark-v1.test.js \
            dist/test/bounded-smarter-path-activation-v1.test.js \
            2>&1 | tee "$RUNNER_TEMP/lineage.log"
          grep 'BOUNDED_SMARTER_PATH_ACTIVATION_V1_ACCEPTANCE>' "$RUNNER_TEMP/lineage.log"
          grep '"MODE":"BOUND_TEST_ONLY.' "$RUNNER_TEMP/lineage.log"
          grep '"PRODUCTION_REQUEST_PATH_CHANGED":false' "$RUNNER_TEMP/lineage.log"
          grep '"PROVIDER_CALLS":0' "$RUNNER_TEMP/lineage.log"
          grep '"EZACT_EVIDENCE_RECOVERABILITY":"PASS"' "$RUNNER_TEMP/lineage.log" || grep '"EXACT_EVIDENCE_RECOVERABILITY":"PASS"' "$RUNNER_TEMP/lineage.log"
          grep '"EZECUTION_AUTHORIZED":false' "$RUNNER_TEMP/lineage.log" || grep '"EZECUTION_AUTHORIZED":false' "$RUNNER_TEMP/lineage.log"
      - name: Run full repository regression
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use 22; fi
          npm test
      - name: Guard clean source and emit receipt
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "BOUNDED_SMARTER_PATH_ACTIVATION_V1_VALIDATION=PASS"
          echo "PRODUCTION_REQUEST_PATH_CHANGE=false"
          echo "PRODUCTION_MODDX_ROUTE_CHANGE=false"
          echo "AUTHORITY_EXPANSION=false"
          echo "GOVERNOR_BYPASS=false"
          echo "PROVIDER_CALLS=0"
          echo "PRODUCTION_DEPLOYMENT=false"
