name: Sentient MVP Mission Control activation patch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sentient, POSTGRES_PASSWORD: sentient, POSTGRES_DB: sentient}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentient -d sentient" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTIENT_TEST_DATABASE_URL: postgresql://sentient:sentient@localhost:5432/sentient
    steps:
      - uses: actions/checkout@v4
        with: {repository: riggeyb/sentient-fly-runner, ref: sentient/mvp-self-improving-v1, path: operator}
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/mvp-mission-control-integration-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Fence exact integration head
        run: |
          cd sentient
          test "$(git rev-parse HEAD)" = "74ad1be0ab36e87ed5f8d77cf470a2b790fb6faa"
          test "$(git rev-parse 'HEAD^{tree}')" = "c50f83e820f881e730221c93c081a6c71e504d4d"
          node -e 'const p=require("./vendor/sentient-orchestrator/package.json"); if(p.sentientExactSource.sha!=="b3df9b32b47370a7140d6fe814eeba97564663ab"||p.sentientExactSource.operatingContextDigest!=="sha256:ef32887bbc1736dce2ed5a73a90a628160edede479bd686ce47cdf0f7507e209")process.exit(1)'
      - name: Patch
        run: python3 operator/scripts/mvp-mission-control-activate.py sentient
      - name: Build and test
        run: |
          cd sentient
          npm ci --no-audit --no-fund
          npm run build
          node --test dist/test/spawn-mission-control-context.test.js
          node --test dist/test/production-collaboration-restart-recovery.test.js
          node --test dist/test/job2-production-convergence.test.js
          node --test dist/test/local-hf-worker-isolation.test.js
          npm test
          git diff --check
      - name: Commit tested successor
        run: |
          cd sentient
          git config user.name sentient-mvp-activation
          git config user.email sentient-mvp-activation@users.noreply.github.com
          git add Dockerfile src/application/contracts.ts src/application/production-composition.ts src/fly/production-runtime.ts src/fly/self-execution.ts src/spawn/backends/huggingface.ts
          git commit -m "mvp: activate Root Mission Control in production objective path"
          git push origin HEAD:sentient/mvp-mission-control-integration-v1
          echo "SUCCESSOR_SHA=$(git rev-parse HEAD)"
          echo "SUCCESSOR_TREE=$(git rev-parse 'HEAD{tree}')"
