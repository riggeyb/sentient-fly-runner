name: Sentient Phase 7 Live Proof Launcher
'on':
  workflow_dispatch:
    inputs:
      sha:
        description: Exact deployed Sentient SHA
        required: true
        type: string
      tree:
        description: Exact deployed Sentient tree
        required: true
        type: string
permissions:
  contents: read

jobs:
  launch-phase7-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Execute shared Phase 7 proof implementation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
          PROOF_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path(".github/workflows/phase7-live-proof.yml").read_text()
          marker = "        run: |\n"
          if source.count(marker) != 1:
              raise SystemExit("phase7_shared_run_block_not_unique")
          block = source.split(marker, 1)[1]
          lines = block.splitlines()
          out = []
          for line in lines:
              if line.startswith("          "):
                  out.append(line[10:])
              elif not line.strip():
                  out.append("")
              else:
                  raise SystemExit("phase7_shared_run_block_indentation_invalid")
          Path("/tmp/phase7-shared-proof.sh").write_text("\n".join(out) + "\n")
          PY
          bash /tmp/phase7-shared-proof.sh
