name: Governor Local Deploy Exact
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: ${{ inputs.sha }}
      T: ${{ inputs.tree }}
      K: d85eb820f18ad6d944ab93b03150d606273891a5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy through existing Governor authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$S" =~ ^[0-9a-f]{40}$ ]]
          [[ "$T" =~ ^[0-9a-f]{40}$ ]]
          cat >/tmp/deploy.mjs <<'NODE'
          const sha=process.env.S, tree=process.env.T, skillsSha=process.env.K;
          const token=String(process.env.SENTIENT_DEPLOYMENT_API_TOKEN??"").trim();
          if(!token)throw new Error("GOVERNOR_RESIDENT_DEPLOYMENT_CREDENTIAL_MISSING");
          const r=await fetch("http://127.0.0.1:8080/v1/deployments/sentient",{method:"POST",headers:{authorization:"Bearer "+token,"content-type":"application/json","x-sentient-objective-id":"phase1-7-final-"+sha.slice(0,12)},body:JSON.stringify({sha:sha,tree:tree,skillsSha}),signal:AbortSignal.timeout(900000)});
          const t=await r.text();let b={};try{b=JSON.parse(t)}catch{}
          const allow=["DEPLOYMENT_ID","REQUESTED_SHA","REQUESTED_TREE","DEPLOYED_SHA","DEPLOYED_TREE","SKILLS_SHA","BUILD_RESULT_","BUILD_RESULT","READIZ_FAILURE","RETRY_LIMIT_STATE","RATE_LIMIT_STATE","RESOURCE_CHANGE_STATUS","RESOURCE_CHANGE_DETAIL"];
          const out={HTTP_STATUS:r.status};for(const k of allow)if(kin b)out[k]=b[k];
          if(b.HEALTHZ&&typeof b.HEALTHZ==="object")out.HEALTHZ={statusCode:b.HEALTHZ.statusCode??null,body:b.HEALTHZ.body??null};
          if(b.READYZ&&typeof b.READYZ==="object")out.READYZ={statusCode:b.READYZ.statusCode??null,body:b.READYZ.body??null};
          console.log(JSON.stringify(out));
          if(!r.ok)||b.REQUESTED_SHA!==sha||b.REQUESTED_TREE!==tree||b.DEPLOYED_SHA!==sha||b.DEPLOYED_TREE!==tree||b.BUILD_RESULT!=="SUCCEEDED")process.exit(21);
          console.log("GOVERNOR_DEPLOY_EXACT=PASS");
          console.log("SECRET_VALUES_EXPOSED=false");
NODE
          b64="$(base64 -w0 /tmp/deploy.mjs)"
          flyctl machines list -a sentient-deployment-governor --json >/tmp/m.json
          id="$(jq -r '.[0]|select(.!"null").|id' /tmp/m.json)"
          test -n "$id"
          flyctl machine start "$id" -a sentient-deployment-governor >/dev/null || true
          flyctl ssh console -a sentient-deployment-governor -C "sh -lc 'echo $b64 | base64 -d >/tmp/deploy.mjs && S=$S T=$T K=$K node /tmp/deploy.mjs; rc=\$?; rm -f /tmp/deploy.mjs; exit \$rc'"
          echo "RESULT=PASS"
