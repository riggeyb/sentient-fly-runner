name: Phase0 Governor Deploy Exact Retry
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      S: b58b7e44f156ebbd62dbc302d8c62b9ddb10c381
      T: 8a6f70aa95402e0c35f30234992727f5c083d639
      K: d85eb820f18ad6d944ab93b03150d606273891a5
      SCRIPT_B64: 
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy exact candidate through resident Governor
        shell: bash
        run: |
          set -euo pipefail
          app=sentient-deployment-governor
          id="$(flyctl machines list -a "$app" --json | jq -r '.[0].id')"
          flyctl machine start "$id" -a "$app" >/dev/null || true
          for _ in $(seq 1 60); do
            st="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$st" = started ] && break
            sleep 2
          done
          test "$st" = started
          set +e
          flyctl ssh console -a "$app" -C "sh -lc 'echo $SCRIPT_B64 | base64 -d >/tmp/d.mjs && S=$S T=$T K=$K node /tmp/d.mjs'" > /tmp/result.json
          rc=$?
          set -e
          cat /tmp/result.json
          test "$rc" -eq 0
          echo "GOVERNOR_DEPLOY_REQUEST=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
