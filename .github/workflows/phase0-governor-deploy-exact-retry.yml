name: Phase0 Governor Deploy Exact Retry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SCRIPT_B64: 
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Retry exact deployment through Fly service
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine start 874dd1a647dd28 -a sentient-deployment-governor >/dev/null || true
          set +e
          flyctl ssh console -a sentient-deployment-governor -C "sh -lc 'echo $SCRIPT_B64 | base64 -d >/tmp/d.mjs && node /tmp/d.mjs'" > /tmp/result.json
          rc=$?
          set -e
          cat /tmp/result.json
          test "$rc" -eq 0
          echo "GOVERNOR_DEPLOY_REQUEST=PASS"
          echo "SECRET_VALUES_EXPOSED=false"
