name: Atlas Hybrid Real Provider Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-hybrid-real-provider-smoke-v1
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 91c0b36526f7bd0fc5d8cae1de9c98677b4998a8
      EXPECTED_TREE: 98b53ac978e5d664ac459933cfcb534bc277ed64
    steps:
      - name: Checkout exact Sentient candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 91c0b36526f7bd0fc5d8cae1de9c98677b4998a8
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"
          echo "SOURCE_CHECKOUT=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          echo "BUILD=PASS"

      - name: Resolve Dots3-Note and smoke Atlas models
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { AtlasCloudClientV1 } from "./dist/src/model/providers/atlas-cloud-client.js";

          const key = String(process.env.ATLASCLOUD_API_KEY ?? "").trim();
          if (!key) throw new Error("ATLASCLOUD_API_KEY secret is unavailable");

          function textFields(row) {
            if (!row || typeof row !== "object" || Array.isArray(row)) return "";
            return [
              row.id, row.name, row.display_name, row.displayName, row.model,
              row.description, row.slug, row.provider,
            ].filter(v => typeof v === "string").join(" ");
          }

          function modelRows(payload) {
            const arrays = [];
            if (Array.isArray(payload)) arrays.push(payload);
            if (payload && typeof payload === "object") {
              for (const key of ["data", "models", "items", "results"]) {
                if (Array.isArray(payload[key])) arrays.push(payload[key]);
              }
            }
            return arrays.flat().filter(row => row && typeof row === "object" && !Array.isArray(row));
          }

          function scoreDots(row) {
            const v = textFields(row).toLowerCase();
            let score = 0;
            if (v.includes("dots3-note") || v.includes("dots3_note") || v.includes("dots3/note")) score += 120;
            if (v.includes("dots 3 note")) score += 110;
            if (v.includes("dots3") && v.includes("note")) score += 100;
            if (v.includes("dots") && v.includes("3") && v.includes("note")) score += 80;
            if (v.includes("dots") && v.includes("note")) score += 40;
            return score;
          }

          const modelsResponse = await fetch("https://api.atlascloud.ai/v1/models", {
            headers: { Authorization: `Bearer ${key}`, Accept: "application/json" },
            signal: AbortSignal.timeout(10_000),
          });
          if (!modelsResponse.ok) {
            console.log(`ATLAS_AUTH=FAIL_HTTP_${modelsResponse.status}`);
            process.exit(2);
          }
          console.log("ATLAS_AUTH=PASS");

          const payload = await modelsResponse.json();
          const ranked = modelRows(payload)
            .map(row => ({ id: typeof row.id === "string" ? row.id.trim() : "", score: scoreDots(row) }))
            .filter(row => row.id && row.score > 0)
            .sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
          if (ranked.length === 0) throw new Error("Atlas model list contained no Dots3-Note candidate");
          const bestScore = ranked[0].score;
          const best = [...new Map(ranked.filter(row => row.score === bestScore).map(row => [row.id, row])).values()];
          if (best.length !== 1) throw new Error(`Atlas Dots3-Note resolution ambiguous (${best.length} top matches)`);
          const dotsModel = best[0].id;
          console.log("DOTS3_MODEL_RESOLUTION=PASS");
          console.log(`DOTS3_MODEL=${dotsModel}`);

          const client = new AtlasCloudClientV1({ apiKey: key });

          async function smoke(label, model, maxOutputTokens) {
            const result = await client.complete({
              model,
              systemPrompt: "You are a connectivity test. Return only one tiny JSON object. Do not call tools or take actions.",
              userPrompt: 'Return exactly {"status":"ok"}.',
              maxOutputTokens,
              timeoutMs: 15_000,
              requireJsonObject: true,
              requiredTextValidator: text => /"status"\s*:\s*"ok"/i.test(text),
            });
            if (!result.ok) {
              console.log(`${label}_CONNECTIVITY=FAIL`);
              console.log(`${label}_FAILURE_REASON=${result.reason}`);
              process.exitCode = 3;
              return;
            }
            const structured = result.structuredOutput;
            if (!structured || typeof structured !== "object" || Array.isArray(structured) || structured.status !== "ok") {
              console.log(`${label}_RESPONSE_VALID=FAIL`);
              process.exitCode = 4;
              return;
            }
            const u = result.usage;
            const usageCaptured = [u.inputTokens, u.outputTokens, u.totalTokens].some(v => typeof v === "number");
            console.log(`${label}_CONNECTIVITY=PASS`);
            console.log(`${label}_RESPONSE_VALID=PASS`);
            console.log(`${label}_USAGE_CAPTURED=${usageCaptured ? "PASS" : "FAIL"}`);
            console.log(`${label}_INPUT_TOKENS=${u.inputTokens ?? "NOT_REPORTED"}`);
            console.log `${label}_CACHED_INPUT_TOKENS=${u.cachedInputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_OUTPUT_TOKENS=${u.outputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_REASONING_TOKENS=${u.reasoningTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_TOTAL_TOKENS=${u.totalTokens ?? "NOT_REPORTED"}`);
            console.log `${label}_FINISH_REASON=${result.finishReason ?? "NOT_REPORTED"}`);
            console.log(`${label}_PROVIDER_REQUEST_ID=${result.providerRequestId ?? "NOT_REPORTED"}`);
            console.log `${label}_REPORTED_COST_USD=${result.reportedCostUsd ?? "NOT_REPORTED"}`);
            console.log `${label}_LATENCY_MS=${result.latencyMs}`);
            if (!usageCaptured) process.exitCode = 5;
          }

          await smoke("DEEPSEEK_V3_2", "deepseek-ai/deepseek-v3.2", 128);
          if (!process.exitCode) await smoke("DOTS3", dotsModel, 128);
          if (process.exitCode) process.exit(process.exitCode);

          console.log("ATLASCLOUD_SECRET_EXPOSED=false");
          console.log("REAL_ATLAS_SMOKE=PASS");
          NODE

      - name: Verify source remained unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "TRACKED_SOURCE_MUTATION=false"
