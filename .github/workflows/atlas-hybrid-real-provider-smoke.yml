name: Atlas Hybrid Real Provider Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-hybrid-real-provider-smoke-v1
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: 91c0b36526f7bd0fc5d8cae1de9c98677b4998a8
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Guard source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "91c0b36526f7bd0fc5d8cae1de9c98677b4998a8"
          test "$(git rev-parse 'HEAD^{tree}')" = "98b53ac978e5d664ac459933cfcb534bc277ed64"
          echo SOURCE_CHECKOUT=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          echo BUILD=PASS
      - name: Real Atlas smoke
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { AtlasCloudClientV1 } from "./dist/src/model/providers/atlas-cloud-client.js";
          const key = String(process.env.ATLASCLOUD_API_KEY ?? "").trim();
          if (!key) throw new Error("atlas_secret_missing");
          const r = await fetch("https://api.atlascloud.ai/v1/models", {
            headers: { Authorization: `Bearer ${key}`, Accept: "application/json" },
            signal: AbortSignal.timeout(10000),
          });
          if (!r.ok) throw new Error(`atlas_models_http_${r.status}`);
          console.log("ATLAS_AUTH=PASS");
          const p = await r.json();
          const rows = Array.isArray(p?.data) ? p.data : Array.isArray(p?.models) ? p.models : [];
          const scored = rows.map(x => {
            const id = typeof x?.id === "string" ? x.id.trim() : "";
            const s = [x?.id,x?.name,x?.display_name,x?.displayName,x?.description].filter(v=>typeof v==="string").join(" ").toLowerCase();
            const score = /dots3[-_ /]?note/.test(s) ? 3 : (/dots.?3/.test(s) && /note/.test(s) ? 2 : (/dots/.test(s) && /note/.test(s) ? 1 : 0));
            return { id, score };
          }).filter(x => x.id && x.score).sort((a,b)=>b.score-a.score || a.id.localeCompare(b.id));
          if (!scored.length) throw new Error("dots3_note_not_found");
          const top = scored.filter(x => x.score === scored[0].score);
          const ids = [...new Set(top.map(x=>x.id))];
          if (ids.length !== 1) throw new Error("dots3_note_ambiguous_${ids.length}`);
          const dots = ids[0];
          console.log("DOTS3_MODEL_RESOLUTION=PASS");
          console.log(`DOTS3_MODEL=${dots}`);
          const client = new AtlasCloudClientV1({ apiKey: key });
          async function smoke(label, model) {
            const x = await client.complete({
              model,
              systemPrompt: "Connectivity test. Return only JSON. No tools or actions.",
              userPrompt: 'Return exactly {"status":"ok"}.',
              maxOutputTokens: 128,
              timeoutMs: 15000,
              requireJsonObject: true,
              requiredTextValidator: t => /"status"\s*:\s*"ok"/i.test(t),
            });
            if (!x.ok) throw new Error(`${label}_${x.reason}`);
            if (x.structuredOutput?.status !== "ok") throw new Error(`${label}_invalid_json`);
            const u=x.usage;
            if (![u.inputTokens,u.outputTokens,u.totalTokens].some(v=>typeof v==="number")) throw new Error(`${label}_usage_missing`);
            console.log(`${label}_CONNECTIVITY=PASS`);
            console.log(`${label}_RESPONSE_VALID=PASS`);
            console.log(`${label}_USAGE_CAPTURED=PASS`);
            console.log(`${label}_INPUT_TOKENS=${u.inputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_CACHED_INPUT_TOKENS=${u.cachedInputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_OUTPUT_TOKENS=${u.outputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_REASONING_TOKENS=${u.reasoningTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_TOTAL_TOKENS=${u.totalTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_REPORTED_COST_USD=${x.reportedCostUsd ?? "NOT_REPORTED"}`);
            console.log(`${label}_LATENCY_MS=${x.latencyMs}`);
            console.log(`${label}_PROVIDER_REQUEST_ID=${x.providerRequestId ?? "NOT_REPORTED"}`);
          }
          await smoke("DEEPSEEK_V3_2","deepseek-ai/deepseek-v3.2");
          await smoke("DOTS3",dots);
          console.log("ATLASCLOUD_SECRET_EXPOSED=false");
          console.log("REAL_ATLAS_SMOKE=PASS");
          NODE
      - name: Guard source clean
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo TRACKED_SOURCE_MUTATION=false
