name: Atlas Hybrid Real Provider Smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact riggeyb/sentient candidate SHA
        required: true
        type: string
      source_tree:
        description: Exact riggeyb/sentient candidate tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-hybrid-real-provider-smoke-v3
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE: ${{ inputs.source_tree }}
    steps:
      - name: Validate immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout trusted runner code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Sentient candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient
          persist-credentials: false
          fetch-depth: 1

       - name: Guard exact source identity
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"
          echo "SOURCE_CHECKOUT=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentient/package-lock.json

      - name: Build exact candidate
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          echo "BUILD=PASS"

      - name: Resolve Dots3-Note and smoke Atlas models
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/atlas-hybrid-real-provider-smoke.mjs

      - name: Verify Sentient source remained unmodified
        shell: bash
        working-directory: sentient
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "TRACKED_SOURCE_MUTATION=false"
