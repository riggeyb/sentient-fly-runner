name: Atlas Hybrid Real Provider Smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact riggeyb/sentient candidate SHA
        required: true
        type: string
      source_tree:
        description: Exact riggeyb/sentient candidate tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-hybrid-real-provider-smoke-v2
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE: ${{ inputs.source_tree }}
    steps:
      - name: Validate immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact Sentient candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"
          echo "SOURCE_CHECKOUT=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          echo "BUILD=PASS"

      - name: Resolve Dots3-Note and smoke Atlas models
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { AtlasCloudClientV1 } from "./dist/src/model/providers/atlas-cloud-client.js";

          const key = String(process.env.ATLASCLOUD_API_KEY ?? "").trim();
          if (!key) throw new Error("ATLASCLOUD_API_KEY secret is unavailable");

          const modelResponse = await fetch("https://api.atlascloud.ai/v1/models", {
            headers: {
              Authorization: `Bearer ${key}`,
              Accept: "application/json",
            },
            signal: AbortSignal.timeout(10_000),
          });
          if (!modelResponse.ok) {
            console.log(`ATLAS_AUTH=FAIL_HTTP_${modelResponse.status}`);
            process.exit(2);
          }
          console.log("ATLAS_AUTH=PASS");

          const payload = await modelResponse.json();
          const rows = Array.isArray(payload?.data)
            ? payload.data
            : Array.isArray(payload?.models)
              ? payload.models
              : Array.isArray(payload)
                ? payload
                : [];
          const candidates = rows
            .filter(row => row && typeof row === "object" && !Array.isArray(row))
            .map(row => {
              const id = typeof row.id === "string" ? row.id.trim() : "";
              const searchable = [
                row.id, row.name, row.display_name, row.displayName,
                row.model, row.description, row.slug,
              ].filter(v => typeof v === "string").join(" ").toLowerCase();
              let score = 0;
              if (searchable.includes("dots3-note") || searchable.includes("dots3_note") || searchable.includes("dots3/note")) score += 120;
              if (searchable.includes("dots 3 note")) score += 110;
              if (searchable.includes("dots3") && searchable.includes("note")) score += 100;
              if (searchable.includes("dots") && searchable.includes("3") && searchable.includes("note")) score += 80;
              return { id, score };
            })
            .filter(row => row.id && row.score > 0)
            .sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));

          if (candidates.length === 0) {
            throw new Error("Atlas model catalog contained no Dots3-Note candidate");
          }
          const bestScore = candidates[0].score;
          const topIds = [...new Set(candidates.filter(row => row.score === bestScore).map(row => row.id))];
          if (topIds.length !== 1) {
            console.log(`DOTS3_MODEL_CANDIDATE_COUNT=${topIds.length}`);
            for (const id of topIds) console.log(`DOTS3_MODD_CANDIDATE=${id}`);
            throw new Error("Atlas Dots3-Note resolution ambiguous");
          }
          const dotsModel = topIds[0];
          console.log("DOTS3_MODEL_RESOLUTION=PASS");
          console.log(`DOTS3_MODEL=${dotsModel}`);

          const client = new AtlasCloudClientV1(; apiKey: key });

          async function smoke(label, model) {
            const result = await client.complete({
              model,
              systemPrompt: "Connectivity test only. Return one tiny JSON object. Do not call tools or take actions.",
              userPrompt: 'Return exactly {"status":"ok"}.',
              maxOutputTokens: 128,
              timeoutMs: 15_000,
              requireJsonObject: true,
              requiredTextValidator: text => /"status"\s*:\s*"ok"/i.test(text),
            });
            if (!result.ok) {
              console.log(`${label}_CONNECTIVITY=FAIL`);
              console.log(`${label}_FAILURE_REASON=${result.reason}`);
              throw new Error(`${label} provider smoke failed`);
            }
            const structured = result.structuredOutput;
            if (!structured || typeof structured !== "object" || Array.isArray(structured) || structured.status !== "ok") {
              console.log(`${label}_RESPONSE_VALID=FAIL`);
              throw new Error(`${label} structured response invalid`);
            }
            const u = result.usage;
            const usageCaptured =
              typeof u.inputTokens === "number"
              && typeof u.outputTokens === "number"
              && typeof u.totalTokens === "number";
            console.log(`${label}_CONNECTIVITY=PASS`);
            console.log(`${label}_RESPONSE_VALID=PASS`);
            console.log(`${label}_USAGE_CAPTURED=${usageCaptured ? "PASS" : "FAIL"}`);
            console.log(`${label}_INPUT_TOKENS=${u.inputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_CACHED_INPUT_TOKENS=${u.cachedInputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_OUTPUT_TOKENS=${u.outputTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_REASONING_TOKENS=${u.reasoningTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_TOTAL_TOKENS=${u.totalTokens ?? "NOT_REPORTED"}`);
            console.log(`${label}_FINISH_REASON=${result.finishReason ?? "NOT_REPORTED"}`);
            console.log(`${label}_PROVIDER_REQUEST_ID=${result.providerRequestId ?? "NOT_REPORTED"}`);
            console.log(`${label}_REPORTED_COST_USD=${result.reportedCostUsd ?? "NOT_REPORTED"}`);
            console.log(`${label}_LATENCY_MS=${result.latencyMs}`);
            if (!usageCaptured) throw new Error(`${label} usage missing`);
          }

          await smoke("DEEPSEEK_V3_2", "deepseek-ai/deepseek-v3.2");
          await smoke("DOTS3", dotsModel);

          console.log("ATLASCLOUD_SECRET_EXPOSED=false");
          console.log("REAL_ATLAS_SMOKE=PASS");
          NODE

      - name: Verify source remained unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          echo "TRACKED_SOURCE_MUTATION=false"
