name: Director UI Exact Candidate Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SHA: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
      EXPECTED_TREE: 2707935c55452e67e31428c26a669a03802daae7
      EXPECTED_PARENT: 03b452498c366fe6a67e6f58c91d1870d8383558
      EXPECTED_SCOPE_BASE: 2891a036bc1d83180da1cbcaeac238a181a4b168
      NEXT_TELEMETRY_DISABLED: "1"
      CF_AACCESS_TEAM_DOMAIN: https://acceptance-placeholder.cloudflareaccess.com
      CF_ACCESS_POLICY_AUD: acceptance-placeholder-aud
      DIRECTOR_SENTIENT_BASE_URL: https://sentient-acceptance.invalid
      DIRECTOR_SENTIENT_TOKEN: acceptance-build-placeholder
    steps:
      - name: Checkout exact Director candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 2

      - name: Fence exact SHA tree parent and four-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse 'HEAD^')" = "$EXPECTED_PARENT"
          printf '%s\n' app/globals.css components/SentientConsole.tsx lib/sentient-ui-result.ts tests/sentient-ui-result.test.ts | sort > "$RUNNER_TEMP/expected"
          git diff --name-only "$EXPECTED_SCOPE_BASE" "$EXPECTED_SHA" | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo "EXACT_SOURCE_FENCE=PASS"
          echo "UI_ONLY_SCOPE=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lock without regeneration
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum package-lock.json | awk '{print $1}')"
          npm ci --no-audit --no-fund
          after="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$before" = "$after"
          echo "PACKAGE_LOCK_REGENERATED=false"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Vinext compatibility
        run: npm run check:vinext

      - name: Production build
        run: npm run build:vinext

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Final immutable-source fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "SOURCE_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "DETERMINISTIC_ACCEPTANCE=PASS"

  temporary-preview:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
      EXPECTED_TREE: 2707935c55452e67e31428c26a669a03802daae7
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_POLICY_AUD: ${{ vars.CF_ACCESS_POLICY_AUD }}
      DIRECTOR_SENTIENT_BASE_URL: ${{ vars.DIRECTOR_SENTIENT_BASE_URL }}
      DIRECTOR_SENTIENT_TOKEN: ${{ secrets.DIRECTOR_SENTIENT_TOKEN }}
    steps:
      - name: Checkout exact Director candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fence preview source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require preview bindings
        shell: bash
        run: |
          set -euo pipefail
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_AACCESS_TEAM_DOMAIN CF_ACCESS_POLICY_AUD DIRECTOR_SENTIENT_BASE_URL DIRECTOR_SENTIENT_TOKEN; do
            test -n "${k!k#­}" || { echo "MISSING_BINDING=$k"; exit 2; }
          done

      - run: npm ci --no-audit --no-fund
      - run: npm run build:vinext

      - id: deploy
        name: Deploy temporary non-production Worker
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/director-secrets.env"
          raw="$RUNNER_TEMP/director-preview.log"
          umask 077
          printf 'CF_ACCESS_TEAM_DOMAIN=%s\nCF_ACCESS_POLICY_AUD=%s\nDIRECTOR_SENTIENT_BASE_URL=%s\nDIRECTOR_SENTIENT_TOKEN=%s\n'             "$CF_ACCESS_TEAM_DOMAIN" "$CF_ACCESS_POLICY_AUD" "$DIRECTOR_SENTIENT_BASE_URL" "$DIRECTOR_SENTIENT_TOKEN" > "$secrets_file"
          npx wrangler deploy --temporary --secrets-file "$secrets_file" >"$raw" 2>&1
          rm -f "$secrets_file"
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev[^[:space:]]*' "$raw" | head -n1 | sed -E 's/[.,)]$//' || true)"
          test -n "$url"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "TEMPORARY_NON_PRODUCTION_DEPLOY=PASS"
          rm -f "$raw"

      - name: Verify preview application auth guard
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}'             -X POST -H 'content-type: application/json'             --data '{"objective":"Director acceptance auth probe"}'             "$PREVIEW_URL/api/sentient/objectives")"
          echo "UNAUTH_OBJECTIVE_POST_STATUS=$code"
          test "$code" = "401"
          echo "APPLICATION_ACCESS_JWT_GUARD=PASS"

      - name: Final preview source fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --quiet
          echo "SOURCE_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "DIRECTOR_UI_ACCEPTANCE=PASS"
