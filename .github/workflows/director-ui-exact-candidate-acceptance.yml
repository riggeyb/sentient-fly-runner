name: Director UI Exact Candidate Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SHA: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
      EXPECTED_TREE: 2707935c55452e67e31428c26a669a03802daae7
      EXPECTED_PARENT: 03b452498c366fe6a67e6f58c91d1870d8383558
      EXPECTED_SCOPE_BASE: 2891a036bc1d83180da1cbcaeac238a181a4b168
      NEXT_TELEMETRY_DISABLED: "1"
      CF_ACCESS_TEAM_DOMAIN: https://acceptance-placeholder.cloudflareaccess.com
      CF_ACCESS_POLICY_AUD: acceptance-placeholder-aud
      DIRECTOR_SENTIENT_BASE_URL: https://sentient-acceptance.invalid
      DIRECTOR_SENTIENT_TOKEN: acceptance-build-placeholder
    steps:
      - name: Checkout exact Director candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fence exact SHA tree parent and four-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse 'HEAD^')" = "$EXPECTED_PARENT"
          printf '%s\n' app/globals.css components/SentientConsole.tsx lib/sentient-ui-result.ts tests/sentient-ui-result.test.ts | sort > "$RUNNER_TEMP/expected"
          git diff --name-only "$EXPECTED_SCOPE_BASE" "$EXPECTED_SHA" | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo "EXACT_SOURCE_FENCE=PASS"
          echo "UI_ONLY_SCOPE=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lock without regeneration
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum package-lock.json | awk '{print $1}')"
          npm ci --no-audit --no-fund
          after="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$before" = "$after"
          echo "PACKAGE_LOCK_REGENERATED=false"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Vinext compatibility
        run: npm run check:vinext

      - name: Production build
        run: npm run build:vinext

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Final tracked-source mutation fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git status --short || true
          git diff --exit-code
          git diff --cached --exit-code
          echo "TRACKED_SOURCE_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "DIRECTOR_UI_ACCEPTANCE=PASS"
