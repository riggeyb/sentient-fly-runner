name: Director UI Immediate Submit Feedback Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SHA: f4b838491f533bf4dc3f2e6bea6a22fdb216ce97
      EXPECTED_TREE: 515a158402b6e9761be773393f1278612cc6adb7
      EXPECTED_PARENT: ad65d2ab98753ad37331a872dd14e134a67db4bb
      EXPECTED_SCOPE_BASE: 976047b626cced9ed9c84b53ca7a8d44f8c93c6b
      NEXT_TELEMETRY_DISABLED: "1"
      CF_ACCESS_TEAM_DOMAIN: https://acceptance-placeholder.cloudflareaccess.com
      CF_ACCESS_POLICY_AUD: acceptance-placeholder-aud
      DIRECTOR_SENTIENT_BASE_URL: https://sentient-acceptance.invalid
      DIRECTOR_SENTIENT_TOKEN: acceptance-build-placeholder
    steps:
      - name: Checkout exact Director candidate
        uses: actions/checkout@v4
        with:
          repository: riggeyb/director-studio-beta
          ref: f4b838491f533bf4dc3f2e6bea6a22fdb216ce97
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fence exact SHA tree parent and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse 'HEAD^')" = "$EXPECTED_PARENT"
          printf '%s\n' components/SentientConsole.tsx lib/sentient-chat-lifecycle.ts tests/sentient-chat-lifecycle.test.ts | sort > "$RUNNER_TEMP/expected"
          git diff --name-only "$EXPECTED_SCOPE_BASE" "$EXPECTED_SHA" | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo "EXACT_SOURCE_FENCE=PASS"
          echo "DIRECTOR_UI_ONLY_SCOPE=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lock without regeneration
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum package-lock.json | awk '{print $1}')"
          npm ci --no-audit --no-fund
          after="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$before" = "$after"
          echo "PACKAGE_LOCK_REGENERATED=false"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Vinext compatibility
        run: npm run check:vinext

      - name: Production build
        run: npm run build:vinext

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Final immutable-source fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          dirty="$(git diff --name-only)"
          if [ -n "$dirty" ]; then
            printf 'TRACKED_MUTATION=%s\n' "$dirty"
            if [ "$dirty" = "next-env.d.ts" ]; then
              git restore --source="$EXPECTED_SHA" -- next-env.d.ts
              echo "GENERATED_NEXT_ENV_RESTORED=true"
            else
              echo "UNEXPECTED_TRACKED_MUTATION=true"
              exit 1
            fi
          fi
          git diff --quiet
          git diff --cached --quiet
          echo "TRACKED_SOURCE_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "DIRECTOR_UI_SUBMIT_FEEDBACK_ACCEPTANCE=PASS"
