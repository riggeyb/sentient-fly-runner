          cat /tmp/local-hf-crash-isolation-edit.base.mjs scripts/local-hf-crash-isolation-edit.part-02 > /tmp/local-hf-crash-isolation-edit.mjs
          node --check /tmp/local-hf-crash-isolation-edit.mjs
          node - <<'NODE' > /tmp/request.json
