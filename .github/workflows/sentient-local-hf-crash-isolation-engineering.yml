          NODE
          request_b64="$(base64 -w0 /tmp/request.json)"
          script_b64="$(base64 -w0 /tmp/create-engineering.mjs)"
          app=sentient-deployment-governor
          id="$(flyctl machines list -a "$app" --json | jq -r 'sort_by(.id) | .[0].id // empty')"
          test -n "$id"
          before="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
          test -n "$before"
          started_here=false
          cleanup() {
            rm -f /tmp/create-engineering.mjs /tmp/request.json
            if [ "$started_here" = true ]; then
              flyctl machine stop "$id" -a "$app" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if [ "$before" != "started" ]; then
            flyctl machine start "$id" -a "$app" >/dev/null
            started_here=true
          fi
          state="$before"
          for _ in $(seq 1 60); do
            state="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          flyctl ssh console -a "$app" --machine "$id" --command "sh -lc 'echo $request_b64 | base64 -d >/tmp/request.json && echo $script_b64 | base64 -d >/tmp/create-engineering.mjs && node /tmp/create-engineering.mjs; rc=\$?; rm -f /tmp/request.json /tmp/create-engineering.mjs; exit \$rc'"
