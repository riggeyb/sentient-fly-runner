name: Sentient Local HF Crash Isolation Engineering

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-local-hf-crash-isolation
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build and validate exact TIER_2 request
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/local-hf-crash-isolation-edit.part-* > /tmp/local-hf-crash-isolation-edit.mjs
          test "$(wc -c < /tmp/local-hf-crash-isolation-edit.mjs)" -eq 7322
          printf '%s  %s\n' 'd381018d2ca7af82b12e8c3b0eef459a88900c205f17846ea516ae58e97f80bc' /tmp/local-hf-crash-isolation-edit.mjs | sha256sum -c -
          node --check /tmp/local-hf-crash-isolation-edit.mjs
          node - <<'NODE' > /tmp/request.json
          const fs=require("fs");
          const editCode=fs.readFileSync("/tmp/local-hf-crash-isolation-edit.mjs","utf8");
          const request={
            repo:"riggeyb/sentient",
            branch:"sentient-production-composition-20261017",
            expectedHead:"7d54e0f5b77b65bc4984cd5a667084e12eb738c1",
            expectedTree:"3f1929fead05d17b182bea29c168faeafbcc1a98",
            objectiveId:"SENTIENT_ROUTINE_LOCAL_HF_CRASH_ISOLATION_20261025",
            actionId:"local-hf-native-child-process-isolation-v1",
            authorizedPaths:[
              "src/model/providers/huggingface.ts",
              "src/model/providers/huggingface-worker.ts",
              "test/local-hf-worker-isolation.test.ts"
            ],
            authorizationIdentity:"user:SENTIENT_ROUTINE_OPERATIONAL_DEVELOPMENT_V1",
            authorizationReason:"Repeated live Napi::Error SIGABRT crashes terminate the authoritative Sentient host while local Hugging Face ONNX inference runs inside worker_threads. Isolate the same local-zero-cost inference protocol in an OS child process so native aborts are contained and retried without changing model, authority, resources, or paid-compute policy.",
            policyVersion:"sentient-capability-tier/v1",
            objective:"ROUTINE_LOCAL_HF_NATIVE_CRASH_ISOLATION_V1: Replace the production local Hugging Face worker_threads boundary with an OS child-process boundary while preserving the LocalHfWorkerPortV1 request/response contract, current SmolLM2 model/revision/q4 CPU configuration, one-retry behavior, abort semantics, model non-authority, and zero-paid-compute policy. Sanitize the child environment to a narrow runtime/network allowlist so HF write secrets and unrelated credentials are not inherited. Add a real child-process regression where the first child process.abort()s during generation and the authoritative parent survives, recreates a child, and succeeds. No deployment, resource change, policy/authority mutation, model change, paid compute, certification change, or historical-state cleanup.",
            commands:[
              {name:"install-js-no-native-scripts",category:"shell",command:"npm",args:["ci","--ignore-scripts"],timeoutMs:300000},
              {name:"preflight-build",category:"build",command:"npm",args:["run","build"],timeoutMs:120000},
              {name:"preflight-local-hf-tests",category:"test",command:"node",args:["--test","dist/test/local-hf-worker-isolation.test.js","dist/test/phase3-local-hf-adapter.test.js","dist/test/production-phase3-cognition.test.js"],timeoutMs:180000},
              {name:"implement-child-process-isolation",category:"edit",command:"node",args:["--input-type=module","-e",editCode],timeoutMs:30000},
              {name:"build-after-change",category:"build",command:"npm",args:["run","build"],timeoutMs:120000},
              {name:"local-hf-crash-isolation-tests",category:"test",command:"node",args:["--test","dist/test/local-hf-worker-isolation.test.js","dist/test/phase3-local-hf-adapter.test.js","dist/test/production-phase3-cognition.test.js","dist/test/dots3-presentation-only-local-hf.test.js"],timeoutMs:240000},
              {name:"diff-check",category:"test",command:"git",args:["diff","--check"],timeoutMs:30000}
            ],
            commitMessage:"fix: isolate local HF native runtime in child process",
            timeoutMs:1200000
          };
          process.stdout.write(JSON.stringify(request));
          NODE
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/request.json","utf8"));
          const paths=[
            "src/model/providers/huggingface.ts",
            "src/model/providers/huggingface-worker.ts",
            "test/local-hf-worker-isolation.test.ts"
          ];
          if(x.expectedHead!=="7d54e0f5b77b65bc4984cd5a667084e12eb738c1") throw new Error("HEAD_MISMATCH");
          if(x.expectedTree!=="3f1929fead05d17b182bea29c168faeafbcc1a98") throw new Error("TREE_MISMATCH");
          if(x.policyVersion!=="sentient-capability-tier/v1") throw new Error("POLICY_MISMATCH");
          if(JSON.stringify(x.authorizedPaths)!==JSON.stringify(paths)) throw new Error("SCOPE_MISMATCH");
          if(!Array.isArray(x.commands)||x.commands.length!==7||x.commands.at(-1)?.category!=="test") throw new Error("COMMAND_SET_MISMATCH");
          console.log("REQUEST_BINDING=PASS");
          console.log("REQUEST_TIER=2");
          console.log("DEPLOY_ON_SUCCESS=false");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
      - name: Create EngineeringJob through resident Governor
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/create-engineering.mjs <<'NODE'
          import { readFile } from "node:fs/promises";
          const token=String(process.env.SENTIENT_ENGINEERING_API_TOKEN??"").trim();
          if(!token) throw new Error("GOVERNOR_RESIDENT_ENGINEERING_CREDENTIAL_MISSING");
          const request=JSON.parse(await readFile("/tmp/request.json","utf8"));
          const r=await fetch("http://127.0.0.1:8080/v1/engineering/jobs",{
            method:"POST",
            headers:{authorization:"Bearer "+token,"content-type":"application/json"},
            body:JSON.stringify(request),
            signal:AbortSignal.timeout(30000)
          });
          const raw=await r.text();
          let body={};
          try{body=JSON.parse(raw)}catch{}
          const out={HTTP_STATUS:r.status};
          for(const k of ["contract","jobId","repo","branch","expectedHead","status","createdAt"]) if(k in body) out[k]=body[k];
          if(body.authorityReceipt&&typeof body.authorityReceipt==="object"){
            const a=body.authorityReceipt;
            out.authorityReceipt={
              actionId:a.actionId??null,
              actionType:a.actionType??null,
              capabilityTier:a.capabilityTier??null,
              policyVersion:a.policyVersion??null,
              sourceSha:a.sourceSha??null,
              sourceTree:a.sourceTree??null,
              authorizedScope:a.authorizedScope??null
            };
          }
          console.log(JSON.stringify(out));
          if(r.status!==202 || typeof body.jobId!=="string" || !body.jobId) process.exit(31);
          if(body.expectedHead!==request.expectedHead) process.exit(32);
          console.log("ENGINEERING_CREATE=PASS");
          console.log("JOB_ID="+body.jobId);
          console.log("PRIVATE_ACTIONS_BRIDGE_USED=false");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          request_b64="$(base64 -w0 /tmp/request.json)"
          script_b64="$(base64 -w0 /tmp/create-engineering.mjs)"
          app=sentient-deployment-governor
          id="$(flyctl machines list -a "$app" --json | jq -r 'sort_by(.id) | .[0].id // empty')"
          test -n "$id"
          before="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
          test -n "$before"
          started_here=false
          cleanup() {
            rm -f /tmp/create-engineering.mjs /tmp/request.json
            if [ "$started_here" = true ]; then
              flyctl machine stop "$id" -a "$app" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if [ "$before" != "started" ]; then
            flyctl machine start "$id" -a "$app" >/dev/null
            started_here=true
          fi
          state="$before"
          for _ in $(seq 1 60); do
            state="$(flyctl machines list -a "$app" --json | jq -r --arg id "$id" '.[]|select(.id==$id)|.state' | head -n1)"
            [ "$state" = "started" ] && break
            sleep 2
          done
          test "$state" = "started"
          flyctl ssh console -a "$app" --machine "$id" --command "sh -lc 'echo $request_b64 | base64 -d >/tmp/request.json && echo $script_b64 | base64 -d >/tmp/create-engineering.mjs && node /tmp/create-engineering.mjs; rc=\$?; rm -f /tmp/request.json /tmp/create-engineering.mjs; exit \$rc'"
          echo "GOVERNOR_ENGINEERING_INGRESS=PASS"
          echo "GOVERNOR_MACHINE_PRIOR_STATE=$before"
          echo "RESOURCE_ENVELOPE_CHANGED=false"
