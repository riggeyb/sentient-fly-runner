name: Sentient Local HF Crash Isolation Engineering

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentient-local-hf-crash-isolation
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build and validate exact TIER_2 request
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/local-hf-crash-isolation-edit.part-00 scripts/local-hf-crash-isolation-edit.part-01 > /tmp/local-hf-crash-isolation-edit.base.mjs
          test "$(wc -c < /tmp/local-hf-crash-isolation-edit.base.mjs)" -eq 7322
