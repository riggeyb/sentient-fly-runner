name: MVP Director Read-Only URL Resolve V1

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve deployed Director URL read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json")
          sub="$(curl -fsS --max-time 30 "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq -er '.result.subdomain')"
          [[ "$sub" =~ ^[a-zA-Z0-9.-]+$ ]]
          dep="$(curl -fsS --max-time 30 "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/director-studio-beta/deployments" | jq -er '(.result.deployments // .result // []) | if type=="array" then .[0].id else .deployments[0].id end')"
          test -n "$dep"
          url="https://director-studio-beta.${sub}.workers.dev/studio"
          echo "DIRECTOR_STUDIO_URL=$url"
          echo "DIRECTOR_DEPLOYMENT_ID=$dep"
          echo "CLOUDFLARE_API_MUTATION=false"
          echo "DIRECTOR_MUTATION=false"
          echo "DEPLOYMENT_PERFORMED=false"
