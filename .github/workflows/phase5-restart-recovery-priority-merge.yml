name: Phase5 Restart Admission Pacing Merge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: sentient-production-composition-20261017
      EXPECTED_HEAD: 96854a116a480c814b2c7e44dcea8dcc8b2b723b
      PATCH_SHA: 25f5fb6ac2270a34c393f6b6a4a61e1508871761
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient-production-composition-20261017
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fence exact canonical head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$EXPECTED_HEAD"
      - name: Apply shared Phase5 admission pacing patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/riggeyb/sentient-fly-runner/${PATCH_SHA}/scripts/phase5-restart-admission-pacing.py" -o /tmp/phase5-restart-admission-pacing.py
          python3 /tmp/phase5-restart-admission-pacing.py
          git diff --check
          git diff -- src/fly/self-execution.ts test/phase5-fly-restart-lease-retry.test.ts
      - name: Build and targeted plus cross-phase regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --test \
            dist/test/phase5-fly-restart-lease-retry.test.js \
            dist/test/production-collaboration-restart-recovery.test.js \
            dist/test/active-work-restart-edge.test.js \
            dist/test/active-work-expiry-fencing.test.js \
            dist/test/phase5-collaborative-convergence.test.js \
            dist/test/job2-self-execution.test.js \
            dist/test/phase1-core-runtime.test.js \
            dist/test/phase1-acceptance-policy.test.js \
            dist/test/fly-phase1-acceptance-policy.test.js \
            dist/test/phase2-skill-execution.test.js \
            dist/test/production-phase3-cognition.test.js \
            dist/test/phase4-multistep-autonomy.test.js \
            dist/test/phase6-capability-integration.test.js \
            dist/test/phase7-model-improvement.test.js \
            dist/test/production-model-improvement.test.js
      - name: Push exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$EXPECTED_HEAD"
          git config user.name sentient-phase5-recovery-pacing
          git config user.email sentient-phase5-recovery-pacing@users.noreply.github.com
          git add src/fly/self-execution.ts test/phase5-fly-restart-lease-retry.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: pace Fly restart recovery admission"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$BRANCH"
          echo PHASE5_RESTART_ADMISSION_PACING_SOURCE=PASS
          echo NEW_SHA=$(git rev-parse HEAD)
          echo NEW_TREE=$(git rev-parse 'HEAD^{tree}')
          echo SECRET_VALUES_EXPOSED=false
