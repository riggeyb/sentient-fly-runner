name: Gate 2 Closed Boundary

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        required: false
        type: string
      source_tree:
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate2_closed:
    runs-on: ubuntu-latest
    steps:
      - name: Gate 2 closed — zero-cost boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "MISSION=HUMAN_GOVERNED_PREPRODUCTION_AUTONOMY_PILOT_V1"
          echo "GATE=GATE_2_LIVE_COGNITION_ARTIFACT_QUALITY"
          echo "GATE_2_CLOSED=true"
          echo "STOP_PAID_COGNITION=true"
          echo "PROVIDER_CALLS=0"
          echo "PROVIDER_SPEND_USD=0"
          echo "PRESERVE_STATE=true"
          echo "REPORT_COST=true"
          echo "WAIT_FOR_HUMAN_GATE_AUTHORIZATION=true"
          echo "NEXT_GATE=GATE_3_SINGLE_REAL_SOFTWARE_OBJECTIVE"
          echo "NEXT_GATE_AUTHORIZED=false"
          echo "GATE_3_REAL_SOFTWARE_OBJECTIVE_AUTHORIZED=false"
          echo "PRODUCTION_MODEL_ROUTE_CHANGE=false"
          echo "PRODUCTION_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "UNBOUNDED_GITHUB_AUTHORITY=false"
