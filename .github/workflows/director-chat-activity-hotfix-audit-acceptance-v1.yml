name: Director Conflict Guard Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shell syntax
        run: |
          bash -n scripts/director-ui-release-preflight.sh
          bash -n scripts/director-ui-release-deploy.sh
          bash -n scripts/test-director-ui-release-binding-preflight.sh
          bash -n scripts/test-director-ui-release-conflict-guard.sh
          bash -n scripts/test-director-ui-release-pins.sh

      - name: Binding preflight coverage
        run: bash scripts/test-director-ui-release-binding-preflight.sh

      - name: Production conflict guard coverage
        run: bash scripts/test-director-ui-release-conflict-guard.sh

      - name: Exact Director hotfix pin coverage
        run: bash scripts/test-director-ui-release-pins.sh

      - name: Confirm no production deployment
        run: echo "PRODUCTION_DEPLOYMENT=false"
