name: Repository GitHub Test Execution V1 Acceptance

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTIENT_SHA: ${{ inputs.sha }}
      SENTIENT_TREE: ${{ inputs.tree }}
      TOKEN: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact accepted Sentient
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --no-checkout https://github.com/riggeyb/sentient.git sentient
          git -C sentient -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=2 origin "$SENTIENT_SHA"
          git -C sentient checkout --detach "$SENTIENT_SHA"
          git -C sentient remote set-url origin disabled://sentient

      - name: Fence exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$SENTIENT_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$SENTIENT_TREE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and canonical repository regression
        working-directory: sentient
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          npm test

      - name: Run repository GitHub test execution proof
        shell: bash
        env:
          SENTIENT_SHA: ${{ inputs.sha }}
          SENTIENT_TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          export SENTIENT_ROOT="$PWD/sentient"
          ./sentient/node_modules/.bin/tsx validation/repository-github-test-execution-v1.mts 2>&1 | tee /tmp/stage7.log
          grep 'REPOSITORY_GITHUB_TEST_EXECUTION_V1_ACCEPTANCE>' /tmp/stage7.log
          grep '"REPOSITORY_INSPECTED":true' /tmp/stage7.log
          grep '"ISOLATED_BRANCH_CREATED":true' /tmp/stage7.log
          grep '"TEST_PASSED":true' /tmp/stage7.log
          grep '"REVIEWABLE_DIFF_PRODUCED":true' /tmp/stage7.log
          grep '"RECURSIVE_REPAIR":true' /tmp/stage7.log
          grep '"CI_EXECUTION_ENVIRONMENT":true' /tmp/stage7.log
          grep '"GITHUB_REMOTE_MUTATION":false' /tmp/stage7.log
          grep '"TEST_PR_CREATED":false' /tmp/stage7.log
          grep '"MERGE_RELEASE":false' /tmp/stage7.log
          grep '"PRODUCTION_MUTATION":false' /tmp/stage7.log
          grep '"AUTHORITY_EXPANSION":false' /tmp/stage7.log
          grep '"GOVERNOR_BYPASS":false' /tmp/stage7.log
          grep '"WRITEBACK_POLICY":"NONE"' /tmp/stage7.log
          grep '"PROVIDER_CALLS":0' /tmp/stage7.log

      - name: Clean source and receipt
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"
          test "$(git -C sentient rev-parse HEAD)" = "$SENTIENT_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$SENTIENT_TREE"
          echo "REPOSITORY_GITHUB_TEST_EXECUTION_V1_VALIDATION=PASS"
          echo "INDEPENDENT_ACCEPTANCE_RESULT=PASS"
          echo "CI_OBSERVED=true"
          echo "GITHUB_REMOTE_MUTATION=false"
          echo "TEST_PR_CREATED=false"
          echo "MERGE_RELEASE=false"
          echo "PRODUCTION_DEPLOYMENT=false"
