name: Final Cert Phase1 Phase3 Existing Proof
'on':
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
      tree: {required: true, type: string}
      objective_id: {required: true, type: string}
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: sentient-validation-runner
      SHA: ${{ inputs.sha }}
      TREE: ${{ inputs.tree }}
      OID: ${{ inputs.objective_id }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Prove accepted live proposal and bounded policy rejection from settled durable result
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OID" =~ ^[A-Za-z0-9._:-]{1,240}$ ]]
          machines="$(flyctl machines list -a "$APP" --json)"
          mid="$(jq -er '.[0].id' <<<"$machines")"
          state="$(jq -er '.[0].state' <<<"$machines")"
          jq -e --arg s "$SHA" 'any(.[]; ((.config.image // .image_ref.tag // "") | contains($s)))' <<<"$machines" >/dev/null
          if [ "$state" != started ]; then flyctl machine start "$mid" -a "$APP" >/dev/null; fi
          cat >/tmp/p13-proof.mjs <<'NODE'
          import {BoundedSentientPhase1AcceptancePolicyV1} from "/app/dist/src/phase1/bounded-acceptance-policy.js";
          import {deriveTaskRequirementsV1} from "/app/dist/src/phase1/core-runtime.js";
          const token=String(process.env.SENTIENT_API_TOKEN??"").trim();
          const id=process.env.CERT_OID,sha=process.env.CERT_SHA,tree=process.env.CERT_TREE;
          if(!token||!id) throw Error("BINDING_MISSING");
          if(process.env.SENTIENT_RUNTIME_SHA!==sha||process.env.SENTIENT_RUNTIME_TREE!==tree) throw Error("SOURCE_MISMATCH");
          const r=await fetch("http://127.0.0.1:8080/v1/objectives/"+encodeURIComponent(id),{
            headers:{authorization:`Bearer ${token}`},signal:AbortSignal.timeout(30000)
          });
          const b=await r.json();
          if(r.status!==200||b.status!=="succeeded") throw Error("OBJECTIVE_NOT_SETTLED_SUCCESS");
          const turn=b?.result?.body?.result??{},sub=turn?.subordinate??{},p3=turn?.phase3Assessment??{};
          if(turn.status!=="RESPONDED"||turn?.state?.authoritativeOwner!=="SENTIENT"||turn?.authority?.owner!=="SENTIENT"||sub.accepted!==true) throw Error("AUTHORITY_ACCEPTANCE_MISMATCH");
          if(sub.provider!=="huggingface-local"||sub.model!=="onnx-community/SmolLM2-135M-Instruct-ONNX"||sub.revision!=="b8a5c0f183b78c55955a5364f610c36668b5e681"||sub.acceptancePolicyId!=="sentient-fly-phase1-acceptance-policy/v1") throw Error("MODEL_IDENTITY_MISMATCH");
          if(p3.status!=="ASSESSED"||p3.transport!=="LOCAL"||p3.authoritative!==false||p3.authorityOwner!=="SENTIENT_RUNTIME"||!p3.modelId) throw Error("PHASE3_MISMATCH");
          const req=deriveTaskRequirementsV1({
            requestId:"final-cert-policy-rejection",
            sessionId:"final-cert-policy-rejection-session",
            taskId:"final-cert-policy-rejection-task",
            userRequest:"Evaluate a syntactically valid subordinate proposal."
          });
          const policy=new BoundedSentientPhase1AcceptancePolicyV1({
            policyId:"sentient-fly-phase1-acceptance-policy/v1",maxProposalChars:8000
          });
          const dec=await policy.evaluate(req,{
            text:"x".repeat(8001),provider:sub.provider,model:sub.model,revision:sub.revision
          });
          if(dec.accepted!==false||!String(dec.reason).includes("8000")) throw Error("POLICY_REJECTION_MISMATCH");
          console.log("PHASE1_LIVE_AUTHORITY=PASS");
          console.log("MODEL_REMAINS_SUBORDINATE=PASS");
          console.log("PHASE1_VALID_PROPOSAL_ACCEPTED=PASS");
          console.log("PHASE1_VALID_PROPOSAL_CONSTRAINED=PASS");
          console.log("LOCAL_HF_COGNITION_LIVE=PASS");
          console.log("PHASE3_LIVE_COGNITION=PASS");
          console.log("EXACT_SOURCE_IDENTITY=PASS");
          console.log("SECRET_VALUES_EXPOSED=false");
          NODE
          B="$(base64 -w0 /tmp/p13-proof.mjs)"
          timeout 70s flyctl ssh console -a "$APP" -C "sh -lc 'echo $B|base64 -d >/tmp/p13-proof-${GITHUB_RUN_ID}.mjs; CERT_OID=$OID CERT_SHA=$SHA CERT_TREE=$TREE node /tmp/p13-proof-${GITHUB_RUN_ID}.mjs; rc=\$?; rm -f /tmp/p13-proof-${GITHUB_RUN_ID}.mjs; exit \$rc'"
