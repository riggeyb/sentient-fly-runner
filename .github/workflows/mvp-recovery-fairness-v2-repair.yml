name: MVP Recovery Fairness V2 Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: sentient/finish-mvp-recovery-fairness-v1
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded scheduler repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c05a4f2d4a45cdc110edd8a397541b7eb8e687bf"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/fly/self-execution.ts")
          s = p.read_text()
          start_marker = "  public async resumeUnfinished(): Promise<number> {"
          end_marker = "\n  #scheduleInheritedRestart"
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit("resume_start_missing")
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("resume_end_missing")
          replacement = """  public async resumeUnfinished(): Promise<number> {
            const tasks = (await this.#state.list("task"))
              .filter((task) =>
                task.kind === "task"
                && ACTIVE.has(task.status)
                && parseRunnerMetadata(task) !== null)
              .sort((left, right) =>
                right.updatedAt.localeCompare(left.updatedAt)
                || left.id.localeCompare(right.id));

            for (const task of tasks) this.#scheduleInheritedRestart(task.id);
            return tasks.length;
          }
          """
          s = s[:start] + replacement + s[end:]
          old = "        void this.#schedule(objectiveId, true);"
          new = "        await this.#schedule(objectiveId, true);"
          if s.count(old) != 1:
              raise SystemExit(f"schedule_matches={s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/fly/self-execution.ts"
      - name: Build and tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --test dist/test/mvp-recovery-fairness-v2.test.js
          node --test dist/test/final-cert-restart-backlog-serialization.test.js
          node --test dist/test/phase5-fly-restart-lease-retry.test.js
          npm test
      - name: Commit isolated repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c05a4f2d4a45cdc110edd8a397541b7eb8e687bf"
          git config user.name "sentient-mvp-activation"
          git config user.email "sentient-mvp-activation@users.noreply.github.com"
          git add src/fly/self-execution.ts
          git commit -m "mvp: restore fair serialized restart recovery"
          git push origin HEAD:sentient/finish-mvp-recovery-fairness-v1
          echo "REPAIRED_SHA=$(git rev-parse HEAD)"
          echo "REPAIRED_TREE=$(git rev-parse 'HEAD^{tree}')"
