name: Gate 2 Contract Adherence and Paid Admission Closure

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: sentient-gate2-contract-adherence-closure-paid-slot-1
  cancel-in-progress: false

env:
  CANONICAL_SENTIENT_SHA: ${{ inputs.source_sha }}
  CANONICAL_SENTIENT_TREE: ${{ inputs.source_tree }}
  LEASE_PATH: gate-leases/gate2-contract-adherence-closure-call-1.json

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact accepted Sentient source
        uses: actions/checkout@v4
        with:
          repository: riggeyb/sentient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SENTIENT_SOURCE_GITHUB_TOKEN }}
          path: sentient

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact source fence and strict build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$CANONICAL_SENTIENT_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$CANONICAL_SENTIENT_TREE"
          git -C sentient remote set-url origin disabled://sentient
          (cd sentient && npm install --no-audit --no-fund --package-lock=false && npm run build)

      - name: Zero-cost closure diagnostics and proofs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gate2-closure-transform.py
          python scripts/gate2-closure-telemetry-patch.py
          node --check gate2-closure-runtime.mjs
          node --check scripts/gate2-closure-proof.mjs
          node --check scripts/gate2-closure-lease.mjs
          node --check scripts/gate2-closure-finalize.mjs
          node gate2-closure-runtime.mjs --preflight
          test -s gate2-zero-cost-diagnostics.json
          node gate2-closure-runtime.mjs --config > gate2-closure-config.json
          test "$(jq -r .max_input_tokens gate2-closure-config.json)" = "4096"
          test "$(jq -r .max_output_tokens gate2-closure-config.json)" = "800"
          test "$(jq -r .max_reasoning_allowance gate2-closure-config.json)" = "800"
          test "$(jq -r .max_reserved_cost gate2-closure-config.json)" = "0.016192"
          test "$(jq -r .hard_budget_usd gate2-closure-config.json)" = "0.06"
          test "$(jq -r .structured_output_mode gate2-closure-config.json)" = "response_format.json_schema.strict"
          node scripts/gate2-closure-proof.mjs
          grep -Fq 'type: "json_schema"' sentient/src/model/providers/atlas-cloud-codec.ts
          grep -Fq 'strict: true' sentient/src/model/providers/atlas-cloud-codec.ts
          grep -Fq 'schema: request.outputSchema' sentient/src/model/providers/atlas-cloud-codec.ts
          set +e
          node gate2-closure-runtime.mjs --persistence-smoke
          smoke=$?
          set -e
          test "$smoke" -ne 0
          test -s gate2-persistence-smoke.json
          echo "ZERO_COST_PRECALL=PASS"
          echo "PROVIDER_CALLS=0"
          echo "MAX_RESERVED_COST_USD=0.016192"

      - name: Acquire and re-read durable single-spender lease
        id: lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/gate2-closure-lease.mjs
          if [ "${{ steps.lease.outputs.acquired }}" = "true" ]; then
            test -s gate2-closure-lease.json
            test "$(jq -r .provider gate2-closure-lease.json)" = "atlascloud"
            test "$(jq -r .model gate2-closure-lease.json)" = "moonshotai/kimi-k3.1-pro"
            test "$(jq -r .max_output_tokens gate2-closure-lease.json)" = "800"
            test "$(jq -r .max_reasoning_allowance gate2-closure-lease.json)" = "800"
            test "$(jq -r .max_reserved_cost gate2-closure-lease.json)" = "0.016192"
            node -e 'const l=require("./gate2-closure-lease.json");if(Number(l.actual_gate_spend_usd)+Number(l.max_reserved_cost)>Number(l.hard_budget_usd))process.exit(2)'
            echo "PRE_DISPATCH_LEASE_REREAD=PASS"
            echo "PRE_DISPATCH_RESERVATION=PASS"
          fi

      - name: Exactly one authorized live Kimi call
        id: live
        if: steps.lease.outputs.acquired == 'true'
        continue-on-error: true
        shell: bash
        env:
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          GATE2_CLOSURE_LEASE_PATH: gate2-closure-lease.json
          GATE2_CLOSURE_ACTUAL_GATE_SPEND_USD: "0"
        run: |
          set +e
          node gate2-closure-runtime.mjs 2>&1 | tee "$RUNNER_TEMP/gate2-closure-live.log"
          rc=${PIPESTATUS[0]}
          set -e
          test -s gate2-receipt.json
          test -s gate2-response-evidence.json
          echo "runtime_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Independent deterministic closure acceptance
        if: always() && steps.lease.outputs.acquired == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gate2-closure-finalize.mjs

      - name: Upload auditable closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-contract-adherence-paid-admission-closure
          path: |
            gate2-zero-cost-diagnostics.json
            gate2-persistence-smoke.json
            gate2-closure-config.json
            gate2-closure-concurrency-proof.json
            gate2-closure-schema-proof.json
            gate2-closure-lease.json
            gate2-receipt.json
            gate2-response-evidence.json
            gate2-model-text.txt
            gate2-closure-final-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Re-fence immutable Sentient source and stop
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sentient rev-parse HEAD)" = "$CANONICAL_SENTIENT_SHA"
          test "$(git -C sentient show -s --format=%T HEAD)" = "$CANONICAL_SENTIENT_TREE"
          test -z "$(git -C sentient status --porcelain --untracked-files=no)"
          echo "STOP_PAID_COGNITION=true"
          echo "PRESERVE_STATE=true"
          echo "GATE_3_AUTHORIZED=false"
          echo "GATE_3_PROVIDER_CALLS_STARTED=0"
          echo "GATE_3_PROVIDER_SPEND_USD=0"
          echo "PRODUCTION_MODEL_ROUTE_CHANGE=false"
          echo "PRODUCTION_MUTATION=false"
          echo "PRODUCTION_DEPLOYMENT=false"
          echo "UNBOUNDED_GITHUB_AUTHORITY=false"
